ource":"CNN 選情直播／10 Things Global News","url":"https://www.cnn.com/2026/11/03/politics/live-news/midterm-election-congress"},{"en":"Russian strike on a Zaporizhzhia aid centre kills at least 26 as new talks are set for Abu Dhabi","zh":"**俄軍攻擊札波羅結援助中心，至少 26 人死亡**，俄烏代表團預定 11/10–11 在阿布達比會談。","summary":"At least 26 people were killed in a Russian strike on a humanitarian aid centre in Zaporizhzhia, one of the deadliest single attacks on a civilian aid site in recent months. The strike landed days before Russian and Ukrainian delegations are due to meet in Abu Dhabi on November 10 and 11 for another round of indirect talks. Separately the United States is preparing to ask NATO allies for additional funding to buy American weapons for Ukraine, with roughly two billion dollars of earlier pledges still unpaid, which European governments say limits how fast new packages can be agreed.","source":"10 Things Global News（11/3）","url":"https://www.10things.news/p/10-things-global-news-3rd-november-4b6"},{"en":"Hacked emergency alert apps pushed false nuclear warnings in both Ukraine and Russia","zh":"**烏克蘭與俄羅斯的緊急警報 App 遭入侵**，同步推送假核子警報，兩案是否相關尚不清楚。","summary":"Emergency alert applications in both Ukraine and Russia were compromised and used to push false nuclear warnings to users' phones, briefly causing panic in several cities before authorities issued corrections. Officials in both countries have not said whether the two intrusions are connected or who was responsible. Security researchers treat the episode as a warning about civil-defence software, which is trusted by default and often maintained with far weaker security than banking or military systems. It follows a broader run of attacks on consumer-facing critical systems across Europe this autumn.","source":"10 Things Global News（11/3）","url":"https://www.10things.news/p/10-things-global-news-3rd-november-4b6"},{"en":"Suspected cyberattacks altered supermarket refrigeration in seven European countries","zh":"**歐洲七國超市冷藏系統疑遭駭**，部分冷凍櫃溫度被推到 50°C，尚無組織出面宣稱負責。","summary":"Supermarkets in seven European countries reported refrigeration systems behaving abnormally after suspected cyberattacks, with some freezer units driven as high as 50 degrees Celsius and large volumes of stock destroyed. No group has claimed responsibility and investigators have not confirmed a single common vendor, though attention has focused on remotely managed building-control systems. The incidents add to warnings that industrial control software in ordinary retail infrastructure is poorly defended, and Britain's National Cyber Security Centre separately said an AI-assisted attack on critical national infrastructure is highly likely before 2028.","source":"10 Things Global News（11/3）","url":"https://www.10things.news/p/10-things-global-news-3rd-november-4b6"},{"en":"Dozens of French high schools were blockaded over teacher shortages, with national strikes called","zh":"**法國數十所高中遭學生封鎖**，抗議師資不足與班級過大，週四將有全國性罷工。","summary":"Dozens of French high schools were blockaded by students returning from the autumn holidays, in protest at unfilled teaching posts and overcrowded classes. Student unions say some classes have started the year without a permanent teacher in core subjects, and they are coordinating with staff unions ahead of nationwide strike action on Thursday. The education ministry says recruitment has improved year on year but acknowledges shortages in mathematics and the sciences. The dispute is the first large education protest the current government has faced this school year.","source":"10 Things Global News（11/3）","url":"https://www.10things.news/p/10-things-global-news-3rd-november-4b6"}]},{"label":"科技","items":[{"en":"Anthropic publishes FlashProve, an open-source way to prove which model produced an output","zh":"**Anthropic 發表開源系統 FlashProve**，用密碼學證明某段輸出確實來自指定模型，防止偷換模型。","summary":"Anthropic released a technical specification and working code for FlashProve, an open-source system for what it calls provable inference: a cryptographic proof that a given output really came from a specific model. Labs would publish a fingerprint for each released model, and outputs could later be matched against that fingerprint without exposing model weights, so closed-weight companies could adopt it. Verification is light enough to run on a local device. The stated aims are to stop a provider quietly substituting a cheaper model, to stop inflated benchmark claims, and to resist impostors even when the impostor is the lab itself. Anthropic calls it intermediate progress with no deployment plans yet.","source":"TechCrunch（11/3）","url":"https://techcrunch.com/2026/11/03/anthropic-is-working-on-a-system-to-prove-ai-models-identity/"},{"en":"Apple slipped 1.9% and Palantir 1.7% as investors kept punishing AI valuations","zh":"**蘋果昨天跌 1.9%、Palantir 跌 1.65%**，財報後市場仍在修正 AI 相關的高估值。","summary":"Apple fell about 1.9 percent and Palantir about 1.65 percent on November 3, both continuing to slide after quarterly results that beat on headline numbers but left investors unconvinced about the pace of AI-driven revenue. The split with the rest of the market was sharp: the Nasdaq Composite rose 0.83 percent the same day on a semiconductor rebound. Analysts read the divergence as money rotating toward companies whose AI spending turns into measurable hardware demand, and away from software names whose AI revenue is still largely promised rather than booked.","source":"StockTitan／Invezz（11/3）","url":"https://invezz.com/pk/news/2026/11/03/nasdaq-rises-as-chip-stocks-rebound-while-apple-and-palantir-shares-fall/"},{"en":"UK cyber agency says an AI-powered attack on critical infrastructure is highly likely by 2028","zh":"**英國國家網路安全中心警告**，2028 年前極可能出現由 AI 驅動、針對關鍵基礎設施的攻擊。","summary":"Britain's National Cyber Security Centre said an AI-powered attack on critical national infrastructure is highly likely before 2028, its strongest wording so far on the subject. The agency's concern is not fully autonomous attacks but the compression of the attacker's timeline: AI tools shorten the gap between a vulnerability being disclosed and being exploited at scale, while defenders still patch on human schedules. It urged operators of energy, water and transport systems to assume shorter windows and to automate their own detection and response. The warning landed the same week as suspected attacks on European retail refrigeration systems.","source":"10 Things Global News（11/3）","url":"https://www.10things.news/p/10-things-global-news-3rd-november-4b6"}]},{"label":"運動","items":[{"en":"Manchester United beat Roma 3-2 in a five-goal European night at Old Trafford","zh":"**曼聯主場 3–2 擊敗羅馬**，五球大戰下半場逆轉，歐賽積分戰保住主場優勢。","summary":"Manchester United came through a five-goal night against Roma at Old Trafford, winning 3-2 after an open game that swung twice in the second half. United's attack produced chances throughout but the defence again looked vulnerable to quick transitions, which is where both Roma goals came from. The result keeps United's European campaign on track and eases pressure before a difficult run of league fixtures, though the manager acknowledged afterwards that conceding twice at home against a side missing key forwards is not sustainable.","source":"NBC Sports（11/3）","url":"https://nbcsports.com/soccer/live/manchester-united-vs-roma-team-live-updates-score-goals-highlights-stats-2026-november-3"},{"en":"No NBA games were played on November 3 because of US Election Day","zh":"**NBA 11/3 整天沒有比賽**，因美國選舉日停賽；前一晚東契奇 42 分、SGA 43 分。","summary":"The NBA scheduled no games on November 3, keeping its calendar clear for United States Election Day, a practice the league has followed in recent national election years. The night before produced heavy individual numbers: Luka Doncic put up 42 points and 13 assists as the Lakers beat Miami 138-117, Shai Gilgeous-Alexander scored 43 in Oklahoma City's 117-112 win over Cleveland, and Stephen Curry scored 34 as Golden State edged Phoenix 116-113. New Orleans also beat Memphis 135-134 in overtime with 25 from Zion Williamson.","source":"Yahoo Sports／KORN Radio（11/3）","url":"https://sports.yahoo.com/articles/why-no-nba-games-november-141431397.html"},{"en":"Chicago beat Seattle 34-17 on Monday Night Football behind three Swift touchdowns","zh":"**芝加哥熊 34–17 擊敗海鷹**，Swift 跑陣三次達陣，Williams 傳 247 碼一記達陣。","summary":"The Chicago Bears beat the Seattle Seahawks 34-17 on Monday Night Football. D'Andre Swift ran for three touchdowns and Caleb Williams threw for 247 yards and one score in a game Chicago controlled on the ground after half-time. Seattle's offence stalled in the red zone and the defence could not get off the field on third down. Earlier in the weekend Arizona beat Dallas 33-30 in overtime, Gardner Minshew throwing three touchdown passes as the Cardinals came back from a 14-point deficit.","source":"KORN Radio Tuesday Sports（11/3）","url":"https://kornradio.com/sports/tuesday-sports-november-3-2026/"}]},{"label":"教育心理","items":[{"en":"A worldwide survey finds young people's mental well-being still declining","zh":"**全球調查顯示年輕族群心理健康持續下滑**，18–34 歲自評幸福感低於中高齡者。","summary":"A large multi-country survey reports that mental well-being among young adults continues to decline, with 18 to 34 year olds now scoring lower on self-reported well-being than older age groups in most countries sampled. The pattern inverts the long-standing assumption that well-being falls in mid-life and recovers later. Researchers point to a cluster of correlates rather than one cause: financial precarity, weaker in-person social ties, heavy social-media use, and disrupted schooling during adolescence. The authors caution that self-report measures may also be picking up greater willingness to describe distress.","source":"News-Medical（11/2）","url":"https://news-medical.net/news/20261102/Worldwide-survey-reveals-declining-mental-well-being-among-young-people.aspx"},{"en":"Inside Higher Ed lists five digital-age threats to student well-being","zh":"**美國高教媒體整理五大數位時代學生困境**：睡眠、注意力、比較心理、孤立與線上騷擾。","summary":"Inside Higher Ed set out five challenges to student well-being in the digital age, drawing on campus wellness directors: disrupted sleep from late-night device use, fragmented attention that makes sustained study harder, constant social comparison, loneliness despite dense online contact, and exposure to online harassment. The piece argues that counselling capacity alone cannot absorb these, and that course design matters: predictable deadlines, fewer always-on communication channels, and explicit norms about response times reduce measured stress more cheaply than adding staff.","source":"Inside Higher Ed（11/3）","url":"https://www.insidehighered.com/news/student-success/health-wellness/2026/11/03/5-challenges-student-well-being-digital-age"},{"en":"Education Week says the research base on AI in schools is a mess","zh":"**Education Week 直言 AI 教育研究一團亂**，多數研究樣本小、缺對照組，難作政策依據。","summary":"Education Week reviewed the fast-growing literature on artificial intelligence in education and concluded that the evidence base is in poor shape. Most studies are small, short, run by the tool's own developers, and lack control groups or pre-registered outcomes, so effect sizes vary wildly between studies of apparently similar products. The result is that schools buying AI tutoring or grading tools cannot tell from the literature whether they work. The piece calls for common outcome measures and independent replication before districts commit budgets.","source":"Education Week（11/2026）","url":"https://edweek.org/technology/the-research-on-ai-in-education-is-a-mess/2026/11"}]},{"label":"產業動態（AI／半導體／量子）","items":[{"en":"Anthropic's IPO preparation dominates AI headlines, with Claude said to help design its own chips","zh":"**Anthropic IPO 題材成焦點**，向投資人表示 Claude 已參與自家晶片設計，信評機構傳給出高收益等級。","summary":"Anthropic's move toward a public listing dominated AI coverage on November 3. Reports said the company told prospective investors that Claude is already used in designing its own accelerator hardware, part of an argument that model capability now compounds into cost advantages down the stack. Separately the Financial Times reported that credit agencies are expected to assign the company a high-yield rating after listing, reflecting heavy capital commitments against still-young revenue. Anthropic also published a warning that it considers itself close to recursive self-improvement capability, and released the FlashProve verification work.","source":"GuruFocus／AI Weekly／FT 轉述（11/3）","url":"https://www.gurufocus.com/news/9165762/anthropic-explores-ai-chip-design-with-potential-15-trillion-ipo"},{"en":"Chip stocks rebounded on November 3 and AMD reported data centre revenue up 97%","zh":"**美股晶片股昨天反彈**：AMD 漲約 5%、Intel 約 4%、NVDA 約 3%；AMD 盤後公布資料中心營收年增 97% 至 85 億美元。","summary":"Semiconductor shares rebounded on November 3 after three sessions of losses, with AMD up around five percent, Intel around four percent, Nvidia around three percent and Micron leading early gains. After the close AMD reported data centre revenue up 97 percent year on year to 8.5 billion dollars, beating expectations, and Super Micro also beat on AI server demand. Both moved higher in after-hours trade. The results push back against the argument that AI capital spending is about to stall, though the market is still separating companies that sell the hardware from those that only promise AI revenue.","source":"24/7 Wall St／Motley Fool（11/3）","url":"https://247wallst.com/investing/2026/11/03/amd-advances-5-intel-rises-4-marvell-gains-2-as-chip-stocks-bounce-ahead-of-amd-earnings/"},{"en":"DRAM prices have doubled in 2026 and a Kioxia guidance miss triggered a memory selloff in Taiwan","zh":"**DRAM 今年以來價格翻倍**，但鎧俠財測不如預期引爆記憶體賣壓，台股南亞科、華邦電昨天跌停。","summary":"Contract DRAM prices have roughly doubled during 2026 as memory makers divert capacity to AI servers, squeezing PC and phone manufacturers who now face both higher component costs and shortages. That price strength had driven a strong run in memory shares, which is exactly why a weaker-than-expected forecast from Kioxia hit so hard: Taiwanese memory and silicon-wafer names fell limit-down on November 3, with Nanya Technology and Winbond both down close to ten percent and GlobalWafers down 9.87 percent. The episode shows how much of the sector's valuation now rests on pricing assumptions rather than volume.","source":"Nikkei Asia／風傳媒（11/3）","url":"https://asia.nikkei.com/business/tech/semiconductors/dram-prices-double-in-2026-as-ai-focus-squeezes-pc-makers"}]},{"label":"追星（僅限清單內歌手）","items":[{"en":"Kenshi Yonezu's 2026 TOUR / GHOST opens this Friday in Nagano, with Taipei Dome in December","zh":"**米津玄師「2026 TOUR / GHOST」11/6（五）長野開跑**，日本 6 城 14 場到 12/17；**台北大巨蛋 12/26–27**。　▶ **Spotify**：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB","summary":"Kenshi Yonezu's arena tour 2026 TOUR / GHOST opens on Friday November 6 at Nagano Big Hat, running 14 shows across six Japanese cities until December 17: Nagano, Yokohama's K-Arena, Osaka-jo Hall, Marine Messe Fukuoka, Sekisui Heim Super Arena in Miyagi and Nagoya. The world leg brings him to Taipei Dome on December 26 and 27. Merchandise visuals released at the start of November use key art Yonezu drew himself. Ticket lottery payment windows for the Japanese dates have now closed, so remaining access is through resale and any later general sale.","source":"REISSUE RECORDS／ライブドアニュース","url":"https://news.livedoor.com/article/detail/28837160/"},{"en":"An Ado and Vaundy collaboration was picked as the Mezamashi TV opening theme","zh":"**Ado × Vaundy 合作新曲成為《めざましテレビ》開場曲**，定位是替努力的人加油的應援歌。　▶ **Spotify**：https://open.spotify.com/search/Ado%20Vaundy","summary":"A collaboration between Ado and Vaundy was chosen as the opening theme for Fuji TV's long-running morning programme Mezamashi TV, described by both artists as a song meant to push along people who are grinding through ordinary days. Vaundy wrote and produced the track and Ado sings it, continuing a run of high-profile tie-ups for both. The placement guarantees daily national exposure, which in Japan reliably converts into streaming chart positions, and it follows Vaundy's Asia tour dates in Taipei at the end of October.","source":"ファッションプレス","url":"https://www.fashion-press.net/news/101237"},{"en":"New releases from YOASOBI, Official HIGE DANdism and Mrs. GREEN APPLE land in the same week","zh":"**YOASOBI、Official髭男dism、Mrs. GREEN APPLE 新曲同週上線**，日媒選為本週重點新作。　▶ **Spotify**：https://open.spotify.com/search/YOASOBI","summary":"Japanese music media flagged a crowded release week with new songs from YOASOBI, Official HIGE DANdism and Mrs. GREEN APPLE arriving together, alongside a Tokyo Ska Paradise Orchestra collaboration and an anime theme from Hitsujibungaku. All three of the headline acts are on the user's tracking list, and all three now release primarily around drama or anime tie-ups rather than conventional album cycles, which is why their singles tend to cluster at the start of a broadcast season. No Taiwan or Hong Kong dates have been announced alongside these releases.","source":"SPICE / New Music Wednesday","url":"https://spice.eplus.jp/articles/330091"}]}]},"market":{"insights":["**台股昨天崩 1,612 點收 43,307**，史上第七大單日跌點，成交爆 9,280 億元","**殺盤主因記憶體與光通訊**：鎧俠財測差、美光續跌，南亞科、華邦電跌停","**櫃買 −6.42% 比大盤慘**，清單外大立光、穩懋跌停，環球晶 −9.87%","**美股昨夜晶片股反彈**，AMD 盤後資料中心營收 +97%，今天開盤壓力減輕","**今天先看 43,000 守不守**，站不回 44,000 之前都只能算反彈不是翻多"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"43,307.54","change":-3.59,"changePts":"-1,612.60","comment":"史上第七大跌點，失守 44K"},{"market":"TW","name":"櫃買指數 OTC","value":"345.52","change":-6.42,"changePts":"-23.72","comment":"中小型股殺更重"},{"market":"TW","name":"0050 元大台灣50","value":"—","change":-3.36,"comment":"溢價 +0.09%，收盤價未取得"},{"market":"TW","name":"0056 元大高股息","value":"—","change":null,"comment":"11/3 精確收盤未取得"},{"market":"US","name":"那斯達克 Nasdaq Composite","value":"25,372","change":0.83,"changePts":"+ <style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}

.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.55}
.weather-badge .w-icon{font-size:20px}

.weather-badge .w-city{color:var(--muted);min-width:2.2em}
.weather-badge .w-t{color:var(--orange);font-weight:700}
.weather-badge .w-d{color:var(--text)}
.weather-badge .w-alerts{margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.w-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid}
.w-tag.red{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.w-tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
.w-tag.ok{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.highlights{max-width:1400px;margin:16px auto 0;padding:0 20px}
.highlights .hl-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px}
.highlights h2{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
.highlights ul{list-style:none;display:flex;flex-direction:column;gap:5px}

.highlights li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.highlights li b{color:#fff}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}

.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}

.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}

.empty-tasks{text-align:center;padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.6}

.task-tmr:hover{border-color:var(--accent);color:var(--accent)}.task-tmr.sent{border-color:var(--green);color:var(--green)}
.tomorrow-btn{display:block;width:100%;margin-top:14px;background:var(--bg3);color:var(--accent);border:1px dashed var(--border);padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tomorrow-btn:hover{border-color:var(--accent);border-style:solid}
.section-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;border-left:3px solid var(--purple);padding-left:8px}

.urg-red{background:var(--red)}.urg-amber{background:var(--yellow)}.urg-green{background:var(--green)}
.email-body{display:none;padding:12px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.7}

.email-add{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);color:var(--accent);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:10px}
.email-add:hover{border-color:var(--accent)}
.news-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer}

.news-section{display:none}.news-section.visible{display:block}
.news-item{padding:12px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-en{font-size:13px;font-weight:600;cursor:pointer}.news-en a{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}.news-en a:hover{color:var(--accent);border-bottom-color:var(--accent)}.news-en a::after{content:' \2197';font-size:.8em;opacity:.55}
.news-en .arrow{color:var(--muted);font-size:10px}
.news-zh{font-size:13px;color:var(--accent);margin:3px 0 0;font-weight:500}
.news-summary{display:none;font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.news-summary.open{display:block}
.news-src{font-size:11px;margin-top:6px}
.news-src a{opacity:.85;text-decoration:none}.news-src a:hover{opacity:1}
.sp-link{color:#1db954;font-weight:600;text-decoration:none;margin-left:8px}

.bul{list-style:none;display:flex;flex-direction:column;gap:6px;margin:0;padding:0}

.bul li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bul li b{color:#fff}
.advice{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}

.insights{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px;margin-bottom:6px}
td.reason{font-size:13px;line-height:1.6}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}
.sec-head{font-size:13px;font-weight:700;margin:18px 0 10px;border-left:3px solid var(--accent);padding-left:9px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}
.wl-tabs{display:flex;gap:8px;margin-bottom:10px}
.wl-tabs button{background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.wl-tabs button.active{background:var(--accent);color:#04121f;font-weight:600}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:6px 0}
.stack{position:relative;padding-bottom:10px}
.stack .layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px;background:var(--bg2);border:1px solid var(--border);height:100%}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>

<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">

<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
var from=it.from||String(it.tag||"").split("·").filter(function(x){return !/優先|開考|剩|發布|48h/.test(x);}).join("·").replace(/^[🔴🟠🟡🟢✅\s]+/,"").trim();
var subj=it.subject||String(it.title||"").replace(/\*\*/g,"").split(/[。（(]/)[0].slice(0,60);
var todo=it.todo||String(it.kind||"").replace(/\*\*/g,"").split(/[：:]/).slice(-1)[0].split(/[；;]/)[0].slice(0,60);
var more=(it.subject?mdb(it.title||""):"")+(it.subject&&it.title?"<br>":"")+(it.todo&&it.kind?mdb(it.kind)+"<br>":"")+(it.detail?mdb(it.detail):"");
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div>"+(from?"<div class='sender'>"+esc(from)+"</div>":"")+
"<div class='subject'>"+mdb(subj)+"</div>"+
(todo?"<div class='action'>👉 "+mdb(todo)+(it.deadline&&it.deadline!=="—"?"（"+esc(it.deadline)+"）":"")+"</div>":"")+"</div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+more+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(!(m.items||[]).length)html+="<div class='empty-tasks'>📭 過去 24 小時沒有需要處理的信</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+mdb(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var c=x.change,cls=c==null?"":(c>=0?"up":"down"),arrow=c==null?"":(c>=0?" ▲":" ▼");
var pts=x.changePts!=null?((x.changePts>=0?"+":"")+x.changePts+" "):"";
var cm=x.comment!=null?x.comment:(x.note?splitStars(String(x.note).replace(/✅[^。]*。?|⚠️[^。]*。?/g,""))[0]||"":"");
if(x.comment==null&&cm.length>40)cm=cm.replace(/\*\*/g,"").split("。")[0].slice(0,40);
var noVal=!x.value||x.value==="—";
return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+(noVal&&c!=null?fmtChg(c):esc(x.value))+arrow+"</div>"+
(c!=null&&!noVal?"<div class='chg "+cls+"'>"+esc(pts)+"("+fmtChg(c)+")</div>":"")+(cm?"<div class='cm'>"+mdb(cm)+"</div>":"")+"</div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(/未取得|沿用/.test(r.price||"")?"—":r.price)+"</td><td class='reason'>"+mdb(r.reason)+"</td></tr>";}).join("");

(function(){var ins=(mk.insights&&mk.insights.length)?mk.insights:splitStars(mk.highlight).concat(splitStars(mk.note)).slice(0,5);
return ins.length?"<div class='insights'><h3>📊 市場解讀</h3>"+bullets(ins)+"</div>":"";})()+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+

"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+

"</div>"+

"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=qChg(code,mkt),price=qPrice(code,s[4]||100),ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=qChg(code,mk[0]);
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:qPrice(code,s[4]||100),ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
