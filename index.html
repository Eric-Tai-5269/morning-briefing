 35 Senate seats and 39 governorships are on the ballot","zh":"**美國期中選舉今天 11/3（二）投票**，眾議院全部 435 席、參議院 35 席、39 席州長同日改選，是本週最大政治變數。","summary":"The 2026 United States midterm elections take place on Tuesday, November 3. Every one of the 435 voting House seats is contested, along with 35 Senate seats, 39 governorships and roughly 100 ballot measures across 37 states. Control of Congress decides how much of the administration's fiscal programme can pass, so investors are watching the result for its effect on federal borrowing and Treasury yields. On the eve of the vote CNN counted eleven Senate seats as realistically in play, with Georgia, Michigan, Maine and Iowa the tightest, while mid-decade redistricting is expected to help Republicans hold House ground.","source":"CNN 選情直播／Wikipedia 2026 United States elections","url":"https://www.cnn.com/election/2026"},{"en":"Fake nuclear and chemical alerts hit emergency warning apps in Ukraine and Russia","zh":"**烏克蘭與俄羅斯的緊急警報 App 同時發出假核災警報**，疑為網路攻擊，烏克蘭一度關閉 App。","summary":"Emergency warning applications in both Ukraine and Russia pushed false alerts on Monday, telling users of radiation leaks, chemical releases and nuclear threats that had not happened. Ukraine temporarily disabled its national alert app while engineers traced the source, and Russian regional apps showed similar bogus messages. Investigators have not named a perpetrator, and officials in neither country have confirmed how the systems were reached. The episode matters beyond the two countries because civil-defence apps are trusted channels: once people have seen a false nuclear warning, genuine alerts are harder to act on.","source":"BBC 彙整／Tech Startups 11/2 彙整","url":"https://techstartups.com/2026/11/02/top-tech-news-today-november-2-2026-the-biggest-stories-in-ai-startups-and-big-tech/"},{"en":"Attackers remotely turned supermarket fridges up to 50C across five European countries","zh":"**歐洲五國逾 100 家超市冷藏設備遭遠端操控**，部分被調到攝氏 50 度，接續 10 月法國 700 家門市事件。","summary":"Attackers reached refrigeration controllers at more than one hundred retail sites in Belgium, Luxembourg, Sweden, Ireland and Estonia, in some cases setting them as high as fifty degrees Celsius and spoiling stock. Ahold Delhaize, Carrefour, Musgrave, Coop, ICA and IKEA were among the companies affected. The incident follows an October campaign that hit roughly seven hundred stores in France, and points at a common weakness: building-management and cold-chain controllers are often internet-exposed, rarely patched, and sit outside the corporate security perimeter that retailers actually monitor.","source":"Tech Startups 11/2 彙整","url":"https://techstartups.com/2026/11/02/top-tech-news-today-november-2-2026-the-biggest-stories-in-ai-startups-and-big-tech/"},{"en":"Apple posts a record September quarter: $114.5bn revenue, up 12%, in John Ternus's first report as CEO","zh":"**蘋果 FY26 第四季營收 1,144.8 億美元、年增 12%**，為 9 月季度新高；iPhone 575.8 億、服務 315.7 億同創紀錄。","summary":"Apple reported fiscal fourth-quarter revenue of $114.48 billion, up twelve percent from $102.47 billion a year earlier and above its own guidance of nine to eleven percent growth. Net profit was $30.71 billion and earnings per share $2.10, against $27.47 billion and $1.85 last year. iPhone brought in $57.58 billion, Services set an all-time high at $31.57 billion, Mac $10.79 billion, iPad $6.23 billion and wearables $8.30 billion. Full-year revenue reached $479 billion. It was the first results call led by chief executive John Ternus, with the active installed base at a record.","source":"9to5Mac／AppleInsider（11/2 盤後）","url":"https://9to5mac.com/2026/11/02/apple-reports-q4-2026-earnings/"},{"en":"South Korea's draft 2027 budget earmarks 21.3 trillion won for chips, physical AI and AI data centres","zh":"**南韓 2027 年度預算草案編列 21.3 兆韓元投入半導體、實體 AI 與 AI 資料中心**，另 4.7 兆元做自主 AI 模型。","summary":"South Korea's proposed 2027 budget sets aside 21.3 trillion won for semiconductors, physical AI and AI data centres, plus a further 4.7 trillion won for a sovereign domestic AI model. The overall budget is 820.9 trillion won, an increase of 12.8 percent, and still requires legislative approval. For Taiwan the plan is a competitive signal rather than a headline: Seoul is subsidising exactly the memory, foundry and AI-infrastructure layers where Samsung and SK Hynix compete most directly with TSMC and the Taiwanese supply chain.","source":"Tech Startups 11/2 彙整","url":"https://techstartups.com/2026/11/02/top-tech-news-today-november-2-2026-the-biggest-stories-in-ai-startups-and-big-tech/"}]},{"label":"科技","items":[{"en":"Marvell agrees to buy Lumentum in an all-stock deal valued around $115bn; both stocks fall hard","zh":"**Marvell 宣布以全股票方式併購 Lumentum，總價約 1,150 億美元**；MRVL 收跌 12.7%、LITE 跌 18.6%，市場不買單。","summary":"Marvell Technology agreed to acquire optical-components maker Lumentum in an all-stock transaction that values Lumentum's equity at about $102.5 billion, with holders receiving 4.5 Marvell shares each. The combination is pitched as a bet on optical interconnect for AI data centres, where bandwidth between accelerators is now the binding constraint. Investors disliked the price and the dilution: Marvell fell more than ten percent to $171.41 and Lumentum dropped over fifteen percent despite reporting fiscal first-quarter revenue of $1.26 billion. Closing is not expected until the first half of 2028.","source":"Tech Startups／Reuters（11/2）","url":"https://techstartups.com/2026/11/02/top-tech-news-today-november-2-2026-the-biggest-stories-in-ai-startups-and-big-tech/"},{"en":"Oracle moves to raise about $20bn in stock and debt to fund AI infrastructure","zh":"**甲骨文計畫發行約 100 億美元普通股＋100 億美元債券**，籌措 AI 基建資金，ORCL 單日收跌 8.7%。","summary":"Oracle is pursuing roughly $10 billion of new common stock alongside about $10 billion of debt, with proceeds earmarked for AI data-centre capacity. Its outstanding borrowings stood near $125.34 billion as of August 31, so the equity leg reads as an admission that debt alone can no longer carry the build-out. Shares fell 8.72 percent on the news. The sell-off fits the pattern that has driven markets since late October: investors now treat heavy AI capital spending as a cost to be funded rather than a growth story to be rewarded.","source":"Tech Startups 11/2 彙整","url":"https://techstartups.com/2026/11/02/top-tech-news-today-november-2-2026-the-biggest-stories-in-ai-startups-and-big-tech/"},{"en":"Google's Project Suncatcher ran a Gemma 4 model on a TPU in low Earth orbit","zh":"**Google「Project Suncatcher」衛星成功在低軌道上以 TPU 跑 Gemma 4 模型**，驗證太空資料中心概念。","summary":"A Google prototype satellite launched on October 1 has run the Gemma 4 model on a Trillium-generation TPU while in low Earth orbit, the company said. The constraint is power rather than compute: with roughly one kilowatt of solar generation, the satellite can only drive the TPU continuously for about twenty minutes at a time. The experiment is a feasibility test for putting inference capacity in orbit, where sunlight is nearly constant and cooling is free, and it is early enough that no production workload is implied.","source":"Tech Startups 11/2 彙整","url":"https://techstartups.com/2026/11/02/top-tech-news-today-november-2-2026-the-biggest-stories-in-ai-startups-and-big-tech/"}]},{"label":"運動","items":[{"en":"Kimi Antonelli becomes F1's youngest world champion at 20 years and 68 days","zh":"**20 歲 68 天的 Antonelli 在墨西哥城站拿下季軍，提前封王**，成為 F1 史上最年輕世界冠軍。","summary":"Mercedes driver Kimi Antonelli clinched the 2026 Formula One drivers' title by finishing third at the Mexico City Grand Prix, aged twenty years and sixty-eight days, the youngest champion in the sport's history. His lead became mathematically unassailable at 119 points. Max Verstappen won the race for Red Bull, his second victory of the season, with Lewis Hamilton second for Ferrari and Charles Leclerc fourth. George Russell, Antonelli's team-mate, sits fourth overall, 130 points back. Mercedes can secure the constructors' championship at the next round in Brazil.","source":"Formula 1 官網／Al Jazeera（11/1–11/2）","url":"https://www.aljazeera.com/sports/2026/11/2/kimi-antonelli-becomes-formula-ones-youngest-world-champion-in-mexico-city"},{"en":"Milwaukee Brewers win the 2026 World Series, the franchise's first championship","zh":"**密爾瓦基釀酒人隊奪下 2026 年世界大賽冠軍**，為球隊史上首座總冠軍。","summary":"The Milwaukee Brewers have won the 2026 World Series, the first championship in the franchise's history after more than five decades without one. The title caps a postseason run through a bracket that CBS Sports had rated wide open, and it closes the Major League Baseball season just as the American football and basketball calendars take over the US sports schedule. For a club that has spent most of its existence as a small-market outsider, the win is the headline sports story of the week in the United States.","source":"CBS Sports MLB playoff bracket","url":"https://www.cbssports.com/mlb/news/2026-mlb-playoff-bracket-schedule-scores-results-how-to-watch/"},{"en":"Buffalo Bills beat the Baltimore Ravens after Lamar Jackson leaves injured","zh":"**水牛城比爾擊敗巴爾的摩烏鴉**，烏鴉四分衛 Lamar Jackson 傷退，衝擊球隊季後賽機會。","summary":"The Buffalo Bills defeated the Baltimore Ravens in the latest round of NFL fixtures, in a game turned by the loss of Ravens quarterback Lamar Jackson to injury. Jackson's absence leaves Baltimore without the player its offence is built around at the point in the season when playoff seeding starts to harden, and Sky Sports' live coverage treated the injury rather than the scoreline as the story. Buffalo's win strengthens its own position in a crowded AFC race.","source":"Sky Sports NFL 2026 live blog","url":"https://skysports.com/nfl/live-blog/13606714/nfl-2026-results-and-highlights-buffalo-bills-beat-baltimore-ravens-after-lamar-jackson-injury"}]},{"label":"教育心理","items":[{"en":"Allen Institute study: AI tutors give away answers unless told very explicitly not to","zh":"**AI 家教模型太愛直接給答案**：基本指令下只有 17–60% 能忍住，指令寫清楚後升到 60–91%。","summary":"Researchers at the Allen Institute for AI tested tutoring models against 462 real mathematics tutoring transcripts from grades two to seven. Given only basic instructions, the models avoided over-helping — handing over the answer instead of prompting the student — just seventeen to sixty percent of the time. With clearer, more specific instructions that rose to between sixty and ninety-one percent. The practical lesson for anyone studying with an AI is that the prompt has to forbid the answer explicitly. The study used simulated students, so it shows restraint, not learning gains.","source":"The Syllabus 11/2（Allen Institute for AI）","url":"https://newcurrent.substack.com/p/the-syllabus-november-2-2026"},{"en":"Minnesota report calls student AI use a 'severe' threat as 70% pass off AI homework as their own","zh":"**明大報告警告學生使用 AI 對學習構成「嚴重」威脅**；調查顯示七成學生把 AI 作業當成自己的，只有 28% 被教過怎麼用。","summary":"A University of Minnesota report published in late October warns that the way students currently use generative AI poses a severe threat to learning, because the tool removes the struggle that produces understanding rather than merely speeding up the work. A separate survey found roughly seven in ten pupils have submitted AI-generated homework as their own, while only twenty-eight percent said they had been taught how to use such tools properly. Together the two findings describe a gap between adoption and instruction rather than a simple cheating problem.","source":"MPR News／AOL 調查報導（10/28 起）","url":"https://mprnews.org/story/2026/10/28/university-of-minnesota-report-warns-student-ai-use-poses-severe-threat-to-learning"},{"en":"A Berkeley mathematician now grades homework for completion, not correctness","zh":"**柏克萊數學教授 Richard Borcherds 改成「按時交就給分」**，理由是 AI 已能解大部分大學部習題。","summary":"Richard Borcherds, a Fields Medallist at Berkeley, has switched to awarding homework credit for on-time submission rather than for correct answers, on the grounds that AI can now solve most undergraduate problem sets, so marking correctness measures tool access instead of understanding. Commentators note the trade-off: if in-person examinations become the only real assessment, students who do badly under timed conditions — including those with learning differences — carry more of the risk. The move is one of several experiments in reweighting coursework as AI assistance becomes assumed.","source":"The Syllabus 11/2","url":"https://newcurrent.substack.com/p/the-syllabus-november-2-2026"}]},{"label":"產業動態（AI／半導體／量子）","items":[{"en":"Anthropic's IPO moves closer: S-1 filed, Nasdaq ticker 'ANT', and a yen 552.9bn tranche for Japanese investors","zh":"**Anthropic 已向 SEC 送出 S-1、代號 ANT**，最快 11 月中掛牌；另規劃對日本投資人配售最高 5,529 億日圓（約 35 億美元）。","summary":"Anthropic filed its S-1 with the SEC on October 26 for a Nasdaq listing under the ticker ANT, and reports since then say it could price as early as mid-November. The filing shows first-half 2026 revenue of $16.3 billion against $1.2 billion a year earlier, alongside a very large net loss driven by compute and training spending. A separate tranche of up to 552.9 billion yen, about $3.5 billion, is earmarked for Japanese investors. Share count and price are not set, and valuation estimates in circulation range from roughly $1.5 trillion to $2 trillion.","source":"Axios／NBC News／Tech Startups 11/2","url":"https://www.axios.com/2026/10/26/anthropic-ipo"},{"en":"Anthropic bans sustained abusive behaviour toward Claude from November 12","zh":"**Anthropic 將「持續且無意義的殘酷或辱罵行為」列入違反使用政策**，11/12 生效；一般抱怨、黑暗創作與模型測試不算。","summary":"From November 12, 2026, sustained and needless abusive or cruel behaviour toward Claude becomes a violation of Anthropic's Usage Policy. The company frames the rule as narrow, applying only in extreme cases of repeated cruelty with no apparent purpose, and explicitly excludes ordinary frustration, pushback, dark creative themes and red-teaming or research. Enforcement stays with Claude's existing ability to end a conversation rather than with account bans. The change grows out of Anthropic's model-welfare work, and it is contested: rivals including Microsoft AI reject the premise that models could warrant welfare consideration.","source":"tbreak／CNN Business（11/1）","url":"https://tbreak.com/anthropic-usage-policy-abuse-claude/"},{"en":"Google unveils Gemini 4 Carbon for vulnerability hunting while OpenAI ships the cheaper GPT-6.1 Terra","zh":"**Google 發表 Gemini 4 Carbon**（限資安專家、專攻找漏洞與多日任務）；**OpenAI 推 GPT-6.1 Terra**，主打螢幕操作與十分之一成本。","summary":"Google announced Gemini 4 Carbon on October 28, describing it as its most capable model and aiming it at finding software vulnerabilities and sustaining multi-day tasks. Access is restricted to selected cyber-defence experts with no release date for the consumer app or API, and Google says it ranks first on the Artificial Analysis Intelligence Index v5.0. OpenAI released GPT-6.1 Terra on October 26, a mid-range model strong at operating on-screen applications and understanding images, which it claims performs close to GPT-6 Astra at roughly a tenth of the cost.","source":"AI Weekly Report（10/26–11/1）","url":"https://note.com/coconut_1122_/n/n73f25e80ee06?hl=en"}]},{"label":"追星（僅限清單內歌手）","items":[{"en":"Kenshi Yonezu reveals GHOST tour merchandise as the arena run opens Friday — Taipei Dome is December 26-27","zh":"**米津玄師 11/2 公開「2026 TOUR / GHOST」周邊視覺**，巡演 11/6 長野開跑；**台北大巨蛋 12/26–12/27 兩場**。　▶ **Spotify**：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB","summary":"Kenshi Yonezu published the merchandise visuals for 2026 TOUR / GHOST on November 2, all using the key art he drew himself: a synthetic-leather jacket, hoodies, sweatshirts, tees, mini bags, key pouches, wristbands, gloves, caps, large scarves, towels, and character goods including the rabbit charm and Tongari keyring, plus gachapon versions. The Japanese arena leg opens at Nagano Big Hat on November 6 and 7, then Yokohama, Osaka, Fukuoka, Miyagi, Nagoya and Yokohama again through December 17. The world tour reaches Taipei Dome on December 26 and 27.","source":"音楽ナタリー／USEN 活動資訊（11/2）","url":"https://e.usen.com/news/news-event/-2026-tour-ghost-2.html"},{"en":"Vaundy closed his Asia tour with two Taipei Arena nights and a surprise free Instagram Live","zh":"**Vaundy 10/31、11/1 首攻台北小巨蛋兩場、約 2.6 萬人**，第二晚突然開 IG Live 免費放送數首歌。　▶ **Spotify**：https://open.spotify.com/search/Vaundy","summary":"Vaundy played Taipei Arena on October 31 and November 1 as the closing stop of his ASIA ARENA TOUR 2026 HORO, drawing about twenty-six thousand people across the two nights on a four-sided stage with a set running close to a hundred minutes. The setlist included Gyakko from One Piece Film Red, Todome no Ichigeki from Spy x Family, Chainsaw Blood, Kaiju no Hanauta and a new song, Idea ga Afurete Nemurenai, with Odoriko closing. On the second night he unexpectedly started a free Instagram Live, streaming several songs to fans without tickets.","source":"BELLA 儂儂（11/1 發布、11/2 更新）","url":"https://www.bella.tw/articles/music/60865/vaundy-tour-taipei-arena-2026"},{"en":"YOASOBI's 10-city Asia dome and stadium tour hits Nagoya this weekend; Taipei Dome is January 9-10","zh":"**YOASOBI「ASIA 10-CITY DOME & STADIUM TOUR 2026」本週 11/7–11/8 唱名古屋巨蛋**；**台北大巨蛋 2027/1/9–1/10 兩天**，實名登記抽選制。　▶ **Spotify**：https://open.spotify.com/search/YOASOBI","summary":"YOASOBI's ASIA 10-CITY DOME & STADIUM TOUR 2026 is billed as the first tour of this scale by a Japanese act. The Japanese dome dates run through Nagoya's Vantelin Dome on November 7 and 8, Sapporo on November 14 and 15, Fukuoka on November 28 and 29, and Tokyo Dome on December 5 and 6, after Osaka in October. The overseas legs include Taipei Dome on January 9 and 10, with entry under a registered-name lottery system and tickets starting around NT$1,800, making this the act's first Taipei Dome appearance.","source":"J/K NEWS 彙整／自由娛樂、巴哈姆特售票資訊","url":"https://gnn.gamer.com.tw/detail.php?sn=310732"},{"en":"Mrs. GREEN APPLE's sixth album is out and their first arena tour in three years is under way","zh":"**Mrs. GREEN APPLE 第 6 張原創專輯已於 9/30 發行**，約三年來首次全國 arena tour 正在進行，官方並已公布到 2029 年的演出構想。　▶ **Spotify**：https://open.spotify.com/search/Mrs.%20GREEN%20APPLE","summary":"Mrs. GREEN APPLE released their sixth original full album on September 30 and are touring Japanese arenas for the first time in about three years, both announced together in June on a television special. The band has also published an unusually long-range outline of live events and projects running to 2029, which is why their schedule page is worth checking periodically rather than waiting for single announcements. No Taiwan or Hong Kong date has been announced in this cycle, so the arena run remains domestic for now.","source":"音楽ナタリー／Mrs. GREEN APPLE 官方 schedule","url":"https://mrsgreenapple.com/schedule/list/?lang=en"}]}]},"market":{"insights":["**美股資金輪動明顯**：道瓊 +0.41% 收紅，那斯達克 −1.07%，錢從 AI 科技撤出","**Marvell 以 1,150 億美元併 Lumentum**，MRVL −12.7%、LITE −18.6%，市場嫌貴","**甲骨文要發 200 億美元籌 AI 資金**，ORCL −8.7%，是本波疑慮的核心案例","**台股今天 09:00 看能否站回 45,000**，昨天盤中低點 44,399 是支撐參考","**美國期中選舉今天開票**，國會席次影響財政與美債殖利率；考試週別盯盤"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"44,920.14","change":-0.65,"changePts":"-291.69","comment":"失守 45K，台積電跌 40 元是主壓"},{"market":"TW","name":"櫃買指數 OTC","value":"369.24","change":-0.28,"changePts":"-1.02","comment":"中小型股跌幅小於上週五"},{"market":"TW","name":"0050 元大台灣50","value":"104.10","change":-0.81,"changePts":"-0.85","comment":"連兩跌，累計回檔 3.41%"},{"market":"TW","name":"0056 元大高股息","value":"—","change":null,"comment":"11/2 精確收盤未取得"},{"market":"US","name":"那斯達克 Nasdaq Composite","value":"25,164.32","change":-1.07,"comment":"晶片與 AI 股續弱，跌最深"},{"market":"US","name":"S&P 500","value":"7,541.40","change":-0.51,"comment":"科技拖累，連兩個交易日收黑"},{"market":"US","name":"道瓊工業指數 Dow Jones","value":"51,983.98","change":0.41,"comment":"資金輪動進傳產與金融"},{"market":"US","name":"羅素 2000 Russell 2000","value":"—","change":null,"comment":"精確收盤未取得"},{"market":"US","name":"費半／半導體指數","value":"—","change":null,"comment":"收盤未取得；成分股普遍續跌"},{"market":"US","name":"QQQ（那斯達克100 ETF）","value":"681.09","change":-1.36,"comment":"跌幅大於 S&P，科技續遭減碼"}],"quotes":{"MRVL":-12.72,"INTC":-8.8,"ORCL":-8.72,"AMD":-7.5,"2330":-1.69,"2454":1.4,"2308":1.5,"2317":2.24,"3711":0.9,"0050":-0.81},"prices":{"2330":2330,"2454":3970,"2308":1355,"2317":251,"3711":674,"0050":104.1,"MRVL":171.41},"movers":[{"name":"Marvell（清單內）","ticker":"MRVL","change":-12.72,"price":"171.41 美元","reason":"全股票併購 Lumentum，市場質疑代價過高"},{"name":"Intel（清單內）","ticker":"INTC","change":-8.8,"price":"—","reason":"AI 資本支出疑慮延續，晶片股續遭賣壓"},{"name":"Oracle（清單內）","ticker":"ORCL","change":-8.72,"price":"—","reason":"擬發行 200 億美元股債籌 AI 基建資金"},{"name":"AMD（清單內）","ticker":"AMD","change":-7.5,"price":"—","reason":"財報前獲利了結，GPU 競爭與估值疑慮"}]}},"archive":{"dates":["2026-11-03","2026-11-02","2026-11-01","2026-10-31","2026-10-30","2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20","2026-10-19","2026-10-18","2026-10-17","2026-10-16","2026-10-15","2026-10-13","2026-10-12","2026-10-11","2026-10-10","2026-10-08","2026-10-07","2026-10-06","2026-10-05","2026-10-04"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.header-left .date{font-size:13px;color:var(--muted);margin-top:3px}
.header-left .ver{font-size:10px;color:#484f58;margin-top:2px}
.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.55}
.weather-badge .w-icon{font-size:20px}
.weather-badge .w-row{display:flex;gap:6px;white-space:nowrap}
.weather-badge .w-city{color:var(--muted);min-width:2.2em}
.weather-badge .w-t{color:var(--orange);font-weight:700}
.weather-badge .w-d{color:var(--text)}
.weather-badge .w-alerts{margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.w-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid}
.w-tag.red{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.w-tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
.w-tag.ok{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.highlights{max-width:1400px;margin:16px auto 0;padding:0 20px}
.highlights .hl-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px}
.highlights h2{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
.highlights ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.highlights li{font-size:14px;line-height:1.6;color:var(--text);padding-left:16px;position:relative}
.highlights li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.highlights li b{color:#fff}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}
.ring-text .sub{font-size:10px;color:var(--muted)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}
.task-cb.checked{background:var(--green);border-color:var(--green)}
.task-cb.checked::after{content:'✓';color:#fff;font-size:11px}
.task-info{flex:1}
.task-name{font-size:13px;font-weight:500}
.task-name.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.pri-high{background:#3d1a1a;color:var(--red)}.pri-mid{background:#2d2714;color:var(--yellow)}.pri-low{background:#172113;color:var(--green)}
.badge-type{background:var(--bg3);color:var(--muted)}
.empty-tasks{text-align:center;padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.6}
.task-tmr{align-self:center;background:transparent;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.task-tmr:hover{border-color:var(--accent);color:var(--accent)}.task-tmr.sent{border-color:var(--green);color:var(--green)}
.tomorrow-btn{display:block;width:100%;margin-top:14px;background:var(--bg3);color:var(--accent);border:1px dashed var(--border);padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tomorrow-btn:hover{border-color:var(--accent);border-style:solid}
.section-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;border-left:3px solid var(--purple);padding-left:8px}
.email-scroll{max-height:520px;overflow-y:auto;padding-right:4px}
.email-item{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.email-header{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--bg2)}
.email-header:hover{background:var(--bg3)}
.email-header .sender{font-size:12px;color:var(--accent);font-weight:600}
.email-header .subject{font-size:14px;margin:2px 0;font-weight:600;color:var(--text)}
.email-header .action{font-size:13px;color:var(--text);opacity:.85}
.urgency{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.urg-red{background:var(--red)}.urg-amber{background:var(--yellow)}.urg-green{background:var(--green)}
.email-body{display:none;padding:12px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.7}
.email-body.open{display:block}
.email-add{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);color:var(--accent);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:10px}
.email-add:hover{border-color:var(--accent)}
.news-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.news-section{display:none}.news-section.visible{display:block}
.news-item{padding:12px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-en{font-size:13px;font-weight:600;cursor:pointer}.news-en a{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}.news-en a:hover{color:var(--accent);border-bottom-color:var(--accent)}.news-en a::after{content:' \2197';font-size:.8em;opacity:.55}
.news-en .arrow{color:var(--muted);font-size:10px}
.news-zh{font-size:13px;color:var(--accent);margin:3px 0 0;font-weight:500}
.news-summary{display:none;font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.news-summary.open{display:block}
.news-src{font-size:11px;margin-top:6px}
.news-src a{opacity:.85;text-decoration:none}.news-src a:hover{opacity:1}

.sc-chg{font-size:15px;font-weight:700;white-space:nowrap}

.sc-spark{margin-top:8px}
.sc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sc-risk{font-size:12.5px;font-weight:700}.sc-hint{font-size:11px;color:var(--muted)}
.sc-dots{display:flex;gap:5px;margin-top:8px}
.sc-dots i{width:6px;height:6px;border-radius:50%;background:var(--border)}.sc-dots i.on{background:var(--accent)}
.stock-select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;min-width:230px;cursor:pointer}
.chart-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.trade-date-note{font-size:11px;color:var(--muted);margin-bottom:12px;padding:6px 10px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent)}
.hl-box-old{background:linear-gradient(135deg,#1a2a1a,#16231b);border:1px solid var(--green);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;line-height:1.6}
.cal-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}

.cal-modal .row{display:flex;gap:10px}.cal-modal .row>div{flex:1}
.cal-modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}

.btn-cancel{background:var(--bg2);color:var(--muted)}.btn-submit{background:#1f6feb;color:#fff;border-color:#1f6feb}

.cal-toast.show{opacity:1}

@media (max-width:900px){.main{grid-template-columns:1fr}.full-width{grid-column:1}.stat{min-width:130px}.stack-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.highlights li{font-size:13.5px}}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
var from=it.from||String(it.tag||"").split("·").filter(function(x){return !/優先|開考|剩|發布|48h/.test(x);}).join("·").replace(/^[🔴🟠🟡🟢✅\s]+/,"").trim();
var subj=it.subject||String(it.title||"").replace(/\*\*/g,"").split(/[。（(]/)[0].slice(0,60);
var todo=it.todo||String(it.kind||"").replace(/\*\*/g,"").split(/[：:]/).slice(-1)[0].split(/[；;]/)[0].slice(0,60);
var more=(it.subject?mdb(it.title||""):"")+(it.subject&&it.title?"<br>":"")+(it.todo&&it.kind?mdb(it.kind)+"<br>":"")+(it.detail?mdb(it.detail):"");
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div>"+(from?"<div class='sender'>"+esc(from)+"</div>":"")+
"<div class='subject'>"+mdb(subj)+"</div>"+
(todo?"<div class='action'>👉 "+mdb(todo)+(it.deadline&&it.deadline!=="—"?"（"+esc(it.deadline)+"）":"")+"</div>":"")+"</div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+more+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(!(m.items||[]).length)html+="<div class='empty-tasks'>📭 過去 24 小時沒有需要處理的信</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){

/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var c=x.change,cls=c==null?"":(c>=0?"up":"down"),arrow=c==null?"":(c>=0?" ▲":" ▼");
var pts=x.changePts!=null?((x.changePts>=0?"+":"")+x.changePts+" "):"";
var cm=x.comment!=null?x.comment:(x.note?splitStars(String(x.note).replace(/✅[^。]*。?|⚠️[^。]*。?/g,""))[0]||"":"");
if(x.comment==null&&cm.length>40)cm=cm.replace(/\*\*/g,"").split("。")[0].slice(0,40);
var noVal=!x.value||x.value==="—";
return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+(noVal&&c!=null?fmtChg(c):esc(x.value))+arrow+"</div>"+
(c!=null&&!noVal?"<div class='chg "+cls+"'>"+esc(pts)+"("+fmtChg(c)+")</div>":"")+(cm?"<div class='cm'>"+mdb(cm)+"</div>":"")+"</div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(/未取得|沿用/.test(r.price||"")?"—":r.price)+"</td><td class='reason'>"+mdb(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2></div><div class='card-body'>"+
(function(){var ins=(mk.insights&&mk.insights.length)?mk.insights:splitStars(mk.highlight).concat(splitStars(mk.note)).slice(0,5);
return ins.length?"<div class='insights'><h3>📊 市場解讀</h3>"+bullets(ins)+"</div>":"";})()+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+

"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"</div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=qChg(code,mkt),price=qPrice(code,s[4]||100),ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=qChg(code,mk[0]);
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:qPrice(code,s[4]||100),ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
