ters overloaded with data and called for $50bn in air traffic control upgrades. Homeland Security Secretary Markwayne Mullin ruled out a cyberattack, saying about 3,000 flights still landed safely.","source":"Al Jazeera（11/14）","url":"https://www.aljazeera.com/news/2026/11/14/faa-ground-stop-lifted-why-were-us-flights-grounded-and-whats-next"},{"en":"US denies Iran destroyed American radar in Bahrain as Gulf tensions escalate","zh":"**伊朗革命衛隊稱擊毀美軍巴林雷達**，美中央司令部否認並稱攔下兩架攻擊無人機、無人傷亡。","summary":"Iran's Revolutionary Guard Corps claimed on November 13 that it destroyed a US early-warning radar in Bahrain, home to the Navy's Fifth Fleet headquarters. US Central Command rejected the claim, saying two one-way attack drones were launched toward Bahrain on Friday, that both were shot down, and that there were no injuries or damage. The IRGC said the strike answered an attack on a telecommunications tower in Sirik County in southern Iran and warned it could respond without geographical limits. CENTCOM says about 1.7 billion barrels of crude have transited the Strait of Hormuz under US protection since summer. Qatar and Pakistan are still mediating.","source":"Euronews（11/13）","url":"https://www.euronews.com/2026/11/13/irgc-says-it-destroyed-us-radar-in-bahrain-after-attack-on-southern-iran"},{"en":"EU picks five states to speak for Europe in Ukraine peace talks","zh":"**歐盟在都柏林敲定由英法德義波五國＋歐盟機構代表歐洲**出席烏克蘭和談，俄方仍拒絕讓歐盟領導人入席。","summary":"At an EU leaders' meeting in Dublin on November 13, European Council President Antonio Costa announced Europe will be represented in Ukraine peace talks by EU institutions plus five Coalition of the Willing states: the UK, France, Germany, Italy and Poland. Costa said Europe must speak with one clear and united voice. German Chancellor Friedrich Merz warned against a second Anchorage moment and asked Washington for no surprises before expected Trump-Putin talks in China. US envoy Jared Kushner said agreeing on one spokesperson would be a bigger achievement than persuading Russia to include Europe. The Kremlin says no decision has been made.","source":"Al Jazeera（11/13）","url":"https://www.aljazeera.com/news/2026/11/13/europe-seeks-seat-at-ukraine-peace-talks-but-lacks-unified-voice"},{"en":"COP31 in Antalya reaches Day 6 with ministers arriving and red lines still hidden","zh":"**COP31 在土耳其安塔利亞進入第六天**，非洲要求 2035 年前調適資金增至每年 1,200 億美元，封面決議草案下週初才會出爐。","summary":"COP31, held in Antalya under a Turkiye-Australia co-presidency, reached Day 6 on November 14. UN climate chief Simon Stiell called progress constructive, noting talks began on time and avoided a fight over the agenda, while a Saturday-night stocktaking plenary was expected to expose countries' first red lines. Nations remain split over whether a cover decision should be the main outcome and over sectoral targets such as raising electrification to 35% by 2035. Africa is pushing to triple adaptation finance to at least $120 billion a year by 2035. Brazil wants to host a 2028 fossil-fuel transition conference.","source":"Climate Home News（11/14）","url":"https://www.climatechangenews.com/2026/11/14/cop31-bulletin-day-6-limited-progress-as-ministers-arrive-in-antalya/"},{"en":"Pope Leo XIV tours Peru as health authorities track a fivefold measles surge","zh":"**教宗良十四世南美行進入秘魯段**，奇克拉約露天彌撒聚集約 50 萬人，美洲今年麻疹病例是去年同期近五倍。","summary":"Pope Leo XIV, 71, continued his November 6-17 apostolic journey through Uruguay, Argentina and Peru, returning on November 13 to Chiclayo, where he once served as bishop. On Saturday November 14 he flew by helicopter to Santa Cruz de Succhabamba for Mass and held an evening prayer meeting at the shrine of Saint Toribio de Mogrovejo. An open-air Mass in Chiclayo drew about 500,000 people and up to four million were expected in Buenos Aires province. Health authorities are watching measles closely: 57,666 confirmed cases were recorded across 17 countries of the Americas from January to October, with at least 81 deaths.","source":"Euronews（11/14）","url":"https://www.euronews.com/2026/11/14/pope-leo-xiv-continues-trip-through-south-america-as-health-authorities-keep-watch"}]},{"label":"科技","items":[{"en":"Microsoft blames overloaded servers as global Outlook outage drags past 12 hours","zh":"**微軟 Outlook 全球大規模中斷**，43,000 則故障通報來自 72 國，微軟稱非網路攻擊、正回滾一項網路變更。","summary":"Users began reporting Outlook failures around 16:00 GMT on Thursday November 12, and by 07:00 GMT Friday Downdetector had at least 43,000 Outlook problem reports from 72 countries. Outlook was worst hit, with mailboxes unreachable on web, app and mobile, while Teams and Copilot were partly disrupted and integrations used by OpenAI and Anthropic were also affected. Charles Lamanna, Microsoft's EVP for Copilot, Agents and Platform, said there was no indication of malicious or cyber activity, and the company blamed elevated load across regions. Affected bodies included government systems in Singapore and Japan and Australia's federal police.","source":"Al Jazeera（11/13）","url":"https://www.aljazeera.com/news/2026/11/13/microsoft-hit-by-global-outages-what-happened-and-why"},{"en":"US Senate summons former Nvidia chief Jensen Huang and Commerce Secretary Lutnick","zh":"**美參議院傳訊已辭任的黃仁勳與商務部長 Lutnick 於 12/3 公開作證**，NVIDIA 市值首度跌破 4 兆美元。","summary":"Senate Banking Committee Chairman Tim Scott summoned former Nvidia CEO Jensen Huang and Commerce Secretary Howard Lutnick to a public hearing on December 3, saying they would face subpoenas if they refused. Three House committees asked Huang and Nvidia general counsel Tim Teter to appear at separate hearings on December 1 and 2. Huang resigned on November 12 after revelations of extramarital affairs, including with a woman US authorities suspect of spying for China; China denies the allegations. Lawmakers allege Nvidia's advanced-chip exports to China escaped proper scrutiny. Nvidia's market value fell below $4 trillion for the first time since July 2025.","source":"Al Jazeera（11/13）","url":"https://www.aljazeera.com/news/2026/11/13/nvidias-huang-lutnick-summoned-to-testify-to-us-senate"},{"en":"Research claims China's strongest open models were trained on export-banned Blackwell GPUs","zh":"**研究指中國最強開源模型是用禁止出口的 NVIDIA Blackwell GPU 訓練**，在 Kimi K3 與 DeepSeek V4 權重中找到訓練指紋。","summary":"Will DePue, a former OpenAI researcher now leading the nonprofit Unemployment Labs, analysed model weights from DeepSeek, Moonshot AI, MiniMax and Ant Group and reported Blackwell training fingerprints in Moonshot's Kimi K3 releases and DeepSeek's V4 models. Blackwell GPUs are banned from export to China or Chinese-owned firms. White House technology adviser Michael Kratsios had earlier said, citing US intelligence, that Moonshot used export-banned chips. Epoch AI estimates about two million advanced chips entered China across 2024 and 2025 through schemes hiding their destination. TechCrunch cautions the models may not have been trained entirely on Nvidia hardware.","source":"TechCrunch（11/13）","url":"https://techcrunch.com/2026/11/13/export-banned-nvidia-chips-are-behind-chinas-most-powerful-ai-models-uh-oh-jensen/"}]},{"label":"運動","items":[{"en":"Denmark thrash Ronaldo-less Portugal 4-1 in Braga as Hojlund scores twice","zh":"**丹麥在布拉加 4–1 痛擊葡萄牙**，Hojlund 獨進兩球；這是 C 羅宣布退出國家隊後葡萄牙首戰。","summary":"Denmark beat Portugal 4-1 at the Estadio Municipal in Braga on November 14. Pierre-Emile Hojbjerg scored a 43rd-minute penalty, Rasmus Hojlund struck twice in the 49th and 56th minutes, Joachim Andersen headed in a fourth, and Bernardo Silva got a late consolation. It was Portugal's first match since Cristiano Ronaldo, 41, announced his exit from international football; the squad wore his number seven with his name and fans unfurled a banner reading thank you, captain. Portugal had won all four previous group matches and were already through to the quarter-finals. Denmark sit second on nine points from five games.","source":"Al Jazeera（11/14）","url":"https://www.aljazeera.com/sports/2026/11/14/ronaldo-less-portugal-thrashed-4-1-by-denmark-in-the-nations-league"},{"en":"Haaland penalty helps Norway beat Wales 3-1 and push Bellamy's side toward relegation","zh":"**挪威在奧斯陸 3–1 擊敗威爾斯**，Haaland 罰進他在國家聯賽的第 23 球，威爾斯已確定小組墊底。","summary":"Norway beat Wales 3-1 at the Ullevaal Stadion in Oslo on November 14 in Nations League Group A4. Antonio Nusa opened the scoring after the break, substitute Andreas Schjelderup tapped in an Erling Haaland pass, and Haaland converted a penalty won when Connor Roberts pushed Schjelderup, his 23rd Nations League goal. David Brooks scored for Wales, who were the better side in the first half as Daniel James missed three chances. Wales are now guaranteed to finish bottom of the group on three points, and a draw against Portugal in Cardiff on Tuesday would confirm a March relegation play-off.","source":"Sky Sports（11/14）","url":"https://www.skysports.com/football/news/13612155/norway-3-1-wales-craig-bellamys-side-suffer-defeat-in-oslo-with-threat-of-nations-league-relegation-now-looming"},{"en":"Reijnders hat-trick powers Netherlands to a record-equalling 7-0 rout of Greece","zh":"**荷蘭 7–0 血洗希臘**，Reijnders 上半場完成帽子戲法，追平國家聯賽史上最大比分勝利。","summary":"The Netherlands beat Greece 7-0 at the Johan Cruijff ArenA in Amsterdam on November 13. Crysencio Summerville scored on six minutes, Tijjani Reijnders hit a first-half hat-trick in the 12th, 18th and 33rd minutes, Jurrien Timber scored twice and Donyell Malen added the seventh. UEFA said the result equals the biggest win in Nations League history. Reijnders is the first Netherlands player to score a first-half hat-trick since Marco van Basten against Malta in December 1990. Greece, previously unbeaten and able to seal the group with a win, conceded five in a match for the first time since September 2001.","source":"beIN Sports（11/13）","url":"https://www.beinsports.com/en-us/soccer/uefa-nations-league/articles/netherlands-7-0-greece-reijnders-hits-hat-trick-in-nations-league-rout-2026-11-13"}]},{"label":"教育心理","items":[{"en":"Only one in six English SEND area inspections produced a positive outcome in 2026","zh":"**英國 2026 年 29 份特教區域視導僅約六分之一獲正面評價**，4 區被判定有系統性失能，EHCP 問題幾乎無處不在。","summary":"A Tes analysis of the 29 SEND area inspections published by Ofsted and the Care Quality Commission in 2026 found only about one in six areas received a positive outcome. Four areas were judged to have widespread or systemic failings: Leeds, St Helens, Sutton and Wokingham. Twenty areas were rated as having arrangements that lead to inconsistent experiences for children, and only five received the most positive rating. Problems with education, health and care plans appeared in all but two of the 29 reports. A government SEND White Paper is expected in the new year, with a new EHCP system due to begin in 2029.","source":"Tes Magazine（11/13）","url":"https://www.tes.com/magazine/news/general/revealed-send-area-inspections-positive-outcome"},{"en":"Neuroscientists find travelling brain waves act as a personal fingerprint for memory","zh":"**研究發現人腦記憶運作時的行進波具個人獨特性**，僅憑波形就能以約 70% 準確率判讀記憶階段。","summary":"A Nature Communications paper by Anup Das, Erfan Zabeh, Bard Ermentrout and Joshua Jacobs reanalysed electrocorticography recordings from 24 drug-resistant epilepsy patients performing spatial and verbal memory tasks. The team found 39 oscillating electrode clusters in the 3 to 40 hertz range, with travelling-wave bursts lasting about 80 to 180 milliseconds and moving at roughly 0.3 to 3.3 metres per second. Outward concentric waves dominated spatial memory while inward waves dominated verbal memory. Decoders trained on wave shape alone identified memory stages and letters with about 70% accuracy against 50% chance, but had to be trained per person.","source":"PsyPost（11/13）","url":"https://www.psypost.org/neuroscientists-just-found-a-hidden-fingerprint-in-human-memory/"},{"en":"Case study links the right amygdala to PTSD after ablation cuts symptom score by more than half","zh":"**單一病例研究顯示右側杏仁核燒灼後 PTSD 分數從 50 降到 21**，為杏仁核與創傷後壓力的因果關係提供罕見證據。","summary":"A Nature Communications case study with senior author Jon T. Willie of the University of Texas at Austin describes a 41-year-old man with drug-resistant temporal lobe epilepsy and severe PTSD. Surgeons used stereoelectroencephalography-guided radiofrequency ablation to inactivate about 47% of the right amygdala while he was awake, sparing over 99.9% of the right hippocampus. Twenty minutes later he rated ambiguous faces as fearful far less often. Two months on, his PTSD score had fallen from 50 to 21, below the diagnostic cutoff, while his seizure rate stayed unchanged. Willie called it an early feasibility study needing larger controlled trials.","source":"PsyPost（11/14）","url":"https://www.psypost.org/new-case-study-offers-causal-evidence-linking-the-right-amygdala-to-ptsd/"}]},{"label":"產業動態","items":[{"en":"OpenAI and Databricks let enterprises run ChatGPT, Codex and GPT models on governed data","zh":"**OpenAI 與 Databricks 合作**，企業可直接在受治理的自有資料上使用 ChatGPT、Codex 與 GPT 模型。","summary":"Under a partnership announced on November 13, enterprises can use ChatGPT, Codex and OpenAI's GPT models directly on data governed inside Databricks, rather than exporting it to a separate environment. The arrangement targets the main blocker for corporate AI adoption, which is keeping regulated or sensitive data inside existing governance and access controls while still letting employees and coding agents query it. No pricing or customer figures were published alongside the announcement. The same round-up notes IBM and Microsoft launched Imagine Enterprise on the same day, bundling prebuilt AI agents with cloud infrastructure for large organisations.","source":"AI Agents Directory 彙整（11/14）","url":"https://aiagentsdirectory.com/news/ai-agents-news-brief-2026-11-14"},{"en":"Anthropic pushes Claude into manufacturing, wiring it to engineering and production systems","zh":"**Anthropic 把 Claude 推進製造業**，直接連接工程軟體與生產系統，是模型從辦公室走向工廠的一步。","summary":"Reported on November 13, Anthropic is extending Claude into manufacturing settings by connecting it to engineering software and production systems rather than only to documents and chat. The move puts the model alongside CAD, PLM and shop-floor data, where the value is in reading specifications, cross-checking tolerances and surfacing production issues earlier. No customer names, deployment scale or revenue figures were disclosed in the report. For a chemical engineering student this is worth tracking because the same pattern, a general model plugged into process and plant data, is what would eventually reach process control and plant optimisation work.","source":"AI Agents Directory 彙整（11/14）","url":"https://aiagentsdirectory.com/news/ai-agents-news-brief-2026-11-14"},{"en":"China warns Washington over chip curbs as banned Nvidia servers surface in Shanghai","zh":"**中國警告美國收緊晶片出口管制將危及全球供應鏈**，同時傳出上海公司取得遭禁的 H800 伺服器。","summary":"On November 13 Chinese foreign ministry spokeswoman Mao Ning said China opposes the abuse of export control measures and warned that tighter US chip export rules would threaten global industry stability and supply chains. Bloomberg reported that Shanghai Longteng Intelligent Computing, set up by former Megaspeed executive Alice Huang, obtained servers containing Nvidia H800 chips that have been banned from export to China since 2023. US House Speaker Mike Johnson said he favours limiting those exports. Washington currently permits exports of the weaker H200 under an arrangement that collects a 25% tariff.","source":"Euronews（11/13）","url":"https://www.euronews.com/2026/11/13/china-warns-us-over-chip-curbs-as-suspected-spys-firm-got-banned-chips"}]},{"label":"追星","items":[{"en":"YOASOBI add two Hong Kong shows with HSBC presale opening Monday November 16","zh":"**YOASOBI「SUPER PLANET」香港站 2027/1/21–22 亞博館**，匯豐 Mastercard 優先預售 11/16、公售 11/17 下午 3 點。","summary":"YOASOBI announced two Hong Kong dates for the SUPER PLANET Asia tour on January 21 and 22, 2027 at the AsiaWorld-Expo Arena. An HSBC Mastercard priority presale runs on November 16 from 10:00 to 22:00 Hong Kong time, with public sale from 15:00 on November 17 through Ticketflap. Prices are HK$1,880 for priority-entry standing, HK$1,580 and HK$1,380 for standing, and HK$1,580 down to HK$980 for seats. The same tour plays Taipei Dome on January 9 and 10, 2027 with an 18:00 start, NT$1,800 to NT$6,880, sold by real-name lottery through Ticket Plus.","source":"星島日報加拿大（11/10）","url":"https://ccue.singtao.ca/2026-11-10/yoasobi%E9%A6%99%E6%B8%AF%E6%BC%94%E5%94%B1%E6%9C%832027%EF%BD%9C1%E6%9C%88%E4%BA%9E%E5%8D%9A%E9%96%8B%E5%85%A9%E5%A0%B4-%E7%A5%A8%E5%83%B9-%E6%BB%99%E8%B1%90%E5%84%AA%E5%85%88%E9%A0%90%E5%94%AE-ticke/1113147","spotify":"https://open.spotify.com/artist/64tJ2EAv1R6UaZqc4iOCyj"},{"en":"Kenshi Yonezu's Taipei Dome general sale is set for Thursday November 19 at noon","zh":"**米津玄師台北大巨蛋 12/26、27 一般售票暫定 11/19（四）12:00 開賣**，生涯首次巨蛋連兩日公演。","summary":"The general sale for Kenshi Yonezu's December 26 and 27 shows at Taipei Dome is provisionally set for Thursday, November 19 at 12:00, after the real-name lottery registration ran from October 29 to 31, first results were published on November 2 and a revival lottery opened on November 4. Doors open at 15:00 with an 18:00 start. Tickets run from NT$1,800 to NT$5,980 across eight tiers, with accessible seating at NT$2,240 and NT$2,840, sold through Ticket Plus. These are the first two-day dome shows of his career, opening a 14-date world tour that continues to Seoul, Singapore, Auckland, Los Angeles, London and Paris.","source":"蕃薯藤 yam 新聞（10/16）","url":"https://n.yam.com/Article/20261016395605","spotify":"https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB"},{"en":"Fujii Kaze streams the first night of his Tokyo Dome piano recital free on YouTube","zh":"**藤井風 11/20、21 東京巨蛋鋼琴獨奏會**，首日 11/20 全場在官方 YouTube 免費直播。","summary":"Fujii Kaze performs a solo piano recital at the Tokyo Dome on November 20 and 21. The first night opens at 17:00 with a 19:00 start and runs to about 20:30, and will be streamed in full and free of charge on his official YouTube channel. The second night opens at 16:00 with an 18:00 start and ends around 19:30, and will not be streamed. Separately, a Blu-ray of this summer's Pre: Prema Tour goes on sale on December 16 for 7,369 yen, carrying all 18 songs from the second Hiroshima Green Arena night plus 35 minutes of backstage footage.","source":"bezzy.jp（10/29）","url":"https://bezzy.jp/2026/10/94241/","spotify":"https://open.spotify.com/artist/6bDWAcdtVR3WHz2xtiIPUi"},{"en":"Ado releases Shinka as the opening theme for Prime Video's Demon's Crest","zh":"**Ado 新曲「シンカ」11/6 配信**，是 Prime Video 獨播動畫《デモンズ・クレスト》片頭曲；翻唱專輯第二彈 12/23 發售。","summary":"Ado released the new song Shinka on November 6 as the opening theme for Demon's Crest, the anime adapted from Reki Kawahara's work and streaming exclusively worldwide on Prime Video, which went live the same day at 21:00 Japan time. The track was written and composed by the VOCALOID producer Yurry Canon. Her second covers album, Ado no Utattemita Album Sono 2, follows on December 23, with the second wave of track listings and store-specific bonuses already announced on October 8. Ado remains one of the most streamed Japanese solo artists, with roughly 6.4 million monthly Spotify listeners.","source":"USEN 音樂情報（11/02）","url":"https://e.usen.com/news/news-release/ado116.html","spotify":"https://open.spotify.com/artist/6mEQK9m2krja6X1cfsAjfl"},{"en":"Mrs. GREEN APPLE's album POPS returns to number one on Billboard Japan","zh":"**Mrs. GREEN APPLE 專輯《POPS》相隔兩週重返 Billboard JAPAN 綜合專輯榜冠軍**。","summary":"Mrs. GREEN APPLE's sixth original album POPS, released on September 30, 2026, returned to number one on Billboard Japan's Hot Albums chart two weeks after previously topping it. The chart covered the tracking period from November 2 to 8 and was published on November 11. POPS is the follow-up to the band's run of dominant singles and has stayed near the top of Japanese album charts since release, which is unusual in a market where new entries normally take the summit for a single week. The band has also announced an arena tour, its first in three years.","source":"Billboard JAPAN（11/12）","url":"https://www.billboard-japan.com/d_news/detail/167360","spotify":"https://open.spotify.com/artist/4QvgGvpgzgyUOo8Yp8LDm9"}]}]},"market":{"insights":["**台股 11/13 收 43,675 點、漲 583 點（+1.35%）**，ASIC 設計族群是主要上攻動能","**創意 +9.54%、世芯 +9.39%、聯發科 +7.01%**：雲端大廠自研 ASIC 加速是核心題材","**美股多空分歧**：道瓊漲 0.10%、那斯達克跌 0.91%，資金從科技流向其他類股","**黃仁勳辭任後 NVIDIA 市值首次跌破 4 兆美元**，12/3 參議院公開聽證是下個觀察點","**10 月 PPI 年增 6.5% 為 2022/11 以來最大**，市場押注 12/8–9 會議升息一碼"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"43,675.12","change":1.35,"changePts":"+583.25","comment":"ASIC 族群帶頭反彈"},{"market":"TW","name":"櫃買指數 OTC","value":"342.41","change":1.99,"changePts":"+6.68","comment":"中小型股漲幅勝大盤"},{"market":"TW","name":"0050 元大台灣50","value":"102.50","change":1.54,"comment":"市值型 ETF 同步回升"},{"market":"TW","name":"0056 元大高股息","value":"53.00","change":1.24,"comment":"高息型跟漲、波動較小"},{"market":"US","name":"那斯達克 Nasdaq","value":"25,136.27","change":-0.91,"changePts":"-229.82","comment":"科技股續弱、跌幅最深"},{"market":"US","name":"S&P 500","value":"7,561.67","change":-0.4,"changePts":"-30.73","comment":"科技拖累、其他類股撐盤"},{"market":"US","name":"道瓊 Dow Jones","value":"52,347.55","change":0.1,"changePts":"+50.46","comment":"四大指數唯一收紅"},{"market":"US","name":"羅素 2000 Russell 2000","value":"2,790.49","change":-0.31,"changePts":"-8.57","comment":"升息預期壓抑小型股"},{"market":"US","name":"費半 SOX","value":"—","comment":"11/13 收盤值未取得"},{"market":"US","name":"QQQ 那斯達克100 ETF","value":"—","comment":"11/13 收盤值未取得"}],"quotes":{"2330":0.43,"2454":7.01,"3443":9.54,"3661":9.39},"prices":{"2330":2350,"2454":4120,"3443":8610,"3661":4020,"0050":102.5,"0056":53},"movers":[{"name":"創意（清單內 · 本日漲幅之冠）","ticker":"3443","change":9.54,"price":"8,610 元","reason":"Q3 財報優於預期、ASIC 專案能見度高"},{"name":"世芯-KY（清單內）","ticker":"3661","change":9.39,"price":"4,020 元","reason":"ASIC 族群走強，開盤即攻上漲停"},{"name":"聯發科（清單內 · 核心股）","ticker":"2454","change":7.01,"price":"4,120 元","reason":"被點名為雲端 ASIC 趨勢潛在受惠者"}]}},"archive":{"dates":["2026-11-15","2026-11-11","2026-11-10","2026-11-09","2026-11-08","2026-11-07","2026-11-06","2026-11-05","2026-11-04","2026-11-03","2026-11-02","2026-11-01","2026-10-31","2026-10-30","2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20","2026-10-19","2026-10-18","2026-10-17","2026-10-16"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.header-left .date{font-size:13px;color:var(--muted);margin-top:3px}
.header-left .ver{font-size:10px;color:#484f58;margin-top:2px}
.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.55}
.weather-badge .w-icon{font-size:20px}
.weather-badge .w-row{display:flex;gap:6px;white-space:nowrap}
.weather-badge .w-city{color:var(--muted);min-width:2.2em}
.weather-badge .w-t{color:var(--orange);font-weight:700}
.weather-badge .w-d{color:var(--text)}
.weather-badge .w-alerts{margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.w-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid}
.w-tag.red{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.w-tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
.w-tag.ok{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.highlights{max-width:1400px;margin:16px auto 0;padding:0 20px}
.highlights .hl-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px}
.highlights h2{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
.highlights ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.highlights li{font-size:14px;line-height:1.6;color:var(--text);padding-left:16px;position:relative}
.highlights li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.highlights li b{color:#fff}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}
.ring-text .sub{font-size:10px;color:var(--muted)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}
.task-cb.checked{background:var(--green);border-color:var(--green)}
.task-cb.checked::after{content:'✓';color:#fff;font-size:11px}
.task-info{flex:1}
.task-name{font-size:13px;font-weight:500}
.task-name.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.pri-high{background:#3d1a1a;color:var(--red)}.pri-mid{background:#2d2714;color:var(--yellow)}.pri-low{background:#172113;color:var(--green)}
.badge-type{background:var(--bg3);color:var(--muted)}
.empty-tasks{text-align:center;padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.6}
.task-tmr{align-self:center;background:transparent;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.task-tmr:hover{border-color:var(--accent);color:var(--accent)}.task-tmr.sent{border-color:var(--green);color:var(--green)}
.tomorrow-btn{display:block;width:100%;margin-top:14px;background:var(--bg3);color:var(--accent);border:1px dashed var(--border);padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tomorrow-btn:hover{border-color:var(--accent);border-style:solid}
.section-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;border-left:3px solid var(--purple);padding-left:8px}
.email-scroll{max-height:520px;overflow-y:auto;padding-right:4px}
.email-item{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.email-header{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--bg2)}
.email-header:hover{background:var(--bg3)}
.email-header .sender{font-size:12px;color:var(--accent);font-weight:600}
.email-header .subject{font-size:14px;margin:2px 0;font-weight:600;color:var(--text)}
.email-header .action{font-size:13px;color:var(--text);opacity:.85}
.urgency{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.urg-red{background:var(--red)}.urg-amber{background:var(--yellow)}.urg-green{background:var(--green)}
.email-body{display:none;padding:12px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.7}
.email-body.open{display:block}
.email-add{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);color:var(--accent);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:10px}
.email-add:hover{border-color:var(--accent)}
.news-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.news-section{display:none}.news-section.visible{display:block}

.news-item:last-child{border-bottom:none}
.news-en{font-size:13px;font-weight:600;cursor:pointer}.news-en a{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}.news-en a:hover{color:var(--accent);border-bottom-color:var(--accent)}.news-en a::after{content:' \2197';font-size:.8em;opacity:.55}
.news-en .arrow{color:var(--muted);font-size:10px}
.news-zh{font-size:13px;color:var(--accent);margin:3px 0 0;font-weight:500}

.sp-link{color:#1db954;font-weight:600;text-decoration:none;margin-left:8px}
.stat-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}

td.reason{font-size:13px;line-height:1.6}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}
.sec-head{font-size:13px;font-weight:700;margin:18px 0 10px;border-left:3px solid var(--accent);padding-left:9px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}
.wl-tabs{display:flex;gap:8px;margin-bottom:10px}
.wl-tabs button{background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.wl-tabs button.active{background:var(--accent);color:#04121f;font-weight:600}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:6px 0}
.stack{position:relative;padding-bottom:10px}
.stack .layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px;background:var(--bg2);border:1px solid var(--border);height:100%}
.stack .l2{width:86%;top:9px;opacity:.4}.stack .l1{width:93%;top:4px;opacity:.7}
.stack-card{position:relative;z-index:3;background:linear-gradient(150deg,#1d2530,#232c38);border:1px solid var(--border);border-radius:14px;padding:14px 15px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;min-height:172px;display:flex;flex-direction:column}
.stack-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.4);border-color:var(--accent)}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.sc-cat{font-size:12px;color:var(--accent);font-weight:600;background:rgba(88,166,255,.12);padding:2px 9px;border-radius:20px}
.sc-count{font-size:11px;color:var(--muted)}
.sc-namerow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-name{font-size:21px;font-weight:700;line-height:1.2}
.sc-code{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.sc-chg{font-size:15px;font-weight:700;white-space:nowrap}
.sc-theme{font-size:12.5px;color:var(--muted);margin-top:7px;flex:1;line-height:1.5}
.sc-spark{margin-top:8px}
.sc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sc-risk{font-size:12.5px;font-weight:700}.sc-hint{font-size:11px;color:var(--muted)}
.sc-dots{display:flex;gap:5px;margin-top:8px}
.sc-dots i{width:6px;height:6px;border-radius:50%;background:var(--border)}.sc-dots i.on{background:var(--accent)}
.stock-select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;min-width:230px;cursor:pointer}
.chart-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.trade-date-note{font-size:11px;color:var(--muted);margin-bottom:12px;padding:6px 10px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent)}
.hl-box-old{background:linear-gradient(135deg,#1a2a1a,#16231b);border:1px solid var(--green);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;line-height:1.6}
.cal-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}
.cal-modal-overlay.open{display:flex}
.cal-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:380px;padding:20px 22px}
.cal-modal h3{font-size:15px;margin-bottom:6px;color:var(--accent)}
.cal-modal .mhint{font-size:11px;color:var(--muted);margin-bottom:10px}
.cal-modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.cal-modal input,.cal-modal select{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px}
.cal-modal .row{display:flex;gap:10px}.cal-modal .row>div{flex:1}
.cal-modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.mbtn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border)}
.btn-cancel{background:var(--bg2);color:var(--muted)}.btn-submit{background:#1f6feb;color:#fff;border-color:#1f6feb}
.cal-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#04121f;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:1100;opacity:0;transition:opacity .3s;pointer-events:none}
.cal-toast.show{opacity:1}
.load-msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
@media (max-width:900px){.main{grid-template-columns:1fr}.full-width{grid-column:1}.stat{min-width:130px}.stack-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.highlights li{font-size:13.5px}}
</style>
</head>
<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
var from=it.from||String(it.tag||"").split("·").filter(function(x){return !/優先|開考|剩|發布|48h/.test(x);}).join("·").replace(/^[🔴🟠🟡🟢✅\s]+/,"").trim();
var subj=it.subject||String(it.title||"").replace(/\*\*/g,"").split(/[。（(]/)[0].slice(0,60);
var todo=it.todo||String(it.kind||"").replace(/\*\*/g,"").split(/[：:]/).slice(-1)[0].split(/[；;]/)[0].slice(0,60);
var more=(it.subject?mdb(it.title||""):"")+(it.subject&&it.title?"<br>":"")+(it.todo&&it.kind?mdb(it.kind)+"<br>":"")+(it.detail?mdb(it.detail):"");
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div>"+(from?"<div class='sender'>"+esc(from)+"</div>":"")+
"<div class='subject'>"+mdb(subj)+"</div>"+
(todo?"<div class='action'>👉 "+mdb(todo)+(it.deadline&&it.deadline!=="—"?"（"+esc(it.deadline)+"）":"")+"</div>":"")+"</div></div>"+
