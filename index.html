ter the midterms","zh":"**期中選舉後川普表態要與民主黨多數正面對撞**，並暗示內閣還會再有人事變動。","summary":"After the 2026 midterm elections, President Donald Trump signalled he is ready to fight a Democratic majority in Congress rather than seek accommodation, and said he expects more Cabinet changes to come. CNN's live coverage frames the next two years as a confrontation over spending bills, nominations and investigations, with the White House leaning on executive action where legislation is unlikely to pass. For markets the relevant question is how much of the administration's agenda now needs congressional approval, since a divided Washington raises the odds of shutdown fights and slower fiscal support.","source":"CNN（11/6–11/7）","url":"https://www.cnn.com/2026/11/07/politics/live-news/midterm-election-congress"},{"en":"The S&P 500 just had its worst week since the April 2025 tariff crash","zh":"**S&P 500 剛走完 2025 年 4 月關稅崩盤以來最差的一週**，AI 資本支出疑慮是主因，波動也擴散到亞股。","summary":"The S&P 500 finished the week of November 2 to 6 with its worst weekly performance since the tariff-driven crash of April 2025, according to 24/7 Wall St. The selling was concentrated in AI-linked names, as investors questioned whether the capital spending plans announced by hyperscalers can be funded without hurting margins. Friday brought a partial rebound in technology, but it was not enough to repair the week. The same anxiety hit Asia harder: Taiwan's benchmark index fell 4.51% on Friday alone, its fourth largest point drop ever.","source":"24/7 Wall St.（11/7）","url":"https://247wallst.com/investing/2026/11/07/the-sp-500-just-had-its-worst-week-since-the-april-2025-tariff-crash/"},{"en":"Two skydivers die in California after a midair collision entangles their parachutes","zh":"**加州兩名跳傘者空中相撞、降落傘纏在一起雙雙罹難**，主管機關已介入調查。","summary":"Two skydivers died in California after colliding in midair, which caused their parachutes to become entangled so that neither canopy could fully deploy. CNN reports that both jumpers were pronounced dead at the scene. Local authorities and federal aviation investigators are examining the jump, including separation distances and the order in which the two exited the aircraft, which are the usual factors in canopy collisions. The accident is a reminder that most fatal skydiving incidents now involve canopy handling and traffic management under an open parachute rather than equipment failure.","source":"CNN（11/7）","url":"https://www.cnn.com/2026/11/07/us/california-skydiving-accident"}]},{"label":"科技","items":[{"en":"Anthropic opens a Personal Finance beta in Claude, connecting bank accounts read-only via Plaid","zh":"**Claude 推出個人理財測試版**，用 Plaid 連結銀行與信用卡，只能讀不能動錢，美國 Pro／Max／Ultra 用戶先開放。","summary":"Anthropic has started a Personal Finance beta inside Claude for US Pro, Max and Ultra subscribers. Users link bank and credit card accounts through Plaid, then ask Claude about balances, individual transactions and spending patterns in plain language. Access is deliberately read-only: Claude cannot move money, pay bills or manage investments, and the feature carries a not-investment-advice disclaimer. Anthropic says it does not train on these financial conversations. The move follows a comparable account-linking feature that ChatGPT launched in May, and it pushes assistants further into a category that banking apps have owned until now.","source":"AI Daily Digest（11/7）","url":"https://dev.to/hiroki-ii-ai/ai-daily-digest-november-7-2026-ai-cracks-legacy-rsa-gemini-omni-gets-longer-clips-first-3f6p"},{"en":"Google's Gemini Omni 1.2 Flash goes generally available with 15-second clips and a 30% price cut","zh":"**Gemini Omni 1.2 Flash 正式上線**，影片最長 15 秒、價格比 1.1 便宜 30%，在 Arena 圖生影片榜以 1502 分排第一。","summary":"Google has made Gemini Omni 1.2 Flash generally available, positioning it as the fast and cheap tier rather than the maximum-capability model. Clips run up to 15 seconds with selectable lengths from three seconds, pricing is 30% below Omni 1.1, and third-party reporting estimates roughly seven cents per second at 720p. Users can revise a draft through follow-up instructions instead of regenerating from scratch. It ships through the Gemini API and inside Workspace apps such as Vids, with three free 15-second generations a month on personal accounts, and debuted top of the Arena image-to-video leaderboard at 1502.","source":"AI Daily Digest（11/7）","url":"https://dev.to/hiroki-ii-ai/ai-daily-digest-november-7-2026-ai-cracks-legacy-rsa-gemini-omni-gets-longer-clips-first-3f6p"},{"en":"DeepMind says AI agents found two weaknesses in legacy 1024-bit RSA","zh":"**DeepMind 的 AI 代理在人類密碼學家指導下，找出 1024 位元 RSA 的兩個弱點**：簽章偽造效率提升約 1,600 倍，批量破解成本降約 30 倍；RSA-2048 不受影響。","summary":"Google DeepMind reported that AI agents, steered by human cryptanalysts, identified two weaknesses in legacy 1024-bit RSA. Signature forgery became roughly 1,600 times more efficient, and the marginal cost of factoring keys in bulk fell about 30 times. DeepMind stressed that RSA-2048, the size in mainstream use, is not affected, and named no production system as vulnerable. The result matters less as an immediate break than as evidence that machine assistance is now productive in serious cryptanalysis, which strengthens the argument for retiring 1024-bit keys and accelerating post-quantum migration plans.","source":"AI Daily Digest（11/7）","url":"https://dev.to/hiroki-ii-ai/ai-daily-digest-november-7-2026-ai-cracks-legacy-rsa-gemini-omni-gets-longer-clips-first-3f6p"}]},{"label":"運動","items":[{"en":"Luka Doncic scores 53 as the Lakers hold off the Trail Blazers 124-118","zh":"**唐西奇砍 53 分帶湖人以 124–118 氣走拓荒者**，連兩場高效率爆發，是本季目前最高個人得分表現之一。","summary":"Luka Doncic poured in 53 points to carry the Los Angeles Lakers past the Portland Trail Blazers 124-118. It was another spectacular offensive night in a stretch where Doncic has been shouldering an unusually large share of the Lakers' scoring, and he kept Los Angeles in front through a fourth quarter that Portland repeatedly pulled back to single digits. The win continues a pattern this season in which the Lakers lean on Doncic's shot creation when their supporting shooting goes cold, and it adds to an early scoring-title conversation.","source":"ABC News／AP（11/7）","url":"https://abcnews.com/Sports/wireStory/luka-doncic-scores-53-spectacular-offensive-game-carrying-137936923"},{"en":"Jayson Tatum scores 34 as the Celtics demolish the Hornets 119-80 in NBA Cup play","zh":"**塔圖姆 34 分，塞爾提克在 NBA Cup 以 119–80 血洗黃蜂**，39 分差是本季至今最大勝差之一。","summary":"Jayson Tatum scored 34 points as the Boston Celtics crushed the Charlotte Hornets 119-80 in Emirates NBA Cup group play. The 39-point margin was built on a long stretch of the second and third quarters in which Charlotte could not score, and Boston's bench finished the game out. Tatum's efficiency rather than volume was the story: he reached 34 without needing heavy minutes, which let Boston rest its starters. Group-stage point differential can decide knockout qualification in the Cup format, so the scale of the win carries extra weight.","source":"Manila Times／AP（11/7）","url":"https://www.manilatimes.net/2026/11/07/sports/jayson-tatum-scores-34-as-celtics-demolish-the-hornets-119-80-in-nba-cup-play/2464440"},{"en":"Leeds beat Tottenham 1-0 in the Premier League","zh":"**英超利茲聯 1–0 擊敗熱刺**，主場拿下寶貴三分，熱刺則延續客場進攻不順的問題。","summary":"Leeds United beat Tottenham Hotspur 1-0 in the Premier League on Saturday November 7. The single goal was enough against a Spurs side that controlled possession for long periods without turning it into clear chances, a problem that has recurred in their away fixtures this season. For Leeds the result is worth more than three points: home wins against established top-half opposition are the clearest sign that a promoted side can survive, and it eases pressure after a run of narrow defeats.","source":"ESPN（11/7）","url":"https://www.espn.com/soccer/report/_/gameId/401878758"}]},{"label":"教育心理","items":[{"en":"Audit finds the meta-analyses claiming AI improves learning are too flawed to guide decisions","zh":"**14 篇「AI 有助學習」的統合分析全部不合基本方法學標準**：混合不同族群、結果指標不一致，被引用超過 3,000 次，其中一篇已撤稿。","summary":"Patrick O'Neill of Ivy Tech Community College audited 14 of nearly 40 meta-analyses that reported positive effects of AI on learning, and found all 14 failed basic standards. They pooled studies on different populations, used inconsistent outcome measures often unrelated to achievement, did not define the type of AI use being studied, and ignored publication bias. Some underlying studies contained impossible statistics or likely hallucinated references, including ChatGPT studies dated before the tool existed. The papers appeared in 11 reputable journals and have over 3,000 Google Scholar citations; one has been retracted. Stanford separately found only 20 of 800-plus studies had strong causal designs.","source":"Education Week（11/2026）","url":"https://edweek.org/technology/the-research-on-ai-in-education-is-a-mess/2026/11"},{"en":"Review of 78 studies links psychological capital to better student wellbeing and lower burnout","zh":"**78 篇研究、24 國、71,119 名受試者的系統性回顧**：希望、效能、韌性、樂觀（PsyCap）與生活滿意度和學習投入正相關，與憂鬱、焦慮、壓力、倦怠負相關。","summary":"A systematic review published in Education Sciences on November 6 screened higher-education studies from 2014 to 2024 and included 78 eligible studies from 24 countries across six continents, covering 71,119 participants. Psychological capital, defined as hope, self-efficacy, resilience and optimism, was positively associated with life satisfaction, academic adjustment, academic engagement, academic performance, wellbeing and positive affect, and negatively associated with depression, anxiety, stress and burnout. It also worked as a mediator and moderator between personal or contextual factors and mental health outcomes. The authors call for research that directly tests the pathway from psychological capital through wellbeing to educational success.","source":"Education Sciences／MDPI（11/6）","url":"https://mdpi.com/2227-7102/16/11/1893"},{"en":"Researchers examine how climate change anxiety affects college students","zh":"**研究檢視氣候焦慮對大學生的影響**，關注情緒困擾如何干擾課業專注與日常功能，以及哪些因應方式比較有效。","summary":"Phys.org reports on new research into how anxiety about climate change affects college students, a group that reports some of the highest levels of climate-related worry in surveys. The work looks at how that worry shows up day to day, including intrusive thoughts, difficulty concentrating on coursework and reduced motivation, and at which coping responses help. The practical interest for universities is distinguishing distress that motivates constructive action from distress that impairs functioning, because the two call for different support: the first for channels to act, the second for clinical services.","source":"Phys.org（11/2026）","url":"https://phys.org/news/2026-11-anxiety-climate-affects-college-students.html"}]},{"label":"產業動態（AI／半導體／量子）","items":[{"en":"IonQ beats and raises guidance: Q3 revenue up 336% to $173.8M, FY26 outlook lifted above half a billion","zh":"**IonQ Q3 營收 1.738 億美元、年增 336%**，全年財測上調到 5.05–5.15 億美元；股價上週五收漲 23.42%，但 10 月增資 20 億美元的稀釋風險是最大隱憂。","summary":"IonQ reported third-quarter revenue of $173.8 million, up 336% year over year and well above the $141.2 million expected, and raised full-year 2026 guidance to $505-515 million from $450-460 million, calling it an industry record above half a billion dollars. The SkyWater acquisition contributed $83.5 million while the core Platform segment grew 127% to $90.3 million. Gross margin slipped to 21.9% and the adjusted EBITDA loss widened to $133.6 million. Backlog stands at $1.2 billion with pro forma liquidity of $3.7 billion. The shares closed Friday up 23.42%, dragging Rigetti and D-Wave up with them.","source":"24/7 Wall St.（11/6）／Closing Look（11/6）","url":"https://247wallst.com/investing/2026/11/06/ionq-surges-18-on-beat-and-raised-guidance-rigetti-computing-jumps-18-d-wave-quantum-surges-16/"},{"en":"NVIDIA ships VFlash and four open-weight Cosmos 3 world models for robotics","zh":"**NVIDIA 發表 VFlash 視覺模型與 Cosmos 3 開放權重世界模型**：軌跡解碼最快 12 倍、3D 預測誤差降 61%、Jetson Thor 延遲降約 80%，機械手任務成功率 62.6%→70.2%。","summary":"NVIDIA introduced VFlash, a vision model that predicts geometry in parallel rather than sequentially, reporting up to 12 times faster trajectory decoding, up to 61% lower 3D prediction error and roughly 80% lower latency on Jetson Thor and DGX Spark. Manipulation success on one robot benchmark rose from 62.6% to 70.2%. Alongside it the company released Cosmos 3, a set of four open-weight world models with 16 billion trainable parameters each. Together they target the robotics stack rather than datacentre training, which is where NVIDIA has been pushing to widen demand beyond hyperscaler capex.","source":"AI Daily Digest（11/7）","url":"https://dev.to/hiroki-ii-ai/ai-daily-digest-november-7-2026-ai-cracks-legacy-rsa-gemini-omni-gets-longer-clips-first-3f6p"},{"en":"Report: OpenAI and Anthropic will take 25-40% of global new AI compute in 2027","zh":"**有報告估 OpenAI 與 Anthropic 2027 年將拿下全球新增 AI 算力的 25–40%**，兩家公司的採購節奏因此成為晶片與資料中心族群的關鍵變數。","summary":"A market report circulating on November 7 estimates that OpenAI and Anthropic together will absorb between 25% and 40% of all newly deployed AI compute globally in 2027. If the range holds, the purchasing decisions of two private companies would set the demand curve for accelerators, networking and datacentre power for the whole industry, which is exactly the concentration risk that drove last week's selloff in AI-linked equities. Treat the figure as an estimate rather than a disclosure: neither company publishes its compute commitments, so the number is modelled from supplier capacity and reported deals.","source":"KuCoin News（11/7）","url":"https://kucoin.com/news/flash/openai-and-anthropic-capture-25-40-of-global-new-ai-compute-in-2027"}]},{"label":"追星（僅限清單內歌手）","items":[{"en":"Kenshi Yonezu's GHOST tour opened this weekend in Nagano; 14 shows in six cities through December 17","zh":"**米津玄師〈2026 TOUR / GHOST〉昨天（11/6）在長野 Big Hat 開跑**，11/7 第二場，全國 6 城 14 場一路到 12/17 K Arena 橫濱；下一站 11/11–12 橫濱。","summary":"Kenshi Yonezu's arena tour GHOST opened on November 6 at Nagano Big Hat with a second night on November 7. The run covers six cities and 14 shows: Nagano on November 6-7, K Arena Yokohama on November 11-12, Osaka-jo Hall on November 18-19, Marine Messe Fukuoka A on November 27-28, Sekisui Heim Super Arena in Miyagi on December 3-4, Port Messe Nagoya Hall 1 on December 8-9, and K Arena Yokohama again on December 16-17. Reserved seats are 9,900 yen. Earliest ballot access came via serial numbers in the 15th single Plazma / BOW AND ARROW. No Taiwan date has been announced.","source":"Mikiki（巡演日程）｜Spotify 搜尋：米津玄師","url":"https://mikiki.tokyo.jp/articles/-/41560"},{"en":"Mrs. GREEN APPLE drop the Cinderella video and line up a 28-show arena tour across 14 venues","zh":"**Mrs. GREEN APPLE 新曲「シンデレラ」MV 公開**，第 6 張專輯《POPS》已於 9/30 發行，並宣布三年來首度大型巡演：全國 14 會場 28 場，9 月到 12 月。","summary":"Mrs. GREEN APPLE released the music video for the new song Cinderella, following their sixth album POPS on September 30. The band also confirmed their first arena tour in three years, 28 shows across 14 venues running from September to December, with an FC arena tour billed as Ringo Jam Tour SHADOWS covering 13 locations. Announcements at the PMGA SUMMIT added Mrs. GREEN APPLE on Harmony 2 and a costume exhibition for 2027. No Taiwan, Hong Kong or other overseas date has been confirmed, so overseas fans are still watching for an Asia leg.","source":"音楽ナタリー／ORICON／BARKS｜Spotify 搜尋：Mrs. GREEN APPLE","url":"https://natalie.mu/music/news/676319"},{"en":"YOASOBI confirm two Taipei Dome nights on January 9-10, 2027","zh":"**YOASOBI 確定攻蛋：2027/1/9–1/10 台北大巨蛋兩天**，屬於「SUPER PLANET 超惑星」亞洲 10 城巨蛋／體育場巡演，是他們生涯最大規模巡演。","summary":"YOASOBI will play two nights at Taipei Dome on January 9 and 10, 2027, their first two-day run at the venue. The shows are part of the YOASOBI ASIA 10-CITY DOME & STADIUM TOUR 2026-2027 SUPER PLANET, which began in October 2026 and is described as the largest tour of the duo's career, following their first North American run. Presale opened on September 16, 2026, so remaining inventory for the Taipei dates is likely to be limited to general-sale and resale channels. The duo also published English versions of the source novels for Adrenaline and BABY.","source":"THE FIRST TIMES（8/31 公布）｜Spotify 搜尋：YOASOBI","url":"https://www.thefirsttimes.jp/news/0000873200/"},{"en":"Vaundy's HORO Asia arena tour sold out both Taipei nights; the Shanghai dates were cancelled","zh":"**Vaundy〈ASIA ARENA TOUR 2026 HORO〉台北小巨蛋 10/31、11/1 兩場抽選完售**，上海 11/14–15 兩場已於 8/27 宣布取消，亞洲段剩餘場次需注意官方公告。","summary":"Vaundy's ASIA ARENA TOUR 2026 HORO ran 11 shows across six cities. The Taipei Arena dates on October 31 and November 1 sold out through a ballot, and the Hong Kong AsiaWorld-Arena show took place on October 3. Japanese legs covered Makuhari Messe on September 5-6 and Kitakyushu Messe on October 24-25, with Korea's INSPIRE ARENA on September 19-20. The two Shanghai dates scheduled for November 14-15 were cancelled, announced on August 27, 2026. With the Taipei nights now past, the practical watch item is whether a live recording or additional Asia dates follow.","source":"もとりょこblog（巡演彙整）｜Spotify 搜尋：Vaundy","url":"https://motoryokoblog.com/?p=16683"},{"en":"Fujii Kaze gave the first overseas date of his Prema World Tour to Kaohsiung","zh":"**藤井風 Prema World Tour 海外首場選在台灣**：2026/10/31 高雄世運主場館，由 KKLIVE 售票，是今年清單內歌手規模最大的台灣場。","summary":"Fujii Kaze opened the overseas leg of his Prema World Tour in Taiwan, playing Kaohsiung World Games Main Stadium on October 31, 2026, with ticketing through KKLIVE. Choosing a Taiwanese stadium as the first non-Japan stop is unusual for a solo J-pop act at that scale and reflects how large his audience in Taiwan has become. Fans who missed it should watch for a live film or album release, which has followed his previous stadium runs, and for whether the remaining world tour schedule adds a second Asia pass.","source":"BELLA.tw（2026 日系來台彙整）｜Spotify 搜尋：藤井風 Fujii Kaze","url":"https://www.bella.tw/articles/music/55869/2026-jpop-concerts-in-taiwan"}]}]},"market":{"insights":["**上週五台股崩 1,873 點（−4.51%）收 39,701**，盤中一度殺 3,737 點、500 多檔跌停","**成交 1.2461 兆是史上第四大量**，法人多解讀為融資斷頭洗籌碼，不是基本面轉壞","**美股同日分歧反彈**：那斯達克 +1.09%、道瓊 −0.46%，SOXX +3.51% 讓晶片股止血","**IonQ 財報噴出帶飛量子族群**，Rigetti、D-Wave 盤中各漲約 18%、16%（收盤值未取得）","**週一盯 40,000 點能否收復**，費半回穩是支撐，但 S&P 剛走完 2025 年 4 月以來最差一週"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"39,701.64","change":-4.51,"changePts":"-1,873.08","comment":"史上第四大跌點，失守 4 萬"},{"market":"TW","name":"櫃買指數 OTC","value":"304.02","change":-5.43,"changePts":"-17.45","comment":"中小型股殺更凶"},{"market":"TW","name":"0050 元大台灣50","value":"—","change":-4.79,"comment":"跌破 90 元，買盤湧入"},{"market":"TW","name":"0056 元大高股息","value":"—","change":null,"comment":"11/6 精確收盤未取得"},{"market":"US","name":"那斯達克 Nasdaq Composite","value":"24,579.43","change":1.09,"comment":"科技股逢低買盤回來"},{"market":"US","name":"S&P 500","value":"7,376.86","change":0.31,"comment":"小漲收週，週線仍最差"},{"market":"US","name":"道瓊工業指數 Dow Jones","value":"51,285.73","change":-0.46,"changePts":"-237.33","comment":"全場唯一收黑的大盤"},{"market":"US","name":"羅素 2000 Russell 2000","value":"2,754.11","change":0.89,"comment":"中小型股同步回穩"},{"market":"US","name":"費半／半導體指數 SOX","value":"—","change":4.21,"comment":"SOXX ETF +3.51%、SMH +3.62%"},{"market":"US","name":"QQQ（那斯達克100 ETF）","value":"—","change":null,"comment":"那斯達克100 +1.35% 收 26,990"}],"quotes":{"2330":-4.69,"0050":-4.79,"3017":-9.9,"3653":-9.9,"IONQ":23.42,"AMD":11.0,"INTC":7.71,"SPCX":8.6,"MU":5.12,"TSLA":4.23,"PLTR":3.48,"NVDA":2.78},"movers":[{"name":"IonQ（清單內 · 漲幅之冠）","ticker":"IONQ","change":23.42,"price":"—","reason":"Q3 營收 +336%、上調全年財測"},{"name":"超微 AMD","ticker":"AMD","change":11.0,"price":"—","reason":"前一日重挫後空頭回補最猛"},{"name":"SpaceX（IPO 觀察標的）","ticker":"SPCX","change":8.6,"price":"—","reason":"德銀喊逢低買進"},{"name":"Intel","ticker":"INTC","change":7.71,"price":"56.28 美元","reason":"轉型題材＋晶片股整體回補"},{"name":"台積電 ADR（清單外）","ticker":"TSM","change":6.33,"price":"—","reason":"3D DRAM 題材，盤前一度 +7.6%"},{"name":"美光 Micron","ticker":"MU","change":5.12,"price":"690.00 美元","reason":"HBM／記憶體族群跟著反彈"},{"name":"元大富櫃50（清單外 ETF）","ticker":"006201","change":-9.98,"price":"—","reason":"成分股多檔跌停，台股 ETF 跌幅之冠"},{"name":"奇鋐","ticker":"3017","change":-9.9,"price":"—","reason":"跌停，散熱族群重災區"},{"name":"健策","ticker":"3653","change":-9.9,"price":"—","reason":"跌停，均熱片族群同步殺盤"}]}},"archive":{"dates":["2026-11-08","2026-11-07","2026-11-06","2026-11-05","2026-11-04","2026-11-03","2026-11-02","2026-11-01","2026-10-31","2026-10-30","2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20","2026-10-19","2026-10-18","2026-10-17","2026-10-16","2026-10-15","2026-10-13","2026-10-12","2026-10-11","2026-10-10"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.header-left .date{font-size:13px;color:var(--muted);margin-top:3px}
.header-left .ver{font-size:10px;color:#484f58;margin-top:2px}
.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.55}
.weather-badge .w-icon{font-size:20px}
.weather-badge .w-row{display:flex;gap:6px;white-space:nowrap}
.weather-badge .w-city{color:var(--muted);min-width:2.2em}
.weather-badge .w-t{color:var(--orange);font-weight:700}
.weather-badge .w-d{color:var(--text)}
.weather-badge .w-alerts{margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.w-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid}
.w-tag.red{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.w-tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
.w-tag.ok{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.highlights{max-width:1400px;margin:16px auto 0;padding:0 20px}
.highlights .hl-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px}
.highlights h2{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
.highlights ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.highlights li{font-size:14px;line-height:1.6;color:var(--text);padding-left:16px;position:relative}
.highlights li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.highlights li b{color:#fff}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}
.ring-text .sub{font-size:10px;color:var(--muted)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}
.task-cb.checked{background:var(--green);border-color:var(--green)}
.task-cb.checked::after{content:'✓';color:#fff;font-size:11px}
.task-info{flex:1}
.task-name{font-size:13px;font-weight:500}
.task-name.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.pri-high{background:#3d1a1a;color:var(--red)}.pri-mid{background:#2d2714;color:var(--yellow)}.pri-low{background:#172113;color:var(--green)}
.badge-type{background:var(--bg3);color:var(--muted)}
.empty-tasks{text-align:center;padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.6}
.task-tmr{align-self:center;background:transparent;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.task-tmr:hover{border-color:var(--accent);color:var(--accent)}.task-tmr.sent{border-color:var(--green);color:var(--green)}
.tomorrow-btn{display:block;width:100%;margin-top:14px;background:var(--bg3);color:var(--accent);border:1px dashed var(--border);padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tomorrow-btn:hover{border-color:var(--accent);border-style:solid}
.section-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;border-left:3px solid var(--purple);padding-left:8px}
.email-scroll{max-height:520px;overflow-y:auto;padding-right:4px}
.email-item{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.email-header{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--bg2)}
.email-header:hover{background:var(--bg3)}

@media (max-width:900px){.main{grid-template-columns:1fr}.full-width{grid-column:1}.stat{min-width:130px}.stack-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.highlights li{font-size:13.5px}}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";

return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
