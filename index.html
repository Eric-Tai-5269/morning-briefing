.tw（活動編號 18057）。","kind":"①想去就先報名說明會，門檻低、會後有餐盒；②確認自己符合資格：成大大學部或研究所在學、申請期間與 2027 赴美期間都須在學、研究領域屬自然科學／工程／生醫／管理／人文社科並具研究基礎；③聽完再決定要不要備齊正式申請文件。","detail":"★ **補助內容**：計畫補助 **10 名成大學生**在芝加哥大學短期研究期間的**全額學雜費與校園住宿費**，以非學位訪問學生（NDVS）身分於 **2027 暑期**赴芝大做研究。　★ **說明會內容**：芝大 Pritzker 分子工程學院徐伯均助理教授線上連線分享研究環境，另有今年參與的學長姊現場分享。　★ **為什麼值得聽**：化工背景申請分子工程領域相當對口，而且暑期短期研究比正式交換好安排，不會卡到學期修課。","deadline":"2026-11-23（一）11:10 說明會","calendar":{"title":"UCTS 芝加哥大學暑期研究說明會","date":"2026-11-23","cat":"特殊課","pri":"低"}}]},"news":{"groups":[{"label":"頭條","items":[{"en":"Russia, Ukraine and US open first US-brokered trilateral talks since February in Abu Dhabi","zh":"**俄烏美三方在阿布達比重啟談判**，是今年 2 月以來首場由美方促成的三方會談，頓內茨克歸屬仍是最大分歧。","summary":"Russia, Ukraine and the United States opened trilateral talks in Abu Dhabi on November 10, the first US-brokered round of three-way negotiations since February 2026. The sides remain far apart over the status of Donetsk, which both Moscow and Kyiv treat as non-negotiable. The White House described itself as cautiously optimistic without predicting a breakthrough. President Zelensky said the talks also covered post-war security arrangements modelled on NATO's Article 5 collective-defence pledge, which Ukraine has sought as a substitute for full membership. No ceasefire timetable was announced and further rounds are expected.","source":"彙整國際新聞（11/10–11/11）","url":"https://www.viewstorys.com/2026/11/top-world-news-november-11-2026-abu.html"},{"en":"US October CPI runs hot at 0.4%, pushing a December Fed hike into view and the 10-year yield to 5.00%","zh":"**美國 10 月 CPI 月增 0.4%、核心 0.3%，雙雙高於預期**，12 月升息機率跳升，10 年期公債殖利率站上 5.00%。","summary":"US consumer prices rose a seasonally adjusted 0.4% in October, above the 0.3% economists expected, while core CPI rose 0.3% against a 0.2% forecast. The report pushed markets toward pricing another Federal Reserve rate increase in December; Fed Governor Christopher Waller said he would support at least a quarter-point hike and floated a half-point move if core prices keep rising at 0.3% or more. The 10-year Treasury yield jumped 13.8 basis points to 5.00%. Investors rotated out of AI and momentum names into defensive sectors such as healthcare, hitting leveraged funds hardest.","source":"TheStreet（11/10 收盤報導）","url":"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-10-2026"},{"en":"France blames Iran's Revolutionary Guard for a cyberattack that raised supermarket fridge temperatures","zh":"**法國指控伊朗革命衛隊發動網攻**，手法是調高超市冷藏櫃溫度，巴黎將尋求歐盟制裁，德黑蘭否認。","summary":"France has formally attributed a cyberattack carried out last month to Iran's Islamic Revolutionary Guard Corps. The intrusion targeted refrigeration control systems and raised temperatures in supermarket fridges and freezers, a sabotage method aimed at food supply rather than data theft. Paris said it will push for European Union sanctions in response. Iran has not accepted responsibility. The attribution lands amid wider Iran-West friction: President Trump called a renewed military campaign against Iran quite unlikely, Qatar's prime minister described talks with US officials as positive, and the US reportedly relocated aircraft from RAF Mildenhall after an Iranian threat.","source":"彙整國際新聞（11/10–11/11）","url":"https://www.viewstorys.com/2026/11/top-world-news-november-11-2026-abu.html"},{"en":"South Africa's ANC falls to 32.5% in municipal elections, its worst result ever","zh":"**南非非洲民族議會（ANC）地方選舉僅得 32.5%**，創黨史最差，多數議會將被迫組聯合政府。","summary":"South Africa's governing African National Congress took 32.5% of the vote in municipal elections, the worst performance in the party's history and a further erosion of the dominance it has held since 1994. The Democratic Alliance finished second on 22.9% and Jacob Zuma's uMkhonto weSizwe party took 9.9%. The result leaves the ANC unable to govern alone in many councils and dependent on coalition partners, extending the national pattern of coalition politics down to local government. Analysts link the slide to service-delivery failures, electricity problems and corruption cases.","source":"彙整國際新聞（11/10–11/11）","url":"https://www.viewstorys.com/2026/11/top-world-news-november-11-2026-abu.html"},{"en":"M. John Harrison, 81, wins the 2026 Booker Prize and becomes its oldest winner","zh":"**英國作家 M. John Harrison 以《The End of Everything》奪 2026 布克獎**，81 歲創下該獎最年長得主紀錄。","summary":"British writer M. John Harrison won the 2026 Booker Prize for his novel The End of Everything, becoming at 81 the oldest winner in the prize's history. Harrison spent decades as a cult figure in science fiction and literary weird fiction before this mainstream recognition, and the award is being read as a late vindication of a career built outside the literary establishment. The Booker carries a GBP 50,000 purse and usually produces a large sales uplift. Elsewhere in UK news, comedian Russell Brand was sentenced to 10 years and six months after convictions for rape and three sexual assaults.","source":"彙整國際新聞（11/10–11/11）","url":"https://www.viewstorys.com/2026/11/top-world-news-november-11-2026-abu.html"}]},{"label":"科技","items":[{"en":"Google unveils TPU 8tx and 8i Max, widening its in-house AI chip push against Nvidia","zh":"**Google 推出 TPU 8tx 與 8i Max 兩款專用 AI 晶片**，8tx 主打硬體層機密運算、8i Max 把兩顆推論晶片封裝在一起。","summary":"Google announced two additions to its eighth-generation TPU line on November 10. The TPU 8tx, developed with AMD and based on the TPU 8t, is built for confidential training and inference, isolating data and model weights at the hardware layer so companies can train on proprietary data without moving it between devices; it also carries a custom inferencing network that runs reasoning alongside training. The TPU 8i Max packages two of April's TPU 8i inference chips together, doubling memory capacity, compute and bandwidth. Google did not disclose pricing or availability. Microsoft, Amazon, OpenAI and Anthropic are all building rival silicon to cut Nvidia dependence.","source":"TechCrunch（11/10）","url":"https://techcrunch.com/2026/11/10/google-broadens-its-ai-hardware-portfolio-with-two-new-specialized-chips/"},{"en":"Meta rolls out AI age detection worldwide, forcing suspected teens into restricted accounts","zh":"**Meta 全球啟用 AI 年齡偵測**，即使註冊時填成年生日，判定為 13–17 歲者一律轉成受限制的青少年帳號。","summary":"Meta expanded its AI-based age detection system globally, moving users it judges to be between 13 and 17 into restricted teen accounts even when they registered with an adult date of birth. Teen accounts default to stricter messaging limits, content filtering and time reminders. The move follows regulatory pressure in the US and Europe over minors' exposure to harmful content and over self-declared ages being trivially easy to falsify. Meta also launched Muse Ember, a small low-cost model aimed at repetitive agent tasks, as it pushes cheaper inference for automation workloads.","source":"The Neuron AI Digest（11/10）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-november-10-2026/"},{"en":"Apple starts selling $49.99 one-time Intelligence Usage Packs once monthly AI limits run out","zh":"**Apple 推出 49.99 美元一次性 Apple Intelligence 用量包**，月配額用完可加購，等於為裝置端 AI 開了計費閘門。","summary":"Apple began selling one-time Apple Intelligence Usage Packs priced at $49.99, which add capacity once a user exhausts their monthly allowance of AI features. The change marks a shift away from treating on-device and Private Cloud Compute AI as a wholly bundled part of the hardware price, and gives Apple a metered revenue line as inference costs rise. Heavy users of writing tools, image generation and Siri's model-backed requests are the obvious buyers. Separately, OpenAI made ChatGPT Enterprise available through AWS Marketplace so companies can buy it on existing AWS billing and count it toward AWS spend commitments.","source":"The Neuron AI Digest（11/10）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-november-10-2026/"}]},{"label":"運動","items":[{"en":"Celtics bury the 76ers 123-101 in Philadelphia","zh":"**NBA 塞爾提克作客 123-101 大勝 76 人**，22 分差距，費城主場防線整場被拉開。","summary":"The Boston Celtics beat the Philadelphia 76ers 123-101 on the road on November 10, a 22-point margin in one of the league's oldest rivalries. Boston controlled the game through its perimeter scoring and kept Philadelphia from mounting a sustained run, with the Sixers unable to answer Boston's shooting volume. The win continues a strong early run for the Celtics in the 2026-27 season, while Philadelphia's home form remains a problem. The two sides meet again later in the schedule, with Boston holding the season-series edge for now.","source":"ESPN／NBA.com（11/10）","url":"https://www.espn.com/nba/game/_/gameId/401909961/celtics-76ers"},{"en":"No. 5 Michigan State routs No. 2 Duke in the Champions Classic; Kansas handles Kentucky","zh":"**NCAA 冠軍經典賽：第 5 名密西根州大全場領先痛擊第 2 名杜克**，另一場堪薩斯輕取肯塔基。","summary":"Michigan State, ranked fifth, led from start to finish in a dominant win over second-ranked Duke in the Champions Classic on November 10, the most impressive result of the young college basketball season. CBS Sports described the Spartans as controlling every phase rather than winning on a late run. In the companion game, No. 15 Kansas beat No. 24 Kentucky comfortably, with the Jayhawks showing a clear talent gap. The doubleheader is the sport's traditional early-season measuring stick and will reshape the next Associated Press poll, with Duke likely to slide several places.","source":"CBS Sports（11/10）","url":"https://www.cbssports.com/college-basketball/news/duke-michigan-state-live-updates-score-college-basketball-2026/live/"},{"en":"Women's Champions League: Man City win 4-1 at Inter, Bayern beat PSG 2-1 in Paris","zh":"**女子歐冠第 4 輪：曼城作客 4-1 大勝國際米蘭**，拜仁在巴黎 2-1 擊敗 PSG，Klara Bühl 進致勝球。","summary":"Manchester City won 4-1 away at Internazionale in the fourth round of the Women's Champions League league phase on November 10, a result that strengthens their position in the standings. In Paris, Bayern Munich came from behind to beat Paris Saint-Germain 2-1, with Klara Buhl scoring the decisive goal to seal the win. Chelsea travelled to BK Hacken and Real Madrid hosted Paris FC on the same matchday. The expanded league-phase format means these margins matter for seeding as well as qualification, with two more rounds to play before the knockout cut.","source":"ESPN／VAVEL（11/10）","url":"https://www.espn.com/soccer/team-stats/_/gameId/401916988/league/uefa.wchampions"}]},{"label":"教育心理","items":[{"en":"Students who turn to AI chatbots for emotional support report worse mental health","zh":"**新調查：把 AI 當情緒支持對象的學生，心理健康指標反而更差**，研究者警告替代了真人求助管道。","summary":"A survey reported by Education Week finds that students who turn to AI chatbots for emotional support score worse on mental health measures than peers who do not. The direction of causation is unsettled: struggling students may be more likely to seek out an always-available listener, but researchers also warn that chatbot reliance can displace help from counsellors, teachers and friends, and that an agreeable model may validate distorted thinking rather than challenge it. The findings matter for schools now deploying AI tools broadly, and argue for routing emotional disclosures to human staff rather than leaving them inside a chat window.","source":"Education Week（2026/11）","url":"https://www.edweek.org/technology/students-who-turn-to-ai-for-emotional-support-report-worse-mental-health/2026/11"},{"en":"US teen mental health shows measured improvement, but gaps between groups persist","zh":"**美國青少年心理健康整體略有改善，但族群間差距仍在**，弱勢群體的改善幅度明顯落後。","summary":"New national data on US adolescent mental health shows improvement on several indicators compared with the pandemic-era lows, including reported persistent sadness and hopelessness. The gains are not evenly shared: disparities persist across income, race and ethnicity, and sexual orientation, with some groups showing little or no improvement. Researchers caution that aggregate improvement can mask worsening conditions in specific populations and that access to care, not just symptom prevalence, drives much of the gap. The report argues for targeting resources at the groups where indicators have stayed flat rather than treating the national average as the story.","source":"PR Newswire 研究發布（2026/11）","url":"https://prnewswire.com/news-releases/where-does-us-teen-mental-health-stand-improvements-reported-but-disparities-persist-302934163.html"},{"en":"Systematic review of a decade of research links psychological capital to student wellbeing","zh":"**十年文獻系統性回顧：心理資本（希望、效能、韌性、樂觀）與大學生福祉高度相關**，且可透過訓練提升。","summary":"A systematic review published in Education Sciences synthesises studies from 2014 to 2024 on psychological capital in higher education, covering the four components of hope, self-efficacy, resilience and optimism. The review reports consistent positive associations between psychological capital and student wellbeing, engagement and academic persistence, and negative associations with burnout and dropout intention. Crucially, the authors note psychological capital is a state rather than a fixed trait, so short structured interventions can raise it. They call for more experimental designs and non-Western samples, since most existing evidence is correlational and drawn from a narrow set of countries.","source":"Education Sciences／MDPI（2026/11）","url":"https://www.mdpi.com/2227-7102/16/11/1893"}]},{"label":"產業動態","items":[{"en":"Anthropic ships Claude Fable 5.2 and Mythos 5.2, then pulls details of a $69.3bn IPO","zh":"**Anthropic 發表 Claude Fable 5.2 與 Mythos 5.2**，主打複雜程式與科研；另路透報導其 693 億美元 IPO 資料已先發後撤。","summary":"Anthropic released Claude Fable 5.2 and Mythos 5.2, aimed at complex coding and scientific research, with both said to respond up to 30% faster than their predecessors. Fable is generally available at $8 per million input tokens and $40 per million output tokens, while Mythos is restricted to verified organisations on approved research and retains cybersecurity and biology capabilities Fable blocks. Anthropic says an engineer used Fable 5.2 to build an operating system by coordinating over 1,000 agents across eight days, and that the models contributed to two open black-hole physics problems. Reuters reports Anthropic circulated then retracted details of a potential $69.3 billion IPO as inaccurate.","source":"The Neuron／Reuters（11/10）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-november-10-2026/"},{"en":"OpenAI builds a Control Room that can halt model output within 35 seconds","zh":"**OpenAI 推出內部 Control Room**，監控 AI 研究負載，決定介入後 35 秒內可切斷模型輸出。","summary":"OpenAI introduced an internal system called Control Room that monitors AI research workloads and can stop a model's output within 35 seconds of a decision to intervene. The design includes a fail-safe so output halts if the monitoring layer itself fails, addressing the scenario where a safety system goes down while a training or evaluation run continues. The move reflects a wider industry shift from policy-level safety commitments toward operational kill switches with measurable response times. OpenAI separately listed ChatGPT Enterprise on AWS Marketplace, letting companies buy it against existing AWS billing commitments.","source":"The Neuron AI Digest（11/10）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-november-10-2026/"},{"en":"Nvidia caps China cloud rentals at 49% as investors discount AI chip loans","zh":"**NVIDIA 要求海外雲端夥伴保留至少 51% 產能給非中國客戶**；同時投資人開始折價拋售 AI 晶片與資料中心貸款。","summary":"Nvidia is reported to require overseas cloud partners to reserve at least 51% of their services for non-Chinese clients, an attempt to keep rental routes from becoming a workaround for export controls; B300 server racks are said to fetch up to $2.8 million inside China. At the same time, investors have begun selling AI chip and data-centre loans at steep discounts, citing how fast GPUs depreciate relative to loan terms, an early sign of financing stress beneath the capex boom. TSMC is meanwhile reported to be backing AI model labs with up to $1 billion in downstream investment, deepening the financing links across the stack.","source":"The Neuron／404k Research（11/10）","url":"https://404kresearch.substack.com/p/456x-evening-brief-november-10-2026"}]},{"label":"追星","items":[{"en":"Kenshi Yonezu's Taipei Dome general sale is set for Nov 19 at noon","zh":"**米津玄師台北大巨蛋 12/26、27 一般販售 11/19（四）12:00 開賣**，實名制、每帳號每場限 2 張，可能視售況取消。","summary":"The general sale for Kenshi Yonezu's December 26 and 27 shows at Taipei Dome is scheduled for Thursday, November 19 at 12:00 on the Ticket Plus platform, the final step after the real-name lottery closed on October 31 and results were published November 2. Yonezu is the first Japanese solo artist to headline the venue. Ticket prices run from NT$1,800 to NT$5,980, with accessible seating at NT$2,240 and NT$2,840. Each account is limited to two tickets per show and each ID may be registered for only one seat. Organisers warn the general sale may be cancelled if inventory sells out in the resale lotteries.","source":"Ticket Plus／遠大售票公告彙整","url":"https://tw.news.yahoo.com/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB1226%E3%80%8127%E8%87%BA%E5%8C%97%E5%A4%A7%E5%B7%A8%E8%9B%8B%E9%96%8B%E5%94%B1%EF%BC%81%E5%84%AA%E5%85%88%E8%B3%BC%E6%99%82%E9%96%93%E3%80%81%E5%AF%A6%E5%90%8D%E7%99%BB%E8%A8%98%E6%8A%BD%E9%81%B8%E3%80%81%E7%A5%A8%E5%83%B9%E5%BA%A7%E4%BD%8D%E4%B8%80%E6%AC%A1%E7%9C%8B-141954113.html","spotify":"https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB"},{"en":"GHOST tour merchandise revealed as Yonezu's six-city arena run gets under way","zh":"**米津玄師 2026 TOUR / GHOST 周邊視覺公開**，含米津親繪主視覺服飾與復刻ねこちゃん、とんがりくん、ティースくん，巡迴 11/6 起走 6 城市。","summary":"Merchandise visuals for Kenshi Yonezu's 2026 TOUR / GHOST have been published, built around a key visual Yonezu drew himself. The line spans apparel and character goods, including reissues of the ねこちゃん, とんがりくん and ティースくん figures that previous tours made collectible, alongside shirts and accessories using the GHOST artwork. The Japanese leg began November 6 and runs through six cities, feeding into the Taipei Dome dates on December 26 and 27. For overseas fans the practical point is that tour goods usually sell online only to Japanese addresses, so Taipei show merchandise is the realistic route.","source":"音楽ナタリー／THE FIRST TIMES（11 月）","url":"https://www.thefirsttimes.jp/news/0000910204/","spotify":"https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB"},{"en":"YOASOBI confirm Taipei Dome on Jan 9-10 as the opener of a renamed 11-city tour","zh":"**YOASOBI 巡演改名為 11 城亞洲大洋洲巡迴**，海外首站台北大巨蛋 2027/1/9–10，香港亞博館 1/21–22。","summary":"YOASOBI's reworked tour, renamed the 11-CITY ASIA-OCEANIA TOUR 2026-2027, opens its overseas leg at Taipei Dome on January 9 and 10, 2027, followed by Hong Kong's AsiaWorld-Arena on January 21-22, Singapore's National Stadium on February 20, Melbourne and Sydney in March, and Korea on April 17. The duo dropped shows in some originally planned countries and venues while adding their first Australian dates. For Taiwan fans the Taipei dates sit two weeks after Yonezu's December shows at the same venue, so the two ticket cycles overlap and budgeting for both is worth planning now.","source":"TVfan／巴哈姆特 GNN 彙整","url":"https://gnn.gamer.com.tw/detail.php?sn=310732","spotify":"https://open.spotify.com/artist/64tJ2EAv1R6UaZqc4iOCyj"},{"en":"Mrs. GREEN APPLE's SHADOWS arena tour rolls on behind their sixth album","zh":"**Mrs. GREEN APPLE 第 6 張原創專輯＋3 年來首次巡演「SHADOWS」進行中**，11/4 佐賀場全 20 曲，各場曲目有變動。","summary":"Mrs. GREEN APPLE are mid-way through SHADOWS, their first arena tour in three years, staged behind their sixth original album. Setlist trackers logged a 20-song show at the Saga date on November 4, and note that the band has been changing selections between venues rather than running a fixed set, so attending more than one date is not a repeat. The trio also continue to top Japanese streaming charts, trading weekly number-one positions with Kenshi Yonezu and King Gnu at above ten million weekly plays. No Taiwan or Hong Kong dates have been announced for this run.","source":"音楽ナタリー／ORICON／巡演曲目彙整","url":"https://mrsgreenapple.com/schedule/list/?lang=en","spotify":"https://open.spotify.com/search/Mrs.%20GREEN%20APPLE"}]}]},"market":{"insights":["**台股 11/10 收 42,712、大漲 1,050 點（+2.52%）**，國安基金進場兩日已反彈 3,010 點","**散熱、PCB、ASIC 全面漲停**：台達電連二根、奇鋐、世芯、金像電同步衝頂","**美國 10 月 CPI 月增 0.4% 超預期**，10 年期殖利率站上 5.00%，12 月升息機率跳升","**NVDA 連二日下跌 −4.27%**：執行長爭議＋AI 晶片貸款折價賣出，是半導體最大壓力源","**清單外新熱門：智邦 2345、力旺 3529、旺矽 6223** 同日漲停，網通與矽智財值得追蹤"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"42,712","change":2.52,"changePts":"+1,050.00","comment":"國安基金兩日反彈 3,010 點"},{"market":"TW","name":"櫃買指數 OTC","value":"332.97","change":3.42,"changePts":"+11.00","comment":"中小型股反彈力道勝加權"},{"market":"TW","name":"0050 元大台灣50","value":"—","change":2.31,"comment":"市值型 ETF 同步回升"},{"market":"TW","name":"0056 元大高股息","value":"—","change":1.06,"comment":"高息型落後大盤屬正常"},{"market":"US","name":"那斯達克 Nasdaq","value":"25,065.88","change":-0.74,"comment":"科技股連二日走弱"},{"market":"US","name":"S&P 500","value":"7,520.93","change":-0.38,"changePts":"-29.01","comment":"CPI 超預期壓抑評價"},{"market":"US","name":"道瓊 Dow Jones","value":"52,231.89","change":-0.3,"changePts":"-157.86","comment":"跌幅最小，資金轉防禦"},{"market":"US","name":"羅素 2000 Russell 2000","value":"2,821.38","change":-0.68,"comment":"殖利率走高壓抑小型股"},{"market":"US","name":"費半 SOXX（半導體 ETF）","value":"—","change":-0.12,"comment":"僅小跌，優於科技類股"}],"quotes":{"2330":2.24,"2308":9.91,"2317":1.05,"2454":2.82,"2382":0.68,"3017":9.84,"3661":9.97,"2368":9.96,"2059":6.93,"2891":-2.9,"AMD":13.26,"AVGO":8.78,"NVDA":-4.27},"prices":{"2330":2285,"2308":1275,"2317":241.5,"2454":3830,"2382":298.5,"3017":2790,"3661":3420,"2368":983,"2059":8565,"2891 <style>

body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}

</head>
<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>

</div>

</div>
</div>

<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
var from=it.from||String(it.tag||"").split("·").filter(function(x){return !/優先|開考|剩|發布|48h/.test(x);}).join("·").replace(/^[🔴🟠🟡🟢✅\s]+/,"").trim();
var subj=it.subject||String(it.title||"").replace(/\*\*/g,"").split(/[。（(]/)[0].slice(0,60);
var todo=it.todo||String(it.kind||"").replace(/\*\*/g,"").split(/[：:]/).slice(-1)[0].split(/[；;]/)[0].slice(0,60);
var more=(it.subject?mdb(it.title||""):"")+(it.subject&&it.title?"<br>":"")+(it.todo&&it.kind?mdb(it.kind)+"<br>":"")+(it.detail?mdb(it.detail):"");
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div>"+(from?"<div class='sender'>"+esc(from)+"</div>":"")+
"<div class='subject'>"+mdb(subj)+"</div>"+
(todo?"<div class='action'>👉 "+mdb(todo)+(it.deadline&&it.deadline!=="—"?"（"+esc(it.deadline)+"）":"")+"</div>":"")+"</div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+more+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(!(m.items||[]).length)html+="<div class='empty-tasks'>📭 過去 24 小時沒有需要處理的信</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+mdb(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var c=x.change,cls=c==null?"":(c>=0?"up":"down"),arrow=c==null?"":(c>=0?" ▲":" ▼");
var pts=x.changePts!=null?((x.changePts>=0?"+":"")+x.changePts+" "):"";
var cm=x.comment!=null?x.comment:(x.note?splitStars(String(x.note).replace(/✅[^。]*。?|⚠️[^。]*。?/g,""))[0]||"":"");
if(x.comment==null&&cm.length>40)cm=cm.replace(/\*\*/g,"").split("。")[0].slice(0,40);
var noVal=!x.value||x.value==="—";
return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+(noVal&&c!=null?fmtChg(c):esc(x.value))+arrow+"</div>"+
(c!=null&&!noVal?"<div class='chg "+cls+"'>"+esc(pts)+"("+fmtChg(c)+")</div>":"")+(cm?"<div class='cm'>"+mdb(cm)+"</div>":"")+"</div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(/未取得|沿用/.test(r.price||"")?"—":r.price)+"</td><td class='reason'>"+mdb(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2></div><div class='card-body'>"+
(function(){var ins=(mk.insights&&mk.insights.length)?mk.insights:splitStars(mk.highlight).concat(splitStars(mk.note)).slice(0,5);
return ins.length?"<div class='insights'><h3>📊 市場解讀</h3>"+bullets(ins)+"</div>":"";})()+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+

"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"</div>"+
