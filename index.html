去幾天的派工通知信全部落在窗口外，無須處理）。今天沒有任何非成大來源的待處理信件，所以整個信件區就是成大一區。", "items": [{"level": "red", "tag": "⏰ Moodle noreply@ncku.edu.tw · 1151_日文（三）JAPANESE（META_1151_A160130_1）· 助教 黃宇誠 · 10/04（日）12:44 發佈 · 未讀 · 截止時間＝今天出門前", "title": "🚨 就是今天：日文（三）開始上聽力——聽力課本＋文法課本「兩本都要帶」", "kind": "需要動作：出門前把兩本書放進書包（約 1 分鐘）＋ 按右邊按鈕補進行事曆（約 10 秒）", "detail": "★ 原文重點：「下週開始課堂上會來練習日文聽力，所以請各位同學接下來每週上課時**聽力和文法的書都要帶來**！期中考及期末考也會有聽力測驗題型。」助教另外加了一句很容易被誤讀的括號：「（週一班因為課程進度較慢的關係，10/05 的上課會不會用到還不一定，但還是請同學帶來！）」　【昨天這封信是「明天」，今天它是「現在」】昨天的晨報已經把這條標紅，當時的理由是成本不對稱；今天這條的狀態變了——它不再是提醒，而是正在到期。括號那句話說的是「今天可能用不到」，不是「今天可以不帶」，而且它只對今天有效：從今天起這是整學期每週的常態。　【最務實的讀法】如果你昨晚已經把書放進書包，這一條現在就只是確認一眼，花 5 秒；如果沒有，現在就是處理它唯一的時機，因為出門之後就補不回來了。　【附帶一個對你有利的細節】期中期末會考聽力題型這件事，等於助教提前公告了考試範圍的變動。現在開始每週帶書，不只是為了今天的課，是為了期中考前你手上有一本做過筆記的聽力課本。", "action": {"title": "日文（三）每週帶聽力＋文法課本", "cat": "日文", "pri": "高", "date": "2026-10-05"}}, {"level": "yellow", "tag": "✉️ e24157035@gs.ncku.edu.tw（明安米 Amir Miranda · E24157035）· 10/04（日）19:28 收到 · 未讀 · 對方在等回覆", "title": "📨 第 4–6 週的分組組員來信：週四的 Engineering Skills 報告要一起做，問你有沒有其他聯絡方式", "kind": "需要動作：今天回信並給一個聯絡方式（LINE／Messenger／手機），約 3 分鐘＋ 按右邊按鈕把週四報告補進行事曆", "detail": "★ 原文（全文只有兩句，英文）：「Hello, I am your group member 明安米(Amir Miranda - E24157035) from weeks 4-6, do you have any other means by which I can contact you to complete the presentation for this week Thursday?」　【這封信的真正份量比它的長度大很多】它同時夾帶了三個資訊：①你在「Engineering Skills for the Third Industrial Revolution」這門課的第 4–6 週分組裡有組員，②這組要交的 presentation 在**本週四**，③對方已經主動找上你、而且目前只能用 email 聯絡你——也就是說，這份報告的協作管道現在卡在你身上。　【為什麼它是黃而不是紅】因為它今天不會到期；但它離到期只有三天，而分組報告的特性是「越晚開始，能分工的空間越小」。今天回一封信的成本是三分鐘，拖到週三回的成本是你得一個人趕完自己那部分、而且還要適應別人已經做好的架構。　【建議的回信內容，直接可用】給一個即時通訊的聯絡方式（台灣這邊最通用的是 LINE ID）、說明你可以負責哪一段、並提議一個今天或明天的線上對一次的時間。對方是外籍同學（信件全英文），所以回信用英文、把分工寫成條列會最清楚。　【一個提醒】他說的是 weeks 4-6，現在是開學第三週結束、第四週要開始——所以這個分組很可能才剛成立，你不是漏掉了什麼，而是正好趕上起跑點。", "action": {"title": "回覆 Amir Miranda＋週四 Engineering Skills 分組報告", "cat": "報告", "pri": "高", "date": "2026-10-08"}}, {"level": "gray", "tag": "📎 Moodle noreply@ncku.edu.tw · 1151_會計學 ACCOUNTING（1151_H313500）· 王鼎超 · 10/03（六）11:26 發佈（在 24h 窗口外，列為參考）", "title": "📗 會計學公佈欄：Google Sheets 完全指南（教學連結）", "kind": "不需要動作：是教材／工具連結，沒有截止日，有空再看", "detail": "★ 內容：公佈欄貼了一個外部教學網站連結 https://mictu.vercel.app/google-sheets-tutorial 。　【為什麼列進來但標灰色】它沒有截止日、沒有要求回覆、也不是作業公告，所以它不該占用你今天早上的注意力。但它值得被看見一次，原因是會計學這門課後面幾乎一定會用到試算表（分類帳、試算表、調整分錄這些東西用手算會非常痛），而這份指南是老師／助教自己挑的，等於暗示了這門課接受、甚至預期你用 Sheets 來做作業。　【建議】不用現在點開。等到第一份需要算數字的會計作業出現時再回來找這封信，那時候它的價值最高。", "action": null}], "footnote": "★★★ 今天這一區的一句話總結：**兩件事需要你動，其中一件在你出門前就會到期**。　①【紅｜現在】日文（三）聽力課本＋文法課本——這是昨天那條提醒的到期日，今天之後沒有補救空間，而且從今天起每週都要帶。　②【黃｜今天內】回信給組員 Amir Miranda，給一個即時聯絡方式——週四的分組報告目前整個卡在「找不到你」這一步，三分鐘的回信可以解開它。　③【灰｜不用動】會計學的 Google Sheets 指南，收著就好。　【這三封信拼出來的學期圖像】開學第三週結束的訊號很典型：課程開始從「說明」轉成「要求」（日文要帶書、會有聽力考題），分組作業開始找人（週四報告），而工具類資源開始累積（Sheets 指南）。這三種信會在接下來十幾週反覆出現，而真正會出事的永遠是第二種——因為只有它需要「別人等你」。所以如果今天早上只能做一件事，做完第一件（放書）之後，第二件（回信）比任何其他事都值得優先。"}, "news": {"window": "過去 48h（10/03 07:00 – 10/05 07:00 台北時間）· 來源 Rio Times／Latin Times／Al Jazeera／Times of Israel／AI Weekly／PsyPost／CBS Sports／Yahoo Sports／Billboard Japan／niewmedia／bg-mania。　★ 每則都是「英文標題＋一行中文副標＋約 100 字英文摘要」的格式；中文只負責告訴你「為什麼這則跟你有關」，細節一律看英文。", "groups": [{"label": "頭條", "items": [{"en": "Flavio Bolsonaro Leads Lula in Brazil's First Round, Forcing an October 25 Runoff", "zh": "巴西第一輪投票大翻盤：波索納洛之子 Flávio 約 50%、魯拉約 41.6%，兩人將在 10/25 決選——這是昨天全球市場最大的政治變數", "summary": "With roughly half to two-thirds of polling stations counted on Sunday night, Senator Flavio Bolsonaro held about 50% of valid votes against incumbent President Lula da Silva's roughly 42%, a far wider margin than final Datafolha polling had suggested. Because neither candidate cleared 50% of valid votes outright, Brazil will hold a runoff on October 25. Turnout drew on about 160 million registered voters. Smaller candidates Augusto Cury, Ronaldo Caiado and Renan Santos each took under 3%. Bahia, Sao Paulo and Rio de Janeiro were still reporting when the lead was established.", "url": "https://www.riotimesonline.com/brazil-election-first-round-results-lula-flavio-2026/"}, {"en": "Wall Street Braced for Two Wildly Different Brazils Before Sunday's Vote", "zh": "開票前華爾街就已經把巴西拆成兩種劇本：魯拉版與波索納洛版，資產配置完全相反——今天新興市場開盤會立刻給答案", "summary": "Ahead of the first round, investors were positioning for binary outcomes: a Bolsonaro win was expected to lift Brazilian equities and the real on hopes of fiscal tightening and privatisation, while a Lula win implied continued state-led spending and pressure on the currency. Strategists flagged the Bovespa and the real as the cleanest expression of the trade, with Brazilian sovereign debt spreads as a secondary gauge. The unexpectedly strong first-round showing by Bolsonaro now sets up three weeks of volatility into the October 25 runoff.", "url": "https://www.cnbc.com/2026/10/03/lula-or-bolsonaro-wall-street-braces-for-two-wildly-different-results-in-brazil-election.html"}, {"en": "Netanyahu Orders Full Review of Foreign Flight Security After flydubai Terror Attack", "zh": "以色列 flydubai 攻擊後續：全面檢討外籍航班安檢，27 國公民被禁止駕駛或搭乘飛以航班，交通部長面臨下台壓力", "summary": "Israel's prime minister ordered a comprehensive review of security procedures for foreign flights after last week's flydubai attack, in which investigators say an Omani co-pilot intended to crash the aircraft into Ben Gurion Airport and had cancelled an earlier July plan. The Transportation Ministry has barred nationals of 27 countries, including Iran, Iraq and Pakistan, from piloting or boarding Israel-bound flights. Investigators also found security officials holding secondary jobs with foreign airlines, raising conflict-of-interest questions.", "url": "https://www.timesofisrael.com/liveblog-october-04-2026/"}, {"en": "Iran's Foreign Minister Says There Is 'No Military Solution' as Another Tanker Is Hit Near Hormuz", "zh": "伊朗外長喊話「沒有軍事解方、只有談判」，但荷姆茲海峽又有油輪被不明彈體擊中——能源價格的尾部風險還沒解除", "summary": "Iran's foreign minister said there is no military solution to the confrontation with the United States and that only negotiations based on fairness could defuse it. The statement came as the Strait of Hormuz remained contested, with reports of another tanker struck by unidentified projectiles amid continuing blockade operations. The combination of diplomatic signalling and continued attacks on commercial shipping keeps a tail risk on crude and shipping insurance even while headline oil prices stay contained.", "url": "https://www.timesofisrael.com/liveblog-october-04-2026/"}, {"en": "IDF Strikes Kill Hamas Military-Wing Commander in Khan Younis and a Nukhba Operative Running an Aid NGO", "zh": "加薩持續空襲：汗尤尼斯一名哈瑪斯軍事指揮官、以及一名同時經營土耳其人道組織的 Nukhba 成員被擊斃", "summary": "The Israeli military said it conducted strikes eliminating a Hamas military-wing commander in Khan Younis and a member of the Nukhba force who, according to the IDF, simultaneously directed a Turkish humanitarian organisation allegedly used to funnel support to Hamas. The second case is the notable one: it moves the targeting rationale from combatants to the civilian-aid infrastructure around them, a line that has previously drawn sharp international criticism and will likely feature in diplomatic exchanges this week.", "url": "https://www.timesofisrael.com/liveblog-october-04-2026/"}]}, {"label": "科技", "items": [{"en": "Google Unveils Gemini 4 Argon, Shipping First to Cybersecurity Professionals", "zh": "Google 發表 Gemini 4 Argon：DeepSWE v1.1 拿 77.9%、CWE-bench 68%，而且不是先給一般用戶，是先給資安從業者", "summary": "Google announced Gemini 4 Argon, reporting 77.9% on DeepSWE v1.1 and 68% on CWE-bench. Unusually, the rollout starts with cybersecurity professionals through Google's Fairwind Program rather than with general consumers or developers. The sequencing matters as much as the scores: both headline benchmarks are security- and software-engineering-oriented, which positions Argon directly against Anthropic's security-focused work rather than against general-purpose assistants, and suggests vendors now see vulnerability discovery as the highest-value frontier task.", "url": "https://aiweekly.co/ai-news-today"}, {"en": "OpenAI and Synopsys Launch a Joint Chip-Design Model With Revenue Sharing", "zh": "OpenAI 跟 Synopsys 合推晶片設計專用模型，而且是拆帳＋共同銷售——AI 第一次直接坐進 EDA 工具鏈裡", "summary": "OpenAI and Synopsys introduced a specialised chip-design model under a partnership that includes revenue sharing and a joint go-to-market. The structure is the story: rather than selling API access, OpenAI is embedding into an EDA vendor's existing enterprise channel and taking a cut of the tooling revenue. For semiconductor design teams this puts a frontier model inside the verification and layout workflow, and for the AI vendors it is a template for monetising domain depth instead of general capability.", "url": "https://aiweekly.co/ai-news-today"}, {"en": "Google's Project Suncatcher Will Put TPUs in Orbit From 2027, With 800 Gbps Optical Links", "zh": "Google 宣布 Project Suncatcher：2027 年把 TPU 送上衛星，實驗室裡自由空間光通訊已經做到 800 Gbps", "summary": "Google announced Project Suncatcher, a plan to launch TPU-equipped satellites beginning in 2027, after free-space optical links reached 800 Gbps in bench testing. The rationale is power and cooling: orbital solar is continuous and radiative cooling is free, which addresses the two hard constraints on terrestrial AI data centres. The engineering risks are radiation tolerance, servicing and launch cost per unit of compute, and the 800 Gbps figure is a bench result rather than an in-orbit demonstration.", "url": "https://aiweekly.co/ai-news-today"}]}, {"label": "運動", "items": [{"en": "MLB Division Series Open With Four Road-and-Home Splits; Rays Shut Out Yankees 1-0", "zh": "大聯盟分區系列賽 Game 1 全開打：道奇 5-3 勇士、釀酒人 3-2 教士、光芒 1-0 洋基、白襪 3-0 守護者", "summary": "All four Division Series opened on Saturday. In the National League the Dodgers beat the Braves 5-3 and the Brewers edged the Padres 3-2; in the American League the Rays shut out the Yankees 1-0 and the White Sox blanked the Guardians 3-0. Two of the four Game 1s were decided by a single run and two were shutouts, an unusually pitching-dominated opening round. Game 2s were played Sunday night US time, meaning results land during Monday morning in Taiwan.", "url": "https://www.cbssports.com/mlb/news/2026-mlb-playoff-bracket-schedule-scores-results-how-to-watch/"}, {"en": "A Fly Ball That Hit the Roof and Stayed in Play Decided Brewers-Padres Game 1", "zh": "釀酒人 Game 1 的勝利有爭議：教士 Ty France 九局一記深遠飛球打到球場屋頂、依規則仍算活球被接殺", "summary": "Milwaukee's 3-2 Game 1 win over San Diego turned on a ninth-inning rule quirk. A deep fly ball off the bat of the Padres' Ty France struck the American Family Field roof and, under the ballpark's ground rules, remained in play and was caught for an out rather than being ruled a home run or a dead ball. The sequence has reopened a long-running argument about retractable-roof ground rules deciding postseason outcomes, and it cost San Diego a potential tying or winning run.", "url": "https://www.cbssports.com/mlb/news/2026-mlb-playoff-bracket-schedule-scores-results-how-to-watch/"}, {"en": "Favourites Hold Serve in College Football: Miami Routs Clemson, Jeremiah Smith Breaks Ohio State Records", "zh": "大學美式足球週末沒有大冷門：邁阿密 41-13 屠殺克萊門森、俄亥俄州 31-14 勝愛荷華、阿拉巴馬 56-23 大勝", "summary": "No. 4 Miami dismantled Clemson 41-13, with quarterback Darian Mensah completing 18 of 27 for 227 yards and a touchdown plus a late pick-six. No. 5 Ohio State controlled No. 15 Iowa 31-14 as receiver Jeremiah Smith posted 206 yards and two touchdowns while setting program receiving records. No. 7 Alabama beat No. 16 Mississippi State 56-23 behind four Keelon Russell touchdown passes and four Bulldog turnovers. USC survived Washington 25-21; Baylor crushed Arizona State 55-19.", "url": "https://sports.yahoo.com/college-football/live/college-football-scores-live-updates-miami-vs-clemson-byu-vs-tcu-washington-vs-usc-and-more-143349614.html"}]}, {"label": "教育心理", "items": [{"en": "Study of 2.5 Million Children Finds No Link Between the MMR Vaccine and Autism", "zh": "250 萬名兒童的大規模研究再次確認：MMR 疫苗與自閉症沒有關聯——樣本規模本身就是這則研究的重點", "summary": "A study covering about 2.5 million children found no association between MMR vaccination and autism diagnosis, published October 4. The contribution here is statistical power rather than novelty: with a cohort this size, the confidence interval around any true effect becomes narrow enough to rule out even small associations, which is precisely the gap that earlier, smaller studies left open to dispute. For anyone evaluating evidence quality, this is a useful worked example of why sample size changes what a null result can claim.", "url": "https://www.psypost.org/"}, {"en": "Among West Point Cadets, Conscientiousness Predicts Leadership Better Than Cognitive Ability", "zh": "西點軍校研究：預測領導表現的最佳指標是「盡責性」而不是認知能力——對正在分組做報告的人特別有用", "summary": "Research on West Point cadets found conscientiousness to be a stronger predictor of leadership performance than cognitive ability. Conscientiousness here means reliability, follow-through and self-discipline rather than intelligence or charisma. The practical reading is that leadership outcomes in structured group settings track who actually does what they said they would do, on time, more than who is the sharpest in the room; the finding is correlational and drawn from a highly selected military population, so generalisation needs care.", "url": "https://www.psypost.org/"}, {"en": "Americans Routinely Fail to Notice When Democrats and Republicans Agree on Policy Direction", "zh": "研究發現美國人經常認不出兩黨其實在政策方向上一致——錯覺本身比真實分歧更能解釋極化", "summary": "A study published October 3 found that Americans frequently fail to recognise cases where Democrats and Republicans favour the same policy direction, systematically overestimating partisan disagreement. The mechanism is perceptual rather than substantive: respondents infer positions from party labels, so shared ground becomes invisible. Related work published the same weekend identified collective anti-mattering, the feeling that one's group does not count, as a distinct driver of political grievance separate from ordinary policy disagreement.", "url": "https://www.psypost.org/"}]}, {"label": "產業動態", "items": [{"en": "Anthropic's Mythos Found CVE-2026-61500; Chinese Attackers Exploited It Within 24 Hours of Disclosure", "zh": "Anthropic 的 Mythos 自動找到 Rejetto HFS 的 CVE-2026-61500（用 Math.random() 產生 session 簽章金鑰），揭露 24 小時內就被實際利用", "summary": "Anthropic's Mythos bug-hunting model discovered CVE-2026-61500 in the Rejetto HTTP File Server, an authentication bypass stemming from Math.random() being used to derive session cookie signing keys. Within 24 hours of disclosure, attackers based in China were observed exploiting unpatched US systems. The episode is the clearest case yet of the double edge of AI-assisted vulnerability discovery: the same capability that finds the flaw compresses the window defenders have to patch it before it is weaponised.", "url": "https://aiweekly.co/ai-news-today"}, {"en": "Toshiba Will Double HDD Output for AI Data Centres by Fiscal 2027", "zh": "東芝宣布 2027 財年內把 AI 資料中心用硬碟產能翻倍——這直接解釋了 10/02 收盤 WDC 與 STX 各跌超過 10%", "summary": "Toshiba said it plans to double hard-disk-drive production capacity for AI data centres within fiscal 2027. Read alongside Friday's market action, this is the supply-side news that matters: Western Digital fell 10.22% and Seagate 10.21% on October 2, the two largest declines among major semiconductor and storage names that session. Nearline HDD pricing has been the main earnings lever for both companies, so a credible capacity expansion by a third supplier compresses exactly the pricing power that drove their re-rating.", "url": "https://aiweekly.co/ai-news-today"}, {"en": "Cognition Reports 4.8x Token Throughput Per GPU on Nvidia's Vera Rubin NVL72 Versus GB200", "zh": "Cognition 在 CoreWeave 上實測 Nvidia 新的 Vera Rubin NVL72：每顆 GPU 的 token 吞吐量是 GB200 的 4.8 倍", "summary": "Cognition reported achieving 4.8x higher total token throughput per GPU on Nvidia's Vera Rubin NVL72 architecture compared with GB200, running on CoreWeave infrastructure. If the figure holds across workloads it changes inference unit economics rather than just training speed, since throughput per GPU is what sets cost per token for serving. The caveat is that it is a single customer's benchmark on a specific workload, and vendor-adjacent numbers on new silicon have historically compressed once broader deployments report.", "url": "https://aiweekly.co/ai-news-today"}]}, {"label": "追星", "items": [{"en": "Mrs. GREEN APPLE's 'Ringo Jam Tour SHADOWS' Is Handing Out Free Local Travel Booklets at Every Stop", "zh": "Mrs. GREEN APPLE 巡演「SHADOWS」在每個場地免費發「旅のしおり」，內容來自約 200 萬則粉絲投稿、由當地政府與觀光協會策劃", "summary": "Mrs. GREEN APPLE's arena tour Ringo Jam Tour SHADOWS, which opened September 30, is distributing a free travel booklet at each tour city, built from roughly two million fan submissions and curated with local municipalities and tourism associations. Distribution is one per person, non-commercial and resale-prohibited, with limited daily quantities. Current and upcoming windows include Hiroshima October 2-11, Chiba October 9-18, Sapporo October 16-25, Shibuya October 23-November 1 and Saga October 30-November 8.", "url": "https://bg-mania.jp/2026/10/02703414.html"}, {"en": "YOASOBI's 10-City Asia Dome and Stadium Tour Includes Taipei and Hong Kong, Dates Still Unannounced", "zh": "YOASOBI 的 2026–27 亞洲巨蛋／體育場巡演確定有台北與香港場——日期和售票資訊還沒公布，這是你要盯的一條", "summary": "YOASOBI's announced Asia tour spans ten cities across 2026 and 2027, described as a dome and stadium tour rather than a hall tour. Five Japanese cities are confirmed: Osaka, Nagoya, Fukuoka, Sapporo and Tokyo. Overseas stops include Taipei, Seoul, Hong Kong and Singapore, with a tenth city still unnamed. Specific dates, venues and ticketing have not been disclosed. For a Taiwan-based fan this is the single highest-value item to monitor, since dome-scale Taipei shows sell out on announcement.", "url": "https://niewmedia.com/en/news/2512yoasobi/"}, {"en": "King Gnu Open Their 10th Anniversary With Four Dome Shows and Their Largest Asian Tour", "zh": "King Gnu 十週年以四場巨蛋開場，並宣布規模最大的亞洲巡演（2026 年 2 月起）——台港場次值得留意", "summary": "King Gnu kicked off their 10th anniversary year with four dome shows and have announced their largest Asian tour to date, running from February 2026. The pairing of a domestic dome run with an expanded overseas leg follows the pattern now standard for top-tier J-pop acts, and puts King Gnu in the same touring tier as YOASOBI for Asian markets. Taiwan and Hong Kong dates are the ones to watch for anyone tracking regional availability.", "url": "https://niewmedia.com/en/news/2607king-gnu/"}, {"en": "Three of Your Listed Bands Share One Stage on Music Station, October 17", "zh": "10/17『Mステ』Official髭男dism、Mrs. GREEN APPLE、King Gnu 三團同場演出最新曲——清單裡三組一次集中", "summary": "Japan's Music Station will feature Official Hige Dandism, Mrs. GREEN APPLE and King Gnu on the same October 17 broadcast, each performing their latest single live. Three of the sixteen acts on the tracked list appearing together in one programme is unusual, and live television performances are typically the first place new arrangements and tour staging get previewed. Worth noting as a fixed date rather than an open-ended announcement to monitor.", "url": "https://www.billboard-japan.com/d_news/detail/154732/2"}]}]}, "market": {"asOf": "台股＝前一交易日 2026/10/02（週五）13:30 收盤；美股＝2026/10/02（週五）收盤。　★ 今天是週一，台股上午 9:00 開盤、美股要等台北時間今晚 21:30，所以這一區顯示的仍然是上週五最後一個完整交易日的數字——這是正確的，不是沒更新。週末兩天台美都休市，所以今天的基準和昨天的晨報相同；真正的新數字要等今天 13:30（台股）與明天清晨（美股）。", "highlight": "★★★ 今天開盤前只要記住兩件事：**①上週五的多頭動能來自「壞就業數據＝不升息」**——九月非農只增 29,000 人（市場預期 90,000）、失業率 4.1%→4.2%、平均時薪月增僅 0.1%，市場把它讀成聯準會沒有理由再升息，於是三大指數全紅、那斯達克＋1.19% 領漲。**②今天開盤要注意的新變數是巴西**——Flávio Bolsonaro 在第一輪拿下約 50%、大幅領先魯拉的約 42%，遠超選前 Datafolha 民調，而 10/25 決選還有三週。選前華爾街已經把這件事拆成兩套完全相反的劇本（財政緊縮 vs 國家支出），所以今天新興市場、巴西幣與相關 ETF 的跳空會是第一個答案。　【這兩件事怎麼一起讀】上週五的上漲是利率邏輯，跟你清單裡的 AI 與半導體直接相關；巴西是政治邏輯，對你 75 檔清單幾乎零直接曝險。所以如果今天台股跟著美股開高，那是第一條線在作用；如果盤中出現無法用台股自身消息解釋的新興市場資金異動，才去看第二條線。", "note": "★ 今天三條主線：　①【美股上週五：一個典型的「利率驅動反彈日」】三大指數全紅，那斯達克漲幅 1.19% 最大，合乎「壞數據→降息預期→成長股受惠」的邏輯。NVIDIA 盤中創下 237.87 美元歷史新高、收漲約 2.5%；Tesla 漲約 4%，因為第三季交車 486,532 輛優於預期。這兩檔都在你的清單裡，是當天清單內唯二明顯受惠的標的。　②【台股：價到量沒到】加權指數 48,475.74（＋122.25 點、＋0.25%），距離歷史盤中高點 48,601 僅約 125 點，但成交金額只有 8,982 億元。富邦投顧的觀點是「逼近前高但量能縮減」，建議持股六成、不追高。台積電收 2,500 元（－10 元、－0.4%），是指數逼近前高時沒有跟上的那一塊。今天開盤要看的就是：如果指數真的突破 48,601，成交量有沒有同步放大——沒有放大的突破，歷史上多半是假突破。　③【儲存硬碟是上週五最清楚的一條產業線】WDC －10.22%、STX －10.21%，兩檔同日跌超過 10%，而同一個週末東芝宣布 2027 財年內把 AI 資料中心硬碟產能翻倍。這兩件事是同一件事的兩面：近線 HDD 的報價是這兩家公司獲利的主要槓桿，第三家供應商可信地擴產，壓縮的正是那個槓桿。你的清單裡沒有 WDC／STX，但清單裡的記憶體類（南亞科 2408、華邦電 2344、旺宏 2337、Micron MU）屬於相鄰題材——不是同一個供需，但同一個「AI 儲存漲價」敘事，值得留意敘事轉向的傳染性。", "indices": [{"market": "TW", "name": "加權指數 TAIEX", "value": "48,475.74", "change": "0.25", "note": "10/02（五）收盤 · +122.25 點 · 集中市場成交金額 8,982 億元 · 距離歷史盤中高點 48,601 僅約 125 點。★ 今天（10/05 一）9:00 開盤，這個數字才會被取代。富邦投顧觀點：逼近前高但量能縮減，屬於「價到量沒到」，建議持股六成、不追高。【已交叉確認：財報狗 TAIEX 頁面／經濟日報 UDN 盤後報導】"}, {"market": "TW", "name": "元大台灣50 0050", "value": "112.05", "change": "0.67", "note": "10/02（五）收盤。權值股為主的 ETF，漲幅（＋0.67%）大於大盤（＋0.25%），代表當天資金集中在大型權值而非中小型股。"}, {"market": "TW", "name": "元大高股息 0056", "value": "56.40", "change": "0.35", "note": "10/02（五）收盤。高股息型 ETF，＋0.35%，介於大盤與 0050 之間，沒有出現明顯的防禦性資金流入或流出。"}, {"market": "US", "name": "那斯達克綜合指數 Nasdaq Composite", "value": "27,190.86", "change": "1.19", "note": "10/02（五）收盤 · +319.27 點 · 三大指數中漲幅最大。成長股對利率最敏感，所以「不升息」的解讀在這裡反映得最直接。"}, {"market": "US", "name": "S&P 500", "value": "7,722.72", "change": "0.73", "note": "10/02（五）收盤 · +56.27 點 · 距離歷史新高不到 1%。"}, {"market": "US", "name": "道瓊工業指數 Dow Jones", "value": "51,176.96", "change": "0.49", "note": "10/02（五）收盤 · +250.40 點 · 漲幅最小，符合「這是成長股行情、不是全面行情」的結構。"}, {"market": "US", "name": "羅素 2000 Russell 2000", "value": "2,832.89", "change": "0.94", "note": "10/02（五）收盤 · +26.27 點 · 小型股漲幅（＋0.94%）超過 S&P 500，是降息預期的典型受惠對象（小型股負債成本敏感度高）。"}, {"market": "US", "name": "QQQ（Invesco QQQ Trust）", "value": "—", "change": null, "note": "★ 空狀態：這次沒有取得 QQQ 當日收盤的精確數字，所以不填推估值。QQQ 追蹤那斯達克 100，方向上可對照上面那斯達克綜合指數的 ＋1.19%，但兩者成分不同、漲跌幅不會相同——要精確數字請看下單平台。"}], "movers": [{"name": "⚠️ 先說清楚這一區今天的資料基準", "ticker": "—", "change": "0", "price": "台股＋美股皆為 2026/10/02（五）收盤・當日全市場異動榜", "reason": "★ 下面列出的是 10/02 全市場漲跌幅 ≥5% 的主要標的，**其中沒有任何一檔在你的 75 檔觀察清單內**。週末休市，所以今天這份名單和昨天的晨報相同——這不是沒更新，是同一個交易日。已確認的三檔清單內標的：2330 －0.4%、NVDA ＋2.5%、TSLA ＋4.0%，都在 5% 以內。　【這份名單今天的用途】它不是「你的持股怎麼了」，而是「市場上週五在幹嘛」，而圖像非常清楚：類比晶片與被動元件大漲、儲存與資料中心硬體大跌。同一個「半導體」標籤底下兩個相反方向——這就是為什麼「半導體漲還是跌」這種問法在現在這個市場沒有意義。"}, {"name": "MaxLinear（清單外 · 當日最大漲幅）", "ticker": "MXL", "change": "14.99", "price": "10/02 收盤 · 單日近 +15%", "reason": "類比／混合訊號晶片。當日全市場最大漲幅之一，屬於「被動元件與類比晶片補漲」這條線的龍頭。"}, {"name": "ChipMOS 南茂科技（清單外 · 台廠 ADR）", "ticker": "IMOS", "change": "14.61", "price": "10/02 收盤 · +14.61%", "reason": "台灣封測廠的美國 ADR。值得注意的原因是它是台廠——同一個題材如果延續，今天台股的封測族群（你清單裡的日月光投控 3711）可能被帶動。"}, {"name": "Synaptics（清單外）", "ticker": "SYNA", "change": "14.08", "price": "10/02 收盤 · +14.08%", "reason": "觸控與人機介面 IC。與 MXL 同屬類比／介面晶片族群，同日同向，佐證這是族群性而非個股事件。"}, {"name": "Penguin Solutions（清單外）", "ticker": "PENG", "change": "11.60", "price": "10/02 收盤 · +11.60%", "reason": "記憶體模組與 AI 基礎設施整合。方向與同日大跌的 WDC／STX 相反，顯示資金在「儲存」內部做了細分選擇。"}, {"name": "Vishay Intertechnology（清單外）", "ticker": "VSH", "change": "11.41", "price": "10/02 收盤 · +11.41%", "reason": "被動元件（電阻、電容）。被動元件是景氣循環末端，單日 ＋11% 通常反映的是庫存去化完成的預期，而不是 AI 題材。"}, {"name": "Western Digital（清單外 · 當日最大跌幅之一）", "ticker": "WDC", "change": "-10.22", "price": "10/02 收盤 · 單日 -10.22%", "reason": "★ 這一檔今天要搭配新聞區「產業動態」第二則一起看：東芝宣布 2027 財年內把 AI 資料中心 HDD 產能翻倍。近線 HDD 報價是 WDC 獲利的主要槓桿，第三家供應商擴產直接壓縮這個槓桿。"}, {"name": "Seagate Technology（清單外）", "ticker": "STX", "change": "-10.21", "price": "10/02 收盤 · -10.21%", "reason": "與 WDC 同日同幅度下跌（－10.21% vs －10.22%），幾乎一模一樣的跌幅是族群性重新定價的特徵，不是個別公司消息。"}, {"name": "Ultra Clean Holdings（清單外）", "ticker": "UCTT", "change": "-7.57", "price": "10/02 收盤 · -7.57%", "reason": "半導體設備零組件與超純淨系統。設備端下跌與類比晶片上漲同日發生，進一步說明當天不是「半導體全面行情」。"}, {"name": "GDS Holdings（清單外）", "ticker": "GDS", "change": "-7.48", "price": "10/02 收盤 · -7.48%", "reason": "中國資料中心營運商。與儲存硬體同日下跌，屬於「資料中心硬體與營運」這一側的賣壓。"}, {"name": "Maase Inc.（清單外 · 當日最大跌幅）", "ticker": "MAAS", "change": "-13.35", "price": "10/02 收盤 · -13.35%", "reason": "當日全市場最大跌幅。小型股、流動性低，單日雙位數跌幅的資訊價值有限，列出僅為完整呈現當日異動榜。"}], "quotes": {"2330": "-0.40", "NVDA": "2.50", "TSLA": "4.00"}, "disclaimer": "【已交叉確認、可以放心引用的數字】　台股 2026/10/02（五）收盤：加權指數 48,475.74（＋122.25 點、＋0.25%）、成交 8,982 億元、台積電 2,500 元（－10 元、－0.4%）——來源：財報狗 TAIEX 頁、經濟日報 UDN 盤後。　美股 2026/10/02（五）收盤：道瓊 51,176.96（＋250.40、＋0.49%）、S&P 500 7,722.72（＋56.27、＋0.73%）、那斯達克 27,190.86（＋319.27、＋1.19%）、羅素 2000 2,832.89（＋26.27、＋0.94%）——來源：AP「How major US stock indexes fared Friday 10/2/2026」。　【標示為示意或空狀態、不要當精確數字引用的部分】QQQ 當日收盤未取得，顯示為「—」；0050／0056 的數字來自前一交易日收盤參考值；個股 sparkline 一律為示意線。　【這一區不是投資建議】觀察清單是分類整理，不是買賣建議；代號與報價請以下單平台最新資料為準。", "historyNote": "個股 sparkline 依「當日漲跌幅」與 config/site.json 的參考價重建、僅供示意；縱軸為實際幣別（台股新臺幣、美股美元）。今天仍然只有 3 檔有漲跌幅資料（2330、NVDA、TSLA），所以 75 檔卡片裡絕大多數會顯示灰色「—」與平線——那是正確的空狀態，不是渲染錯誤。　【為什麼不把它補滿】因為補滿的唯一方法是用推估值，而推估值在一張看起來像報價表的卡片上會被誤讀成真實收盤。寧可留 72 個誠實的「—」，也不要給 72 個看起來精確的假數字。　【參考價校準】config/site.json 的參考價多數仍停在 2026/09/03，所以 sparkline 的絕對價位與現價會有落差，只能用來看形狀、不能看價位。"}}, "archive": {"dates": ["2026-10-05", "2026-10-04", "2026-09-29", "2026-09-28", "2026-09-27", "2026-09-26", "2026-09-21", "2026-09-19", "2026-09-18", "2026-09-17", "2026-09-15", "2026-09-14", "2026-09-13", "2026-09-12", "2026-09-05"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.header-left .date{font-size:13px;color:var(--muted);margin-top:3px}
.header-left .ver{font-size:10px;color:#484f58;margin-top:2px}
.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 16px;display:flex;align-items:center;gap:10px}
.weather-badge .temp{font-size:20px;font-weight:700;color:var(--orange)}
.weather-badge .detail{font-size:12px;color:var(--muted);max-width:260px}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}

<body>

</div>

<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
/* ---------- render ---------- */
function render(){
document.getElementById("h-date").textContent=(DATA.dateLabel||DATA.date)+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;

// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
if(sc.note){var _n=document.createElement("div");_n.className="empty-tasks";_n.style.marginTop="12px";_n.style.textAlign="left";_n.style.lineHeight="1.8";_n.textContent=sc.note;list.appendChild(_n);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2><span class='hint'>"+esc((DATA.mail&&DATA.mail.window)||"")+"</span></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div><div class='sender'>"+esc(it.tag)+"</div>"+
"<div class='subject'>"+esc(it.title)+"</div>"+
"<div class='action'>"+(it.deadline&&it.deadline!=="—"?"📌 "+esc(it.deadline)+" · ":"")+esc(it.kind||"")+"</div></div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+esc(it.detail||"")+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(m.footnote)html+="<div style='font-size:11px;color:#8b949e;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;line-height:1.6'>※ "+esc(m.footnote)+"</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2><span class='hint'>"+esc((DATA.news&&DATA.news.window)||"")+"</span></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+esc(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var cls=x.change==null?"":(x.change>=0?"up":"down");var arrow=x.change==null?"":(x.change>=0?" ▲":" ▼");return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+esc(x.value)+arrow+"</div><div class='k'>"+(x.change!=null?fmtChg(x.change)+(x.note?" · "+esc(x.note):""):esc(x.note||""))+"</div></div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(r.price)+"</td><td>"+esc(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2><span class='hint'>"+esc(mk.asOf||"")+"</span></div><div class='card-body'>"+
(mk.highlight?"<div class='hl-box'><div style='color:var(--green);font-weight:700;margin-bottom:4px'>🆕 觀察清單外・新熱門標的</div>"+esc(mk.highlight)+"</div>":"")+
(mk.note?"<div class='trade-date-note'>📅 "+esc(mk.note)+"</div>":"")+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+
"<p style='font-size:11.5px;color:var(--muted);margin:8px 0 18px'>每張卡是觀察清單的一個分類；點卡片切換同分類的下一支，右上角為前一交易日漲跌幅、卡上為 sparkline。</p>"+
"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"<p class='chart-note'>"+esc(mk.historyNote||"")+"</p></div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
(mk.disclaimer?"<p style='font-size:12px;color:var(--muted)'>"+esc(mk.disclaimer)+"</p>":"")+
"<p style='font-size:11.5px;color:var(--muted);margin-top:6px'>※ "+esc(SITE.watchlistNote||"")+"</p>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=Q[code],price=s[4]||100,ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=Q[code];
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:s[4]||100,ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
</body>
</html>
