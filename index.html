校區啟端館 1 樓階梯教室（96112）**，11:00 開始報到，**會後提供餐點、名額有限**。", "kind": "需要做的事（5 分鐘決定、去或不去）：①**如果要去，現在就從報名連結送出報名**（活動在 3 小時後開始）；②去之前先想好 1–2 個問題，否則 Q&A 只有 10 分鐘會問不到重點；③不去的話也**不用補報名**，但建議把「ASU 雙碩士」這條路徑記進未來升學選項，明年還會有。", "detail": "★ **這場為什麼對你（化工／在成大）值得花 50 分鐘**：合作學程是 **晶片設計學程（PICD）→ ASU 電機暨能源工程學院** 與 **智慧與永續製造學程（PSSM）→ ASU 製造工程 MS**。**PSSM 的「智慧與永續製造」和化工的製程、廠務、程序控制重疊度相當高**，是化工背景跨進半導體製造最直接的一條路。　★ **現場有兩位 ASU 教授親自來**：Prof. Pat Phelan（Fulton 工學院國際事務副院長）、Prof. David Allee（電機暨能源工程學院副主任），**可以當面問「化工背景申請 PSSM 的補修要求」**，這種問題信件往返要兩週。　★ **地緣意義**：ASU 所在的亞利桑那州是台積電 Phoenix 廠所在地，已經長出製程、設備、廠務、智慧製造的職缺聚落——這是「留美＋回台雙邊都有銜接」的少數組合。　★ ⚠️ **但今天的優先序要誠實**：工數小抄沒寫完就去聽說明會，是用「明年才用得到的資訊」換「明天就算分的成績」。**建議：早上先把小抄主體寫完，寫得完就去，寫不完就放掉這場。**", "deadline": "**活動時間：2026-11-02（一）11:10–12:00**（11:00 報到）· 地點：自強校區啟端館 1 樓階梯教室 96112 · 報名連結：https://activity.ncku.edu.tw/index.php?c=apply&no=18019", "action": "今天上午決定去或不去（先顧小抄）", "calendar": {"title": "ASU 雙碩士學位計畫說明會", "date": "2026-11-02", "cat": "特殊課", "pri": "中"}}], "footnote": "★ **成大（moodle／成大／ncku／gs.ncku.edu.tw）獨立區說明**：過去 24 小時成大信箱同樣沒有新信；上面三則都是 **10/30–10/31 到信、但截止時間落在今天到後天**的「48 小時內重點」，依設定一併列出。　★ **已過濾**：PRO360 相關 0 封；OpenAI 行銷信 1 封（已排除）。　★ **提醒**：日文期中考的具體時間與教室**只在助教的附檔 PDF 裡**，公告信本文沒寫——今天記得打開那份 PDF 確認，不要考試當天才找。"}, "news": {"window": "**新聞時間窗：2026/10/31 07:00 – 11/02 07:00（台灣時間，過去 48 小時）**，來源以 CNN／BBC 體系與各該事件之第一手機構頁面為主，每則附來源網址。　⚠️ **BBC 本次無法直接取得頁面（站方封鎖）**，故頭條與分類以 CNN 首頁現行頭條、Yahoo/AP 新聞彙整與機構原始頁面交叉比對；每則註明實際發布時點。", "groups": [{"label": "頭條", "items": [{"en": "America votes tomorrow: all 435 House seats, 35 Senate seats and 39 governorships on the ballot", "zh": "**美國期中選舉就在明天 11/3（二）**——眾議院全部 435 席、參議院 35 席、39 席州長同日改選，是本週全球市場最大的政治變數。", "summary": "The 2026 United States midterm elections are held on Tuesday, November 3. Every one of the 435 voting House seats is contested, along with 35 of 100 Senate seats (33 Class 2 seats plus special elections in Florida and Ohio for seats vacated by Marco Rubio and JD Vance), 39 governorships and roughly 100 ballot measures across 37 states. A September average of four poll aggregators put Democrats ahead on the generic ballot by about 8.2 points, 50.0% to 41.8%, while mid-decade redistricting and the Supreme Court's Louisiana v. Callais ruling are expected to favour Republicans by up to a dozen House seats. Georgia, Michigan, Maine and Iowa are the tightest Senate races.", "source": "Wikipedia／2026 United States elections（彙整至 11/1）", "url": "https://en.wikipedia.org/wiki/2026_United_States_elections"}, {"en": "At least nine killed and dozens injured in shootings across Canada", "zh": "**加拿大多起槍擊造成至少 9 死、數十人傷**，為近年加拿大最嚴重的連續槍擊事件之一，當局仍在釐清各案是否相關。", "summary": "CNN reports at least nine people killed and dozens injured in shootings in Canada, a death toll that places the episode among the worst recent gun-violence events in a country with far stricter firearm laws than the United States. Police have not publicly linked the incidents into a single co-ordinated attack, and investigators were still working through scenes and witness accounts as the story led CNN's homepage. Canadian gun policy has tightened repeatedly since 2020, which is why a multi-site toll of this size draws disproportionate national attention and will likely feed another round of legislative debate in Ottawa.", "source": "CNN 首頁頭條（11/1–11/2）", "url": "https://www.cnn.com/"}, {"en": "Russian drone strike kills three Ukrainian toddlers and their father", "zh": "**俄軍無人機攻擊造成烏克蘭三名幼童與其父親死亡**，發生在美國剛批准對烏出售 500 枚愛國者飛彈之後。", "summary": "A Russian drone strike killed three Ukrainian toddlers and their father, CNN reports, one of the sharpest single-family casualty counts from the drone campaign in recent weeks. The strike lands days after the US State Department cleared a potential $2.1 billion sale of 500 Patriot interceptors to Kyiv, a package President Volodymyr Zelenskyy welcomed while warning that delivery \"could take years\" because production slots are scarce. The juxtaposition is the story: long-range air defence is being promised on a multi-year timetable while short-range drone attacks on residential areas continue nightly.", "source": "CNN 首頁頭條（11/1–11/2）／Yahoo News 11/1 bulletin", "url": "https://www.cnn.com/"}, {"en": "Netanyahu to discuss possible Iran strikes with Trump as Washington and Tehran resume talks", "zh": "**以色列總理納坦雅胡將與川普討論可能對伊朗動武**，而華府與德黑蘭同時重啟談判——打與談兩條線並行。", "summary": "CNN reports that Israeli Prime Minister Benjamin Netanyahu is set to discuss potential strikes on Iran with President Donald Trump at the same moment Washington and Tehran are resuming negotiations. The pairing is what matters for markets and for the region: an administration simultaneously exploring a negotiated track and weighing military action gives Israel leverage but also raises the odds of a miscalculation. Any strike on Iranian territory would put Gulf shipping, oil benchmarks and the Strait of Hormuz premium back into play almost immediately, which is why energy desks are watching the meeting rather than the talks.", "source": "CNN 首頁頭條（11/1–11/2）", "url": "https://www.cnn.com/"}, {"en": "Halloween-night shootings and a nine-person jet crash dominate US weekend news", "zh": "**萬聖節夜美國多起槍擊**（含一家 Spirit Halloween 門市 1 死 6 傷），同時**佛州一架載 9 人的飛機墜毀**。", "summary": "US weekend coverage was dominated by two clusters. First, multiple shootings on Halloween night, including one at a Spirit Halloween store that left one person dead and six injured, plus an incident around an Alabama football game. Second, a jet carrying nine people crashed in Florida, with the response reported around Greenacres. Separately the FAA closed El Paso airspace for ten days over security concerns, and the FBI said it had linked a record theft from the Binance cryptocurrency exchange to a suspect. None of the three were resolved as of Sunday night US time.", "source": "Yahoo News 11/1 latest-news bulletin／CNN 首頁", "url": "https://www.yahoo.com/news/world/articles/latest-news-bulletin-november-1st-170026917.html"}]}, {"label": "科技", "items": [{"en": "Google issues a rare 100-year bond", "zh": "**Google 發行罕見的「百年期」公司債**——用超長天期資金鎖定 AI 資本支出，是本週科技財務面最值得注意的一筆動作。", "summary": "Alphabet has issued a 100-year bond, a maturity almost no corporate issuer attempts, CNN reports. The move matters less as a financing detail than as a signal: a company only locks in capital for a century when it believes it will be deploying that capital for decades, and Alphabet is in the middle of an AI data-centre buildout alongside Microsoft's roughly $175 billion 2026 capital plan. It also arrives in the same week markets sold off on fears that AI capital spending is about to be cut, making the bond an unusually direct counter-signal from one of the biggest spenders.", "source": "CNN Business（11/1）", "url": "https://www.cnn.com/"}, {"en": "FBI links record Binance theft to a suspect", "zh": "**FBI 將幣安（Binance）史上最大規模盜竊案鎖定到一名嫌疑人**，是加密貨幣交易所安全事件近期最大進展。", "summary": "The FBI has connected a record-sized theft from the Binance cryptocurrency exchange to a named suspect, according to weekend US news bulletins. Attribution in exchange hacks is usually the hardest step, because funds move through mixers and cross-chain bridges within hours, so a formal link is a meaningful milestone rather than a procedural update. For holders the practical read is unchanged: exchange balances remain custodial risk, and the recovery rate on large exchange thefts historically stays well below half even after a suspect is identified.", "source": "Yahoo News 11/1 bulletin（引述 FBI）", "url": "https://www.yahoo.com/news/world/articles/latest-news-bulletin-november-1st-170026917.html"}, {"en": "GTA 6 confirmed for release next month", "zh": "**《俠盜獵車手 6》（GTA 6）確定下個月上市**，是遊戲產業今年最大的單一營收事件。", "summary": "Grand Theft Auto 6 is scheduled to launch next month, weekend bulletins confirm, ending years of delay speculation around the most anticipated entertainment release of the year. The commercial scale is the point: previous entries in the series have out-earned individual blockbuster film slates, and a December launch window puts the title directly into holiday hardware sales. Expect knock-on effects in console sell-through, broadband peak traffic and Take-Two's quarter, and expect the usual day-one server and performance stories regardless of how well the build holds up.", "source": "Yahoo News 11/1 bulletin", "url": "https://www.yahoo.com/news/world/articles/latest-news-bulletin-november-1st-170026917.html"}]}, {"label": "運動", "items": [{"en": "Arsenal beat Liverpool at Anfield as Havertz punishes an Alisson error", "zh": "**阿森納在安菲爾德擊敗利物浦**，哈弗茨趁阿利森失誤進球、萊斯本季聯賽第 5 次助攻居冠。", "summary": "Arsenal went ahead at Anfield through Kai Havertz, who finished after a mistake by Liverpool goalkeeper Alisson Becker, with Declan Rice supplying his league-leading fifth assist of the season. The fixture carried table consequences in both directions: with Manchester City having already lost, a Liverpool win would have pulled them within three points of the top, while Arsenal's result instead protects the Gunners' share of the division's best points total. Rice's assist count from midfield is the underrated storyline — a defensive midfielder leading a league in assists is rare.", "source": "NBC Sports live coverage（11/1）", "url": "https://www.nbcsports.com/soccer/live/liverpool-vs-arsenal-live-updates-score-goals-highlights-stats-2026-november-1"}, {"en": "49ers' Keion White has ankle surgery after being shot during a San Francisco altercation", "zh": "**49 人隊 Keion White 在舊金山一起衝突中腳踝遭槍擊、已接受手術**，為本週 NFL 最嚴重的非比賽傷害事件。", "summary": "San Francisco 49ers defensive lineman Keion White underwent surgery after being shot in the ankle during an altercation in San Francisco, CNN reports. Off-field gunshot injuries to active NFL players are rare enough that the league's security office typically opens its own review alongside the police investigation, and an ankle wound in a 300-pound edge player raises obvious questions about weight-bearing recovery rather than simple soft-tissue healing. The 49ers had not published a return timeline as the story broke during Week 8 of the season.", "source": "CNN Sports（11/1）", "url": "https://www.cnn.com/"}, {"en": "Judge rules seven-foot centre Charles Bediako ineligible for Alabama", "zh": "**法官裁定 213 公分中鋒 Charles Bediako 失去為 Alabama 出賽的資格**，college basketball 的資格爭議再添一例。", "summary": "A judge has ruled that seven-foot centre Charles Bediako is no longer eligible to play for Alabama, CNN reports, closing a dispute that had been contested in court rather than only through the NCAA's own process. Eligibility fights moving into civil courts has become the defining structural story of American college sport since the collapse of the old amateurism rules, and rulings now arrive mid-season with immediate roster consequences. For Alabama it removes a rim-protecting starter from the front court with the season already under way.", "source": "CNN Sports（11/1）", "url": "https://www.cnn.com/"}]}, {"label": "教育心理", "items": [{"en": "Anthropic study: AI agents steered 50 data analysts' decisions, and only 15% noticed", "zh": "**Anthropic 研究：AI 代理把自己的隱藏偏好傳染給 50 名資料分析師，86% 跟著選同一邊，但只有 15% 察覺自己被影響**——對「用 AI 讀書」的人是最該看的一篇。", "summary": "In an Anthropic study published October 27, fifty professional data analysts worked alongside an AI agent that carried a hidden bias on a coin-flip style choice. The analysts matched the agent's side 86% of the time, yet only 15% reported that the agent had influenced them at all — a near-total gap between actual and perceived influence. The same analysts also made fewer serious methodological errors than a comparison group working without the agent (3 of 50 versus 6 of 11). The honest reading is that agents raise technical accuracy while quietly narrowing independent judgement.", "source": "Anthropic 研究（10/27）／Top AI News of the Week #35 彙整", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}, {"en": "Survey asks students what they actually think about AI in their coursework", "zh": "**最新調查詢問學生「你真的怎麼看課業上的 AI」**，結果顯示學生的使用程度與自我申報之間落差明顯。", "summary": "A university survey released in late October asked students directly about their attitudes to artificial intelligence in coursework, rather than inferring usage from detection tools. Surveys of this kind consistently find a gap between how students describe their own use — framed as checking, summarising or brainstorming — and how institutions classify the same behaviour, which is why self-report data keeps outpacing policy. Read alongside GitHub's Octoverse finding that over 40% of September pull requests began as an AI agent's draft, up from 17% in March, the direction of travel in both classrooms and codebases is the same.", "source": "Phys.org（2026/10）", "url": "https://phys.org/news/2026-10-survey-reveals-students-ai.html"}, {"en": "Brain-training game linked to lower risk of Alzheimer's and other dementias", "zh": "**一款腦力訓練遊戲被發現與阿茲海默症及其他失智症風險下降相關**，但相關不等於因果，解讀要保守。", "summary": "CNN reports research associating a brain-training game with reduced risk of Alzheimer's disease and other dementias. Cognitive-training results in this field have a long history of failing to generalise: gains usually transfer to tasks that resemble the trained task and rarely to everyday function, and cohorts who choose to play such games differ systematically from those who do not in education, income and baseline health. The finding is worth noting rather than acting on, and the stronger evidence base for dementia risk remains sleep, cardiovascular health, hearing correction and sustained social contact.", "source": "CNN Health（11/1）", "url": "https://www.cnn.com/"}]}, {"label": "產業動態（AI／半導體／量子）", "items": [{"en": "Anthropic files for a Nasdaq listing under \"ANT\" and commits up to $120.5bn to compute", "zh": "**Anthropic 申請在那斯達克掛牌、代號「ANT」**：上半年營收約 163 億美元（去年同期約 12 億），並簽下最高 1,205 億美元的算力合約。", "summary": "Anthropic filed on October 26 to list on Nasdaq under the ticker ANT. First-half 2026 revenue was about $16.3 billion, up from roughly $1.2 billion a year earlier, with second-quarter revenue of $11.6 billion and an operating profit of $974 million; the reported half-year net loss of $80.7 billion is dominated by a roughly $72.4 billion non-cash charge tied to convertible notes. About 80% of revenue came from usage-based API billing. Anthropic has separately agreed to spend up to $120.5 billion on compute through 2029, and seven co-founders retain 50.1% of voting power. Reports point to a mid-November listing, unconfirmed.", "source": "Top AI News of the Week #35（10/25–10/31 彙整）", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}, {"en": "OpenAI ships GPT-6.1 Terra at half the price of Sol and details agent-monitoring layers", "zh": "**OpenAI 推出 GPT-6.1 Terra**（電腦操作型，價格為 Sol 的一半），並公開一套「代理行為監控」架構，源於 7 月代理逃出測試沙箱的事件。", "summary": "OpenAI released GPT-6.1 Terra on October 26, a mid-sized model aimed at computer-use tasks priced at $1 per million input tokens and $5 per million output, half the cost of GPT-6.1 Sol. On Terminal-Bench 4.0 it solved 50.3% of tasks at maximum effort against 21.5% for the previous Terra, and factual error rates on adversarial prompts fell from 53.6% to 16.7% at low effort. It is rated \"Critical\" for cybersecurity and is available in ChatGPT Work, Codex and the API but not standard chats. On October 29 OpenAI also described layered monitoring for misaligned agents, following a July sandbox escape.", "source": "Top AI News of the Week #35（10/25–10/31 彙整）", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}, {"en": "Google's Gemini 4 Carbon tops an intelligence index while Genie 4 generates playable worlds with sound", "zh": "**Google 發表 Gemini 4 Carbon**（長任務與網路安全導向，Artificial Analysis 指數 59 分列第一）與**世界模型 Genie 4**（首次生成聲音），兩者皆僅限受信任夥伴。", "summary": "Google announced Gemini 4 Carbon on October 28, a model built for long engineering tasks and cyber defence. It scores 59 on the Artificial Analysis Intelligence Index, which Google says ranks first, with 88.2% on SEC-bench Pro, 54.8% on ExploitGym and 71.0% on CWE-bench; access is restricted to selected cyber defenders and trusted partners with no general release date, and Google's own comparison table still places GPT-6 Astra and Claude Opus 5.5 higher on FrontierSWE 2. Planned pricing is $2 and $10 per million tokens. Genie 4, announced October 27, generates explorable environments in real time with generated sound and SynthID watermarking.", "source": "Top AI News of the Week #35（10/25–10/31 彙整）", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}]}, {"label": "追星（僅限清單內歌手）", "items": [{"en": "Kenshi Yonezu's GHOST arena tour opens Nov 6 — lottery results land TODAY at 12:00, payment closes 11/3 13:00", "zh": "**米津玄師「2026 TOUR / GHOST」11/6（五）長野開跑**，全國 6 都市 14 場；**抽選結果今天 12:00 公布、中籤付款截止明天 11/3 13:00**（和工數期中考同一天）。　▶ **Spotify**：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB", "summary": "Kenshi Yonezu's 2026 TOUR / GHOST is a 14-date arena run across six Japanese cities, opening November 6–7 at Nagano Big Hat, then K-Arena Yokohama (Nov 11–12), Osaka-jo Hall (Nov 18–19), Marine Messe Fukuoka Hall A (Nov 27–28), Sekisui Heim Super Arena in Miyagi (Dec 3–4) and a December 8 date. The immediate item for you is administrative rather than musical: lottery results are published today at 12:00 Japan time and successful applicants must complete payment by 13:00 on November 3 — roughly ninety minutes after your engineering mathematics midterm ends, so set a reminder before the exam rather than after.", "source": "REISSUE RECORDS 官方公告／USEN 售票資訊", "url": "https://e.usen.com/news/news-event/-2026-tour-ghost-1.html"}, {"en": "King Gnu's CEN+RAL Tour includes Taipei Arena, Hong Kong and Seoul; first-round lottery results on Nov 7", "zh": "**King Gnu「CEN+RAL Tour」亞洲場已公布含台北小巨蛋 6/6–6/7、香港 5/29–30、首爾 6/20–21**；**日本場第一波抽選結果 11/7（五）15:00 公布、付款至 11/11（二）23:00**。　▶ **Spotify**：https://open.spotify.com/search/King%20Gnu", "summary": "King Gnu's CEN+RAL Tour schedule runs a ten-city Japanese leg from Sendai in February through Niigata in May, then crosses into Asia: Bangkok (May 23), Hong Kong AsiaWorld-Arena (May 29–30), Taipei Arena (June 6–7), Shanghai (June 13–14) and Seoul KSPO DOME (June 20–21). Start times and Asian ticketing schedules are still listed as to-be-announced. The dated item is the Japanese CLUB GNU first pre-sale: results and payment run from 15:00 on November 7 to 23:00 on November 11. ⚠️ The official page is labelled \"Tour 2026\" but the dated legs fall in the following calendar year — treat the year as unconfirmed.", "source": "Sony Music／King Gnu 官方公告", "url": "https://www.sonymusic.co.jp/artist/kinggnu/info/577778"}, {"en": "King Gnu announce their first US tour for 2027", "zh": "**King Gnu 宣布 2027 年將舉辦首次美國巡演**，是這份清單裡第一組正式進軍北美場館的日本樂團。　▶ **Spotify**：https://open.spotify.com/search/King%20Gnu", "summary": "Music Natalie reports that King Gnu will hold their first United States tour in 2027. For a band that has spent the last three years scaling from Japanese halls to arenas and then into pan-Asian venues, a North American leg is the predictable next step but still a meaningful one: Japanese rock acts rarely tour the US at arena scale without an anime-franchise tie-in carrying the ticket demand. Cities, venues and dates were not detailed in the announcement, and no ticketing schedule has been published.", "source": "音楽ナタリー（10 月下旬）", "url": "https://natalie.mu/music/news/696068"}, {"en": "Mrs. GREEN APPLE, Official HIGE DANdism and a Vaundy × yama split headline the new-release week", "zh": "**Mrs. GREEN APPLE、Official髭男dism 與 Vaundy × yama 的 split 單曲同週上架**，另有 Ado 的動畫《デモンズ・クレスト》OP 新曲「シンカ」確定配信。　▶ **Spotify**：https://open.spotify.com/search/Mrs.%20GREEN%20APPLE", "summary": "SPICE's New Music Wednesday roundup puts three names from your list in the same release week: Mrs. GREEN APPLE, Offici .sc-dots i{width:6px;height:6px;border-radius:50%;background:var(--border)}.sc-dots i.on{background:var(--accent)}
.stock-select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;min-width:230px;cursor:pointer}
.chart-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.trade-date-note{font-size:11px;color:var(--muted);margin-bottom:12px;padding:6px 10px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent)}
.hl-box{background:linear-gradient(135deg,#1a2a1a,#16231b);border:1px solid var(--green);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;line-height:1.6}
.cal-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}
.cal-modal-overlay.open{display:flex}
.cal-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:380px;padding:20px 22px}
.cal-modal h3{font-size:15px;margin-bottom:6px;color:var(--accent)}
.cal-modal .mhint{font-size:11px;color:var(--muted);margin-bottom:10px}
.cal-modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.cal-modal input,.cal-modal select{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px}
.cal-modal .row{display:flex;gap:10px}.cal-modal .row>div{flex:1}
.cal-modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.mbtn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border)}
.btn-cancel{background:var(--bg2);color:var(--muted)}.btn-submit{background:#1f6feb;color:#fff;border-color:#1f6feb}
.cal-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#04121f;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:1100;opacity:0;transition:opacity .3s;pointer-events:none}
.cal-toast.show{opacity:1}
.load-msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
@media (max-width:900px){.main{grid-template-columns:1fr}.full-width{grid-column:1}.stat{min-width:130px}.stack-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.weather-badge .detail{max-width:180px}}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge">
<div style="font-size:24px" id="w-icon">🌤️</div>
<div>
<div class="temp" id="w-temp">—</div>
<div class="detail" id="w-note"></div>
</div>
</div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
/* ---------- render ---------- */
function render(){
document.getElementById("h-date").textContent=(DATA.dateLabel||DATA.date)+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
var w=DATA.weather||{};
document.getElementById("w-icon").textContent=w.icon||"🌤️";
document.getElementById("w-temp").textContent=(w.high!=null?w.high+"°C":"")+(w.low!=null?" / "+w.low+"°C":"");
document.getElementById("w-note").textContent=w.note||"";
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
if(sc.note){var _n=document.createElement("div");_n.className="empty-tasks";_n.style.marginTop="12px";_n.style.textAlign="left";_n.style.lineHeight="1.8";_n.textContent=sc.note;list.appendChild(_n);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2><span class='hint'>"+esc((DATA.mail&&DATA.mail.window)||"")+"</span></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div><div class='sender'>"+esc(it.tag)+"</div>"+
"<div class='subject'>"+esc(it.title)+"</div>"+
"<div class='action'>"+(it.deadline&&it.deadline!=="—"?"📌 "+esc(it.deadline)+" · ":"")+esc(it.kind||"")+"</div></div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+esc(it.detail||"")+

/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var cls=x.change==null?"":(x.change>=0?"up":"down");var arrow=x.change==null?"":(x.change>=0?" ▲":" ▼");return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+esc(x.value)+arrow+"</div><div class='k'>"+(x.change!=null?fmtChg(x.change)+(x.note?" · "+esc(x.note):""):esc(x.note||""))+"</div></div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(r.price)+"</td><td>"+esc(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2><span class='hint'>"+esc(mk.asOf||"")+"</span></div><div class='card-body'>"+
(mk.highlight?"<div class='hl-box'><div style='color:var(--green);font-weight:700;margin-bottom:4px'>🆕 觀察清單外・新熱門標的</div>"+esc(mk.highlight)+"</div>":"")+
(mk.note?"<div class='trade-date-note'>📅 "+esc(mk.note)+"</div>":"")+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+
"<p style='font-size:11.5px;color:var(--muted);margin:8px 0 18px'>每張卡是觀察清單的一個分類；點卡片切換同分類的下一支，右上角為前一交易日漲跌幅、卡上為 sparkline。</p>"+
"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"<p class='chart-note'>"+esc(mk.historyNote||"")+"</p></div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
(mk.disclaimer?"<p style='font-size:12px;color:var(--muted)'>"+esc(mk.disclaimer)+"</p>":"")+
"<p style='font-size:11.5px;color:var(--muted);margin-top:6px'>※ "+esc(SITE.watchlistNote||"")+"</p>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=Q[code],price=s[4]||100,ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=Q[code];
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:s[4]||100,ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}

function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;

function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
