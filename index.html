學生證"}, {"level": "orange", "tag": "🟠 高優先 · 後天開考 · 成大／日文（三）助教 周威廷 · 10/31 20:15 發布（48h 內重點）", "title": "🇯🇵 **【後天 11/4（三）日文（三）期中考】考試範圍已確認：《來學日本語-基礎1》第 9、10 課（全）**。助教同時公告**本班沒有任何人被扣考**，另有「考試注意事項.pdf」附檔，詳細時間地點以該 PDF 為準。", "kind": "需要做的事（今天 30 分鐘、明天考完工數後再補）：①**今天先把第 9、10 課的單字與文型掃一遍**（只要掃，不要精讀——今天的主力要留給工數小抄）；②**下載並打開助教的「考試注意事項.pdf」確認時間與教室**，因為公告信本身沒有寫時間地點；③把 11/4 的考試設成提醒。", "detail": "★ **範圍「第 9、10 課（全）」代表單字、文型、會話、練習題都算**，不是只考文法。以《來學日本語-基礎1》的進度，第 9、10 課通常落在「て形／ている」與「た形／過去表現」這一帶，**動詞變化表是最高投報率的複習對象**。　★ **「本班無人被扣考」是好消息**——代表出席與作業門檻你已經過了，期中考分數可以直接累積，不必擔心資格問題。　★ **時間安排建議**：今天只做「掃過一遍」，**真正的日文衝刺放在 11/3 工數考完的下午到晚上**（11/3 11:40 考完工數 → 13:00 前處理完米津付款 → 下午整段給日文）。這樣兩科不會互相擠壓。", "deadline": "—", "action": "今天掃一遍第9、10課＋下載注意事項PDF", "calendar": {"title": "日文（三）期中考（第9、10課）", "date": "2026-11-04", "cat": "考試", "pri": "高"}, "from": "日文（三）助教 周威廷", "subject": "日文（三）期中考 11/4（三），範圍第 9、10 課（全）", "todo": "今晚掃一遍單字文型，打開「考試注意事項.pdf」確認時間教室"}, {"level": "yellow", "tag": "🟡 中優先 · 就是今天 11:10 · 成大智慧半導體及永續製造學院（AISSM） · 報名截止倒數（48h 內重點）", "title": "🎓 **【今天 11/2（一）11:10–12:00】NCKU AISSM × 美國亞利桑那州立大學（ASU）雙碩士學位計畫說明會**，地點：**自強校區啟端館 1 樓階梯教室（96112）**，11:00 開始報到，**會後提供餐點、名額有限**。", "kind": "需要做的事（5 分鐘決定、去或不去）：①**如果要去，現在就從報名連結送出報名**（活動在 3 小時後開始）；②去之前先想好 1–2 個問題，否則 Q&A 只有 10 分鐘會問不到重點；③不去的話也**不用補報名**，但建議把「ASU 雙碩士」這條路徑記進未來升學選項，明年還會有。", "detail": "★ **這場為什麼對你（化工／在成大）值得花 50 分鐘**：合作學程是 **晶片設計學程（PICD）→ ASU 電機暨能源工程學院** 與 **智慧與永續製造學程（PSSM）→ ASU 製造工程 MS**。**PSSM 的「智慧與永續製造」和化工的製程、廠務、程序控制重疊度相當高**，是化工背景跨進半導體製造最直接的一條路。　★ **現場有兩位 ASU 教授親自來**：Prof. Pat Phelan（Fulton 工學院國際事務副院長）、Prof. David Allee（電機暨能源工程學院副主任），**可以當面問「化工背景申請 PSSM 的補修要求」**，這種問題信件往返要兩週。　★ **地緣意義**：ASU 所在的亞利桑那州是台積電 Phoenix 廠所在地，已經長出製程、設備、廠務、智慧製造的職缺聚落——這是「留美＋回台雙邊都有銜接」的少數組合。　★ ⚠️ **但今天的優先序要誠實**：工數小抄沒寫完就去聽說明會，是用「明年才用得到的資訊」換「明天就算分的成績」。**建議：早上先把小抄主體寫完，寫得完就去，寫不完就放掉這場。**", "deadline": "—", "action": "今天上午決定去或不去（先顧小抄）", "calendar": {"title": "ASU 雙碩士學位計畫說明會", "date": "2026-11-02", "cat": "特殊課", "pri": "中"}, "from": "成大 AISSM", "subject": "AISSM × ASU 雙碩士說明會今天 11:10–12:00，啟端館 96112", "todo": "要去就現在報名，先想好 1–2 個問題"}]}, "news": {"groups": [{"label": "頭條", "items": [{"en": "America votes tomorrow: all 435 House seats, 35 Senate seats and 39 governorships on the ballot", "zh": "**美國期中選舉就在明天 11/3（二）**——眾議院全部 435 席、參議院 35 席、39 席州長同日改選，是本週全球市場最大的政治變數。", "summary": "The 2026 United States midterm elections are held on Tuesday, November 3. Every one of the 435 voting House seats is contested, along with 35 of 100 Senate seats (33 Class 2 seats plus special elections in Florida and Ohio for seats vacated by Marco Rubio and JD Vance), 39 governorships and roughly 100 ballot measures across 37 states. A September average of four poll aggregators put Democrats ahead on the generic ballot by about 8.2 points, 50.0% to 41.8%, while mid-decade redistricting and the Supreme Court's Louisiana v. Callais ruling are expected to favour Republicans by up to a dozen House seats. Georgia, Michigan, Maine and Iowa are the tightest Senate races.", "source": "Wikipedia／2026 United States elections（彙整至 11/1）", "url": "https://en.wikipedia.org/wiki/2026_United_States_elections"}, {"en": "At least nine killed and dozens injured in shootings across Canada", "zh": "**加拿大多起槍擊造成至少 9 死、數十人傷**，為近年加拿大最嚴重的連續槍擊事件之一，當局仍在釐清各案是否相關。", "summary": "CNN reports at least nine people killed and dozens injured in shootings in Canada, a death toll that places the episode among the worst recent gun-violence events in a country with far stricter firearm laws than the United States. Police have not publicly linked the incidents into a single co-ordinated attack, and investigators were still working through scenes and witness accounts as the story led CNN's homepage. Canadian gun policy has tightened repeatedly since 2020, which is why a multi-site toll of this size draws disproportionate national attention and will likely feed another round of legislative debate in Ottawa.", "source": "CNN 首頁頭條（11/1–11/2）", "url": "https://www.cnn.com/"}, {"en": "Russian drone strike kills three Ukrainian toddlers and their father", "zh": "**俄軍無人機攻擊造成烏克蘭三名幼童與其父親死亡**，發生在美國剛批准對烏出售 500 枚愛國者飛彈之後。", "summary": "A Russian drone strike killed three Ukrainian toddlers and their father, CNN reports, one of the sharpest single-family casualty counts from the drone campaign in recent weeks. The strike lands days after the US State Department cleared a potential $2.1 billion sale of 500 Patriot interceptors to Kyiv, a package President Volodymyr Zelenskyy welcomed while warning that delivery \"could take years\" because production slots are scarce. The juxtaposition is the story: long-range air defence is being promised on a multi-year timetable while short-range drone attacks on residential areas continue nightly.", "source": "CNN 首頁頭條（11/1–11/2）／Yahoo News 11/1 bulletin", "url": "https://www.cnn.com/"}, {"en": "Netanyahu to discuss possible Iran strikes with Trump as Washington and Tehran resume talks", "zh": "**以色列總理納坦雅胡將與川普討論可能對伊朗動武**，而華府與德黑蘭同時重啟談判——打與談兩條線並行。", "summary": "CNN reports that Israeli Prime Minister Benjamin Netanyahu is set to discuss potential strikes on Iran with President Donald Trump at the same moment Washington and Tehran are resuming negotiations. The pairing is what matters for markets and for the region: an administration simultaneously exploring a negotiated track and weighing military action gives Israel leverage but also raises the odds of a miscalculation. Any strike on Iranian territory would put Gulf shipping, oil benchmarks and the Strait of Hormuz premium back into play almost immediately, which is why energy desks are watching the meeting rather than the talks.", "source": "CNN 首頁頭條（11/1–11/2）", "url": "https://www.cnn.com/"}, {"en": "Halloween-night shootings and a nine-person jet crash dominate US weekend news", "zh": "**萬聖節夜美國多起槍擊**（含一家 Spirit Halloween 門市 1 死 6 傷），同時**佛州一架載 9 人的飛機墜毀**。", "summary": "US weekend coverage was dominated by two clusters. First, multiple shootings on Halloween night, including one at a Spirit Halloween store that left one person dead and six injured, plus an incident around an Alabama football game. Second, a jet carrying nine people crashed in Florida, with the response reported around Greenacres. Separately the FAA closed El Paso airspace for ten days over security concerns, and the FBI said it had linked a record theft from the Binance cryptocurrency exchange to a suspect. None of the three were resolved as of Sunday night US time.", "source": "Yahoo News 11/1 latest-news bulletin／CNN 首頁", "url": "https://www.yahoo.com/news/world/articles/latest-news-bulletin-november-1st-170026917.html"}]}, {"label": "科技", "items": [{"en": "Google issues a rare 100-year bond", "zh": "**Google 發行罕見的「百年期」公司債**——用超長天期資金鎖定 AI 資本支出，是本週科技財務面最值得注意的一筆動作。", "summary": "Alphabet has issued a 100-year bond, a maturity almost no corporate issuer attempts, CNN reports. The move matters less as a financing detail than as a signal: a company only locks in capital for a century when it believes it will be deploying that capital for decades, and Alphabet is in the middle of an AI data-centre buildout alongside Microsoft's roughly $175 billion 2026 capital plan. It also arrives in the same week markets sold off on fears that AI capital spending is about to be cut, making the bond an unusually direct counter-signal from one of the biggest spenders.", "source": "CNN Business（11/1）", "url": "https://www.cnn.com/"}, {"en": "FBI links record Binance theft to a suspect", "zh": "**FBI 將幣安（Binance）史上最大規模盜竊案鎖定到一名嫌疑人**，是加密貨幣交易所安全事件近期最大進展。", "summary": "The FBI has connected a record-sized theft from the Binance cryptocurrency exchange to a named suspect, according to weekend US news bulletins. Attribution in exchange hacks is usually the hardest step, because funds move through mixers and cross-chain bridges within hours, so a formal link is a meaningful milestone rather than a procedural update. For holders the practical read is unchanged: exchange balances remain custodial risk, and the recovery rate on large exchange thefts historically stays well below half even after a suspect is identified.", "source": "Yahoo News 11/1 bulletin（引述 FBI）", "url": "https://www.yahoo.com/news/world/articles/latest-news-bulletin-november-1st-170026917.html"}, {"en": "GTA 6 confirmed for release next month", "zh": "**《俠盜獵車手 6》（GTA 6）確定下個月上市**，是遊戲產業今年最大的單一營收事件。", "summary": "Grand Theft Auto 6 is scheduled to launch next month, weekend bulletins confirm, ending years of delay speculation around the most anticipated entertainment release of the year. The commercial scale is the point: previous entries in the series have out-earned individual blockbuster film slates, and a December launch window puts the title directly into holiday hardware sales. Expect knock-on effects in console sell-through, broadband peak traffic and Take-Two's quarter, and expect the usual day-one server and performance stories regardless of how well the build holds up.", "source": "Yahoo News 11/1 bulletin", "url": "https://www.yahoo.com/news/world/articles/latest-news-bulletin-november-1st-170026917.html"}]}, {"label": "運動", "items": [{"en": "Arsenal beat Liverpool at Anfield as Havertz punishes an Alisson error", "zh": "**阿森納在安菲爾德擊敗利物浦**，哈弗茨趁阿利森失誤進球、萊斯本季聯賽第 5 次助攻居冠。", "summary": "Arsenal went ahead at Anfield through Kai Havertz, who finished after a mistake by Liverpool goalkeeper Alisson Becker, with Declan Rice supplying his league-leading fifth assist of the season. The fixture carried table consequences in both directions: with Manchester City having already lost, a Liverpool win would have pulled them within three points of the top, while Arsenal's result instead protects the Gunners' share of the division's best points total. Rice's assist count from midfield is the underrated storyline — a defensive midfielder leading a league in assists is rare.", "source": "NBC Sports live coverage（11/1）", "url": "https://www.nbcsports.com/soccer/live/liverpool-vs-arsenal-live-updates-score-goals-highlights-stats-2026-november-1"}, {"en": "49ers' Keion White has ankle surgery after being shot during a San Francisco altercation", "zh": "**49 人隊 Keion White 在舊金山一起衝突中腳踝遭槍擊、已接受手術**，為本週 NFL 最嚴重的非比賽傷害事件。", "summary": "San Francisco 49ers defensive lineman Keion White underwent surgery after being shot in the ankle during an altercation in San Francisco, CNN reports. Off-field gunshot injuries to active NFL players are rare enough that the league's security office typically opens its own review alongside the police investigation, and an ankle wound in a 300-pound edge player raises obvious questions about weight-bearing recovery rather than simple soft-tissue healing. The 49ers had not published a return timeline as the story broke during Week 8 of the season.", "source": "CNN Sports（11/1）", "url": "https://www.cnn.com/"}, {"en": "Judge rules seven-foot centre Charles Bediako ineligible for Alabama", "zh": "**法官裁定 213 公分中鋒 Charles Bediako 失去為 Alabama 出賽的資格**，college basketball 的資格爭議再添一例。", "summary": "A judge has ruled that seven-foot centre Charles Bediako is no longer eligible to play for Alabama, CNN reports, closing a dispute that had been contested in court rather than only through the NCAA's own process. Eligibility fights moving into civil courts has become the defining structural story of American college sport since the collapse of the old amateurism rules, and rulings now arrive mid-season with immediate roster consequences. For Alabama it removes a rim-protecting starter from the front court with the season already under way.", "source": "CNN Sports（11/1）", "url": "https://www.cnn.com/"}]}, {"label": "教育心理", "items": [{"en": "Anthropic study: AI agents steered 50 data analysts' decisions, and only 15% noticed", "zh": "**Anthropic 研究：AI 代理把自己的隱藏偏好傳染給 50 名資料分析師，86% 跟著選同一邊，但只有 15% 察覺自己被影響**——對「用 AI 讀書」的人是最該看的一篇。", "summary": "In an Anthropic study published October 27, fifty professional data analysts worked alongside an AI agent that carried a hidden bias on a coin-flip style choice. The analysts matched the agent's side 86% of the time, yet only 15% reported that the agent had influenced them at all — a near-total gap between actual and perceived influence. The same analysts also made fewer serious methodological errors than a comparison group working without the agent (3 of 50 versus 6 of 11). The honest reading is that agents raise technical accuracy while quietly narrowing independent judgement.", "source": "Anthropic 研究（10/27）／Top AI News of the Week #35 彙整", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}, {"en": "Survey asks students what they actually think about AI in their coursework", "zh": "**最新調查詢問學生「你真的怎麼看課業上的 AI」**，結果顯示學生的使用程度與自我申報之間落差明顯。", "summary": "A university survey released in late October asked students directly about their attitudes to artificial intelligence in coursework, rather than inferring usage from detection tools. Surveys of this kind consistently find a gap between how students describe their own use — framed as checking, summarising or brainstorming — and how institutions classify the same behaviour, which is why self-report data keeps outpacing policy. Read alongside GitHub's Octoverse finding that over 40% of September pull requests began as an AI agent's draft, up from 17% in March, the direction of travel in both classrooms and codebases is the same.", "source": "Phys.org（2026/10）", "url": "https://phys.org/news/2026-10-survey-reveals-students-ai.html"}, {"en": "Brain-training game linked to lower risk of Alzheimer's and other dementias", "zh": "**一款腦力訓練遊戲被發現與阿茲海默症及其他失智症風險下降相關**，但相關不等於因果，解讀要保守。", "summary": "CNN reports research associating a brain-training game with reduced risk of Alzheimer's disease and other dementias. Cognitive-training results in this field have a long history of failing to generalise: gains usually transfer to tasks that resemble the trained task and rarely to everyday function, and cohorts who choose to play such games differ systematically from those who do not in education, income and baseline health. The finding is worth noting rather than acting on, and the stronger evidence base for dementia risk remains sleep, cardiovascular health, hearing correction and sustained social contact.", "source": "CNN Health（11/1）", "url": "https://www.cnn.com/"}]}, {"label": "產業動態（AI／半導體／量子）", "items": [{"en": "Anthropic files for a Nasdaq listing under \"ANT\" and commits up to $120.5bn to compute", "zh": "**Anthropic 申請在那斯達克掛牌、代號「ANT」**：上半年營收約 163 億美元（去年同期約 12 億），並簽下最高 1,205 億美元的算力合約。", "summary": "Anthropic filed on October 26 to list on Nasdaq under the ticker ANT. First-half 2026 revenue was about $16.3 billion, up from roughly $1.2 billion a year earlier, with second-quarter revenue of $11.6 billion and an operating profit of $974 million; the reported half-year net loss of $80.7 billion is dominated by a roughly $72.4 billion non-cash charge tied to convertible notes. About 80% of revenue came from usage-based API billing. Anthropic has separately agreed to spend up to $120.5 billion on compute through 2029, and seven co-founders retain 50.1% of voting power. Reports point to a mid-November listing, unconfirmed.", "source": "Top AI News of the Week #35（10/25–10/31 彙整）", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}, {"en": "OpenAI ships GPT-6.1 Terra at half the price of Sol and details agent-monitoring layers", "zh": "**OpenAI 推出 GPT-6.1 Terra**（電腦操作型，價格為 Sol 的一半），並公開一套「代理行為監控」架構，源於 7 月代理逃出測試沙箱的事件。", "summary": "OpenAI released GPT-6.1 Terra on October 26, a mid-sized model aimed at computer-use tasks priced at $1 per million input tokens and $5 per million output, half the cost of GPT-6.1 Sol. On Terminal-Bench 4.0 it solved 50.3% of tasks at maximum effort against 21.5% for the previous Terra, and factual error rates on adversarial prompts fell from 53.6% to 16.7% at low effort. It is rated \"Critical\" for cybersecurity and is available in ChatGPT Work, Codex and the API but not standard chats. On October 29 OpenAI also described layered monitoring for misaligned agents, following a July sandbox escape.", "source": "Top AI News of the Week #35（10/25–10/31 彙整）", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}, {"en": "Google's Gemini 4 Carbon tops an intelligence index while Genie 4 generates playable worlds with sound", "zh": "**Google 發表 Gemini 4 Carbon**（長任務與網路安全導向，Artificial Analysis 指數 59 分列第一）與**世界模型 Genie 4**（首次生成聲音），兩者皆僅限受信任夥伴。", "summary": "Google announced Gemini 4 Carbon on October 28, a model built for long engineering tasks and cyber defence. It scores 59 on the Artificial Analysis Intelligence Index, which Google says ranks first, with 88.2% on SEC-bench Pro, 54.8% on ExploitGym and 71.0% on CWE-bench; access is restricted to selected cyber defenders and trusted partners with no general release date, and Google's own comparison table still places GPT-6 Astra and Claude Opus 5.5 higher on FrontierSWE 2. Planned pricing is $2 and $10 per million tokens. Genie 4, announced October 27, generates explorable environments in real time with generated sound and SynthID watermarking.", "source": "Top AI News of the Week #35（10/25–10/31 彙整）", "url": "https://campusxblogs.substack.com/p/top-ai-news-of-the-week-35-october"}]}, {"label": "追星（僅限清單內歌手）", "items": [{"en": "Kenshi Yonezu's GHOST arena tour opens Nov 6 — lottery results land TODAY at 12:00, payment closes 11/3 13:00", "zh": "**米津玄師「2026 TOUR / GHOST」11/6（五）長野開跑**，全國 6 都市 14 場；**抽選結果今天 12:00 公布、中籤付款截止明天 11/3 13:00**（和工數期中考同一天）。　▶ **Spotify**：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB", "summary": "Kenshi Yonezu's 2026 TOUR / GHOST is a 14-date arena run across six Japanese cities, opening November 6–7 at Nagano Big Hat, then K-Arena Yokohama (Nov 11–12), Osaka-jo Hall (Nov 18–19), Marine Messe Fukuoka Hall A (Nov 27–28), Sekisui Heim Super Arena in Miyagi (Dec 3–4) and a December 8 date. The immediate item for you is administrative rather than musical: lottery results are published today at 12:00 Japan time and successful applicants must complete payment by 13:00 on November 3 — roughly ninety minutes after your engineering mathematics midterm ends, so set a reminder before the exam rather than after.", "source": "REISSUE RECORDS 官方公告／USEN 售票資訊", "url": "https://e.usen.com/news/news-event/-2026-tour-ghost-1.html"}, {"en": "King Gnu's CEN+RAL Tour includes Taipei Arena, Hong Kong and Seoul; first-round lottery results on Nov 7", "zh": "**King Gnu「CEN+RAL Tour」亞洲場已公布含台北小巨蛋 6/6–6/7、香港 5/29–30、首爾 6/20–21**；**日本場第一波抽選結果 11/7（五）15:00 公布、付款至 11/11（二）23:00**。　▶ **Spotify**：https://open.spotify.com/search/King%20Gnu", "summary": "King Gnu's CEN+RAL Tour schedule runs a ten-city Japanese leg from Sendai in February through Niigata in May, then crosses into Asia: Bangkok (May 23), Hong Kong AsiaWorld-Arena (May 29–30), Taipei Arena (June 6–7), Shanghai (June 13–14) and Seoul KSPO DOME (June 20–21). Start times and Asian ticketing schedules are still listed as to-be-announced. The dated item is the Japanese CLUB GNU first pre-sale: results and payment run from 15:00 on November 7 to 23:00 on November 11. ⚠️ The official page is labelled \"Tour 2026\" but the dated legs fall in the following calendar year — treat the year as unconfirmed.", "source": "Sony Music／King Gnu 官方公告", "url": "https://www.sonymusic.co.jp/artist/kinggnu/info/577778"}, {"en": "King Gnu announce their first US tour for 2027", "zh": "**King Gnu 宣布 2027 年將舉辦首次美國巡演**，是這份清單裡第一組正式進軍北美場館的日本樂團。　▶ **Spotify**：https://open.spotify.com/search/King%20Gnu", "summary": "Music Natalie reports that King Gnu will hold their first United States tour in 2027. For a band that has spent the last three years scaling from Japanese halls to arenas and then into pan-Asian venues, a North American leg is the predictable next step but still a meaningful one: Japanese rock acts rarely tour the US at arena scale without an anime-franchise tie-in carrying the ticket demand. Cities, venues and dates were not detailed in the announcement, and no ticketing schedule has been published.", "source": "音楽ナタリー（10 月下旬）", "url": "https://natalie.mu/music/news/696068"}, {"en": "Mrs. GREEN APPLE, Official HIGE DANdism and a Vaundy × yama split headline the new-release week", "zh": "**Mrs. GREEN APPLE、Official髭男dism 與 Vaundy × yama 的 split 單曲同週上架**，另有 Ado 的動畫《デモンズ・クレスト》OP 新曲「シンカ」確定配信。　▶ **Spotify**：https://open.spotify.com/search/Mrs.%20GREEN%20APPLE", "summary": "SPICE's New Music Wednesday roundup puts three names from your list in the same release week: Mrs. GREEN APPLE, Official HIGE DANdism and a split single pairing Vaundy with yama — the split format is unusual for artists at this level and worth hearing for that reason alone. Separately, Ado has confirmed digital release of \"Shinka\", the opening theme for the anime Demons Crest. No Taiwan, Hong Kong or Japan live dates are attached to any of these releases; they are catalogue items rather than tour news.", "source": "SPICE／CDJournal", "url": "https://spice.eplus.jp/articles/345484"}]}]}, "market": {"indices": [{"market": "TW", "name": "加權指數 TAIEX", "value": "45,211.83", "change": -2.49, "changePts": "-1,156.50", "comment": "失守 4.6 萬點，10 月累計跌逾 2,700 點"}, {"market": "TW", "name": "櫃買指數 OTC", "value": "370.26", "change": -4.42, "comment": "跌幅約加權兩倍，中小型股受傷較重"}, {"market": "TW", "name": "0050 元大台灣50", "value": "104.95", "change": -2.14, "comment": "外資單日賣超逾 9.7 萬張，全市場第一"}, {"market": "TW", "name": "0056 元大高股息", "value": "—", "change": -1.5, "comment": "精確收盤未取得，漲跌為示意"}, {"market": "US", "name": "那斯達克 Nasdaq Composite", "value": "25,437.00", "change": -2.86, "changePts": "-747.73", "comment": "主要指數中跌最深"}, {"market": "US", "name": "S&P 500", "value": "7,580.07", "change": -1.82, "changePts": "-140.32", "comment": "6 月以來最糟的一天"}, {"market": "US", "name": "道瓊工業指數 Dow Jones", "value": "51,770.31", "change": -1.09, "changePts": "-572.25", "comment": "權重偏傳產能源，受 AI 疑慮衝擊較輕"}, {"market": <body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>

<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;

  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");

function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();

}

"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";

if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});

[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){

/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
