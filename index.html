ia defends its under-16 social media ban in the High Court","zh":"**澳洲政府在高等法院為「16 歲以下禁用社群媒體」辯護**，主張這是保護發育中大腦的必要手段。","summary":"Australian government lawyers told the High Court that the country's ban on social media for children under 16 is necessary to protect developing brains. The government is defending two constitutional challenges, brought by Reddit and the Sydney-based Digital Freedom Project, to a law that took effect last year. Counsel listed addictive use, disrupted sleep, depression, anxiety, suicidal ideation, worsened disordered eating and more intense ADHD symptoms among the harms cited. The case is being watched closely by other governments weighing similar age limits.","source":"Morning Star World in Brief（11/4）","url":"https://morningstaronline.co.uk/article/world-brief-november-4-2026"},{"en":"Indonesia deployed over 20,000 troops in Jakarta over an alleged wiretapping plot","zh":"**印尼在雅加達部署超過 2 萬名軍警**，調查針對總統普拉伯沃的非法監聽案，總統府稱近乎叛國。","summary":"More than 20,000 troops and personnel were deployed across Jakarta on November 4 while Indonesian authorities investigate an alleged illegal wiretapping operation targeting President Prabowo Subianto. The presidential palace said the alleged operation could be regarded as leading toward treason. General Listyo Sigit Prabowo, appointed presidential chief of staff only last month, is among those implicated and was dismissed the same day. The scale of the deployment in a capital with no reported unrest drew comment from analysts about the government's reading of the threat.","source":"Morning Star World in Brief（11/4）","url":"https://morningstaronline.co.uk/article/world-brief-november-4-2026"},{"en":"North Korea fired multiple missiles after ruling out renewed talks with Washington","zh":"**北韓向東部海域試射多枚飛彈**，發生在其表態無意恢復對美外交的數小時後。","summary":"North Korea launched multiple missiles toward its eastern waters on November 4, hours after saying it saw no need to resume diplomacy with the United States. Pyongyang framed the launches as a protest against accusations that North Korean hackers were behind a recent cryptocurrency theft at Binance. South Korea's joint chiefs of staff confirmed they had detected the launches and said the South stands ready to repel any provocation. The timing, immediately after the US midterms, was read as a test of how the new Congress affects Washington's posture.","source":"Morning Star World in Brief（11/4）","url":"https://morningstaronline.co.uk/article/world-brief-november-4-2026"}]},{"label":"科技","items":[{"en":"Anthropic released FlashProve, a cryptographic way to verify which model answered","zh":"**Anthropic 發表 FlashProve**，用密碼學證明回應確實來自指定模型，且不需公開模型權重。","summary":"Anthropic published research and working code for FlashProve, a system for checking whether an AI response actually came from the model a provider claims to have used. The method relies on cryptographic proofs, so verification does not expose private model weights, which means closed-weight providers could adopt it. The stated aims are to stop a provider quietly substituting a cheaper model, to make benchmark claims auditable, and to resist impostors even when the impostor is the lab itself. Anthropic calls the work experimental and has announced no production deployment.","source":"The Neuron AI Digest（11/4）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-4-2026/"},{"en":"Apple warned investors that autonomous AI agents could exceed their permissions","zh":"**蘋果在年報中警告 AI 代理風險**，指出自主代理可能超出授權、造成難以回復的未授權交易。","summary":"Apple warned investors in its annual filing that autonomous AI agents could exceed their granted permissions or behave unpredictably, raising the possibility of unauthorised transactions and effects that are hard to reverse. The warning is notable because it landed the same week Apple expanded Siri AI's ability to take actions across third-party applications and opened Siri AI to developers in a preview build. Risk disclosures of this kind are becoming a standard place to look for what large platforms actually believe about agent reliability, as opposed to what their marketing says.","source":"The Neuron AI Digest（11/4）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-4-2026/"},{"en":"OpenAI built Pando, a Git-compatible backend, and says ChatGPT has 1.2bn weekly users","zh":"**OpenAI 自建 Git 相容後端 Pando**，推送延遲中位數降近 80%；同時宣稱 ChatGPT 週活 12 億人。","summary":"OpenAI said it built Pando, a Git-compatible backend designed for the volume of code produced by its engineers and coding agents. Pando now powers the company's main repository, cut median code-push latency by nearly 80 percent, and serves close to a petabyte of repository data a day. Separately OpenAI reported 1.2 billion weekly ChatGPT users, estimated its search-like query volume at roughly 20 percent of Google's, and said it plans to merge its Chat and Work products into a single experience. The search figure is OpenAI's own estimate, not an independent audit.","source":"The Neuron AI Digest（11/4）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-4-2026/"}]},{"label":"運動","items":[{"en":"Fenerbahce beat Liverpool 3-2 for Liverpool's first Champions League defeat this season","zh":"**費內巴切 3–2 擊敗利物浦**，利物浦本季歐冠首敗，兩度領先仍被逆轉。","summary":"Fenerbahce beat Liverpool 3-2 in Istanbul on November 4, handing Liverpool their first defeat of this season's Champions League league phase. Liverpool led twice through Trey Nyoni and Alexander Isak but conceded to Mason Greenwood, Archie Brown and Vedat Muriqi. Manager Andoni Iraola summed the night up as cheap, messy goals, and the defensive pattern repeated what has troubled Liverpool in away games this autumn. The result leaves the league-phase table tighter at the top and puts more weight on Liverpool's remaining fixtures.","source":"Football360／KSAT（11/4）","url":"https://football360.com.au/champions-league-results-matchday-4-liverpool-real-madrid/"},{"en":"Valverde's stoppage-time winner kept Real Madrid perfect, 3-2 at AEK Athens","zh":"**皇馬 3–2 客勝 AEK 雅典**，瓦爾韋德補時進球，歐冠聯賽階段四戰全勝。","summary":"Real Madrid came from behind twice in Athens to beat AEK 3-2, with Jude Bellingham and Kylian Mbappe scoring before Federico Valverde struck in stoppage time. Madrid remain unbeaten in the league phase with four wins from four. Elsewhere Manchester City ended a losing run by winning 3-2 at RB Leipzig, Erling Haaland scoring the 78th-minute winner, and Arsenal won 1-2 at Slavia Prague through Noni Madueke and Viktor Gyokeres to stay unbeaten in third place on ten points.","source":"Yahoo Sports／Football360（11/4）","url":"https://sports.yahoo.com/soccer/live/champions-league-scores-live-updates-scores-highlights-leipzig-vs-manchester-city-real-madrid-arsenal-190000043.html"},{"en":"Como won 9-1 at Lens in the highest-scoring Champions League away win of the season","zh":"**科莫 9–1 血洗朗斯**，杜維卡斯帽子戲法、七名不同球員進球，本季歐冠最大比分客場勝。","summary":"Como won 9-1 at Lens on November 4, with Anastasios Douvikas scoring a hat-trick and seven different players finding the net, the heaviest away win of this Champions League season. Ruben Aguilar scored the Lens consolation. On the same night Porto took their first points of the campaign by beating Napoli 4-1, with Napoli defender Rafa Marin sent off, Borussia Dortmund beat Real Betis 2-1 to inflict Betis's first league-phase loss, Club Brugge won 2-1 at PSV for a third straight win, and Viking beat Sabah 4-1.","source":"Football360（11/4）","url":"https://football360.com.au/champions-league-results-matchday-4-liverpool-real-madrid/"}]},{"label":"教育心理","items":[{"en":"Australia's court case put adolescent brain development at the centre of platform regulation","zh":"**澳洲高等法院審理 16 歲以下社群禁令**，政府列出成癮、睡眠、憂鬱、焦慮等一整串發展風險。","summary":"The Australian government's High Court defence of its under-16 social media ban set out an unusually explicit list of developmental harms: addictive patterns of use, disrupted sleep, depression, anxiety, suicidal ideation, worsened disordered eating and more intense ADHD symptoms. Reddit and the Digital Freedom Project are challenging the law on constitutional grounds. Researchers have noted that the evidence for each individual harm varies in strength, and that the case will effectively test how much certainty a government needs before restricting a medium for minors.","source":"Morning Star World in Brief（11/4）","url":"https://morningstaronline.co.uk/article/world-brief-november-4-2026"},{"en":"Google's new education settings force schools to choose between AI tools and Search","zh":"**Google 新教育設定讓學校二選一**：關掉 AI 工具就連 Google 搜尋也一併失去學生帳號權限。","summary":"Under new education settings, schools that disable Google's AI tools for student accounts also lose access to Google Search for those accounts. Google says AI is now integrated into Search and cannot be separated, and is adding Guided Learning features intended to walk students through reasoning rather than hand them answers. Schools that want conventional search therefore have to accept an AI-enabled experience. Administrators have objected that the choice removes a basic research tool from classrooms that are not yet ready to supervise AI use.","source":"The Neuron AI Digest（11/4）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-4-2026/"},{"en":"New work examines how climate anxiety affects college students' functioning","zh":"**研究檢視氣候焦慮對大學生的影響**，發現焦慮本身不必然致病，關鍵是有沒有行動管道。","summary":"Researchers looking at climate anxiety among college students report that distress about climate change is now common on campuses but does not map neatly onto impairment. Students who channel the concern into coursework, research or local action tend to function normally, while those who feel they have no avenue for action report more avoidance and difficulty concentrating. The authors argue counselling framings that treat climate anxiety purely as a symptom miss this, and that giving students something concrete to do is often the more effective intervention.","source":"Phys.org（11/2026）","url":"https://phys.org/news/2026-11-anxiety-climate-affects-college-students.html"}]},{"label":"產業動態（AI／半導體／量子）","items":[{"en":"Anthropic says it uses Claude to design its own AI accelerator chips","zh":"**Anthropic 表示已用 Claude 參與自家 AI 加速器晶片設計**，被視為直接挑戰 Nvidia、AMD 的成本結構。","summary":"Anthropic said it is using Claude in the design of its own AI accelerator hardware, part of an argument that model capability compounds into cost advantages further down the stack. Coverage framed it as a challenge to Nvidia and AMD, though Anthropic has not claimed a shipping product and custom silicon takes years to reach volume. The company separately added instructions to Claude Code for Opus 5.5 that block cloning specific existing video games after a wave of AI recreations, a restriction some developers say also catches legitimate work.","source":"Emergent／CryptoBriefing（11/4）","url":"https://emergent.sh/news/anthropic-uses-claude-design-own-ai-chips"},{"en":"The semiconductor index fell 3.13% while the rest of the market rallied hard","zh":"**費半昨夜逆勢跌 3.13% 收 10,268 點**，那斯達克 100 卻漲 0.91%，資金明顯從晶片股撤出。","summary":"The Philadelphia Semiconductor Index fell 3.13 percent to about 10,268 on November 4 even as the Dow rose more than three percent and the Nasdaq 100 gained 0.91 percent. The equal-weighted Nasdaq 100 rose 1.23 percent, which means the breadth was in the broad market rather than in large-cap technology. The divergence suggests money rotating out of the AI hardware trade and into sectors expected to benefit from a divided Congress, and it sets up a difficult open for Taiwanese chip and memory names that follow the index closely.","source":"TS2／KuCoin News（11/4）","url":"https://ts2.tech/en/nasdaq-100-rises-as-chip-index-falls-3-13/"},{"en":"Drax proposed a 20 billion pound data centre campus in North Yorkshire","zh":"**英國 Drax 提出 200 億英鎊資料中心開發案**，與 Brookfield、Radiant 合作，規模最終可能超過 1GW。","summary":"Drax proposed a twenty billion pound data centre development in North Yorkshire with partners Brookfield and Radiant, a site that could eventually exceed one gigawatt of computing capacity. Construction depends on planning permission, regulatory approvals and customer commitments, none of which are secured. The announcement fits a pattern of power-adjacent companies positioning land and grid connections as the scarce input in AI infrastructure, and it is the kind of project that shapes multi-year demand for the power, cooling and networking suppliers on the Taiwan supply chain.","source":"The Neuron AI Digest（11/4）","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-4-2026/"}]},{"label":"追星（僅限清單內歌手）","items":[{"en":"Kenshi Yonezu's 2026 TOUR / GHOST opens tomorrow in Nagano, Taipei Dome in December","zh":"**米津玄師「2026 TOUR / GHOST」明天 11/6（五）長野開跑**，日本 6 城 14 場到 12/17；**台北大巨蛋 12/26–27**。　▶ **Spotify**：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB","summary":"Kenshi Yonezu's arena tour 2026 TOUR / GHOST opens on Friday November 6 at Nagano Big Hat, running 14 shows across six Japanese cities until December 17: Nagano, Yokohama's K-Arena, Osaka-jo Hall, Marine Messe Fukuoka, Sekisui Heim Super Arena in Miyagi and Nagoya. The world leg brings him to Taipei Dome on December 26 and 27. Tour merchandise released this week reissues the Nekochan, Tongarikun and Teethkun character goods, and a new single carries the fastest-priority ticket serial number for later dates.","source":"ライブドアニュース／音楽ナタリー","url":"https://natalie.mu/music/news/696163"},{"en":"tuki. finished her first overseas show at Taipei Arena, with Hong Kong next","zh":"**tuki. 首次海外公演在台北小巨蛋完成**，唱了 20 首、安可〈純恋愛のインゴット〉；接著是香港場。　▶ **Spotify**：https://open.spotify.com/search/tuki.","summary":"tuki. played her first overseas concert at Taipei Arena as part of the 1st ASIA TOUR 2026, performing twenty songs including Ichirinka, Jigoku Renbun, Kodoku no Kujira, Bansan Uta and Gilty, with Junrenai no Ingot as the encore. Her backing band was Sumito Kansa on keys, Yuki Nara on guitar, Riku Sakurai on bass and Ryo Kanda on drums. The Hong Kong date follows on the same tour. For a singer who built an audience almost entirely online, the Taipei show was her first test of that audience in a physical arena.","source":"tuki. 官方／unipa 現場報導","url":"https://tuki-official.net/contents/1006330"},{"en":"An Ado and Vaundy collaboration became the new Mezamashi TV opening theme","zh":"**Ado × Vaundy 合作新曲成《めざましテレビ》開場曲**，兩人定位是替努力的普通人加油的應援歌。　▶ **Spotify**：https://open.spotify.com/search/Ado%20Vaundy","summary":"A collaboration between Ado and Vaundy was chosen as the opening theme for Fuji TV's long-running morning programme Mezamashi TV, described by both artists as a song meant to push along people grinding through ordinary days. Vaundy wrote and produced the track and Ado sings it, continuing a run of high-profile tie-ups for both. The placement guarantees daily national exposure in Japan, which in recent years has been a reliable route onto the domestic streaming charts for songs that are not anime or drama themes.","source":"ファッションプレス","url":"https://www.fashion-press.net/news/101237"}]}]},"market":{"insights":["**台股昨天收 42,948（−358 點、−0.83%）**，盤中崩 1,451 點後尾盤狂拉，留 1,093 點長下影線","**成交爆 1.11 兆、震幅 1,885 點**，外資連 5 賣提款約 1,499 億，投信連 17 買","**殺盤主角還是記憶體**：華邦電法說後盤中一度 −9%、南亞科 −7.4%、旺宏 −6.7%（收盤未確認）","**美股昨夜大漲但費半 −3.13%**，資金從晶片轉向受惠分立政府的傳產與金融","**今天看 43,000 能不能站回**，長下影線只是止跌訊號，站不上 44,000 都算反彈"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"42,948.91","change":-0.83,"changePts":"-358.63","comment":"留 1,093 點長下影線"},{"market":"TW","name":"櫃買指數 OTC","value":"343.50","change":-0.58,"changePts":"-2.02","comment":"盤中一度殺 3.7% 後拉回"},{"market":"TW","name":"0050 元大台灣50","value":"—","change":-2.6,"comment":"失守百元，成交逾 20 萬張"},{"market":"TW","name":"0056 元大高股息","value":"—","change":null,"comment":"11/4 精確收盤未取得"},{"market":"US","name":"那斯達克 Nasdaq Composite","value":"25,736.51","change":1.44,"changePts":"+364.50","comment":"選後反彈但晶片拖累"},{"market":"US","name":"S&P 500","value":"7,688.62","change":1.58,"changePts":"+119.70","comment":"幾乎全類股上漲"},{"market":"US","name":"道瓊工業指數 Dow Jones","value":"53,356.12","change":3.03,"changePts":"+1,569.40","comment":"44 年來期中選後最強"},{"market":"US","name":"羅素 2000 Russell 2000","value":"2,856.96","change":1.58,"changePts":"+44.51","comment":"中小型股同步走強"},{"market":"US","name":"費半／半導體指數 SOX","value":"10,268.65","change":-3.13,"comment":"全場唯一大跌，台股最大變數"},{"market":"US","name":"QQQ（那斯達克100 ETF）","value":"—","change":null,"comment":"那斯達克100 +0.91%，QQQ 收盤未取得"}],"quotes":{"2330":-1.53,"2308":-3.94,"2317":-2.24,"2454":1.09,"3711":1.79,"2383":3.64,"0050":-2.6},"prices":{"2330":2260,"2308":1220,"2317":240,"2454":3715,"3711":627},"movers":[]}},"archive":{"dates":["2026-11-05","2026-11-04","2026-11-03","2026-11-02","2026-11-01","2026-10-31","2026-10-30","2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20","2026-10-19","2026-10-18","2026-10-17","2026-10-16","2026-10-15","2026-10-13","2026-10-12","2026-10-11","2026-10-10","2026-10-08","2026-10-07","2026-10-06"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}

body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}

.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}

.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}

.task-tmr:hover{border-color:var(--accent);color:var(--accent)}.task-tmr.sent{border-color:var(--green);color:var(--green)}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
var from=it.from||String(it.tag||"").split("·").filter(function(x){return !/優先|開考|剩|發布|48h/.test(x);}).join("·").replace(/^[🔴🟠🟡🟢✅\s]+/,"").trim();
var subj=it.subject||String(it.title||"").replace(/\*\*/g,"").split(/[。（(]/)[0].slice(0,60);
var todo=it.todo||String(it.kind||"").replace(/\*\*/g,"").split(/[：:]/).slice(-1)[0].split(/[；;]/)[0].slice(0,60);
var more=(it.subject?mdb(it.title||""):"")+(it.subject&&it.title?"<br>":"")+(it.todo&&it.kind?mdb(it.kind)+"<br>":"")+(it.detail?mdb(it.detail):"");
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div>"+(from?"<div class='sender'>"+esc(from)+"</div>":"")+
"<div class='subject'>"+mdb(subj)+"</div>"+
(todo?"<div class='action'>👉 "+mdb(todo)+(it.deadline&&it.deadline!=="—"?"（"+esc(it.deadline)+"）":"")+"</div>":"")+"</div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+more+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(!(m.items||[]).length)html+="<div class='empty-tasks'>📭 過去 24 小時沒有需要處理的信</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+mdb(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var c=x.change,cls=c==null?"":(c>=0?"up":"down"),arrow=c==null?"":(c>=0?" ▲":" ▼");
var pts=x.changePts!=null?((x.changePts>=0?"+":"")+x.changePts+" "):"";
var cm=x.comment!=null?x.comment:(x.note?splitStars(String(x.note).replace(/✅[^。]*。?|⚠️[^。]*。?/g,""))[0]||"":"");
if(x.comment==null&&cm.length>40)cm=cm.replace(/\*\*/g,"").split("。")[0].slice(0,40);
var noVal=!x.value||x.value==="—";
return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+(noVal&&c!=null?fmtChg(c):esc(x.value))+arrow+"</div>"+
(c!=null&&!noVal?"<div class='chg "+cls+"'>"+esc(pts)+"("+fmtChg(c)+")</div>":"")+(cm?"<div class='cm'>"+mdb(cm)+"</div>":"")+"</div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(/未取得|沿用/.test(r.price||"")?"—":r.price)+"</td><td class='reason'>"+mdb(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2></div><div class='card-body'>"+
(function(){var ins=(mk.insights&&mk.insights.length)?mk.insights:splitStars(mk.highlight).concat(splitStars(mk.note)).slice(0,5);
return ins.length?"<div class='insights'><h3>📊 市場解讀</h3>"+bullets(ins)+"</div>":"";})()+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+

"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"</div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=qChg(code,mkt),price=qPrice(code,s[4]||100),ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=qChg(code,mk[0]);
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:qPrice(code,s[4]||100),ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
