8 之後完全靜止 11 小時。"}, "news": {"window": "過去 48h（**10/21 00:00 – 10/22 23:59 美國／日本當地時間**）· 來源：CNN（頭條／科技／運動／教育心理，共 14 則）、Anthropic Newsroom、PYMNTS、404K Research、アニメ!アニメ!、Universal Music Japan、日刊ゲンダイ、Entame Rush、PR TIMES。　★ **本期資料限制（請一併讀）**：①**BBC 本期 0 則** —— 本執行環境對 bbc.com 的抓取被封鎖、搜尋索引也取不到 BBC 連結，因此四類新聞**全部來自 CNN**；②CNN 文章內文 robots 禁止抓取，**標題與網址來自實際搜尋結果**，摘要中的數字與人名則透過 CNN 授權轉載站與同事件他媒體**逐條交叉查證**，非由標題推測；③「教育心理」本期偏心理學與校園安全，10/21–22 的 CNN 沒有獨立的教育政策報導。", "groups": [{"label": "頭條", "items": [{"en": "Massive strikes hit Kyiv hours after Putin agrees to fresh peace talks", "zh": "**普丁才剛同意重啟美方調停的和談，俄軍隨即夜襲基輔，至少 4 死數十傷** —— 停火承諾與戰場現實的落差大到幾乎是公開嘲諷。", "summary": "Russia launched a heavy missile and drone assault on Kyiv overnight into Thursday, October 22, just hours after President Vladimir Putin told US envoy Steve Witkoff in St Petersburg that Moscow was willing \"in principle\" to resume American-mediated talks with Ukraine. Ukraine's emergency service said at least four people were killed and dozens injured, including four children, while Mayor Vitali Klitschko reported damage to metro infrastructure near the Pivdenny Bridge. Russia also freed detained American teacher Stephen Hubbard as a goodwill gesture, and Witkoff praised Putin as a \"humanitarian.\" Ukrainian Foreign Minister Andrii Sybiha responded that \"appeasement, servility, and flattery will not stop this war.\"", "source": "CNN — World / Europe", "url": "https://www.cnn.com/2026/10/21/europe/us-envoy-witkoff-putin-talks-russia-ukraine-intl"}, {"en": "US orders departure of some embassy staff and families from Saudi Arabia amid Houthi threat", "zh": "**胡塞武裝連日襲擊沙烏地機場與油田致 4 死，美國下令駐利雅德使館非必要人員撤離** —— 中東油運風險再升一級。", "summary": "The State Department on Wednesday, October 21, ordered non-essential staff and family members to leave the US embassy in Riyadh, citing escalating Houthi attacks. Spokesperson Tommy Pigott said \"Iranian-supported Houthis have increasingly engaged in hostilities against Saudi Arabia,\" and a department official told CNN simply, \"This is about the Houthis.\" Saudi Arabia said it intercepted at least 16 drones over two days; one strike on the Shaybah oil field killed two expatriate workers, and an attack on King Fahd International Airport in Dammam killed two people and injured eight. Washington has boosted intelligence support but President Trump has declined to strike the Houthis directly.", "source": "CNN — Politics", "url": "https://www.cnn.com/2026/10/21/politics/us-orders-departure-embassy-staff-saudi-arabia"}, {"en": "For the first time, UN says breaching 1.5C warming limit is 'imminent and unavoidable'", "zh": "**聯合國首度認定 1.5°C 升溫紅線已無法避免跨越**，現行政策將使本世紀末升溫約 2.8°C —— 這是給 COP31 的開場壞消息。", "summary": "The UN Environment Programme's annual Emissions Gap Report, released October 21 ahead of COP31, concluded for the first time that overshooting the Paris Agreement's 1.5-degree-Celsius limit can no longer be avoided. Current policies put the world on track for roughly 2.8C of warming by 2100, falling to about 2.6C if countries meet their new 2035 pledges. Staying near 1.7C would require cutting emissions 18% below 2025 levels by 2030, 45% by 2035 and 69% by 2040. UNEP chief Inger Andersen said the world \"must pull out all the stops,\" while the US State Department said it does not endorse the findings.", "source": "CNN — Climate", "url": "https://www.cnn.com/2026/10/21/climate/cop31-un-climate-report-emissions-gap"}, {"en": "Trump's approval rating hits a new low as midterms enter final stretch: CNN poll", "zh": "**川普支持度跌至 32% 任內新低**，國會選舉意向民主黨以 49% 對 39% 領先 —— 距期中選舉只剩約兩週。", "summary": "A CNN/SSRS poll conducted October 15-18 and released October 21 put President Donald Trump's job approval at 32%, the lowest of his second term and a record low in CNN's polling, down from 33% in mid-September. Among registered voters, 49% said they would back the Democratic candidate in their congressional district versus 39% for the Republican, a ten-point gap with roughly two weeks until the midterm elections. The survey of 1,701 adults carried a margin of error of about 4.1 percentage points. Separate Reuters/Ipsos and New York Times/Siena polls released the same week showed Trump at 31% and 36%.", "source": "CNN — Politics", "url": "https://www.cnn.com/2026/10/21/politics/cnn-poll-trump-democrats-republicans-midterms"}, {"en": "Ebola has spread from Congo to 4 other countries. A look at where things stand", "zh": "**剛果 Bundibugyo 型伊波拉疫情已逾 9,000 例、4,000 死並外溢至 4 國**，而這個病毒型別**沒有任何核可疫苗**。", "summary": "The Bundibugyo Ebola epidemic centred on the Democratic Republic of Congo has now reached four other countries, with the DRC reporting more than 9,000 cases and over 4,000 deaths since May, making it the second-largest Ebola outbreak on record. Nigeria confirmed its first case in Abuja in a woman who travelled from Uganda, developed symptoms October 7 and was hospitalised October 11; Health Minister Muhammad Pate said 44 contacts were being traced. Kenya confirmed a ninth case, a 24-year-old relative of its first patient, who died in Nairobi on October 5. No licensed vaccine exists for the Bundibugyo strain.", "source": "CNN — Health", "url": "https://www.cnn.com/2026/10/21/health/ebola-kenya-congo-nigeria-uganda-france"}]}, {"label": "科技", "items": [{"en": "Websites shut down globally after AI finds cybersecurity flaw affecting 70% of the internet", "zh": "**AI 協助挖出 PHP 兩個重大漏洞「PHP2Shell」，影響全球約七成網站** —— 日本 ANA、JR 西日本、維基媒體與多國政府網站緊急下線修補。", "summary": "Governments and companies worldwide pulled websites offline on October 21-22 after researchers disclosed PHP2Shell, two critical flaws (CVE-2026-109618 and CVE-2026-109619, rated up to CVSS 9.2) in PHP, the language powering roughly 70% of websites. Wiz Research found the bugs in late August using Google's Gemini 4 Argon, Wiz Atlas and OpenAI's GPT-5.6 Sol, demonstrating unauthenticated remote code execution against WordPress, Drupal and Joomla. Japan's ANA, JR West and MUFG, Ireland's The Journal, the Wikimedia Foundation and government sites in France, Denmark, Finland and the Netherlands suspended services. The NSA and Europe's cybersecurity agency urged immediate patching.", "source": "CNN — Business / Tech", "url": "https://www.cnn.com/2026/10/21/tech/php2shell-vulnerability-ai-intl"}, {"en": "Meta ordered to pay $25 billion in New Mexico case over Cambridge Analytica scandal", "zh": "**法官裁定 Meta 須賠新墨西哥州 250 億美元**，創該公司史上最高罰款 —— 這也是 Meta 10/22 股價重挫 6.98% 的背景之一。", "summary": "Judge Francis Mathew ordered Meta on October 21 to pay New Mexico $25 billion, the largest penalty in the company's history, over deception tied to the Cambridge Analytica scandal. A jury in September found Meta liable for more than 43 million violations of state consumer protection law across 34 allegedly misleading statements about privacy and content moderation. New Mexico had sought $35-40 billion; Meta argued for no more than $3.4 billion and called $40 billion \"shocking to the conscience.\" Attorney General Raul Torrez said proceeds will go to a state education fund. Meta plans to appeal, with interest accruing meanwhile.", "source": "CNN — Business / Tech", "url": "https://www.cnn.com/2026/10/21/tech/meta-25-billion-new-mexico-judgment"}, {"en": "Taking back the algorithm: Social media platforms are restoring users' control of their feeds", "zh": "**Instagram、TikTok、YouTube 陸續開放自選主題與關鍵字過濾**，讓使用者重新掌控演算法推薦的配方。", "summary": "Major platforms are handing feed control back to users after years of opaque recommendation engines. Instagram's \"your algorithm\" tool, which shows inferred interests and lets people add topics to see or avoid, launched on Reels and has now expanded across Instagram and to Facebook. TikTok introduced \"manage topics\" and \"smart keyword filtering\" in June 2026, and YouTube announced \"custom feeds\" at its Made on YouTube event in September. Instagram product vice-president Tessa Lyons said the aim is restoring a sense of control while preserving discovery. Notre Dame professor Tim Weninger cautioned that users often still engage with content that upsets them.", "source": "CNN — Business / Tech", "url": "https://edition.cnn.com/2026/10/22/tech/social-media-user-algorithm-control"}]}, {"label": "運動", "items": [{"en": "Atlanta's dream of a WNBA title might be coming soon. A guardian Angel leads the way", "zh": "**亞特蘭大夢想隊 97:71 痛擊金州女武神，Angel Reese 21 分 12 籃板**，WNBA 總冠軍賽取得 2 勝 1 敗領先。", "summary": "The Atlanta Dream thrashed the Golden State Valkyries 97-71 in Game 3 of the WNBA Finals on October 21, taking a 2-1 series lead before a sold-out crowd of more than 17,000 at State Farm Arena. Angel Reese led all scorers with 21 points and 12 rebounds, days after becoming the youngest player in WNBA history to post at least 30 points and 15 rebounds in a postseason game. Rhyne Howard became the first player in Finals history with five or more steals in consecutive games, and Naz Hillmon shot strongly. Game 4 is a Saturday afternoon fixture in Atlanta.", "source": "CNN — Sport", "url": "https://www.cnn.com/2026/10/21/sport/atlanta-dream-wnba-finals-game-3"}, {"en": "The Rams are in serious trouble, a showdown in Seattle and a trip to Paris: Here's what to watch in the NFL's Week 7", "zh": "**公羊 2 勝 4 敗陷入危機、5 勝 0 敗酋長週日夜間作客衛冕軍海鷹**，鋼人對聖徒將在巴黎打 NFL 史上首場例行賽。", "summary": "CNN's Andy Scholes previewed NFL Week 7 on October 22, noting the Los Angeles Rams have slumped to 2-4 after losing to Arizona, with their Super Bowl odds drifting from +500 to +1200 while the 49ers sit 6-0 atop the NFC West. The undefeated 5-0 Kansas City Chiefs face their stiffest test at the defending champion Seattle Seahawks on Sunday Night Football, and the 2-4 Cowboys visit the Eagles on Monday night without Jalen Hurts, sidelined for the season by blood clots. The Pittsburgh Steelers meet the New Orleans Saints in the first regular-season NFL game ever staged in Paris.", "source": "CNN — Sport", "url": "https://www.cnn.com/2026/10/22/sport/what-to-watch-nfl-week-7"}, {"en": "Meet Adri Mehmeti, the 17-year-old future star of American soccer", "zh": "**17 歲防守中場 Mehmeti 已是紐約紅牛主力**，9 月在美國國家隊完成初登場，被視為美國足球最受期待的新生代核心。", "summary": "CNN's Ben Church profiled Adri Mehmeti, a 17-year-old defensive midfielder who has become a regular starter for the New York Red Bulls. He joined the club's academy in 2019 at around age 10, debuted for the first team at 16 in February and scored his first MLS goal in April. In September he made his senior United States debut under head coach Mauricio Pochettino, replacing Tyler Adams late in a 4-1 win over Peru. Born to Albanian parents and once a youth international for Albania, Mehmeti still lives at home and studies remotely. \"I didn't expect it to happen so fast,\" he said.", "source": "CNN — Sport", "url": "https://www.cnn.com/2026/10/22/sport/adri-mehmeti-us-soccer-phenom-profile"}]}, {"label": "教育心理", "items": [{"en": "What unhealthy social media habits reveal about your attachment style", "zh": "**PLOS One 研究調查 555 名美國成人：「恐懼型」依附者強迫性滑手機最嚴重、安全型最低**，依附焦慮是遠比迴避更強的預測因子。", "summary": "A study published in PLOS One and covered by CNN on October 21 found that compulsive social media use is highest among adults with a \"fearful\" attachment style, who crave closeness but fear depending on others. Psychology professor Chris Bjornsen of Longwood University in Virginia and colleague Allen Harbaugh surveyed 555 US adults aged 18 to 79 using a 76-question online questionnaire in 2023. Compulsive use was lowest among securely attached participants, with avoidant and anxious adults in between; attachment anxiety predicted compulsive use far more strongly than avoidance. Vulnerable narcissism was also linked to compulsive scrolling, while grandiose narcissism was not.", "source": "CNN — Health / Life, But Better", "url": "https://www.cnn.com/2026/10/21/health/social-media-attachment-style-friendships-wellness"}, {"en": "A botched scientific experiment returns as a Netflix reality TV show", "zh": "**Netflix 以 30 名受試者重啟史丹佛監獄實驗**，但學者指出 1971 年原始研究本就是齊巴多暗中指導的「表演而非科學」。", "summary": "CNN's Jacopo Prisco examined \"The New Stanford Prison Experiment,\" a six-part Netflix reality series filmed in a decommissioned wing of the Cherokee County Adult Detention Center, in which 30 screened participants, including three women, can quit using a safe word. Executive producer Jane Lipsitz said recreating Philip Zimbardo's 1971 study would be \"unconscionable.\" That original experiment assigned 24 male Stanford students as guards or prisoners and collapsed within a week. Critics including St Andrews psychologist Stephen Reicher and historian Thibault Le Texier argue Zimbardo coached the guards, calling the work \"more theater than science\" and its conclusions morally dangerous.", "source": "CNN — Science", "url": "https://www.cnn.com/2026/10/21/science/stanford-prison-experiment-netflix"}, {"en": "Teacher who survived Oregon school shooting says she had no chance to protect children", "zh": "**奧勒岡 Silver Rail 小學槍案倖存教師 Drury 首度發聲**，澄清自己來不及護住學童、只能裝死 —— 直指事發毫無反應時間。", "summary": "Becky Drury, a teacher wounded in the October 15 shooting at Silver Rail Elementary School in Bend, Oregon, issued a statement on October 21 disputing accounts that she had shielded a pupil. She said she ran toward the commotion, turned back to close her classroom door and found the gunman already there, who shot her at close range; unable to stand, she \"pretended to be dead\" hoping he would not fire again. The attack by a 16-year-old former student killed 25-year-old teacher Megan Lambert and three children, including five-year-old Rhoam Summer. Drury needed surgery on her left arm and right hand.", "source": "CNN — US", "url": "https://www.cnn.com/2026/10/21/us/teacher-survivor-oregon-shooting-statement"}]}, {"label": "產業動態（AI／半導體／量子）", "items": [{"en": "Anthropic donates the Agent Skills open standard to the Agentic AI Foundation", "zh": "**Anthropic 10/22 把 Agent Skills 開放標準連同商標、GitHub 組織與網域全數捐給 Linux 基金會旗下的 Agentic AI Foundation** —— 已有 70+ 平台接入、約 100 萬個 skills、近 2.8 億次安裝。", "summary": "On October 22, 2026, Anthropic handed its Agent Skills open standard to the Agentic AI Foundation, a Linux Foundation project it co-founded last year with OpenAI and Block. The donation covers the Agent Skills name and logo, the GitHub organization and the agentskills.io domain, giving the spec a vendor-neutral home alongside Model Context Protocol, which Anthropic donated earlier. Anthropic says more than 70 agent platforms now integrate Agent Skills, including ChatGPT, Cursor, GitHub Copilot and VS Code, with about 1 million skills published and nearly 280 million installs. Engineers from Anthropic, Google and OpenAI will maintain it as individuals, led by David Soria Parra and Mahesh Murag.", "source": "Anthropic Newsroom", "url": "https://www.anthropic.com/news/donating-agent-skills-to-the-agentic-ai-foundation"}, {"en": "OpenAI expands ChatGPT Ads to 26 more countries, reaching 89 markets", "zh": "**ChatGPT 廣告再擴 26 國、共 89 個市場**，逾 10 萬家廣告主投放、年化廣告營收達 10 億美元規模 —— 廣告只出現在 Free 與 Go 方案。", "summary": "OpenAI said on October 21, 2026 that it is extending ChatGPT Ads into 26 additional countries, taking the programme to 89 markets. New territories span Latin America (Argentina, Chile, Colombia, Peru and others), Africa (Nigeria, South Africa), Europe (Serbia, Ukraine) and Asia (Cambodia, Bangladesh, Pakistan). More than 100,000 advertisers have now run campaigns on the platform. OpenAI said in September that ads were annualising at roughly $1 billion less than 200 days after launch, and Fortune reports the company is tracking toward $2.5 billion in booked ad revenue this year. Ads appear only on the Free and Go tiers; Plus, Pro and Enterprise remain ad-free.", "source": "PYMNTS", "url": "https://www.pymnts.com/news/artificial-intelligence/2026/openai-expands-chatgpt-ads-to-26-new-countries/"}, {"en": "Nvidia locks packaging and test capacity with billion-dollar prepayments as memory shortage drags on", "zh": "**NVIDIA 以預付款鎖定封測產能：預付京元電約 11 億美元、Amkor 再追加 13 億美元**；美光同時警告記憶體缺貨**至少再延兩年** —— 這條供應鏈警訊正是 10/22 美股晶片股崩跌的導火線。", "summary": "Supply-chain reporting dated October 22, 2026 detailed how Nvidia is pre-buying capacity to secure AI accelerator output. The company aims to lift total packaging-substrate capacity to 2.5 times current levels within three years and to double final-test capacity across 2026-2027. It has prepaid roughly $1.1 billion to Taiwan's King Yuan Electronics to fund a US test facility targeting volume production by April 2027, while Amkor's incremental $1.3 billion advanced-packaging agreement lifts its multi-year Nvidia commitments to $3.0 billion. Vera Rubin has entered full volume production. Micron separately warned memory shortages will persist at least two years and mapped an HBM roadmap running to HBM6 by 2030.", "source": "404K Research SEMI-AI Evening Brief", "url": "https://404kresearch.substack.com/p/404k-semi-ai-evening-brief-october-a15"}]}, {"label": "追星（僅限清單內歌手）", "items": [{"en": "米津玄師 新曲「春が灯り」が『劇場版 薬屋のひとりごと 亡妃の秘宝』主題歌に決定", "zh": "**米津玄師 10/22 宣布新曲〈春が灯り〉擔任《劇場版 藥屋少女的呢喃 亡妃的祕寶》主題曲**，電影 12/11 日本上映；單曲發行日**待確認**。", "summary": "Announced on October 22, 2026, Kenshi Yonezu has written a new song, 'Haru ga Tomori', as the theme for the animated feature The Apothecary Diaries: The Secret Treasure of the Late Consort, which opens in Japan on December 11, 2026. Yonezu wrote the track after meetings with original novelist Natsu Hyuuga and director Naohiro Naganuma, and says he drew on Japanese nursery rhymes such as 'Tulip' and 'Antagata Dokosa' for its warm, nostalgic melody. A new trailer released the same day features part of the song, and fresh artist photos were published alongside it. No standalone single release date has been confirmed yet.", "source": "アニメ!アニメ!（AnimeAnime.jp）· Spotify：https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB", "url": "https://animeanime.jp/article/2026/10/22/104094.html"}, {"en": "Ado 代々木第一体育館公演 会場限定購入特典・新カバーアルバム予約特典を発表", "zh": "**Ado 公布 10/24–25 代代木第一體育館場邊限定特典**：買 LIVE Blu-ray《よだか》送貼紙組，預購《歌ってみたアルバム その２》（12/23 發行）送鐵盒。", "summary": "Ado's official site published venue-exclusive purchase bonuses on October 22, 2026, ahead of her two Yoyogi First Gymnasium shows on October 24 and 25. Buying any edition of the live Blu-ray/DVD 'Yodaka', released October 21, earns a two-sticker set; eligible editions run 11,000 yen for limited versions bundled with a charm and 6,600 yen for standard ones. Pre-ordering her second covers album, 'Ado no Utattemita Album Sono 2' (out December 23, 5,500 yen limited / 3,300 yen standard), earns an 80x50x15mm can case. Orders are placed via QR code at the venue, with Tower Records Shibuya pickup or 950-yen home delivery.", "source": "Ado Official Site / Universal Music Japan · Spotify：https://open.spotify.com/artist/6mEQK9m2krja6X1cfsAjfl", "url": "https://www.universal-music.co.jp/ado/news/2026-10-22/"}, {"en": "YOASOBI dome tour still has tickets in Osaka, Nagoya and Fukuoka", "zh": "**YOASOBI 巨蛋巡演在大阪、名古屋、福岡仍有餘票**，統一票價 1 萬 4000 日圓被粉絲批為「座位轉蛋」；札幌 11/14–15 加場。**台北大巨蛋場為 2027/1/9–10（舊公告）**。", "summary": "Nikkan Gendai reported on October 21, 2026 that YOASOBI's dome tour still had tickets available in several cities as of October 20. Kyocera Dome Osaka on October 24-25 had sold out regular reserved seats but still offered balcony seats; Vantelin Dome Nagoya on November 8 and the Fukuoka dome date were still selling. Sapporo Dome shows on November 14-15 were announced on October 17, the same day vocalist ikura played her first street performance in about eight years in Sapporo. Fans criticised the flat 14,000-yen reserved-seat price as a 'seat gacha'; the December Tokyo Dome date reportedly sold out immediately.", "source": "日刊ゲンダイDIGITAL · Spotify：https://open.spotify.com/artist/64tJ2EAv1R6UaZqc4iOCyj", "url": "https://www.nikkan-gendai.com/articles/view/geino/394500"}, {"en": "Aimer launches official app and 'Aimer Official Market' online store", "zh": "**Aimer 官方 App 與官方電商 10/20 同步上線**，11/3 橫濱 BUNTAI 公演門票改以 App 電子票發行（指定席 9,500 日圓）。", "summary": "Reported on October 21, 2026, Aimer's official smartphone app went live on October 20 through Fanplus, free to download on the App Store and Google Play with some paid content. The app pushes news alerts and carries material from her fan club NIGHT OWLS, and an online store, Aimer Official Market, opened the same day with detailed product and styling photos. Tickets for 'Aimer Premium Concert 2026 Sing like a Stray Cat - hiss -' will be issued inside the app, covering both NIGHT OWLS presales. The concert is November 3, 2026 at Yokohama BUNTAI, doors 16:30, start 17:30, reserved seats 9,500 yen.", "source": "エンタメラッシュ（Entame Rush）· Spotify：https://open.spotify.com/artist/0bAsR2unSRpn6BQPEnNlZm", "url": "https://entamerush.jp/721080/"}, {"en": "Gusto x Ryoka Fujisawa (Mrs. GREEN APPLE) 'Chef RyoChan' menu launches with 18 collectible goods", "zh": "**Mrs. GREEN APPLE 鍵盤手藤澤涼架與日本家庭餐廳 Gusto 聯名**，10/22 起推 6 道自創料理、全 18 種隨機贈品與團曲店內 BGM，活動到 12/2。", "summary": "A release dated October 21, 2026 confirmed that Japanese family-restaurant chain Gusto began a collaboration with Mrs. GREEN APPLE keyboardist Ryoka Fujisawa on October 22, running through December 2 at stores nationwide. Billed as 'Chef RyoChan', Fujisawa devised six dishes priced from 1,099 to 1,649 yen, including a spicy chige hot-pot set and an apple pie. Limited goods are handed out at random while stocks last: mugs or spoon-and-fork sets from October 22, then plates, lunch cloths and rubber coaster charms from November 12, with 18 variants in total. Fujisawa also selected the in-store playlist of seven band tracks.", "source": "PR TIMES（すかいらーくホールディングス）· Spotify：https://open.spotify.com/artist/4QvgGvpgzgyUOo8Yp8LDm9", "url": "https://prtimes.jp/main/html/rd/p/000000720.000017486.html"}]}]}, "market": {"asOf": "台股＝**2026/10/22（四）13:30 收盤**；美股＝**2026/10/22（四）正規盤收盤**（台灣 10/23 清晨 04:00 結束）。　★ **今天（10/23，週五）台 .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}

.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}

.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}

.task-item:last-child{border-bottom:none}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>

<div class="ver" id="h-ver"></div>
</div>

<div>

</div>
</div>

<!-- 加入 Notion 行事曆 彈窗 -->

<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">

<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">

<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
/* ---------- render ---------- */
function render(){
document.getElementById("h-date").textContent=(DATA.dateLabel||DATA.date)+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
var w=DATA.weather||{};
document.getElementById("w-icon").textContent=w.icon||"🌤️";
document.getElementById("w-temp").textContent=(w.high!=null?w.high+"°C":"")+(w.low!=null?" / "+w.low+"°C":"");
document.getElementById("w-note").textContent=w.note||"";
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
if(sc.note){var _n=document.createElement("div");_n.className="empty-tasks";_n.style.marginTop="12px";_n.style.textAlign="left";_n.style.lineHeight="1.8";_n.textContent=sc.note;list.appendChild(_n);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2><span class='hint'>"+esc((DATA.mail&&DATA.mail.window)||"")+"</span></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div><div class='sender'>"+esc(it.tag)+"</div>"+
"<div class='subject'>"+esc(it.title)+"</div>"+
"<div class='action'>"+(it.deadline&&it.deadline!=="—"?"📌 "+esc(it.deadline)+" · ":"")+esc(it.kind||"")+"</div></div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+esc(it.detail||"")+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(m.footnote)html+="<div style='font-size:11px;color:#8b949e;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;line-height:1.6'>※ "+esc(m.footnote)+"</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2><span class='hint'>"+esc((DATA.news&&DATA.news.window)||"")+"</span></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+esc(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");

}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var cls=x.change==null?"":(x.change>=0?"up":"down");var arrow=x.change==null?"":(x.change>=0?" ▲":" ▼");return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+esc(x.value)+arrow+"</div><div class='k'>"+(x.change!=null?fmtChg(x.change)+(x.note?" · "+esc(x.note):""):esc(x.note||""))+"</div></div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(r.price)+"</td><td>"+esc(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2><span class='hint'>"+esc(mk.asOf||"")+"</span></div><div class='card-body'>"+
(mk.highlight?"<div class='hl-box'><div style='color:var(--green);font-weight:700;margin-bottom:4px'>🆕 觀察清單外・新熱門標的</div>"+esc(mk.highlight)+"</div>":"")+
(mk.note?"<div class='trade-date-note'>📅 "+esc(mk.note)+"</div>":"")+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+
"<p style='font-size:11.5px;color:var(--muted);margin:8px 0 18px'>每張卡是觀察清單的一個分類；點卡片切換同分類的下一支，右上角為前一交易日漲跌幅、卡上為 sparkline。</p>"+
"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"<p class='chart-note'>"+esc(mk.historyNote||"")+"</p></div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
(mk.disclaimer?"<p style='font-size:12px;color:var(--muted)'>"+esc(mk.disclaimer)+"</p>":"")+
"<p style='font-size:11.5px;color:var(--muted);margin-top:6px'>※ "+esc(SITE.watchlistNote||"")+"</p>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=Q[code],price=s[4]||100,ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=Q[code];
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:s[4]||100,ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
