10:00 小組長報名","calendar":{"title":"成大職涯教練計畫報名","date":"2026-11-09","cat":"實習","pri":"中"}}]},"news":{"groups":[{"label":"頭條","items":[{"en":"Poland says Krakow market square gunman who killed six may have held far-right views","zh":"**波蘭克拉科夫市集廣場槍擊案 6 死 16 傷**，內政部長指槍手可能受極右派思想影響。","summary":"Poland's interior minister Marcin Kierwinski said the gunman who opened fire in central Krakow may have been influenced by far-right ideology. Six people were killed and 16 injured in the attack on the city's market square, a figure that includes the suspect himself and two police officers hit while responding. Investigators are examining his online activity and any links to extremist networks, and prosecutors have not yet filed formal charges. It is one of the deadliest random attacks in Poland in recent years and has reopened debate about gun licensing and the policing of far-right groups across central Europe.","source":"Anadolu Agency 晨間彙整（11/8）","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-8-2026/4115649"},{"en":"Herzog to task Yashar leader Gadi Eisenkot with forming Israel's next government","zh":"**以色列總統赫佐格將授權 Yashar 黨主席艾森科特組閣**，期限 28 天、可再延 14 天，對納坦雅胡是明顯挫敗。","summary":"President Isaac Herzog will hand the mandate to form Israel's next government to Gadi Eisenkot, leader of the Yashar party, after consulting the parties elected to the new Knesset. Eisenkot gets 28 days to assemble a coalition, with a possible 14-day extension if talks stall. The move is a clear setback for Benjamin Netanyahu, who had hoped to stay on as prime minister, but Eisenkot still has to bridge wide gaps between centrist, right-wing and religious factions to reach a majority. If he fails, the mandate can pass to another candidate or push Israel toward fresh elections.","source":"Anadolu Agency 晨間彙整（11/8）","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-8-2026/4115649"},{"en":"US Central Command sets up Task Force Iron Gate as Iran warns of a devastating response","zh":"**美軍中央司令部成立「鐵門特遣隊」**，約 20 人駐坦帕，專門打斷伊朗武器陸運；伊朗警告若重啟戰爭將有「毀滅性回應」。","summary":"U.S. Central Command has created Task Force Iron Gate, a roughly 20-person unit based in Tampa, to disrupt Iran's land-based movement of weapons and sanctioned material and to monitor traffic across the Caspian Sea. The announcement came as Iran's top security official warned Washington would face a devastating response if it restarted the war, and as Secretary of State Marco Rubio said a diplomatic deal with Tehran may no longer be possible. Separately, U.S. forces disabled a commercial cargo vessel that allegedly tried to breach the naval blockade on Iran, and Britain reported a military-linked incident in the Gulf of Oman.","source":"Anadolu Agency 晨間彙整（11/8）","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-8-2026/4115649"},{"en":"Flooding and a landslide leave about 350,000 displaced Palestinians in Gaza without shelter","zh":"**加薩洪水與土石流讓約 35 萬流離失所者失去遮蔽**，中加薩一處帳篷區土石崩落，一名婦女與四名兒童死亡。","summary":"Gaza's health ministry says flooding and a landslide have left roughly 350,000 displaced Palestinians without usable shelter after heavy rain swept through tent encampments that have housed families for months. A landslide in central Gaza killed a woman and four children sheltering in tents. Aid agencies warn that winter rain is turning unpaved camps into mud, contaminating water supplies and raising the risk of respiratory and waterborne disease among children. The same storm system caused flash floods in Syria's Deir ez-Zor province, where a bridge collapsed, killing at least one person and cutting off residential neighbourhoods.","source":"Anadolu Agency 晨間彙整（11/8）","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-8-2026/4115649"},{"en":"Zelenskyy says Russia used North Korean missiles in overnight strikes that hit Kyiv","zh":"**澤倫斯基指俄軍夜間空襲使用北韓飛彈**，攻擊目標包含基輔，烏方再度向西方要求更多防空攔截彈。","summary":"President Volodymyr Zelenskyy said Russian forces used North Korean-supplied missiles in overnight air strikes on Ukraine, including attacks that targeted Kyiv. Ukrainian officials have repeatedly accused Pyongyang of supplying Moscow with ballistic missiles and artillery shells in exchange for food, fuel and technical help, and say debris recovered from impact sites carries North Korean markings. The strikes continued a pattern of long-range attacks on Ukrainian cities and energy infrastructure as winter approaches, and Kyiv renewed its appeals to Western partners for additional air-defence interceptors ahead of another expected campaign against the power grid.","source":"Anadolu Agency 晨間彙整（11/8）","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-8-2026/4115649"}]},{"label":"科技","items":[{"en":"Anthropic commits $3.4bn to 1.7GW of gas generators to power its own AI data centres","zh":"**Anthropic 砸 34 億美元買下 1.7GW 燃氣發電機組**，規模約等於 Caterpillar 發電事業整季營收的 99%。","summary":"The Financial Times reports Anthropic has committed about $3.4 billion to secure 1.7 gigawatts of gas-fired generating capacity for its AI data centres, including taking over generator orders that OnePWR Solutions had placed with Caterpillar two years earlier. The volume is equivalent to roughly 99% of Caterpillar's third-quarter power generation sales, an illustration of how fast frontier labs are moving to buy their own electricity rather than wait for grid connections. The deal lands alongside separate reporting that investors in Anthropic's planned listing are pressing its valuation below an earlier $1.5 trillion mark.","source":"FourWeekMBA AI Daily（11/8）／FT","url":"https://fourweekmba.com/ai-daily-roundup-8-nov-2026-anthropic-1-7gw-nvidia-board"},{"en":"Nvidia's board opens an independent probe after a reported foreign intelligence effort against Jensen Huang","zh":"**NVIDIA 董事會啟動獨立調查**，起因是公司通報黃仁勳遭外國情報鎖定；距 11/17 財報僅九天，五年期 CDS 一個月彈升 76%。","summary":"Nvidia's board has launched an independent investigation after the company reported that chief executive Jensen Huang was the target of a foreign intelligence operation. The review begins nine days before Nvidia reports quarterly results on November 17, and three House committee chairs have asked Huang for a closed-door briefing on November 18. CNBC reported that five-year credit default swaps on Nvidia debt rose about 76% over the past month to roughly 139 basis points, a sign credit markets are pricing more risk into the AI complex even as the shares bounced on Friday.","source":"FourWeekMBA AI Daily（11/8）／CNBC","url":"https://fourweekmba.com/ai-daily-roundup-8-nov-2026-anthropic-1-7gw-nvidia-board"},{"en":"OpenAI closes an $11 billion round at a $1.25 trillion valuation","zh":"**OpenAI 完成 110 億美元募資、估值 1.25 兆美元**；同期 Google 宣布在懷俄明州投 170 億美元建資料中心，SpaceX 也要在 Starbase 蓋燃氣電廠與超級電腦。","summary":"Bloomberg and Reuters report that OpenAI has closed an $11 billion funding round at a $1.25 trillion valuation, extending a run of record private raises across frontier AI. The round landed in the same week AI-linked equities had their worst stretch since April 2025, underlining the gap between private capital appetite and public-market nerves about capital expenditure. Separately, Google confirmed a $17 billion data centre project in Wyoming, and SpaceX outlined plans for a gas-fired power plant and supercomputer campus at Starbase, Texas, with roughly $24 billion of estimated initial investment.","source":"Tech Trends Morning Brief（11/7）／Bloomberg、Reuters","url":"https://techtrendsnewsupdate.substack.com/p/tech-trends-news-update-morning-brief-a1a"}]},{"label":"運動","items":[{"en":"Manchester United and Aston Villa share eight goals in a 4-4 Premier League thriller","zh":"**曼聯與阿斯頓維拉 4–4 互轟八球**，是本週英超最瘋狂的一場，曼聯後防問題再度被放大。","summary":"Manchester United and Aston Villa produced the Premier League weekend's wildest game, trading goals in a 4-4 draw. The scoreline extended a familiar pattern for United, who have scored freely at home this season but keep conceding in bunches, and it cost both sides ground in a congested table. Villa will feel they let a winnable away game slip after going toe to toe with their hosts, while United's manager again faced questions about the balance of a defence that has now shipped multiple goals in consecutive fixtures. Neither side can afford many more shared points at this stage.","source":"Sporting Life 比分表（11/8）","url":"https://www.sportinglife.com/football/fixtures-results/2026-11-08"},{"en":"Sunderland beat Chelsea 1-0 to continue a remarkable promoted-season run","zh":"**升班馬桑德蘭 1–0 擊敗切爾西**，延續本季對強隊的驚人戰績，切爾西客場進攻又卡住。","summary":"Sunderland beat Chelsea 1-0, another scalp in a season that has seen the promoted side punch far above expectations. The hosts defended in a compact block, limited Chelsea to low-value shots from distance and took their one clear chance, a formula that has already brought them points against several established top-half clubs. For Chelsea the defeat renews questions about a front line that has struggled to turn territory into goals away from home, and leaves their head coach under pressure heading into the next round of European fixtures.","source":"Sporting Life 比分表（11/8）","url":"https://www.sportinglife.com/football/fixtures-results/2026-11-08"},{"en":"Liverpool win 3-1 at Crystal Palace to steady their league campaign","zh":"**利物浦作客 3–1 擊敗水晶宮**，拿下關鍵三分、穩住聯賽排名。","summary":"Liverpool won 3-1 at Selhurst Park, recovering from a difficult spell to take three points against a Crystal Palace side that has been awkward for most visitors this season. The visitors controlled midfield possession after the opening exchanges and punished Palace on transitions, with their attacking rotation finally looking settled after weeks of changes. The result lifts Liverpool back into contention near the top of the table and eases pressure after a run of dropped points, while Palace remain stuck in the congested middle of the table despite a competitive home performance.","source":"Sporting Life 比分表（11/8）","url":"https://www.sportinglife.com/football/fixtures-results/2026-11-08"}]},{"label":"教育心理","items":[{"en":"Review of 78 studies ties psychological capital to better student wellbeing and lower burnout","zh":"**78 篇研究、24 國、71,119 名受試者的系統性回顧**：希望、效能、韌性、樂觀（PsyCap）與生活滿意度、學習投入正相關，與憂鬱、焦慮、壓力、倦怠負相關。","summary":"A systematic review in Education Sciences pooled 78 studies covering 71,119 participants across 24 countries to examine psychological capital, the combination of hope, self-efficacy, resilience and optimism, in higher education. Students scoring higher on these four resources reported greater life satisfaction, stronger academic engagement and lower levels of depression, anxiety, stress and burnout. The authors note psychological capital appears trainable rather than fixed, and that short structured interventions have produced measurable gains, but caution that most studies are cross-sectional and that longitudinal work is needed before universities build large programmes around it.","source":"Education Sciences／MDPI（11/6）","url":"https://mdpi.com/2227-7102/16/11/1893"},{"en":"Researchers examine how climate anxiety affects college students' focus and coping","zh":"**研究檢視氣候焦慮對大學生的影響**：會行動的擔憂與干擾睡眠課業的痛苦要分開看，資訊加上具體集體行動比逃避或狂刷新聞更有保護力。","summary":"Researchers looked at how anxiety about climate change shapes college students' emotional state and day-to-day functioning, including their ability to concentrate on coursework. The work distinguishes worry that motivates action from distress that interferes with sleep, study and social life, and finds the second pattern is more common among students who feel they have no meaningful way to respond. Coping strategies combining accurate information with concrete collective action appeared more protective than either avoidance or constant news consumption, a finding the authors say campus counselling services could use when designing support.","source":"Phys.org（2026/11）","url":"https://phys.org/news/2026-11-anxiety-climate-affects-college-students.html"},{"en":"Worldwide survey finds mental well-being still declining among people under 35","zh":"**全球調查顯示 35 歲以下心理健康持續下滑**，年輕世代在情緒、社交連結與人生目標感的分數都低於年長族群，且跨國一致。","summary":"A large multi-country survey reports that mental well-being continues to deteriorate among people under 35, with younger cohorts scoring lower than older groups on measures of mood, outlook, social connection and sense of purpose. The pattern holds across high- and middle-income countries, which the authors argue weakens explanations based on any single national policy or event. The researchers point instead to shared factors such as smartphone-mediated social life, delayed financial independence and weaker community ties, and warn the gap between generations has widened rather than closed since the pandemic.","source":"News-Medical（11/2）","url":"https://news-medical.net/news/20261102/Worldwide-survey-reveals-declining-mental-well-being-among-young-people.aspx"}]},{"label":"產業動態（AI／半導體／量子）","items":[{"en":"Micron ends the week at $690 while Intel sits 53% below its September level","zh":"**半導體內部分歧擴大**：美光 11/6 收 690 美元、較 2025 年底漲 141.76%；Intel 收 56.28 美元、較 9/30 跌 53.2%，約蒸發 3,400 億美元市值。","summary":"The gap inside the semiconductor complex widened into the weekend. Micron closed November 6 at $690.00, up about 141.76% from the end of 2025 on sustained demand for high-bandwidth memory used in AI accelerators. Intel finished at $56.28, down roughly 53.2% from its September 30 level, a slide that has erased an estimated $340 billion of market value as investors question the pace of its foundry turnaround. Both moves came in a week when AI-linked equities had their worst stretch since April 2025, and when Apollo's two pending AI chip financing deals reportedly totalled $75 billion.","source":"FourWeekMBA AI Daily（11/8）／Closing Print（11/6）","url":"https://fourweekmba.com/ai-daily-roundup-8-nov-2026-anthropic-1-7gw-nvidia-board"},{"en":"IonQ lifts full-year guidance above half a billion dollars after a 336% revenue jump","zh":"**IonQ Q3 營收年增 336% 至 1.738 億美元**，全年財測上調到 5.05–5.15 億美元；11/6 收漲 23.42%，帶動 Rigetti、D-Wave 同步大漲。","summary":"IonQ reported third-quarter revenue of $173.8 million, up about 336% year on year, and raised its full-year outlook to $505-515 million, passing the half-billion mark for the first time. The stock closed November 6 up 23.42%, and the read-across lifted other quantum names, with Rigetti gaining roughly 19% and D-Wave also rallying. Analysts cautioned that the roughly $2 billion October capital raise adds meaningful dilution, and that much of the revenue growth reflects systems sales and government contracts rather than recurring commercial cloud usage, so the guidance beat is not yet proof of a durable business.","source":"Closing Print（11/6）／24-7 Wall St.","url":"https://www.theclosingprint.net/2026/11/post-market-and-weekly-summary-2026-11-06/"},{"en":"Anthropic's IPO investors push back on a $1.5 trillion valuation","zh":"**Anthropic 的 IPO 投資人正在壓低 1.5 兆美元估值**；同一週 OpenAI 以 1.25 兆美元完成 110 億美元募資，兩家的採購節奏是晶片族群最大變數。","summary":"The Wall Street Journal reported that investors in Anthropic's planned listing are pressing the company's valuation down from an earlier $1.5 trillion figure, without specifying how far or on what timeline. The report landed in the same week OpenAI closed $11 billion at a $1.25 trillion valuation, and alongside estimates that the two labs together could absorb 25-40% of all new global AI compute in 2027. For chip and data-centre investors the purchasing cadence of these two buyers has become the single biggest swing factor, which is part of why capital-expenditure headlines moved semiconductor prices so violently last week.","source":"Tech Trends Morning Brief（11/7）／WSJ","url":"https://techtrendsnewsupdate.substack.com/p/tech-trends-news-update-morning-brief-a1a"}]},{"label":"追星（僅限清單內歌手）","items":[{"en":"Kenshi Yonezu's GHOST arena tour moves to K-Arena Yokohama on November 11-12","zh":"**米津玄師〈2026 TOUR / GHOST〉長野兩場（11/6–7）已開跑**，下一站 11/11–12 橫濱 K-Arena，全國 6 城 14 場一路到 12/17。","summary":"Kenshi Yonezu opened his 2026 TOUR / GHOST arena run at Nagano Big Hat on November 6 and 7, the first dates of a 14-show, six-city schedule. The tour next moves to K-Arena Yokohama on November 11 and 12, then Osaka-jo Hall on November 18 and 19, Marine Messe Fukuoka A on November 27 and 28, and Sekisui Heim Super Arena in Miyagi on December 3 and 4, before closing on December 17. No overseas dates have been announced, so Taiwanese fans would need to travel to Japan; remaining tickets have been handled through the Japanese ticketing agencies.","source":"Mikiki／REISSUE RECORDS 官方日程｜Spotify","url":"https://mikiki.tokyo.jp/articles/-/41560","spotify":"https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB"},{"en":"YOASOBI confirm two Taipei Dome nights on January 9-10, 2027","zh":"**YOASOBI 確定攻大巨蛋：2027/1/9–1/10 台北兩場**，屬「SUPER PLANET 超惑星」亞洲 10 城巨蛋／體育場巡演，是生涯最大規模。","summary":"YOASOBI will play two nights at the Taipei Dome on January 9 and 10, 2027, as part of the SUPER PLANET Asia tour that takes the duo to domes and stadiums in ten cities. It is the largest run of their career and their biggest Taiwanese booking to date, moving them up from arena-scale venues. Taiwanese fans should watch for the local ticketing announcement and presale windows, which for dome shows in Taipei typically open two to three months ahead and sell out within hours for Japanese acts of this size.","source":"THE FIRST TIMES（巡演公告）｜Spotify","url":"https://www.thefirsttimes.jp/news/0000873200/","spotify":"https://open.spotify.com/search/YOASOBI"},{"en":"Mrs. GREEN APPLE follow the POPS album with a 28-show arena tour across 14 venues","zh":"**Mrs. GREEN APPLE 第 6 張專輯《POPS》已發行**，並宣布三年來首度大型巡演：全國 14 會場共 28 場，新曲「シンデレラ」MV 也已公開。","summary":"Mrs. GREEN APPLE released POPS, their sixth studio album and the opening of what the band calls Phase 3, and have followed it with their first large-scale tour in three years: 28 shows across 14 arenas in Japan. The music video for the single Cinderella is also out. The band has not confirmed Taiwan or Hong Kong dates for this cycle, so overseas fans are watching for an Asian leg announcement; their recent pattern has been to add regional shows only after the domestic run is well under way.","source":"音楽ナタリー／Mrs. GREEN APPLE 官方日程｜Spotify","url":"https://mrsgreenapple.com/schedule/list/?lang=en","spotify":"https://open.spotify.com/search/Mrs.%20GREEN%20APPLE"},{"en":"Vaundy's HORO Asia arena tour sold out both Taipei nights; Shanghai was cancelled","zh":"**Vaundy〈ASIA ARENA TOUR 2026 HORO〉台北小巨蛋 10/31、11/1 兩場抽選完售**，上海 11/14–15 兩場已取消，亞洲行程縮水。","summary":"Vaundy's ASIA ARENA TOUR 2026 HORO sold out both Taipei Arena nights on October 31 and November 1 through a lottery ballot, confirming how fast his Taiwanese audience has grown. The two Shanghai dates originally set for November 14 and 15 were cancelled in late August, trimming the Asian leg. For fans who missed the Taipei shows, the remaining dates are in Japan and other Asian cities, and resale through official platforms is the only sanctioned route; unofficial resale tickets are routinely voided at the door.","source":"もとりょこblog 巡演彙整｜Spotify","url":"https://motoryokoblog.com/?p=16683","spotify":"https://open.spotify.com/search/Vaundy"}]}]},"market":{"insights":["**週一開盤先看 4 萬點能否收復**，上週五加權殺 1,873 點收 39,701","**成交 1.2461 兆是史上第四大量**，法人多解讀為融資斷頭洗籌碼","**反彈三訊號**：金管會穩市措施、新台幣守 33 元、融資餘額續降","**美股同日分歧**：那斯達克 +1.09%、道瓊 −0.46%，費半 +4.21% 止血","**0056 首度跌破 50 元收 49.91**，南亞與記憶體拖累、金融股撐盤"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"39,701.64","change":-4.51,"changePts":"-1,873.08","comment":"史上第四大跌點，失守 4 萬"},{"market":"TW","name":"櫃買指數 OTC","value":"304.02","change":-5.43,"changePts":"-17.45","comment":"中小型股殺更凶"},{"market":"TW","name":"0050 元大台灣50","value":"—","change":-4.79,"comment":"跌破 90 元，買盤湧入"},{"market":"TW","name":"0056 元大高股息","value":"49.91","change":null,"comment":"首度跌破 50 元"},{"market":"US","name":"那斯達克 Nasdaq Composite","value":"24,579.42","change":1.09,"comment":"科技股逢低買盤回來"},{"market":"US","name":"S&P 500","value":"7,376.86","change":0.31,"comment":"小漲收週，週線仍最差"},{"market":"US","name":"道瓊工業指數 Dow Jones","value":"51,285.73","change":-0.46,"changePts":"-237.33","comment":"全場唯一收黑的大盤"},{"market":"US","name":"羅素 2000 Russell 2000","value":"2,754.11","change":0.89,"comment":"中小型股同步回穩"},{"market":"US","name":"費半／半導體指數 SOX","value":"—","change":4.21,"comment":"晶片股前一日重挫後回補"},{"market":"US","name":"QQQ（那斯達克100 ETF）","value":"—","change":null,"comment":"11/6 精確收盤未取得"}],"quotes":{"2330":-4.69,"0050":-4.79,"3017":-9.9,"3653":-9.9,"IONQ":23.42,"RGTI":19.3,"AMD":11.04,"SPCX":8.6,"INTC":7.71,"MU":5.12,"TSLA":4.23,"PLTR":3.48,"NVDA":2.78},"prices":{"MU":690,"INTC":56.28},"movers":[{"name":"IonQ（清單內 · 漲幅之冠）","ticker":"IONQ","change":23.42,"price":"—","reason":"Q3 營收 +336%、上調全年財測"},{"name":"Rigetti（清單內 · 量子）","ticker":"RGTI","change":19.3,"price":"—","reason":"IonQ 財報帶飛整個量子族群"},{"name":"Coherent（清單外 · S&P 漲幅之冠）","ticker":"COHR","change":13.58,"price":"—","reason":"光通訊與資料中心需求強"},{"name":"Airbnb（清單外）","ticker":"ABNB","change":11.67,"price":"—","reason":"財報與旅遊需求優於預期"},{"name":"超微 AMD","ticker":"AMD","change":11.04,"price":"—","reason":"前一日重挫後空頭回補最猛"},{"name":"SpaceX（IPO 觀察標的）","ticker":"SPCX","change":8.6,"price":"—","reason":"德銀喊逢低買進"},{"name":"Intel","ticker":"INTC","change":7.71,"price":"56.28 美元","reason":"轉型題材＋晶片股整體回補"},{"name":"美光 Micron","ticker":"MU","change":5.12,"price":"690.00 美元","reason":"HBM／記憶體族群跟著反彈"},{"name":"Axon（清單外 · S&P 跌幅之冠）","ticker":"AXON","change":-18.18,"price":"—","reason":"財測不如預期，獲利了結出場"},{"name":"Microchip（清單外）","ticker":"MCHP","change":-10.02,"price":"—","reason":"車用／工業類比需求仍低迷"},{"name":"奇鋐","ticker":"3017","change":-9.9,"price":"—","reason":"跌停，散熱族群重災區"},{"name":"健策","ticker":"3653","change":-9.9,"price":"—","reason":"跌停，均熱片族群同步殺盤"}]}},"archive":{"dates":["2026-11-09","2026-11-08","2026-11-07","2026-11-06","2026-11-05","2026-11-04","2026-11-03","2026-11-02","2026-11-01","2026-10-31","2026-10-30","2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20","2026-10-19","2026-10-18","2026-10-17","2026-10-16","2026-10-15","2026-10-13","2026-10-12","2026-10-11","2026-10-10"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.header-left .date{font-size:13px;color:var(--muted);margin-top:3px}
.header-left .ver{font-size:10px;color:#484f58;margin-top:2px}
.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.55}
.weather-badge .w-icon{font-size:20px}
.weather-badge .w-row{display:flex;gap:6px;white-space:nowrap}
.weather-badge .w-city{color:var(--muted);min-width:2.2em}
.weather-badge .w-t{color:var(--orange);font-weight:700}
.weather-badge .w-d{color:var(--text)}
.weather-badge .w-alerts{margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.w-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid}
.w-tag.red{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.w-tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
.w-tag.ok{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.highlights{max-width:1400px;margin:16px auto 0;padding:0 20px}
.highlights .hl-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px}
.highlights h2{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
.highlights ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.highlights li{font-size:14px;line-height:1.6;color:var(--text);padding-left:16px;position:relative}
.highlights li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.highlights li b{color:#fff}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}
.ring-text .sub{font-size:10px;color:var(--muted)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}
.task-cb.checked{background:var(--green);border-color:var(--green)}
.task-cb.checked::after{content:'✓';color:#fff;font-size:11px}
.task-info{flex:1}
.task-name{font-size:13px;font-weight:500}
.task-name.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.pri-high{background:#3d1a1a;color:var(--red)}.pri-mid{background:#2d2714;color:var(--yellow)}.pri-low{background:#172113;color:var(--green)}
.badge-type{background:var(--bg3);color:var(--muted)}
.empty-tasks{text-align:center;padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.6}
.task-tmr{align-self:center;background:transparent;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.task-tmr:hover{border-color:var(--accent);color:var(--accent)}.task-tmr.sent{border-color:var(--green);color:var(--green)}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
