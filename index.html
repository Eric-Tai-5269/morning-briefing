、雲平咖啡校慶伴手禮、三星禮券、生理用品補助（資格不符）、OIA eNews 月刊 —— 這些都沒有需要你今天動手的事。**PRO360 相關信件本期為 0 封。**"}, "news": {"window": "過去 48h（10/20 23:00 – 10/22 23:00 台北時間）· 來源：Democracy Now! 10/22 Headlines／Yahoo Finance／9to5Mac／Techzine／MedicalXpress／Futurity／The Avocado Sportacados／NiEW／otomo.net。**新聞摘要一律約 100 字英文，中文僅一行副標。**", "groups": [{"label": "頭條", "items": [{"en": "U.S. and Israeli Militaries Draft Plans to Resume Strikes on Iran After Midterm Elections", "zh": "**五角大廈與以色列軍方已擬定「期中選舉後重啟對伊朗空襲」的具體計畫** —— 同時伊朗革命衛隊稱擊中波斯灣北部四艘油品轉運船，荷莫茲海峽另有三艘船觸雷，油運風險直接升高。", "summary": "Iran's Revolutionary Guard says it struck four oil-transfer vessels in the northern Persian Gulf, while three other ships hit mines in the Strait of Hormuz. The New York Times reports the Pentagon and Israel's military have drafted specific plans to resume strikes on Iran after the U.S. midterm elections, suggesting the current pause is tactical rather than a de-escalation. The Strait of Hormuz carries roughly a fifth of global oil, so mining incidents and vessel strikes there feed directly into shipping insurance costs and crude prices. Markets have so far treated the escalation as contained, but the reported post-midterm timeline gives a concrete date range for renewed risk.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}, {"en": "Saudi Arabia Says Four People Are Killed as Houthis Attack Oil Field and King Fahd Airport", "zh": "**沙烏地阿拉伯遭胡塞武裝攻擊油田與法赫德國王國際機場，至少 4 死 8 傷，美國已下令駐沙外交人員撤離。**", "summary": "Saudi officials say a strike on King Fahd International Airport killed at least two people and wounded eight, while a Houthi drone attack on an oil field reportedly killed two more. The United States has ordered its diplomats in Saudi Arabia to evacuate, an unusually strong signal that Washington expects further attacks rather than a one-off strike. Hitting both civil aviation infrastructure and upstream oil facilities in the same window marks an escalation beyond the Houthis' earlier shipping-focused campaign. Combined with the Strait of Hormuz incidents, the region now has two simultaneous threats to energy logistics.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}, {"en": "Russia Kills More Civilians in Ukraine as U.S. Envoy Witkoff Praises Putin as a \"Humanitarian\"", "zh": "**俄軍一夜攻擊烏克蘭 12 個州、基輔至少 2 死；美方特使威特科夫稱普丁為「人道主義者」，遭兩黨同聲批評。**", "summary": "Russian drones and missiles struck twelve Ukrainian regions overnight, killing at least two people in Kyiv. Kremlin officials said U.S.-brokered talks will resume next month, which places the diplomatic track and the escalating strike campaign on parallel lines rather than in sequence. U.S. envoy Steve Witkoff's description of Vladimir Putin as a \"humanitarian\" drew bipartisan criticism in Washington and raised questions about the administration's negotiating posture. For Taiwan-based readers, the pattern worth watching is not the rhetoric but whether negotiations proceeding alongside continued strikes becomes an accepted template.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}, {"en": "U.N. Says World Has Lost Its Chance to Limit Global Heating to 1.5°C", "zh": "**聯合國報告正式宣告：將升溫控制在工業化前 1.5°C 以內的機會已經失去**，但大幅減排與停止森林砍伐仍能縮短並縮小「超標期」。", "summary": "A new United Nations report concludes the world has missed its chance to hold warming to 1.5 degrees Celsius above preindustrial levels, shifting the framing from prevention to overshoot management. The report argues that deep emissions cuts and an end to deforestation could still shorten the overshoot period and reduce its peak magnitude, which matters because the duration above 1.5 degrees drives how much irreversible damage accumulates. For chemical engineering students the practical consequence is that carbon capture, process electrification and heat-integration work move from optional sustainability projects toward core design constraints.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}, {"en": "Nigeria Reports Its First Case of Ebola in Over a Decade", "zh": "**奈及利亞確診十多年來首例伊波拉病例**，患者由衣索比亞入境、曾赴剛果民主共和國；當前疫情累計逾 4,600 死、近 1 萬人感染。", "summary": "Nigeria has confirmed an Ebola case in a patient who flew in from Ethiopia after traveling to the Democratic Republic of the Congo, the country's first in more than ten years. The wider outbreak has already killed over 4,600 people and infected nearly 10,000. The significance is the travel chain: a case arriving by air in Africa's most populous country, with Lagos as a major aviation hub, changes the containment problem from a regional one to a potentially international one. Health authorities will now be racing to complete contact tracing across at least three countries.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}]}, {"label": "科技", "items": [{"en": "Critical PHP Flaws Leave the Majority of Websites on the Internet Vulnerable", "zh": "**PHP 爆出可讓攻擊者接管伺服器的重大漏洞，影響網路上多數網站** —— 維基百科與 BBC 部分服務一度離線搶修。", "summary": "Critical vulnerabilities have been found in PHP, the language behind most of the world's websites, which could let attackers take over servers and steal data. Parts of Wikipedia and the BBC went offline while programmers rushed to patch the bug. This is the rare class of flaw where the blast radius is defined by language adoption rather than by any single product, so patch coverage will lag for months on unmaintained sites. The market read-through was immediate: cybersecurity names including Zscaler, Okta, Cloudflare and CrowdStrike rose five to seven percent intraday on October 21.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}, {"en": "Meta Ordered to Pay a $25 Billion Fine Over Facebook Data Misuse", "zh": "**新墨西哥州法官判 Meta 賠 250 億美元**，源自劍橋分析醜聞中誤導用戶資料用途 —— 為該公司史上最大罰款，但仍遠低於州方主張的約 2,200 億美元上限。", "summary": "A New Mexico judge ordered Meta to pay twenty-five billion dollars for misleading users about how their Facebook data was handled, in a case stemming from the Cambridge Analytica scandal. It is the largest fine in the company's history, though far below the roughly two hundred twenty billion dollars the state argued the statute allowed. The gap between the awarded and maximum amounts is the detail to watch, because it sets an informal discount factor other state attorneys general will cite in pending privacy suits. Appeals are near certain given the size of the award.", "source": "Democracy Now! — Headlines for October 22, 2026", "url": "https://www.democracynow.org/2026/10/22/headlines"}, {"en": "Musk Says SpaceX and Tesla Have Formed Special Committees to Discuss a Potential Merger", "zh": "**馬斯克表示 SpaceX 與特斯拉已各自成立特別委員會，討論可能的合併** —— SpaceX 財報優於預期後股價收漲 7.79%，特斯拉同日漲 3.41%。", "summary": "Elon Musk said SpaceX and Tesla have each formed special committees to discuss a potential merger, the clearest signal yet that the two companies' capital structures could be combined. SpaceX closed October 21 at 159.31 dollars, up 7.79 percent after quarterly results beat estimates, while Tesla closed at 386.47 dollars, up 3.41 percent. Special committees are the standard governance device for related-party transactions, so their formation indicates the discussion has moved past the informal stage. Separately, AT&T fell 6.45 percent as investors weighed competitive pressure from SpaceX's Starlink Mobile plans.", "source": "Yahoo Finance — Stock market today, Wednesday October 21 2026", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-october-21-dow-sp-500-nasdaq-100000105.html"}]}, {"label": "運動", "items": [{"en": "World Series Set: Tampa Bay Rays vs. Milwaukee Brewers, Neither Franchise Has Ever Won", "zh": "**世界大賽對戰組合出爐：坦帕灣光芒對密爾瓦基釀酒人** —— 光芒在美聯冠軍賽六戰勝出，釀酒人橫掃國聯冠軍賽；兩隊都從未奪冠，今年必定誕生新王。", "summary": "The Tampa Bay Rays, who won the American League Championship Series in six games, will face the Milwaukee Brewers, who swept the National League Championship Series. Neither franchise has ever won a World Series, so this year guarantees a first-time champion. The contrast in paths is notable: the Rays ground out a six-game series while the Brewers arrive rested from a sweep, which usually favors the swept-series team's pitching rotation alignment. Both are small-market clubs, making this a rare World Series with no large-payroll team involved.", "source": "The Avocado — Sportacados Discussion Thread for October 21-22, 2026", "url": "https://the-avocado.org/2026/10/21/sportacados-discussion-thread-for-october-21-22-2026/"}, {"en": "NBA Season Opens: Pistons Erase a 20-Point Deficit to Beat the Celtics; Knicks Lose on Banner Night", "zh": "**NBA 2026-27 球季開幕：活塞逆轉 20 分落後擊敗塞爾提克**；尼克升起冠軍錦旗之夜卻敗給七六人，雷霆則擊敗馬刺。", "summary": "The 2026-27 NBA season began with the Detroit Pistons erasing a twenty-point deficit to beat the Boston Celtics. The New York Knicks raised their championship banner but lost to the Philadelphia 76ers on the same night, and the Oklahoma City Thunder beat the San Antonio Spurs. A twenty-point comeback in a season opener is unusual because rotations are still unsettled and teams rarely have the defensive cohesion to force that kind of swing. The Knicks' banner-night loss continues a long pattern of defending champions starting slowly.", "source": "The Avocado — Sportacados Discussion Thread for October 21-22, 2026", "url": "https://the-avocado.org/2026/10/21/sportacados-discussion-thread-for-october-21-22-2026/"}, {"en": "WNBA Finals Draw Record Audience as Atlanta Dream Face Golden State Valkyries", "zh": "**WNBA 總冠軍賽收視創紀錄**：亞特蘭大夢想對金州女武神，NBC 與 USA 頻道宣布系列賽開局寫下史上最高觀眾數。", "summary": "NBC and USA Network claimed a record audience for the start of the WNBA Finals, where the Atlanta Dream are facing the Golden State Valkyries. The Valkyries reaching the Finals is the headline story given how recently the franchise entered the league, and the Bay Area market has delivered unusually strong local ratings. Record viewership for a women's basketball championship continues a multi-year trend that has reshaped broadcast rights negotiations. Game three of the series was scheduled for October 21, with coverage across NBC's platforms.", "source": "Front Office Sports — NBC Claims Record Audience for Start of WNBA Finals", "url": "https://frontofficesports.com/article/nbc-claims-record-audience-for-start-of-wnba-finals/"}]}, {"label": "教育心理", "items": [{"en": "Twin Study Suggests Screen Time's Link to Mental Health May Be Overstated", "zh": "**雙胞胎研究指出：螢幕時間與心理健康的關聯可能被高估** —— 控制家庭與遺傳因素後，效果明顯縮小。", "summary": "A new twin study suggests the association between screen time and poorer mental health may be substantially overstated. By comparing twins raised in the same household, researchers controlled for shared genetics and family environment, two confounders that inflate effect sizes in conventional observational studies. When those factors are held constant, the remaining association between screen use and mental health outcomes shrinks considerably. The finding does not say screens are harmless, but it does imply that families differing in screen habits also differ in many other ways, and those other differences carry much of the explanatory weight.", "source": "MedicalXpress — Twin study suggests screen time's link to mental health may be overstated", "url": "https://medicalxpress.com/news/2026-10-twin-screen-link-mental-health.html"}, {"en": "New Review Suggests Not All Screen Time Is Bad for Children", "zh": "**新回顧研究：不是所有螢幕時間都有害** —— 關鍵在內容與使用情境，而非單純計算總時數。", "summary": "A new review argues that screen time should not be treated as a single exposure, because content type and context shape outcomes more than total duration does. Interactive and co-viewed use patterns show different associations than passive solitary consumption, which means hour-counting guidelines may be measuring the wrong variable. The practical implication for students is that a blanket reduction target is less useful than auditing what the hours actually consist of. The review arrives alongside the twin study above, and together they mark a visible shift in how this literature is being framed.", "source": "MedicalXpress — Is all screen time bad for children? Maybe not, new review suggests", "url": "https://medicalxpress.com/news/2026-10-screen-bad-children.html"}, {"en": "Research Roundup Links Adolescent Study Strain to Measurable Mental Load", "zh": "**研究整理指出青少年「讀書壓力」與可量測的心理負荷相關** —— 對正在排期中考衝刺的你，重點是「休息排程」比「總時數」更能決定成效。", "summary": "A research roundup published this week collects studies linking adolescent academic strain to measurable increases in mental load, alongside the screen-time reassessments. The consistent thread across the papers is that recovery scheduling predicts outcomes better than raw study hours, because sustained high load without breaks degrades the encoding that studying is meant to produce. For a student facing two midterms and a makeup class inside two weeks, the actionable reading is to block fixed recovery windows first and fit study sessions around them, rather than treating rest as the residual after studying.", "source": "DeepDyve Blog — Screen Time and Youth Mental Health: A Research Roundup", "url": "https://blog.deepdyve.com/2026/10/19/screen-time-youth-mental-health-research-roundup/"}]}, {"label": "產業動態（AI／半導體／量子）", "items": [{"en": "Anthropic Launches Claude Duet, an Always-On Agent in Research Preview, Powered by Claude Opus 5.5", "zh": "**Anthropic 推出 Claude Duet（研究預覽版）** —— 跑在自家雲端電腦上、關掉 App 仍持續工作的常駐代理人，共用記憶／技能／連接器，免額外費用但吃現有方案額度。", "summary": "Anthropic announced Claude Duet on October 21, an always-on agent that works proactively inside connected apps. It is a research preview rolling out by waitlist to Pro and Max subscribers in the United States, and is not yet on Team or Enterprise plans. Duet runs on its own cloud computer so it keeps working after the app closes, shares memories, skills and connectors with regular Claude, and can search past conversations. Features include morning briefs over email and calendar, a Make tab returning editable files, a Tasks tab, Stripe and Shop Pay integrations, and a cloud browser. It is reported to run on Claude Opus 5.5.", "source": "9to5Mac — Anthropic takes on ChatGPT Dots and Meta Muse with Claude Duet", "url": "https://9to5mac.com/2026/10/21/anthropic-takes-on-chatgpt-dots-and-meta-muse-with-claude-duet"}, {"en": "Nvidia Standardizes Custom HBM Base-Die Production at TSMC; Samsung Reportedly Agrees to the Terms", "zh": "**Nvidia 要求所有 NVHBM 的 base die 都在台積電生產，三星據報已同意** —— 這把記憶體的價值鏈往台積電方向再搬一塊，對台股 CoWoS／先進封裝供應鏈是結構性利多。", "summary": "Nvidia is standardizing production of the base dies for its custom HBM, known as NVHBM, at TSMC, and Samsung has reportedly agreed to the terms. The base die is the logic layer beneath the stacked DRAM, and moving it to a leading-edge foundry process lets Nvidia specify performance and integration rather than accept each memory vendor's in-house logic. Strategically this shifts value from memory makers toward TSMC and tightens Nvidia's control over its own memory roadmap. DigiTimes flags four strategic concerns for Samsung in accepting the arrangement, chiefly dependence on a competitor's foundry.", "source": "Techzine — Nvidia standardizes HBM production at TSMC", "url": "https://www.techzine.eu/news/infrastructure/145117/nvidia-standardizes-hbm-production-at-tsmc/"}, {"en": "Google Cloud Adds OpenAI's GPT-Astra and GPT-6 Models to Vertex AI Model Garden", "zh": "**Google Cloud 把 OpenAI 的 GPT-Astra 與 GPT-6 上架到 Model Garden** —— 雲端業者「中立貨架化」的趨勢加速，模型層與雲端層的綁定正在鬆開。", "summary": "Google Cloud has added OpenAI's GPT-Astra and GPT-6 models to its Vertex AI Model Garden, placing a direct competitor's frontier models on Google's own distribution shelf. The move continues a pattern in which hyperscalers compete on infrastructure and tooling rather than on model exclusivity, because enterprise buyers increasingly refuse to accept single-vendor model lock-in. For developers the practical effect is that switching costs between frontier models keep falling, since the surrounding cloud plumbing stays the same. The strategic question is whether model differentiation can survive commoditized distribution.", "source": "Unite.AI — Google Cloud Adds OpenAI's GPT-Astra and GPT-6 Models to Model Garden", "url": "https://unite.ai/google-cloud-adds-openais-gpt-astra-and-gpt-6-models-to-model-garden"}]}, {"label": "追星（僅限清單內歌手）", "items": [{"en": "Fujii Kaze Adds Kaohsiung National Stadium on October 31, 2026 to the Prema World Tour; Hong Kong Show Canceled", "zh": "**藤井 風 Prema World Tour 加場：10/31（六）高雄國家體育場** —— 就在 9 天後、台灣場次；香港場已取消，曼谷 12/26、首爾 2027/1/9。", "summary": "Fujii Kaze has added Kaohsiung National Stadium on October 31, 2026 to his Prema World Tour, along with Supachalasai National Stadium in Bangkok on December 26 and Gocheok Sky Dome in Seoul on January 9, 2027. The Hong Kong date has been canceled. Japanese dates run Fukuoka's Mizuho PayPay Dome on November 14 and 15, Kyocera Dome Osaka on December 10 and 12 to 13, and Tokyo Dome on December 19 and 20. A summer 2027 leg is planned across Europe and North America with dates unconfirmed.", "source": "NiEW — Fujii Kaze Reveals Additional Stops for Prema World Tour", "url": "https://niewmedia.com/en/news/2604fujiikaze/"}, {"en": "Mrs. GREEN APPLE Sets Release Date for Sixth Album and Announces First Arena Tour in Three Years", "zh": "**Mrs. GREEN APPLE 第 6 張專輯發行日確定，並宣布三年來首次巨蛋／Arena 巡迴。**", "summary": "Mrs. GREEN APPLE has set the release date for their sixth studio album and announced their first arena tour in three years. The gap matters because the band spent the interim period in stadium-scale shows and media work rather than the arena circuit, so this tour returns them to venues where ticket demand historically outstrips supply by a wide margin. For overseas fans the practical note is that arena-scale Japanese tours rarely include international dates, so any Taiwan interest will depend on a separate announcement. Album and tour details were published via otomo.net.", "source": "otomo.net — Release date set for Mrs. GREEN APPLE's 6th album, first arena tour in 3 years also announced", "url": "https://otomo.net/contents/1083257?locale=en"}, {"en": "Music Awards Japan 2026 Entry List Puts Kenshi Yonezu, Ado and Mrs. GREEN APPLE in Direct Contention", "zh": "**Music Awards Japan 2026 入圍名單公布：米津玄師、Ado、Mrs. GREEN APPLE 正面對決** —— 清單內三位歌手同場競爭，是今年 J-POP 獎季最值得追的一條線。", "summary": "The entry works and artists for Music Awards Japan 2026 have been announced, placing Kenshi Yonezu, Ado and Mrs. GREEN APPLE in direct contention. All three appear on the tracked artist list, which makes this the single awards race most relevant to follow this season. Music Awards Japan is the country's newer industry-wide awards body, built to resemble the Grammys in structure rather than the sales-driven legacy formats, so entry lists carry more signal about critical standing than chart position does. Winners are determined by an industry voting panel.", "source": "otomo.net — \"MUSIC AWARDS JAPAN 2026\" entry works / artists announced", "url": "https://otomo.net/contents/1057982?locale=en"}, {"en": "Spotify Quick Links for the Tracked Artists", "zh": "**追蹤清單快速連結** —— 藤井風、Mrs. GREEN APPLE、米津玄師、Ado、YOASOBI、King Gnu 等 16 位清單內歌手的 Spotify 入口。", "summary": "Direct Spotify entry points for the tracked artist list, for checking new releases against the tour and awards news above: Fujii Kaze, Mrs. GREEN APPLE, Kenshi Yonezu, Ado, YOASOBI, King Gnu, Yuuri, YUIKA, back number, LiSA, Official Hige Dandism, Aimer, Vaundy, tuki., RADWIMPS and Aimyon. No new release announcements from the other twelve artists surfaced inside this forty-eight hour window, so the three items above are the complete set for today rather than a filtered selection.", "source": "Spotify（清單內歌手搜尋入口）", "url": "https://open.spotify.com/search/Fujii%20Kaze"}]}]}, "market": {"asOf": "台股＝**2026/10/21（三）13:30 收盤**；美股＝**2026/10/21（三）正規盤收盤**（台灣 10/22 清晨 04:00 結束）。　★ **為什麼不是 10/22 的數字**：本期是「10/22 早晨簡報」，依規格取**前一交易日收盤** —— 台股 10/22（四）的盤後資料與美股 10/22 夜盤均不在本期範圍內。　★ 另外提醒：**10/26（一）光復節補假，台股休市**，加上 10/23 可能的颱風因素，本週到下週的交易日會被切得很碎。", "highlight": "**一句話：台股 10/21 收復 46,800 是「補漲＋族群輪動」，不是台積電帶的 —— 而美股同一晚漲的是太空、資安與晶片，兩邊這次方向一致。**台股 10/21：加權 **46,887.77（+1.28%、+594.84 點）**，成交 **8,331.91 億元**（量能回升），盤中最高 47,254.93、最低 46,454；**台積電只漲 0.62% 到 2,420 元**，真正的主角是**塑膠類股 +6.52%（全場最強）、光電類股 +3.61%**，以及**被動元件、低軌衛星、PCB／載板**三個族群的漲停潮 —— 上市 25 檔漲逾 9%（24 檔漲停）、上櫃 28 檔漲逾 9%（27 檔漲停）。**網通類股逆勢跌 2.15%**，智邦 -7.87% 是權值級的破口。美股 10/21：**那斯達克 26,702.86（+1.05%）、S&P 500 7,757.17（+0.58%）、道瓊 52,856.09（+0.69%）、QQQ +1.05%**，晶片股領漲，**SpaceX 財報優於預期收漲 7.79%** 直接點燃台股低軌衛星族群（昇達科、穩懋盤中漲停、終場皆漲逾 7%）—— 這是今天最乾淨的一條「美股→台股」傳導鏈。", "note": "★ **今天（10/22）盤前只盯這三件，其他先放掉**：　**①「低軌衛星」這條傳導鏈是真的，但它已經反映了。**SpaceX 10/21 財報優於預期、收漲 7.79% 至 159.31，台股低軌衛星族群同日就把漲停吃完（昇達科、穩懋盤中漲停、終場漲逾 7%），同欣電、金寶、兆赫、仲琦、耀登、燿華同步走揚。**追高風險在於：這是別人財報的外溢，不是台廠自己的訂單確認。**要驗證就看接下來幾週這些公司有沒有實際出貨或接單公告，沒有就只是情緒。　**②真正的結構性消息是 NVHBM base die 全部交給台積電。**Nvidia 要求所有客製 HBM 的 base die 在台積電生產、三星據報已同意 —— 這件事的受益者不是記憶體股，而是**台積電＋先進封裝／CoWoS／載板鏈**。它不會在一天內反映在股價上，但它改變的是未來兩年的價值分配，比任何單日漲停都重要。對照觀察清單：台積電（2330）、日月光投控（3711，10/21 漲 3.64%）、欣興（3037）、台光電（2383）、金像電（2368）都在這條鏈上。　**③被動元件與塑膠的漲停潮要小心「補漲」性質。**塑膠類股 +6.52% 是全場最強，南亞 +8.28% 盤中一度漲停 —— 但塑膠與被動元件這兩個族群今年大多數時間都落後大盤，單日爆量漲停更常是落後補漲與資金輪動，而不是基本面反轉。**判斷方法很簡單：看第二天與第三天能不能守住。**守不住就是一日行情。　★ **觀察清單對照（10/21）**：清單內明確上漲的有 **台積電 2330 +0.62%（2,420）、鴻海 2317 +3.52%（250）、台達電 2308 +1.25%（1,625）、廣達 2382 +2.5%（328.5）、日月光投控 3711 +3.64%、中信金 2891 +4.47%、SPCX +7.79%、TSLA +3.41%、COIN 與 CRCL 各漲逾 4%（聯邦銀行監管機構定案穩定幣規則）**；清單內下跌的有 **聯發科 2454 -0.24%（4,140）、T（AT&T）-6.45%、NFLX -5.31%**。資安族群 **ZS／CRWD／NET** 因 PHP 重大漏洞盤中漲 5–7%，但收盤幅度未確認，故不列入下方 ≥5% 名單。", "indices": [{"market": "TW", "name": "加權指數 TAIEX", "value": "46,887.77", "change": 1.28, "note": "10/21（三）13:30 收盤 · **漲 594.84 點、+1.28%**，成交 **8,331.91 億元**（量能回升）。開盤即大漲 161 點，盤中最高 **47,254.93**、最低 **46,454**，尾盤由台積電撐住（期指結算日）。前一交易日 10/20 為 -529.15 點（-1.13%），本日屬於**收復失土**而非突破。"}, {"market": "TW", "name": "元大台灣50 0050", "value": "—", "change": 0.84, "note": "10/21 **+0.84%**，明顯落後大盤的 +1.28% —— 原因是權值大型股（台積電 +0.62%、聯發科 -0.24%）被壓抑，資金跑向中小型與高股息。**0050 落後大盤本身就是「這天不是權值股在漲」的最直接證據。**（收盤價未取得多來源確認，故不列數值）"}, {"market": "TW", "name": "元大高股息 0056", "value": "—", "change": 2.26, "note": "10/21 **+2.26%**，大幅領先 0050 的 +0.84% 與大盤的 +1.28%。當日**全部 87 檔台股掛牌 ETF 全數上漲、無一平盤或下跌**，其中中小型與高股息 ETF 表現最好（00733 富邦中小 +4.26% 居冠、0055 元大金融 +2.29%）。金融股全面上漲（中信金 +4.47%）是 0056 走強的主因之一。（收盤價未取得多來源確認，故不列數值）"}, {"market": "TW", "name": "櫃買指數 OTC", "value": "—", "change": 0, "note": "⚠️ **本期未取得 10/21 櫃買指數收盤的可信數字**（多家報導皆未列出），故不填數值與漲跌幅。可參考的替代指標：**上櫃 28 檔漲逾 9%、其中 27 檔漲停；13 檔跌逾 4%、1 檔跌停** —— 中小型股的投機熱度明顯高於上市。"}, {"market": "US", "name": "那斯達克綜合指數 Nasdaq Composite", "value": "26,702.86", "change": 1.05, "note": "10/21（三）收盤 **+1.05%**，四大指數中最強，**由晶片股領漲**（NVDA 盤中漲逾 1.5%、AMD 盤中約 +2%）。Nasdaq 100 漲逾 1.2%，科技股內部的大型權值表現優於綜合指數。"}, {"market": "US", "name": "S&P 500", "value": "7,757.17", "change": 0.58, "note": "10/21（三）收盤 **+0.58%**，連續第 3 個交易日收紅。漲幅明顯小於那斯達克，顯示這一天是**科技／成長領漲、而非全面普漲**。"}, {"market": "US", "name": "道瓊工業指數 Dow Jones", "value": "52,856.09", "change": 0.69, "note": "10/21（三）收盤 **+0.69%**。成分股內部分歧很大：**IBM +3.94%、Danaher +4.29%** 撐盤，但 **AT&T -6.45%**（投資人評估 SpaceX Starlink Mobile 的競爭威脅）是最大拖累。"}, {"market": "US", "name": "QQQ（Invesco QQQ Trust）", "value": "—", "change": 1.05, "note": "10/21 **+1.05%**，與那斯達克綜合同步。（來源未提供收盤價，故不列數值）"}, {"market": "US", "name": "VIX／風險情緒", "value": "—", "change": 0, "note": "⚠️ 本期未取得 10/21 VIX 收盤可信數字，不填。間接判斷：三大指數同步收紅、S&P 500 連 3 紅、資安與太空族群出現 5% 以上單日漲幅 —— 屬於**風險偏好偏高但有族群分化**的環境。"}, {"market": "US", "name": "加密資產相關股", "value": "—", "change": 0, "note": "10/21：**Circle（CRCL）與 Coinbase（COIN）各漲逾 4%**，因**聯邦銀行監管機構定案穩定幣規則**；Ro <body>

<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
/* ---------- render ---------- */
function render(){
document.getElementById("h-date").textContent=(DATA.dateLabel||DATA.date)+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;

document.getElementById("w-note").textContent=w.note||"";
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
if(sc.note){var _n=document.createElement("div");_n.className="empty-tasks";_n.style.marginTop="12px";_n.style.textAlign="left";_n.style.lineHeight="1.8";_n.textContent=sc.note;list.appendChild(_n);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2><span class='hint'>"+esc((DATA.mail&&DATA.mail.window)||"")+"</span></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div><div class='sender'>"+esc(it.tag)+"</div>"+
"<div class='subject'>"+esc(it.title)+"</div>"+
"<div class='action'>"+(it.deadline&&it.deadline!=="—"?"📌 "+esc(it.deadline)+" · ":"")+esc(it.kind||"")+"</div></div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+esc(it.detail||"")+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(m.footnote)html+="<div style='font-size:11px;color:#8b949e;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;line-height:1.6'>※ "+esc(m.footnote)+"</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2><span class='hint'>"+esc((DATA.news&&DATA.news.window)||"")+"</span></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+esc(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var cls=x.change==null?"":(x.change>=0?"up":"down");var arrow=x.change==null?"":(x.change>=0?" ▲":" ▼");return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+esc(x.value)+arrow+"</div><div class='k'>"+(x.change!=null?fmtChg(x.change)+(x.note?" · "+esc(x.note):""):esc(x.note||""))+"</div></div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(r.price)+"</td><td>"+esc(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2><span class='hint'>"+esc(mk.asOf||"")+"</span></div><div class='card-body'>"+
(mk.highlight?"<div class='hl-box'><div style='color:var(--green);font-weight:700;margin-bottom:4px'>🆕 觀察清單外・新熱門標的</div>"+esc(mk.highlight)+"</div>":"")+
(mk.note?"<div class='trade-date-note'>📅 "+esc(mk.note)+"</div>":"")+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+
"<p style='font-size:11.5px;color:var(--muted);margin:8px 0 18px'>每張卡是觀察清單的一個分類；點卡片切換同分類的下一支，右上角為前一交易日漲跌幅、卡上為 sparkline。</p>"+
"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"<p class='chart-note'>"+esc(mk.historyNote||"")+"</p></div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
(mk.disclaimer?"<p style='font-size:12px;color:var(--muted)'>"+esc(mk.disclaimer)+"</p>":"")+
"<p style='font-size:11.5px;color:var(--muted);margin-top:6px'>※ "+esc(SITE.watchlistNote||"")+"</p>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=Q[code],price=s[4]||100,ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=Q[code];
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:s[4]||100,ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
