00（UNIQLO 組）","calendar":{"title":"職涯教練計畫 UNIQLO 組報名截止","date":"2026-11-09","cat":"實習","pri":"中"}},{"level":"green","from":"成大雙語教育推動辦公室","subject":"11/9 英語午餐桌報名開跑，主題 Pet Peeves","todo":"想練口說就報名 11/9 中午場","title":"11月9日英語午餐桌報名開跑！快來一起練口說！","kind":"11/9（一）12:10–13:00 英語午餐桌，12:00 開始報到，需線上報名","detail":"每週不同主題的英語聊天活動，有桌長帶、可以問英語對話小撇步，還提供餐點。這週主題是 Pet Peeves（讓你爆炸的小事）。","deadline":"11/9（一）前報名","calendar":{"title":"英語午餐桌（Pet Peeves）","date":"2026-11-09","cat":"英文","pri":"低"}},{"level":"green","from":"成大國際關係組","subject":"11/10 台北科大 × 九州大學聯合研討會開放報名","todo":"對 AI／先進材料有興趣可報名 11/10 場","title":"活動轉知｜2026 Taipei Tech x Kyushu University Joint Symposium，歡迎有興趣之師生踴躍報名參加!","kind":"11/10（二）台北科大與日本九州大學聯合研討會，開放本校師生報名","detail":"聚焦人工智慧、智慧工程、先進材料、光電元件與綠色能源，是臺日學術交流場合。對工程科學系跨域或日本留學有興趣的話值得去看看。","deadline":"11/10（二）前報名","calendar":{"title":"Taipei Tech × 九州大學聯合研討會","date":"2026-11-10","cat":"特殊課","pri":"低"}}]},"news":{"groups":[{"label":"頭條","items":[{"en":"Wall Street suffers worst day in 19 months as the chip index plunges 12.25%","zh":"**美股四大指數全面重挫**，費半單日暴跌 12.25%，那斯達克跌 5.52% 正式進入修正區間。","summary":"US stocks fell sharply on Thursday November 5. The Nasdaq Composite dropped 1,421.52 points, or 5.52%, to 24,315.00, its worst single session in nineteen months and enough to confirm a correction after an eleven percent slide over the past month. The S&P 500 lost 4.36% to 7,353.73, the Dow fell 1,833.06 points or 3.44% to 51,523.06, and the Russell 2000 shed 4.4%. The Philadelphia Semiconductor Index collapsed 12.25%, its steepest fall since March 2020. Money moved into Treasuries, pushing the ten-year yield down about six basis points to 4.83%, while gold rose and bitcoin fell roughly 5.4%.","source":"鉅亨網／世界日報（11/5 美股盤後）","url":"https://news.cnyes.com/news/id/6648369"},{"en":"Post-election data centre policy fears trigger the AI selloff","zh":"**殺盤主因是 AI 政策風險**：民主黨期中選舉全勝後，多位新任州長主張嚴限資料中心興建，參議員桑德斯更喊全國暫停。","summary":"Investors read the Democratic sweep of both chambers and five governorships as a turning point for AI infrastructure policy. Newly elected governors including Gina Hinojosa in Texas, Keisha Lance Bottoms in Georgia and Amy Acton in Ohio campaigned on strict conditions for large data centre projects, and several incoming senators want limits on construction and power supply. Senator Bernie Sanders called for a nationwide pause on data centre building, a political proposal rather than an enacted ban. A Meta executive also said building data centres would become harder. The Nasdaq lost about 2.5 trillion dollars of market value in one day.","source":"經濟日報／中央社（11/6）","url":"https://money.udn.com/money/story/123398/9860953"},{"en":"Taiwan's TAIEX falls for a sixth straight day, down 1,374 points","zh":"**台股昨天已先跌 1,374.19 點收 41,574.72**，連 6 跌失守 42,000，外資賣超 1,024 億是史上第 10 大。","summary":"Taiwan's benchmark index closed on November 5 at 41,574.72, down 1,374.19 points or 3.2%, falling below 42,000 and marking a sixth consecutive decline. Turnover reached NT$926.0 billion. Foreign investors net sold about NT$102.5 billion, the tenth largest single-day outflow on record, and have now sold for six sessions running. The over-the-counter TPEx index fared far worse, dropping 22.03 points or 6.41% to 321.47, prompting the exchange to issue a statement urging investors not to panic. Memory and PCB names led the fall, with several hitting limit down, while textile stocks rose against the trend.","source":"鉅亨網／聯合新聞網（11/5 台股盤後）","url":"https://news.cnyes.com/news/id/6647916"},{"en":"COP31 climate summit opens in Antalya, Türkiye on November 9","zh":"**COP31 氣候峰會 11/9–20 在土耳其安塔利亞登場**，焦點是各國能否補上過去承諾的減碳與氣候資金缺口。","summary":"The thirty-first United Nations climate conference runs from November 9 to 20 in Antalya, Türkiye. Negotiators arrive with a credibility problem: the national climate plans submitted so far still point to warming well above the Paris Agreement's 1.5 degree goal, and the finance pledged to developing countries remains far short of what was promised at earlier summits. Expected flashpoints include the pace of the transition away from fossil fuels, rules for carbon markets, and who pays for adaptation and loss and damage. Delivery on existing commitments, rather than new headline targets, is the test observers say matters.","source":"Climate Home News／United Nations","url":"https://www.climatechangenews.com/2026/11/05/cop31-briefing-what-to-expect-from-the-antalya-climate-summit/"},{"en":"Vote counting continues in Alaska, Mississippi and Kansas after the Democratic sweep","zh":"**期中選舉開票仍在收尾**：阿拉斯加、密西西比與堪薩斯仍在計票，民主黨已確定同時掌握參眾兩院。","summary":"Counting continued in Alaska, Mississippi and Kansas several days after the November 3 midterms, though control of both chambers of Congress had already been decided for the Democrats. The result hands the party the House and the Senate alongside five governorships taken from Republicans, and analysts have framed it as a verdict on prices, health costs and tariffs. President Trump told CNBC he could work with Democrats on more issues than people expect. A divided government makes sweeping new legislation unlikely, which some investors read as lower policy risk even as AI regulation fears hit markets.","source":"NBC News 選情直播","url":"https://www.nbcnews.com/politics/2026-election/live-blog/election-results-house-senate-trump-congress-live-updates-rcna607549"}]},{"label":"科技","items":[{"en":"Apple puts five new products on sale today, including its first touchscreen MacBook Pro","zh":"**蘋果今天（11/6）開賣五款新品**：OLED iPad mini、M6 iMac、M6 MacBook Pro，以及史上第一款 OLED 觸控 MacBook Pro 14／16 吋。","summary":"Apple's five new products go on sale on Friday November 6, with pre-orders already open. The redesigned iPad mini starts at 699 dollars with an 8.5-inch OLED display, the A20 Pro chip, IP67 water resistance and a thinner body. A new iMac with the M6 chip starts at 1,499 dollars, and a spec-bumped 14-inch MacBook Pro with M6 starts at 1,999 dollars. The headline models are Apple's first touchscreen MacBook Pros, with OLED displays at 2,899 dollars for 14 inches and 3,399 dollars for 16 inches. Most pre-orders arrive on launch day, though Space Black touchscreen units slip three to four weeks.","source":"MacRumors","url":"https://www.macrumors.com/2026/11/05/apple-launching-five-new-products-tomorrow/"},{"en":"OpenAI hires away Anthropic's Claude Code product lead","zh":"**OpenAI 挖走 Anthropic 的 Claude Code 產品負責人 Cat Wu**，AI 寫程式工具的人才戰持續升溫。","summary":"OpenAI has recruited Cat Wu, who led product for Anthropic's Claude Code, the command line coding agent that became one of the company's fastest growing products. The move continues an unusually aggressive run of hiring between the two largest frontier labs, concentrated on the people who ship developer tools rather than on researchers. Coding agents have turned into the most commercially proven application of large language models, and both firms are racing to own the workflow that developers keep open all day. Neither company commented in detail on what she will build at OpenAI.","source":"WinBuzzer","url":"https://winbuzzer.com/2026/11/05/openai-hires-anthropics-ai-coding-product-leader-cat-wu-xcxwbn"},{"en":"Claude adds a personal finance feature with read-only bank access","zh":"**Claude 新增個人理財功能**，可用唯讀方式連結銀行帳戶做支出分析，資料不會被寫入或動用。","summary":"Anthropic is rolling out a personal finance capability in Claude that connects to a user's bank accounts in read-only mode. The assistant can then categorise spending, summarise cash flow and answer questions about a household budget without any ability to move money or change account settings. Read-only access is the key design choice: it limits the blast radius if the model misreads something, and it sidesteps the approval problem that has slowed agentic finance tools elsewhere. The feature puts Claude into direct competition with budgeting apps, and raises the usual questions about how long sensitive transaction data is retained.","source":"TestingCatalog","url":"https://testingcatalog.com/claude-adds-personal-finance-with-read-only-bank-access"}]},{"label":"運動","items":[{"en":"Thunder hold off the Lakers at home as Los Angeles fades on the road","zh":"**雷霆主場擊退湖人**，湖人客場後段跟不上節奏，衛冕軍開季手感依舊火燙。","summary":"Oklahoma City beat the Los Angeles Lakers at home, with the Lakers unable to match the defending champions' pace once the game tightened in the second half. The Thunder have leaned on the same formula that carried them through last season: relentless ball pressure, a deep rotation and enough shot creation to survive stretches when the outside shots stop falling. For the Lakers the loss continued a pattern of road games decided in the final quarter. The result keeps Oklahoma City near the top of the Western Conference standings in the early weeks of the season.","source":"Yahoo Sports","url":"https://sports.yahoo.com/articles/lakers-vs-thunder-live-score-003300991.html"},{"en":"Milwaukee Brewers win the first World Series title in franchise history","zh":"**釀酒人拿下隊史首座世界大賽冠軍**，結束球團五十多年的等待，2026 季後賽正式落幕。","summary":"The Milwaukee Brewers won the 2026 World Series, the first championship in a franchise history stretching back to 1969 and the end of one of baseball's longest title droughts. Milwaukee reached the series as the best regular season team in the National League and carried that form through October, winning with pitching depth and a lineup that produced without a single superstar bat. The win leaves only a handful of clubs still without a World Series trophy. Attention now turns to a free agent market that several contenders are expected to attack aggressively.","source":"CBS Sports","url":"https://www.cbssports.com/mlb/news/2026-mlb-playoff-bracket-schedule-scores-results-how-to-watch/"},{"en":"Japanese media grade the 2026 MLB season: Ohtani an A, Suzuki an S","zh":"**日媒評 2026 年大聯盟日籍球員**：鈴木誠也拿到最高的 S，大谷翔平只拿 A，投打二刀流負荷被點名。","summary":"Japanese media published season grades for Japanese players in Major League Baseball in 2026, giving Seiya Suzuki the top S rating and Shohei Ohtani an A. Suzuki's grade reflects a full healthy season and production that held up through the summer, while the assessment of Ohtani focused on the cost of carrying both a pitching and a hitting workload, which trimmed his numbers at the plate relative to his best years. The exercise is as much a commentary on usage as on talent, and feeds a long running debate in Japan about how long the two-way role is sustainable.","source":"NOWnews 今日新聞","url":"https://www.nownews.com/news/6889365"}]},{"label":"教育心理","items":[{"en":"Lawsuit says a Google AI tool used in school triggered a teenager's mental health crisis","zh":"**美國家庭提告**：校內使用的 Google AI 工具被指引發青少年心理危機，學校導入 AI 的責任界線成焦點。","summary":"A lawsuit filed in the United States alleges that a Google artificial intelligence tool used in a school setting contributed to a teenager's mental health crisis. The case matters less for its specific claims than for the question it forces: when a district deploys a general purpose AI system to students, who carries responsibility for how the model responds to a child in distress. Schools have adopted these tools quickly, often without the safeguarding review applied to counselling services. Expect the filing to be cited in arguments for clearer duty of care standards on educational AI.","source":"Claims Journal","url":"https://www.claimsjournal.com/news/national/2026/11/05/341139.htm"},{"en":"Scientists warn permanent daylight saving time carries a hidden cost","zh":"**永久日光節約時間有副作用**：研究指出長期把時鐘往後撥會讓生理時鐘與日照長期錯位，影響睡眠與學習表現。","summary":"Researchers warn that making daylight saving time permanent would leave clock time chronically misaligned with the solar day, pushing sunrise later in winter mornings. The concern is circadian: light in the early morning is what anchors the body clock, and removing it is associated with shorter sleep, later bedtimes and worse alertness, with adolescents the most exposed because school start times are fixed. The scientists argue permanent standard time fits human physiology better than permanent daylight saving, even though the latter is more politically popular for its late summer evenings.","source":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261103003157.htm"},{"en":"Psychologists petition the APA to create a psychedelic science division","zh":"**心理學界推動成立迷幻科學分支**，向美國心理學會請願設立專門部門，反映臨床研究已成主流議題。","summary":"A group of psychologists has petitioned the American Psychological Association to create a division dedicated to psychedelic science. Supporters argue the field has outgrown its position at the margins: clinical trials of psilocybin and MDMA assisted therapy now run at major universities, and practitioners need professional standards, training pathways and ethics guidance that no existing division owns. A dedicated division would also give the work institutional legitimacy inside the largest body of American psychologists. Critics inside the profession caution that evidence for durable benefit remains thinner than public enthusiasm suggests.","source":"PsyPost","url":"https://www.psypost.org/psychologists-petition-to-create-a-psychedelic-science-division-within-the-apa/"}]},{"label":"產業動態（AI／半導體／量子）","items":[{"en":"Chip stocks post historic losses: Micron down 17%, AMD down 17%, SanDisk down 22%","zh":"**半導體股歷史性重挫**：美光 −17.46%、AMD −17.26%、SanDisk −22.26%、SK海力士 ADR −13.40%、台積電 ADR −10.78%。","summary":"The semiconductor selloff on November 5 was broad and violent. Micron fell 17.46%, AMD 17.26% and SanDisk 22.26%, with SK Hynix's ADR down 13.40% and TSMC's ADR down 10.78%. Nvidia lost 9.26%, erasing roughly 447 billion dollars of market value in a single session. Qualcomm fell about 9.5% after reporting weaker smartphone chip sales and margins squeezed by rising memory costs, and Arm's 27% revenue growth still missed the most optimistic outlooks. Dell dropped 15% and CoreWeave 9.8%. Analysts expect volatility-driven funds to sell roughly 135 billion dollars of US equity futures over the next day or two.","source":"世界日報／鉅亨網","url":"https://www.worldjournal.com/wj/story/121477/9860949"},{"en":"Memory makers lead Taiwan's rout with multiple limit-down closes","zh":"**台股記憶體與 PCB 族群跌停**：南亞科、華邦電雙雙跌停，日月光 −8.77%、旺宏 −8.60%、台光電與金像電跌停。","summary":"Taiwan's memory and PCB groups absorbed the worst of the November 5 selling. Nanya Technology and Winbond both closed limit down at 9.89%, at NT$360 and NT$127.5 respectively, while Macronix fell 8.60% and Elite Semiconductor 7.56%. ASE Technology dropped 8.77% and Delta Electronics 7.38%, the latter caught by the same data centre policy fears hitting US power names. In copper clad laminate and PCB, Elite Material closed limit down at NT$4,100 and Career Technology at NT$868. MediaTek fell 6.86% to NT$3,460 while TSMC held up far better at a 0.88% decline.","source":"鉅亨網台股盤後","url":"https://news.cnyes.com/news/id/6647916"},{"en":"Claude's user base grows 1,260% but ChatGPT still leads by a wide margin","zh":"**Claude 一年成長 1,260%**，但 ChatGPT 仍穩居第一，Gemini 則靠 Google 生態系緊追。","summary":"App analytics from Sensor Tower show Claude growing about 1,260% year on year, the fastest expansion among the major consumer AI assistants, while ChatGPT remains comfortably the largest by downloads and active users. Gemini sits between them, boosted less by standalone app installs than by distribution through Google's existing products. The pattern suggests the consumer assistant market is still widening rather than consolidating: rapid percentage growth from a smaller base has not yet dented the incumbent's lead. Enterprise and developer revenue, where Anthropic is strongest, is not captured by these figures at all.","source":"Trending Topics／Sensor Tower","url":"https://trendingtopics.eu/sensor-tower-claude-growth-chatgpt-gemini"}]},{"label":"追星（僅限清單內歌手）","items":[{"en":"Kenshi Yonezu's 2026 TOUR / GHOST opens tonight in Nagano","zh":"**米津玄師「2026 TOUR / GHOST」今天 11/6（五）長野 Big Hat 開跑**，日本 6 城 14 場到 12/17 橫濱；**台北大巨蛋 12/26–27**。　▶ **Spotify**：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB","summary":"Kenshi Yonezu's arena tour 2026 TOUR / GHOST opens on Friday November 6 at Nagano Big Hat, the first of fourteen shows across six Japanese cities. The run takes in K-Arena Yokohama on November 11 and 12, Osaka-jo Hall on the 18th and 19th, Marine Messe Fukuoka on the 27th and 28th, Sendai's Sekisui Heim Super Arena in early December and Portmesse Nagoya on December 8 and 9, before closing with two nights back at K-Arena Yokohama on December 16 and 17. Reserved seats are 9,900 yen. The overseas leg brings him to Taipei Dome on December 26 and 27.","source":"Mikiki／音楽ナタリー","url":"https://mikiki.tokyo.jp/articles/-/41560"},{"en":"YOASOBI sell out two Taipei Dome nights, about 70,000 tickets gone at once","zh":"**YOASOBI 2027 年 1 月台北大巨蛋 2 天**，約 7 萬張票開賣即完售，是台灣場規模最大的一次。　▶ **Spotify**：https://open.spotify.com/search/YOASOBI","summary":"YOASOBI will play two nights at Taipei Dome in January 2027, and the roughly seventy thousand tickets across both shows sold out almost immediately. The scale is a step up from the group's earlier Taiwan appearances at arena-sized venues, and puts them among the small number of Japanese acts who can fill a dome outside Japan. The dates sit inside the same world tour cycle that has been running through Asia this year. Fans who missed out are watching for resale arrangements and for whether a third date gets added.","source":"ORICON NEWS／音楽ナタリー","url":"https://natalie.mu/music/news/687365"},{"en":"King Gnu announce their first headline US tour for 2027","zh":"**King Gnu 宣布 2027 年首度美國巡演**，接在史上最大規模亞洲巡迴 15 城 29 場之後。　▶ **Spotify**：https://open.spotify.com/search/King%20Gnu","summary":"King Gnu have announced their first headline tour of the United States, scheduled for 2027. It follows the band's largest Asian tour to date, a twenty-nine show run across fifteen cities, and continues a steady widening of their touring map rather than a one-off festival appearance. The band has also been unusually relaxed about phone filming at recent shows, saying they do not actively encourage it but will allow photography and recording during the new tour, a policy that has helped their live clips spread outside Japan.","source":"音楽ナタリー","url":"https://natalie.mu/music/news/696068"},{"en":"Aimer announces a national hall tour starting next September","zh":"**Aimer 宣布明年 9 月起全國 Hall 巡迴**，場館型巡演規模，台港場次尚未公布。　▶ **Spotify**：https://open.spotify.com/search/Aimer","summary":"Aimer has announced a national hall tour in Japan beginning next September. Hall venues rather than arenas suit the detail in her live arrangements, and the long lead time gives room for a release to land before the tour starts. No Taiwan or Hong Kong dates have been announced yet, which for an artist with a sizeable following across Chinese-speaking Asia usually means an overseas leg is decided later. Ticket priority is expected to run through her fan club first, as on previous tours.","source":"Skream!","url":"https://en.skream.jp/news/2026/11/aimer_hall_tour.php"}]}]},"market":{"insights":["**美股昨夜崩盤**：費半 −12.25% 是 2020/3 以來最慘，那指 −5.52% 正式進入修正","**殺盤主因是政策風險**：民主黨全勝後新州長主張嚴限 AI 資料中心，桑德斯喊全國暫停興建","**台股昨天已先跌 1,374 點收 41,574**，連 6 跌、櫃買 −6.41%，外資賣超 1,024 億史上第 10 大","**台股夜盤一度失守 4 萬點**，今天 40,000 整數關卡是最關鍵支撐，開盤先別急著接刀","**資金轉進避險**：10 年期美債殖利率降至 4.83%、黃金走強，比特幣反而跌 5.4%"],"indices":[{"market":"TW","name":"加權指數 TAIEX","value":"41,574.72","change":-3.2,"changePts":"-1,374.19","comment":"連 6 跌，失守 42,000"},{"market":"TW","name":"櫃買指數 OTC","value":"321.47","change":-6.41,"changePts":"-22.03","comment":"中小型股殺更深"},{"market":"TW","name":"0050 元大台灣50","value":"—","change":null,"comment":"連 6 跌、百元關卡以下，精確收盤未取得"},{"market":"TW","name":"0056 元大高股息","value":"—","change":null,"comment":"11/5 精確收盤未取得"},{"market":"US","name":"那斯達克 Nasdaq Composite","value":"24,315.00","change":-5.52,"changePts":"-1,421.52","comment":"19 個月最慘，進入修正"},{"market":"US","name":"S&P 500","value":"7,353.73","change":-4.36,"changePts":"-334.89","comment":"幾乎全類股下跌"},{"market":"US","name":"道瓊工業指數 Dow Jones","value":"51,523.06","change":-3.44,"changePts":"-1,833.06","comment":"一日倒吐前天漲幅"},{"market":"US","name":"羅素 2000 Russell 2000","value":"2,729.89","change":-4.4,"changePts":"-127.06","comment":"中小型股同步補跌"},{"market":"US","name":"費半／半導體指數 SOX","value":"—","change":-12.25,"comment":"2020/3 以來最大單日跌幅"},{"market":"US","name":"QQQ（那斯達克100 ETF）","value":"—","change":null,"comment":"11/5 精確收盤未取得"}],"quotes":{"2408":-9.89,"2344":-9.89,"3711":-8.77,"2337":-8.6,"2308":-7.38,"2454":-6.86,"2330":-0.88,"2317":-2.08,"2382":-0.83,"MU":-17.46,"AMD":-17.26,"SNDK":-22.26,"NVDA":-9.26,"TSM":-10.78,"QCOM":-9.5,"DELL":-15.0,"CRWV":-9.8},"prices":{"2408":360,"2344":127.5,"2454":3460,"2330":2240,"2383":4100,"2368":868,"NVDA":181.6,"CRWV":43.66},"movers":[{"name":"SanDisk","ticker":"SNDK","change":-22.26,"price":"—","reason":"記憶體財報與成本壓力，跌幅之冠"},{"name":"美光 Micron","ticker":"MU","change":-17.46,"price":"—","reason":"記憶體漲價紅利被 AI 支出疑慮抵銷"},{"name":"超微 AMD","ticker":"AMD","change":-17.26,"price":"—","reason":"AI 晶片需求展望遭重新評價"},{"name":"戴爾 Dell（清單外）","ticker":"DELL","change":-15.0,"price":"—","reason":"AI 伺服器出貨節奏被質疑"},{"name":"SK海力士 ADR（清單外）","ticker":"SKHY","change":-13.4,"price":"—","reason":"記憶體族群連動重挫"},{"name":"台積電 ADR","ticker":"TSM","change":-10.78,"price":"—","reason":"外資提款 AI 權值龍頭"},{"name":"南亞科","ticker":"2408","change":-9.89,"price":"360 元","reason":"跌停，記憶體賣壓最重"},{"name":"華邦電","ticker":"2344","change":-9.89,"price":"127.5 元","reason":"跌停，記憶體八雄全倒"},{"name":"台光電","ticker":"2383","change":-9.9,"price":"4,100 元","reason":"跌停，CCL／PCB 族群重災區"},{"name":"金像電","ticker":"2368","change":-9.9,"price":"868 元","reason":"跌停，PCB 跟著 AI 伺服器修正"},{"name":"CoreWeave（清單外）","ticker":"CRWV","change":-9.8,"price":"43.66 美元","reason":"資料中心政策風險直接受害"},{"name":"高通 Qualcomm（清單外）","ticker":"QCOM","change":-9.5,"price":"—","reason":"手機晶片不如預期、記憶體成本吃掉毛利"},{"name":"輝達 NVIDIA","ticker":"NVDA","change":-9.26,"price":"181.60 美元","reason":"一日蒸發約 4,470 億美元市值"},{"name":"日月光投控","ticker":"3711","change":-8.77,"price":"—","reason":"封測龍頭同步補跌"},{"name":"旺宏","ticker":"2337","change":-8.6,"price":"—","reason":"記憶體族群殺盤主角之一"},{"name":"晶豪科（清單外）","ticker":"3006","change":-7.56,"price":"—","reason":"記憶體 IC 設計跟跌"},{"name":"台達電","ticker":"2308","change":-7.38,"price":"—","reason":"電源族群被資料中心政策波及"},{"name":"聯發科","ticker":"2454","change":-6.86,"price":"3,460 元","reason":"電子權值股全數收黑"},{"name":"儒鴻（清單外 · 逆勢大漲）","ticker":"1476","change":8.64,"price":"—","reason":"資金從電子轉進紡織傳產避險"}]}},"archive":{"dates":["2026-11-06","2026-11-05","2026-11-04","2026-11-03","2026-11-02","2026-11-01","2026-10-31","2026-10-30","2026-10-29","2026-10-28","2026-10-27","2026-10-26","2026-10-25","2026-10-24","2026-10-23","2026-10-22","2026-10-21","2026-10-20","2026-10-19","2026-10-18","2026-10-17","2026-10-16","2026-10-15","2026-10-13","2026-10-12","2026-10-11","2026-10-10","2026-10-08","2026-10-07"]}};</script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--card:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;min-height:100vh}
a{color:var(--accent)}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.header-left .date{font-size:13px;color:var(--muted);margin-top:3px}
.header-left .ver{font-size:10px;color:#484f58;margin-top:2px}
.head-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.weather-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.55}
.weather-badge .w-icon{font-size:20px}
.weather-badge .w-row{display:flex;gap:6px;white-space:nowrap}
.weather-badge .w-city{color:var(--muted);min-width:2.2em}
.weather-badge .w-t{color:var(--orange);font-weight:700}
.weather-badge .w-d{color:var(--text)}
.weather-badge .w-alerts{margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.w-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid}
.w-tag.red{color:var(--red);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.w-tag.yellow{color:var(--yellow);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
.w-tag.ok{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.highlights{max-width:1400px;margin:16px auto 0;padding:0 20px}
.highlights .hl-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 18px}
.highlights h2{font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700}
.highlights ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.highlights li{font-size:14px;line-height:1.6;color:var(--text);padding-left:16px;position:relative}
.highlights li::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.highlights li b{color:#fff}
.date-select,.notion-btn{border:1px solid var(--border);border-radius:8px;font-size:13px}
.date-select{background:var(--bg2);color:var(--text);padding:8px 10px}
.notion-btn{background:#1f6feb;color:#fff;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1400px;margin:0 auto}
.full-width{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-header h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .hint{font-size:11px;color:var(--muted)}
.card-body{padding:16px 18px}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.ring-container{position:relative;width:110px;height:110px;margin-bottom:12px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-text .pct{font-size:20px;font-weight:700;color:var(--accent)}
.ring-text .sub{font-size:10px;color:var(--muted)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.2s}
.task-cb.checked{background:var(--green);border-color:var(--green)}
.task-cb.checked::after{content:'✓';color:#fff;font-size:11px}
.task-info{flex:1}
.task-name{font-size:13px;font-weight:500}
.task-name.done{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}

<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge" id="w-box"><span class="w-icon">🌤️</span><div>—</div></div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div class="highlights" id="hl" hidden></div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";

/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
