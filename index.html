兵地雷、金額逾 1 億美元** —— 今年 1 月退出《禁雷公約》後的首筆大單，國際禁雷運動要求撤回", "summary": "Finland announced it will purchase one million anti-personnel landmines at a cost of more than one hundred million dollars, following its withdrawal from the Mine Ban Treaty in January. The International Campaign to Ban Landmines urged Finland and other states to reverse course, warning the weapons kill civilians for decades after conflicts end. Finland shares a long border with Russia and frames the purchase as deterrence. Separately, a Russian satellite was reported manoeuvring close to a Finnish-American radar satellite used by Ukraine's military.", "source": "Democracy Now! — Headlines for October 20, 2026", "url": "https://www.democracynow.org/2026/10/20/headlines"}, {"en": "Drone strike near a market in Sudan's West Kordofan kills 80 people, among the deadliest single attacks of the war", "zh": "**蘇丹西科爾多凡市集遭無人機襲擊、80 人死亡** —— 開戰以來最血腥的單次攻擊之一，雙方互相指責，累計逾 1,300 萬人流離失所", "summary": "A drone strike near a market in Sudan's West Kordofan state killed eighty people on Sunday, making it one of the deadliest single attacks since the war began in April 2023. The paramilitary Rapid Support Forces blamed the Sudanese Armed Forces, which denied responsibility. Markets have repeatedly been hit in the conflict, and aid agencies say access to the region remains severely restricted. More than thirteen million people have now been displaced, in what the UN describes as the world's largest displacement crisis.", "source": "Democracy Now! — Headlines for October 20, 2026", "url": "https://www.democracynow.org/2026/10/20/headlines"}, {"en": "Brazil's Electoral Court gives Meta 24 hours to prove it treats both campaigns equally before Sunday's presidential runoff", "zh": "**巴西選舉法院給 Meta 24 小時自證公平** —— 聖保羅民眾包圍 Meta 辦公室抗議干預選舉，週日魯拉對決小波索納洛", "summary": "Protesters rallied outside Meta's offices in São Paulo accusing the company of electoral interference ahead of Sunday's presidential runoff between incumbent President Lula and Flávio Bolsonaro. Brazil's Electoral Court gave Meta twenty-four hours to demonstrate that it applies its advertising and moderation rules equally to both campaigns. The dispute echoes earlier Brazilian clashes with US platforms over disinformation. A ruling against Meta could force changes to political advertising on Facebook and Instagram days before voting.", "source": "Democracy Now! — Headlines for October 20, 2026", "url": "https://www.democracynow.org/2026/10/20/headlines"}, {"en": "Seventh person dies in ICE custody in Texas this year; family says heart and diabetes medication was withheld", "zh": "**德州今年第 7 名移民拘留所死亡案** —— 56 歲合法永久居民安德拉德-科瓦魯比亞斯在 GEO Group 設施中被發現失去意識，家屬稱藥物被拒給", "summary": "Emiliano Andrade-Covarrubias, a fifty-six-year-old lawful permanent resident, was found unresponsive at a GEO Group-run immigration detention centre in Laredo, Texas. His family says he was denied his heart and diabetes medications while detained. He is the seventh person to die in ICE custody in Texas this year, a figure advocates call unprecedented. In a separate incident in Long Beach, California, video shows ICE agents kneeling on former city employee Ricardo Gonzalez during a protest, breaking his arm.", "source": "Democracy Now! — Headlines for October 20, 2026", "url": "https://www.democracynow.org/2026/10/20/headlines"}]}, {"label": "科技", "items": [{"en": "Anthropic's draft S-1 reportedly shows $16.3B first-half revenue, an $80.7B net loss, and a $518B compute commitment", "zh": "**Anthropic 傳遞交 IPO 草案、目標 11 月上市估值約 2 兆美元** —— 上半年營收 163 億美元、淨虧 807 億（多為非現金），兩個未具名客戶佔營收約 25%", "summary": "Reports on Anthropic's draft S-1 filing describe sixteen point three billion dollars of revenue in the first half of 2026 against an eighty point seven billion dollar net loss that is said to be mostly non-cash. Roughly a quarter of revenue reportedly comes from just two unnamed customers, a concentration risk investors will scrutinise. The company has committed about five hundred and eighteen billion dollars to compute over roughly a decade and is said to target a two trillion dollar valuation in a November listing. Figures remain unconfirmed by Anthropic.", "source": "Artificially Intimidating / AI Weekly — AI News, October 20, 2026（★ 此為媒體轉述未經公司確認的草案數字，請以正式公開文件為準）", "url": "https://aiweekly.co/ai-news-today"}, {"en": "OpenAI says GPT-6.1 Sol scores 97.9% on its COBOL migration eval, up from 5.4% for the previous model", "zh": "**OpenAI 宣稱新模型把 COBOL 遷移正確率從 5.4% 拉到 97.9%** —— 針對銀行與 ATM 的半世紀老程式碼，但測驗由 OpenAI 自己出題自己評分", "summary": "OpenAI reports that GPT-6.1 Sol reaches ninety-seven point nine percent on its internal COBOL migration evaluation at maximum reasoning effort, against five point four percent for GPT-5.6 Sol, and eighty-six point six percent at low effort for roughly sixty-one percent less cost. On MultiLangBench, GPT-6 Astra averages eighty-seven point four percent across twenty languages, up from twenty-six point eight. OpenAI notes COBOL underpins over forty percent of online banking and ninety-five percent of ATM transactions. The company wrote and graded both benchmarks itself.", "source": "Artificially Intimidating — AI Brief, October 20, 2026", "url": "https://artificiallyintimidating.com/p/ai-brief-october-20-2026"}, {"en": "Google open-sources TorchTPU and proposes a 780MW AI data centre in Pine Island, Minnesota", "zh": "**Google 開源 TorchTPU，讓 PyTorch 幾乎不改程式就能跑 TPU** —— 同日提出明尼蘇達 780MW AI 資料中心，並承諾為電網出資 1,400MW 風電、200MW 太陽能、300MW 儲能", "summary": "Google released TorchTPU, an open-source PyTorch variant that runs on its own TPUs with minimal code changes, alongside a TPU agent suite that helps developers port applications and fix errors, and an updated LiteRT for mobile and embedded devices. The launch landed a day after Amazon's TorchNeuron release for AWS Trainium, underlining how aggressively both firms are courting PyTorch developers away from CUDA. Google separately proposed a seven hundred and eighty megawatt data centre in Pine Island, Minnesota, financing 1,400MW of wind, 200MW of solar and 300MW of storage.", "source": "AI Weekly — AI News Today, October 20, 2026", "url": "https://aiweekly.co/ai-news-today"}]}, {"label": "運動", "items": [{"en": "Wei Chuan Dragons shut out CTBC Brothers 6-0 to take a 3-0 lead in the Taiwan Series; Game 4 is tonight", "zh": "**台灣大賽 G3 味全龍 6:0 完封中信兄弟、3 連勝聽牌** —— 兄弟三場打擊率 0.100 寫下隊史最慘，今晚 G4 龍隊就能封王", "summary": "The Wei Chuan Dragons shut out the CTBC Brothers six to nothing in Game 3 of the Taiwan Series at Taipei Dome on Monday night, taking a commanding three games to none series lead. The Brothers managed just one hit and are batting a dismal .100 across the three games, the worst mark in the franchise's Taiwan Series history. Dragons manager Yeh Chun-chang said he never expected to be one win away this quickly. Game 4 is tonight, with the Dragons able to clinch the championship.", "source": "鏡週刊 Mirror Media／壹蘋新聞網 — 2026/10/20", "url": "https://www.mirrormedia.mg/story/20261020edi083"}, {"en": "Tampa Bay Rays beat Cleveland 7-3 in ALCS Game 6 and will face the Milwaukee Brewers in the World Series from Friday", "zh": "**光芒 7:3 收下美聯冠軍賽第六戰、隊史第三次闖進世界大賽** —— 卡米內羅與迪亞茲各扛兩分砲，週五在密爾瓦基與釀酒人開打", "summary": "The Tampa Bay Rays beat the Cleveland Guardians seven to three in Game 6 of the American League Championship Series at Tropicana Field, closing out the series in six games with a third straight win. Junior Caminero and Yandy Diaz each hit a two-run homer, with Diaz's eighth-inning blast restoring a four-run cushion. It is the Rays' third World Series appearance in franchise history. They will face the Milwaukee Brewers, with Game 1 scheduled for Friday in Milwaukee.", "source": "Honolulu Star-Advertiser — October 20, 2026", "url": "https://staradvertiser.com/2026/10/20/sports/sports-breaking/two-run-homers-send-rays-to-world-series-with-game-6-win"}, {"en": "NBA 2026-27 season tips off with a Western Conference Finals rematch: Thunder at Spurs", "zh": "**NBA 新球季今天開打，首戰就是西區冠軍賽重演** —— 雷霆作客馬刺（台灣時間今天 09:30），同日三場開幕戰", "summary": "The 2026-27 NBA season opens with a nationally televised Western Conference Finals rematch as the Oklahoma City Thunder visit the San Antonio Spurs at Frost Bank Center, tipping off at 9:30pm Eastern on Tuesday, which is 9:30am Taipei time on Wednesday. The league scheduled three games for opening night. The Spurs-Thunder matchup headlines what broadcasters are selling as the most promising young rivalry in the Western Conference, after the two met in last season's conference finals.", "source": "NBA.com／News 4 San Antonio — 2026 NBA opening night", "url": "https://www.nba.com/game/okc-vs-sas-0022600003"}]}, {"label": "教育心理", "items": [{"en": "Your body's physiological state may shape whether your best ideas arrive as words or as images", "zh": "**身體狀態會決定你的好想法是「文字型」還是「圖像型」** —— 對正在排讀書計畫的你很實用：換個生理狀態，可能換到另一種思考模式", "summary": "New research in cognitive science suggests a person's bodily and physiological state may influence whether their best ideas surface in verbal or visual form. The finding fits a broader embodied cognition literature arguing that thinking is not purely abstract but shaped by bodily signals such as arousal, posture and interoceptive state. If replicated, the practical implication is that switching physical state, through movement, rest or changed environment, could shift which representational mode of problem solving comes most easily during study or revision.", "source": "PsyPost — Cognitive Science, October 19, 2026", "url": "https://www.psypost.org/your-bodys-state-may-shape-whether-your-best-ideas-are-verbal-or-visual/"}, {"en": "A larger paycheck tends to come with measurable personality changes, a large-scale analysis of psychology research finds", "zh": "**薪水變高，人格也會跟著變** —— 大規模整合分析發現收入上升與人格特質改變有系統性關聯，不只是「有錢人本來就這樣」", "summary": "A large-scale analysis of psychology research reports that rising income is systematically associated with shifts in personality traits, rather than simply reflecting pre-existing differences between rich and poor people. The direction of causation remains the central open question, since personality also predicts earnings. For students planning careers, the finding is a reminder that occupational and financial trajectories may reshape dispositions over time. The authors call for longitudinal designs that track the same individuals as their earnings change.", "source": "PsyPost — Business, October 20, 2026", "url": "https://www.psypost.org/a-bigger-paycheck-tends-to-come-with-personality-changes-according-to-a-large-scale-analysis-of-psychology-research/"}, {"en": "Online meat-shaming appears to do little to change minds, new research suggests", "zh": "**網路上公開羞辱吃肉的人，幾乎改變不了任何人的想法** —— 道德心理學研究再次指出，羞辱式說服對態度轉變無效甚至反效果", "summary": "New moral psychology research suggests that publicly shaming people online over meat consumption does little to shift their attitudes. The result aligns with a wider literature showing that shame-based persuasion often triggers defensiveness and identity protection rather than genuine attitude change, and can harden the position being targeted. The study matters beyond diet debates, since the same dynamic appears in online argument about climate, public health and politics, where moralised criticism is the default rhetorical move.", "source": "PsyPost — Moral Psychology, October 20, 2026", "url": "https://www.psypost.org/online-meat-shaming-may-do-little-to-change-minds-new-research-suggests/"}]}, {"label": "產業動態（AI／半導體／量子）", "items": [{"en": "ByteDance, Alibaba and Tencent reportedly ordered over 3 million Nvidia RTX PRO 5500 cards worth more than $35B — more than Nvidia can build", "zh": "**中國三巨頭傳下單超過 300 萬張 Nvidia RTX PRO 5500、金額逾 350 億美元** —— 但 Nvidia 告知夥伴 2027 年最多只能做 300 萬顆，客戶可能只拿到 5–10%", "summary": "ByteDance, Alibaba and Tencent have reportedly placed orders for more than three million Nvidia RTX PRO 5500 cards worth over thirty-five billion dollars. Nvidia has told partners it can manufacture no more than three million of these chips during 2027, meaning individual customers may receive only five to ten percent of what they requested. The gap illustrates how acute AI accelerator scarcity has become even for export-compliant parts. Separately, OpenAI has reportedly dropped its push for strict US chip export controls on China after Nvidia took a thirty billion dollar equity stake.", "source": "AI Weekly — AI News Today, October 20, 2026", "url": "https://aiweekly.co/ai-news-today"}, {"en": "SK hynix targets January 2027 for an HBF standard and shows DRAM stacked directly on AI processor dies, as its shares post their worst week since 2008", "zh": "**SK 海力士拚 2027 年 1 月定出 HBF 標準，並展示直接疊在運算晶片上的 3D DRAM** —— 同時其股價寫下 2008 年以來最慘一週，記憶體題材正處「技術大躍進、股價先修正」的落差", "summary": "SK hynix is targeting January 2027 for a High Bandwidth Flash standard and has shown a memory tier above HBM in which 3D stacked DRAM mounts directly onto processor dies, aimed at AI inference capacity. Samsung and SK hynix both showcased zHBM and HBF concepts at SEDEX 2026 as the industry attacks the AI memory bottleneck. SK hynix holds roughly sixty-two percent of the HBM market, with Micron now ahead of Samsung, and the 2026 battle pivoting to HBM4. The stock nonetheless logged its worst week since 2008.", "source": "DigiTimes／TechTimes／Astute Group／Benzinga — 2026/10/13–10/20", "url": "https://www.digitimes.com/news/a20261015PD218/sk-hynix-dram-ai-inference-capacity-2027.html"}, {"en": "Nvidia signs a physical-AI pact with the German government, while Jim Keller's Tenstorrent raises $1.5B at a $6.2B valuation", "zh": "**Nvidia 與德國政府簽署「實體 AI」合作宣言、黃仁勳稱德國工廠資料是「天然資源」** —— 同時 Jim Keller 的 Tenstorrent 完成 15 億美元 E 輪、投後估值 62 億，AI 晶片挑戰者資金仍在湧入", "summary": "At the Invest in Germany Summit in Berlin, Chancellor Friedrich Merz and two federal ministries signed a Joint Declaration of Intent with Nvidia to develop AI models for physical AI covering robotics, manufacturing and vehicles. Jensen Huang urged German carmakers and machine builders to adopt AI quickly, calling the country's factory data a natural resource, in an economy that has barely grown since the pandemic. Separately Jim Keller's Tenstorrent raised a one point five billion dollar Series E at a six point two billion post-money valuation. No major quantum computing news appeared in the window.", "source": "Artificially Intimidating／AI Weekly — October 20, 2026", "url": "https://artificiallyintimidating.com/p/ai-brief-october-20-2026"}]}, {"label": "追星（J-POP 清單內歌手）", "items": [{"en": "Kenshi Yonezu announces his largest-ever world tour \"GHOST\" — 11 cities, 14 shows, including two nights at Taipei Dome on December 26-27", "zh": "**米津玄師宣布生涯最大規模世界巡演「GHOST」，首站就是台北大巨蛋 12/26–12/27 兩天** —— 距今約 2 個月，這是你清單內歌手今年最大的台灣場，請務必盯票", "summary": "Kenshi Yonezu announced GHOST, his largest world tour to date, covering eleven cities and fourteen shows from December 26, 2026 to February 28, 2027, with total attendance projected around two hundred thousand. Asia gets three cities: Taipei Dome for two nights on December 26 and 27, Seoul for three nights, and Singapore. North America covers Oakland, Los Angeles, Mexico City, New York/Newark and Toronto; Europe covers London, Paris and Amsterdam. The tour follows Chainsaw Man theme song IRIS OUT, which set the all-time weekly streaming record in Japan.", "source": "アニメ！アニメ！／音楽ナタリー — 2026/10/15 · 🎧 Spotify：https://open.spotify.com/search/%E7%B1%B3%E6%B4%A5%E7%8E%84%E5%B8%AB", "url": "https://animeanime.jp/article/2026/10/15/103844.html"}, {"en": "Fujii Kaze's Prema World Tour opens at Kaohsiung National Stadium on October 31 — ten days away, and sold out", "zh": "**藤井風高雄國家體育場就在 10 天後（10/31），門票已完售** —— Prema World Tour 全球首站獻給台灣，之後接曼谷 12/26、首爾 2027/1/9，香港場取消", "summary": "Fujii Kaze opens his Prema World Tour at Kaohsiung National Stadium on October 31, 2026, the tour's only Taiwan date and now ten days away, with tickets sold out. The world tour's opening night being given to Taiwan drew significant local coverage. Later stops include Bangkok's Supachalasai National Stadium on December 26 and Seoul's Gocheok Sky Dome on January 9, 2027, while the Hong Kong show was cancelled. Japanese dome legs follow at Fukuoka, Osaka and Tokyo Dome between November and December.", "source": "Blow 吹音樂／Bella／Yahoo 新聞 — 藤井風 Prema World Tour 高雄場 · 🎧 Spotify：https://open.spotify.com/search/Fujii%20Kaze%20%E8%97%A4%E4%BA%95%E9%A2%A8", "url": "https://blow.streetvoice.com/88142/"}, {"en": "Mrs. GREEN APPLE's first gelato pique collaboration goes on sale, as new song \"Damashi\" fronts an anan cover story", "zh": "**Mrs. GREEN APPLE × gelato pique 聯名系列昨天（10/20）開賣** —— 全日本門市與線上同步，另有青蘋果原創角色；新曲「瞞し」同期登上《anan》封面特輯", "summary": "Mrs. GREEN APPLE's first collaboration with loungewear brand gelato pique, titled Mrs. GREEN APPLE with GELATO PIQUE, went on sale on October 20, 2026 at gelato pique stores nationwide in Japan and through its online store, accompanied by an original green-apple character. In the same period the band fronted an anan cover story built around new song Damashi, surprise-released an MV described as unbroadcastable on terrestrial television, and became the first Japanese act to have YouTube turn its progress bar green-apple coloured.", "source": "Billboard JAPAN／ORICON NEWS — 2026/10 · 🎧 Spotify：https://open.spotify.com/search/Mrs.%20GREEN%20APPLE", "url": "https://www.billboard-japan.com/d_news/detail/166064"}, {"en": "King Gnu's CEN+RAL Tour 2026 is the band's largest ever, with first-time stops in Bangkok and Hong Kong", "zh": "**King Gnu「CEN+RAL Tour 2026」是樂團史上最多都市、最多場次的巡演** —— 15–16 都市、29 公演，首度加入曼谷與香港；台灣場次尚未公布，香港場是最近的選項", "summary": "King Gnu's CEN+RAL Tour 2026 is billed as the largest tour in the band's history, spanning fifteen to sixteen cities and twenty-nine performances after an added Yokohama date, and including first-ever shows in Niigata, Bangkok and Hong Kong. No Taiwan date has been announced, which makes the Hong Kong show the nearest option for Taiwan-based fans. The tour final is scheduled for a live stream on Lemino, with WOWOW also carrying broadcast coverage, so the shows will be watchable without travelling.", "source": "Real Sound／音楽ナタリー／fashion-press — King Gnu CEN+RAL Tour 2026（★ 巡演日程為既有公告，本窗口內無新增變動）· 🎧 Spotify：https://open.spotify.com/search/King%20Gnu", "url": "https://realsound.jp/2025/10/post-2179448.html"}]}]}, "market": {"asOf": "台股＝**2026/10/20（二）13:30 收盤**；美股＝**2026/10/20（二）正規盤收盤**（台灣今天 10/21 清晨 04:00 結束）。　★★ **今天這一區最重要的一句話：台股昨天又崩 529 點、外資連 10 個交易日賣超再砍 795 億；但美股昨晚道瓊 +1.02%、羅素 2000 +1.65%、醫療類股創歷史新高，那斯達克卻只有 -0.02%、META 連五跌 —— 錢沒走，是從 AI 大型股輪動到價值股與小型股。所以今天台股開盤要問的不是「美股漲不漲」，而是「這波輪動會不會讓台股電子繼續被抽血」。**", "highlight": "**一句話：美股昨晚漲的是醫療、金融、小型股，不是半導體 —— 對台股幾乎沒有救援效果。**台股 10/20：加權 **46,292.93（-1.13%、-529.15 點）**，開盤 46,712.57、盤中最高 46,967.91、最低 **46,163.03**，成交 **7,586.84 億元**（量再縮）；**櫃買指數 387.88（-1.57%）**跌更凶。**三大法人合計賣超 968.04 億**，其中**外資賣超 795.4 億、連續第 10 個交易日賣超、累計約 8,380.65 億**；自營商賣超 355.8 億；投信則連 8 買、買超 183.15 億（累計約 1,330 億）。**金融類股 -2.36%**、電子類股 -0.92% —— **昨天真正被殺的是金融，不是電子。**權值股：台積電 **2,405（-0.62%、-15 元）**、台達電 **1,605（-2.13%）**、聯發科 **4,150（-1.31%）**、鴻海 **241.5（+0.84%）**、廣達 **320.5（+1.91%）**。美股 10/20：**道瓊 52,497（+1.02%，約 +530 點）**、**S&P 500 7,712（+0.29%）**、**那斯達克 26,424（-0.02%）**、**羅素 2000 2,773（+1.65%）**；**醫療類股 XLV +2.2% 創歷史新高**、不動產 +1.7%、公用事業 +1.3%、金融 +1.1%，而**科技 XLK、通訊 XLC 幾乎平盤**、半導體 SMH 僅 +0.3%（終止九連跌）。**META 跌逾 2% 至 689 美元、連續第五個交易日下跌，距 10/13 高點 771.27 已低約 11%**，財報就在今天（10/21）美股盤後。**GM 因全年指引偏弱重摔 -7.6%（盤中一度約 -8.3%）**，**禮來（LLY）創 52 週新高**領軍醫療。油價仍高（布蘭特盤中一度突破 110 美元、五個月新高後翻黑，WTI 約 97.55、-1.0%），**美債 10 年期殖利率約 5.11%、2 年期約 4.76%** —— 這是壓住科技股估值的真正原因。", "note": "★ **今天（10/21，週三）開盤前只盯這三件，其他先放掉**：　**①「輪動」不是「反彈」，別把道瓊 +1.02% 當成利多。**昨晚美股的結構非常清楚：醫療 +2.2%（歷史新高）、小型股 +1.65%、金融 +1.1%，但科技與通訊平盤、半導體只 +0.3%、META 連五跌。**對台股這種電子權重超過六成的市場，這種輪動等於沒有救援。**今天台股若開高，重點是**開高能不能守住**，而不是開高幾點。　**②外資連 10 賣、累計 8,380 億，這是本波最硬的壓力。**昨天再賣 795.4 億，三大法人合計賣超 968 億，而投信連 8 買只買了 183 億 —— **內資的買盤規模完全不足以對沖外資提款。**量能同步縮到 7,586 億，**縮量下跌代 th{color:var(--muted);font-weight:600;font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}
.wl-tabs{display:flex;gap:8px;margin-bottom:10px}
.wl-tabs button{background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.wl-tabs button.active{background:var(--accent);color:#04121f;font-weight:600}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:6px 0}
.stack{position:relative;padding-bottom:10px}
.stack .layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px;background:var(--bg2);border:1px solid var(--border);height:100%}
.stack .l2{width:86%;top:9px;opacity:.4}.stack .l1{width:93%;top:4px;opacity:.7}
.stack-card{position:relative;z-index:3;background:linear-gradient(150deg,#1d2530,#232c38);border:1px solid var(--border);border-radius:14px;padding:14px 15px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;min-height:172px;display:flex;flex-direction:column}
.stack-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.4);border-color:var(--accent)}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.sc-cat{font-size:12px;color:var(--accent);font-weight:600;background:rgba(88,166,255,.12);padding:2px 9px;border-radius:20px}
.sc-count{font-size:11px;color:var(--muted)}
.sc-namerow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sc-name{font-size:21px;font-weight:700;line-height:1.2}
.sc-code{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.sc-chg{font-size:15px;font-weight:700;white-space:nowrap}
.sc-theme{font-size:12.5px;color:var(--muted);margin-top:7px;flex:1;line-height:1.5}
.sc-spark{margin-top:8px}
.sc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sc-risk{font-size:12.5px;font-weight:700}.sc-hint{font-size:11px;color:var(--muted)}
.sc-dots{display:flex;gap:5px;margin-top:8px}
.sc-dots i{width:6px;height:6px;border-radius:50%;background:var(--border)}.sc-dots i.on{background:var(--accent)}
.stock-select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;min-width:230px;cursor:pointer}
.chart-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.trade-date-note{font-size:11px;color:var(--muted);margin-bottom:12px;padding:6px 10px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent)}
.hl-box{background:linear-gradient(135deg,#1a2a1a,#16231b);border:1px solid var(--green);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;line-height:1.6}
.cal-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}
.cal-modal-overlay.open{display:flex}
.cal-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:380px;padding:20px 22px}
.cal-modal h3{font-size:15px;margin-bottom:6px;color:var(--accent)}
.cal-modal .mhint{font-size:11px;color:var(--muted);margin-bottom:10px}
.cal-modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.cal-modal input,.cal-modal select{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px}
.cal-modal .row{display:flex;gap:10px}.cal-modal .row>div{flex:1}
.cal-modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.mbtn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border)}
.btn-cancel{background:var(--bg2);color:var(--muted)}.btn-submit{background:#1f6feb;color:#fff;border-color:#1f6feb}
.cal-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#04121f;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:1100;opacity:0;transition:opacity .3s;pointer-events:none}
.cal-toast.show{opacity:1}
.load-msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
@media (max-width:900px){.main{grid-template-columns:1fr}.full-width{grid-column:1}.stat{min-width:130px}.stack-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.weather-badge .detail{max-width:180px}}
</style>
</head>
<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge">
<div style="font-size:24px" id="w-icon">🌤️</div>
<div>
<div class="temp" id="w-temp">—</div>
<div class="detail" id="w-note"></div>
</div>
</div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
/* ---------- render ---------- */
function render(){
document.getElementById("h-date").textContent=(DATA.dateLabel||DATA.date)+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
var w=DATA.weather||{};
document.getElementById("w-icon").textContent=w.icon||"🌤️";
document.getElementById("w-temp").textContent=(w.high!=null?w.high+"°C":"")+(w.low!=null?" / "+w.low+"°C":"");
document.getElementById("w-note").textContent=w.note||"";
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
if(sc.note){var _n=document.createElement("div");_n.className="empty-tasks";_n.style.marginTop="12px";_n.style.textAlign="left";_n.style.lineHeight="1.8";_n.textContent=sc.note;list.appendChild(_n);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2><span class='hint'>"+esc((DATA.mail&&DATA.mail.window)||"")+"</span></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div><div class='sender'>"+esc(it.tag)+"</div>"+
"<div class='subject'>"+esc(it.title)+"</div>"+
"<div class='action'>"+(it.deadline&&it.deadline!=="—"?"📌 "+esc(it.deadline)+" · ":"")+esc(it.kind||"")+"</div></div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+esc(it.detail||"")+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(m.footnote)html+="<div style='font-size:11px;color:#8b949e;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;line-height:1.6'>※ "+esc(m.footnote)+"</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2><span class='hint'>"+esc((DATA.news&&DATA.news.window)||"")+"</span></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+esc(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var cls=x.change==null?"":(x.change>=0?"up":"down");var arrow=x.change==null?"":(x.change>=0?" ▲":" ▼");return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+esc(x.value)+arrow+"</div><div class='k'>"+(x.change!=null?fmtChg(x.change)+(x.note?" · "+esc(x.note):""):esc(x.note||""))+"</div></div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(r.price)+"</td><td>"+esc(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2><span class='hint'>"+esc(mk.asOf||"")+"</span></div><div class='card-body'>"+
(mk.highlight?"<div class='hl-box'><div style='color:var(--green);font-weight:700;margin-bottom:4px'>🆕 觀察清單外・新熱門標的</div>"+esc(mk.highlight)+"</div>":"")+
(mk.note?"<div class='trade-date-note'>📅 "+esc(mk.note)+"</div>":"")+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+
"<p style='font-size:11.5px;color:var(--muted);margin:8px 0 18px'>每張卡是觀察清單的一個分類；點卡片切換同分類的下一支，右上角為前一交易日漲跌幅、卡上為 sparkline。</p>"+
"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"<p class='chart-note'>"+esc(mk.historyNote||"")+"</p></div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
(mk.disclaimer?"<p style='font-size:12px;color:var(--muted)'>"+esc(mk.disclaimer)+"</p>":"")+
"<p style='font-size:11.5px;color:var(--muted);margin-top:6px'>※ "+esc(SITE.watchlistNote||"")+"</p>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=Q[code],price=s[4]||100,ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=Q[code];
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:s[4]||100,ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);
var first=series[0],last=series[series.length-1],winChg=(last-first)/first*100;
var col=(f.chg==null?"#8b949e":chgColor(f.chg)),dec=f.price<20?2:(f.price<100?1:0);
document.getElementById("mover-head").innerHTML="<strong>"+esc(f.name)+"</strong> <span class='pill'>"+esc(f.code)+"</span>"+
"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+
"<span style='color:"+col+";font-weight:700;margin-left:8px'>當日 "+fmtChg(f.chg)+"</span>"+
"<span style='color:"+(winChg>=0?"#3fb950":"#f85149")+";margin-left:10px'>區間("+(rng===5?"1週":"1月")+") "+(winChg>=0?"+":"")+winChg.toFixed(2)+"%</span>";
document.getElementById("mover-chart").innerHTML=sparkSVG(series,640,150,col).replace("width='640' height='150'","width='100%' height='150'");
}
document.querySelectorAll("#range-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#range-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");rng=+b.dataset.rg;drawMover();};});
sel.onchange=drawMover;
sel.value="TW|2330";drawMover();
}
/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
