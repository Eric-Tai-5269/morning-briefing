": "中"}}], "footnote": "★ **今天信件區的一句話結論：新信只有 1 封、而且不需要動作，所以今天的「信件時間」應該花在「寄一封信」上 —— 就是向系辦確認陳果夫獎學金的順延截止日。**其餘時間全部還給讀書。　★ **被過濾掉的信（1 封，僅註記不展開）**：`noreply@email.openai.com`「4 種新圖像風格等你試用」（10/23 22:04）—— OpenAI 產品電子報，無行動需求。　★ **PRO360 過濾**：本期 24 小時內**沒有** PRO360 來信（0 封）。　★ **24 小時窗外、不需要動作但你可能想知道的成大信（10/22）**：①學務處「填問卷抽大獎」第 2 次通知（`stud2.adm.ncku.edu.tw/evaluation/115/`，無明確截止日，想抽獎才填）；②原資中心《文化交流》毛利與臺灣原住民族文化體驗 **11/14（六）09:30–19:00** 於臺灣原住民族文化園區；③學術誠信講座「AI 時代的翻譯倫理與知識責任」**11/20（五）14:10–16:00 線上**（蔡毓芬教授，與你用 AI 寫報告的分際直接相關，可考慮報名）；④第一屆「成功論壇」**11/5（四）09:30** 起（校慶週，材料／電機／機械／工程科學四系）；⑤第十七屆職涯教練計畫說明會；⑥雪梨大學臺南見面會 **11/19（四）18:00**；⑦NCKU OIA eNews 十月號（成大與 imec 深化台歐研究合作）。**這 7 封全部不需要今天動作**，其中 ③ 和 ④ 若要參加，建議現在就加進行事曆以免連假後忘記。"}, "news": {"window": "過去 48h（**10/22 00:00 – 10/23 23:59 美國／日本當地時間**）· 來源：CNN（頭條／科技／運動／教育心理，共 14 則）、Anthropic News／TechCrunch／Digital Today（產業動態 3 則）、米津玄師官方 REISSUE RECORDS／MOVIE WALKER／BARKS／Mrs. GREEN APPLE 官網／音樂ナタリー（追星 5 則）。　★ **今天的資料品質必須先說清楚**：CNN 的**文章內頁本次全部無法讀取**（robots 限制），BBC 本次**完全無法取得**（搜尋與抓取皆被阻擋），所以**今天 14 則全部來自 CNN，沒有 BBC**。頭條 5 則與科技第 1 則的內容是改抓 **CNN 10/22–10/23 的電視節目逐字稿**（Connect the World、One World、CNN News Central、The Situation Room、Quest Means Business、AC360）補齊，**人名、數字、引述皆來自 CNN 同日播出內容**；但逐字稿與文章版本偶有差異（例如約旦教堂槍擊的傷亡數字，CNN 當日曾由「至少 6 死 28 傷」修正為「至少 7 死 27 傷」）。　★ **科技第 2、3 則與運動 3 則、教育心理 3 則的英文摘要明顯短於 100 字**，因為這些只能驗證到標題、無法讀到內文——**寧可寫短，不要編造**。這一點請在閱讀時自行折扣。", "groups": [{"label": "頭條", "items": [{"en": "At least 7 people killed in unprecedented shooting at church in Jordan", "zh": "約旦卡拉克省一座希臘正教堂的葬禮遭槍手掃射，至少 7 死約 27 傷，**向來平靜的約旦基督徒社群首次成為攻擊目標**，中東緊張再添變數。", "summary": "Jordan's public security agency said gunmen opened fire during a funeral inside a Greek Orthodox church in Karak province, about 90 miles southwest of Amman, killing at least seven people and wounding roughly 27. Eyewitnesses told CNN 150 to 200 mourners were inside, and at least three attackers remained at large as security forces mounted a large manhunt. One witness described an assailant with an AK-47 firing for several minutes; a survivor said the gunmen shouted \"Allahu Akbar.\" King Abdullah vowed a harsh response. Hassan Barari of the University of Jordan called the attack unprecedented, noting the country's Christian community has not previously been targeted this way.", "source": "CNN — World / Middle East（內容補自 CNN 10/23 節目逐字稿）", "url": "https://www.cnn.com/2026/10/23/middleeast/church-shooting-jordan-intl"}, {"en": "Israel begins demolitions in West Bank city after two soldiers killed in shooting attack", "zh": "希伯倫檢查哨 2 名以軍士兵被殺，以色列封鎖全城並**開始拆屋、可能迫使數千人遷離**，距以國 10 月 7 日後首次大選僅剩 4 天。", "summary": "Two Palestinian gunmen attacked an Israeli military checkpoint near Hebron early Friday, killing two Israeli soldiers and lightly wounding at least three others in a firefight that lasted about 20 minutes; both attackers were killed. Prime Minister Benjamin Netanyahu initially ordered a full closure of the West Bank, later narrowed to Hebron, where the military declared a siege and began evacuations and house demolitions that could displace thousands. Netanyahu said forces would destroy the neighborhood the gunmen came from. Hamas and Palestinian Islamic Jihad praised the attack without claiming it. The violence came four days before Israel's first national election since October 7, 2023.", "source": "CNN — World / Middle East（內容補自 CNN 10/23 節目逐字稿）", "url": "https://www.cnn.com/2026/10/23/middleeast/israel-closes-west-bank-city-intl"}, {"en": "Macron says Paris suburb shooting that killed one person was terrorist and racist act", "zh": "巴黎西南郊特拉普發生開車掃射，1 死 4 傷、含**一名被射中至少 8 槍的 12 歲女童**，反恐檢察官接手，馬克宏定調為恐怖與種族主義攻擊。", "summary": "A 39-year-old man drove through Trappes and La Verriere, towns southwest of Paris, firing an automatic weapon from his car at a gas station, a clinic and a playground. One person was killed and four were wounded, among them a 12-year-old girl who was shot at least eight times. The suspect was arrested and is in police custody, and France's National Anti-Terrorism Prosecutor's Office took over the case, with investigators examining whether the attack was racially motivated. Interior Minister Laurent Nunez praised local police. President Emmanuel Macron said on social media that a suspect had been detained, and called the shooting a terrorist and racist act.", "source": "CNN — World / Europe（內容補自 CNN 10/23 節目逐字稿）", "url": "https://www.cnn.com/2026/10/23/europe/one-killed-drive-by-shooting-france-paris-intl"}, {"en": "Live updates: Elections forecaster has bad news for GOP as Trump campaigns in Florida", "zh": "選情機構 Cook 認定**共和黨保住眾院的路「幾乎已蒸發」**，220 席倒向民主黨、逾 2000 萬人已提前投票，川普仍赴佛州造勢。", "summary": "Eleven days before the US midterms, the Cook Political Report said Republicans' path to holding the House has all but evaporated, shifting 19 races toward Democrats. By its ratings, 220 seats are now solid, likely or lean Democratic, against the 215 Democrats currently hold; the party needs a net gain of three for a majority. Analyst Dave Wasserman said Democrats could match or exceed the 235 seats they won in 2018. More than 20 million Americans have already voted, with California, Texas, Florida, Georgia and North Carolina each passing one million. President Donald Trump campaigned in Florida, rallying in Fort Myers for Byron Donalds.", "source": "CNN — Politics / Election live updates（內容補自 CNN 10/23 節目逐字稿）", "url": "https://www.cnn.com/2026/10/23/politics/live-news/midterm-election-congress"}, {"en": "Trump DOJ sues to block Alaska US Senate results if Republican incumbent loses", "zh": "司法部搶在開票前提訴，要求**若共和黨現任參議員 Dan Sullivan 落選就不要認證結果**，被批為行政權介入選舉的危險先例。", "summary": "The Justice Department filed a pre-emptive lawsuit seeking to block certification of Alaska's US Senate election if Republican incumbent Dan Sullivan loses. The suit argues voters were confused because a second candidate, Daniel J. Sullivan, also appeared on the ballot. CNN's Alayna Treene noted that certification is normally handled by states rather than the federal government, making the filing highly unusual. Democratic Senator Cory Booker said the move was insulting Alaskan voters. A separate CNN analysis questioned the administration's parallel election lawsuits in Alaska and California, filed days before voting ends in a cycle where Republicans are trailing in House and Senate ratings.", "source": "CNN — Politics（內容補自 CNN 10/23 節目逐字稿）", "url": "https://www.cnn.com/2026/10/23/politics/doj-sues-alaska-dan-sullivan-us-senate"}]}, {"label": "科技", "items": [{"en": "The biggest-ever internet security threat has been known for 22 years. AI made it a crisis in 2 days", "zh": "PHP2Shell 漏洞影響全球約**七成網站**，AI 協助挖出的 22 年老問題兩天內變成全網危機，攻擊嘗試從數千暴增到數百萬次。**★ 這則與你修的課無關但與你的專題網站／任何自架 PHP 服務直接相關。**", "summary": "CNN explains PHP2Shell, a pair of vulnerabilities in PHP, the language behind an estimated 70% of the world's websites. Teams at OpenAI and two cybersecurity firms found the bugs in August, in a weakness CNN says has been known for 22 years; the PHP Foundation disclosed them and released a patch on Wednesday, October 21. Attackers could steal passwords, run code remotely and expose customer data. Cloudflare's chief executive said his network logged thousands of exploit attempts in the 10 hours before disclosure, tens of thousands within 45 minutes, hundreds of thousands within two hours and millions afterwards. Websites went offline worldwide as operators rushed to patch.", "source": "CNN — Technology（內容補自 CNN 10/23 節目逐字稿）", "url": "https://www.cnn.com/2026/10/23/tech/ai-cybersecurity-php2shell-explained"}, {"en": "Taking back the algorithm: Social media platforms are restoring users' control of their feeds", "zh": "社群平台開始**把推薦演算法的控制權還給使用者**，讓人能自行調整、重設甚至關掉決定你看到什麼的排序機制。（⚠️ 僅能驗證標題，內文無法讀取）", "summary": "Social media platforms are handing users more control over their recommendation feeds, CNN Technology reports in a piece headlined \"Taking back the algorithm.\" The story examines how companies are restoring people's ability to shape, tune or switch off the automated ranking systems that decide what appears in their timelines. (Headline verified; CNN article body could not be retrieved, so this summary is deliberately short rather than invented.)", "source": "CNN — Technology（僅標題驗證）", "url": "https://www.cnn.com/2026/10/22/tech/social-media-user-algorithm-control"}, {"en": "NASA lays out mad dash to test lunar landers next year", "zh": "NASA 公布**明年登月艙試飛的急行軍時程**，SpaceX 的 Starship 與 Blue Origin 登月艙都被排進幾乎沒有緩衝的測試表。（⚠️ 僅能驗證標題；與你清單裡的 SPCX 有關）", "summary": "NASA has laid out an accelerated schedule to test lunar landers next year, CNN Science reports in an Artemis program update covering both SpaceX's Starship and Blue Origin's lander. The piece describes the agency's \"mad dash\" to push the vehicles through testing on a timeline that leaves little margin for delay. (Headline verified; CNN article body could not be retrieved, so this summary is deliberately short rather than invented.)", "source": "CNN — Science / Space（僅標題驗證）", "url": "https://www.cnn.com/2026/10/23/science/nasa-artemis-update-spacex-starship-blue-origin"}]}, {"label": "運動", "items": [{"en": "4 reasons to get excited about the World Series showdown between the Brewers and Rays", "zh": "第 127 屆世界大賽由釀酒人在主場迎戰光芒，**兩隊都還沒拿過冠軍**，第一戰美東時間週五晚間 8 點在密爾瓦基開打。", "summary": "The 127th World Series opens with the Milwaukee Brewers hosting the Tampa Bay Rays, with Game 1 scheduled for 8 p.m. ET Friday in Milwaukee. CNN Sport lays out four reasons to watch, including the fact that neither franchise has ever won a World Series title. The Rays reached the Fall Classic by beating the Cleveland Guardians in the American League Championship Series. (Headline and these points verified; full article body could not be retrieved.)", "source": "CNN — Sport / Baseball（僅標題與要點驗證）", "url": "https://www.cnn.com/2026/10/23/sport/what-to-watch-in-the-world-series"}, {"en": "The Rams are in serious trouble, a showdown in Seattle and a trip to Paris: Here's what to watch in the NFL's Week 7", "zh": "CNN NFL 第 7 週前瞻：**公羊陷入苦戰**、西雅圖有關鍵對決，聯盟還把例行賽搬到巴黎打。（⚠️ 僅能驗證標題）", "summary": "CNN Sport's NFL Week 7 preview highlights the Los Angeles Rams being in serious trouble, a showdown in Seattle, and the league's regular-season game in Paris. The France fixture drew a mocking comment from President Donald Trump during White House remarks on October 23. (Headline verified; CNN article body could not be retrieved.)", "source": "CNN — Sport / NFL（僅標題驗證）", "url": "https://www.cnn.com/2026/10/22/sport/what-to-watch-nfl-week-7"}, {"en": "Meet Adri Mehmeti, the 17-year-old future star of American soccer", "zh": "CNN 專訪 17 歲的 Adri Mehmeti，**被看好是美國足球的下一張招牌**。（⚠️ 僅能驗證標題）", "summary": "CNN Sport profiles Adri Mehmeti, a 17-year-old it describes as a future star of American soccer, continuing CNN's coverage of US teenage prospects alongside players such as Cavan Sullivan. (Headline verified; CNN article body could not be retrieved.)", "source": "CNN — Sport / Soccer（僅標題驗證）", "url": "https://www.cnn.com/2026/10/22/sport/adri-mehmeti-us-soccer-phenom-profile"}]}, {"label": "教育心理", "items": [{"en": "Electric shock gloves were used on students. Now Nebraska parents want them out of schools", "zh": "內布拉斯加州家長要求**把曾用在學生身上的電擊手套趕出校園**；CNN 先前已報導美軍研究指該裝置會造成疼痛、恐懼與服從。", "summary": "Parents in Nebraska are pushing to get electric shock gloves out of schools after the devices were used on students, CNN reports. The story follows CNN's earlier reporting, published October 7, on an Army study that found shock gloves purchased by Immigration and Customs Enforcement cause pain, compliance and fear. (Headline and the earlier CNN reporting verified; this article's body could not be retrieved.)", "source": "CNN — US（僅標題驗證）", "url": "https://www.cnn.com/2026/10/23/us/nebraska-shock-gloves-in-schools"}, {"en": "She survived a school shooting. Now her children have too", "zh": "曾在校園槍擊中倖存的母親，**如今自己的孩子也經歷了同一種恐懼**，世代相傳的創傷成為美國校園暴力最沉重的註腳。", "summary": "CNN tells the story of an Oregon mother who survived a school shooting and whose children have now lived through one as well. It published a week after the October 15 attack at Silver Rail Elementary in Bend, Oregon, in which three children and a teacher were killed and the teenage gunman also died. CNN has reported that a father, Kaylub Giamanco, shot the attacker, and that an unarmed teacher shielded her students. (Context verified from CNN's earlier coverage; this article's body could not be retrieved.)", "source": "CNN — US（僅標題與先前報導驗證）", "url": "https://www.cnn.com/2026/10/22/us/school-shooting-survival-oregon-family"}, {"en": "How Boston College women's lacrosse team is breaking the stigma and prioritizing mental health", "zh": "波士頓學院女子長曲棍球隊**把心理健康當成團隊第一順位**，試圖打破運動員不談心理困擾的禁忌。（⚠️ 影片段落，僅能驗證標題）", "summary": "A CNN segment on The Lead with Jake Tapper looks at how the Boston College women's lacrosse team is working to break the stigma around mental health and make it a stated team priority. (Headline verified; this is a video segment and no article text was available. Note: CNN's stronger psychology piece this week, on Netflix reimagining the Stanford Prison Experiment, is dated October 21 and therefore falls outside the 48-hour window.)", "source": "CNN — Sport / The Lead with Jake Tapper（影片，僅標題驗證）", "url": "https://www.cnn.com/2026/10/23/sport/video/how-boston-college-womens-lacrosse-team-is-breaking-the-stigma-and-prioritizing-mental-health-the-lead-jake-tapper"}]}, {"label": "產業動態（AI／半導體／量子）", "items": [{"en": "Donating Agent Skills to the Agentic AI Foundation", "zh": "Anthropic 把 **Agent Skills** 開放標準捐給 Linux Foundation 旗下的 Agentic AI Foundation，繼 MCP 之後再次把 agent 生態主導權交給中立社群，目前已有逾 70 個平台支援、約 100 萬個 skill 發布、近 2.8 億次安裝。", "summary": "Anthropic said on October 22, 2026 that it is donating Agent Skills, its open standard for giving AI agents specialized knowledge and workflows, to the Agentic AI Foundation under the Linux Foundation. The donation covers the standard, its name and logo, the GitHub organization and the agentskills.io domain. A skill is a folder with a SKILL.md file plus optional scripts and reference material. Anthropic co-founded the foundation with Block and OpenAI in 2025 and earlier donated the Model Context Protocol. Over 70 platforms, including ChatGPT, Cursor, GitHub Copilot and VS Code, support Agent Skills; about 1 million skills published, nearly 280 million installed.", "source": "Anthropic News", "url": "https://www.anthropic.com/news/donating-agent-skills-to-the-agentic-ai-foundation"}, {"en": "OpenAI makes its Jev competitor widely available as decision model competition heats up", "zh": "OpenAI 的 **Decisions API** 全面開放，把 ChatGPT Luna 調校到 **100–180 毫秒**回應，正面對決 TypeSafe 的 Jev —— 低延遲「決策模型」成為 LLM 的下一個戰場。", "summary": "TechCrunch reported on October 22, 2026 that OpenAI has made its Decisions API model available to all customers, after announcing it at its September 29 developer day. Rather than train a dedicated decision model, OpenAI reconfigured ChatGPT Luna to run faster and cheaper, cutting response times from one to three seconds down to roughly 100-180 milliseconds, and added voice and visual modalities. Early customers include Box, Datadog, Ramp and Speak, whose CTO Andrew Hsu said time between actions fell from 1.4 seconds to 0.13 seconds. It competes with Jev from TypeSafe, a startup recently valued at $7.6 billion; API product lead Nikunj Handa wants to reach 60 milliseconds.", "source": "TechCrunch — AI", "url": "https://techcrunch.com/2026/10/22/openai-makes-its-jev-competitor-widely-available-as-decision-model-competition-heats-up/"}, {"en": "Jensen Huang says no memory glut in 2029, rebutting fears over memory stocks", "zh": "黃仁勳在 GTC Berlin 駁斥 **2029 記憶體供過於求**的說法，強調 HBM 與資料中心 LPDDR 需求續強，並對中國 CXMT 表態開放合作 —— **這是昨天美股記憶體族群被殺（MU -6.26%、SNDK -8.51%、WDC -6.43%）之後最關鍵的風向反駁。**", "summary": "Speaking in an interview at Nvidia's GTC Berlin event, CEO Jensen Huang dismissed fears of a memory oversupply in 2029, saying demand from AI and data centres will keep rising: \"One of the greatest things about memory is that you can always use more.\" He said HBM will stay in use for years and noted Nvidia was first to bring low-power DRAM into data centres, claiming it is twice as energy-efficient. Huang said Nvidia is open to cooperating with Chinese memory maker CXMT. The remarks, reported October 22, followed an October 15 forecast that the market could turn into a \"red ocean\" by 2029, pressuring SK Hynix, Samsung and Micron.", "source": "Digital Today（韓國）— Tech｜原始出處為 CNBC 同日報導，該頁本次無法讀取", "url": "https://www.digitaltoday.co.kr/en/view/118511/jensen-huang-says-no-memory-glut-in-2029-rebutting-fears-over-memory-stocks"}]}, {"label": "追星（僅限清單內歌手）", "items": [{"en": "KENSHI YONEZU 2026-2027 WORLD TOUR / GHOST", "zh": "🚨 **本週最重要的一則**：米津玄師官網 10/22 更新世界巡演《GHOST》場次，加開 1/30 新加坡第二場、全球共 **11 城 15 場**；**台灣站 12/26、12/27 台北大巨蛋（日本歌手首度攻蛋）**，**中信卡優先購 10/24（就是今天）開跑**，目前無香港場。", "summary": "Kenshi Yonezu's official label site REISSUE RECORDS updated its KENSHI YONEZU 2026-2027 WORLD TOUR / GHOST page on October 22, adding a second Singapore Indoor Stadium show on January 30 and bringing the run to 15 concerts in 11 cities. The tour opens at Taipei Dome on December 26 and 27, 2026, his first shows there, then Seoul Inspire Arena on January 14, 16 and 17, Singapore on January 29 and 30, followed by Oakland, Los Angeles, Mexico City, Newark, Toronto, London, Paris and Amsterdam through February 28. No Hong Kong date is listed. Taiwan priority buying for CTBC cardholders opens October 24.", "source": "REISSUE RECORDS（米津玄師官方）· Spotify：https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB", "url": "https://reissuerecords.net/2026/10/22/kenshi-yonezu-2026-2027-world-tour-ghost/"}, {"en": "米津玄師が『劇場版 薬屋のひとりごと 亡妃の秘宝』主題歌「春が灯り」を書き下ろし！最新予告＆メインビジュアルも解禁", "zh": "**米津玄師**為首部劇場版《藥師少女的獨語 亡妃的祕寶》寫下主題歌〈春が灯り〉（はるがあかり），**日本 12/11 上映**，同步解禁使用該曲的最新預告、主視覺與人物關係圖。", "summary": "Kenshi Yonezu has written a new song, Haru ga Akari, as the theme for Gekijoban Kusuriya no Hitorigoto: Boki no Hiho, the first Apothecary Diaries film, which opens in Japan on December 11, 2026. The announcement on October 22 and 23 came with a new trailer using the song, a main visual and a character relationship chart. The film's story is an original written by the novels' author Natsu Hyuuga, with Nobuhiro Naganuma directing. Yonezu said he wrote the track while reading the script and drew heavily on the nursery rhymes Tulip and Anta Gata Dokosa, calling it a song about what people inherit from one another.", "source": "MOVIE WALKER PRESS · Spotify：https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB", "url": "https://press.moviewalker.jp/news/article/1451342/"}, {"en": "Mrs. GREEN APPLE、新曲「シンデレラ」MVを今夜23:53に公開", "zh": "**Mrs. GREEN APPLE** 新曲〈シンデレラ〉MV 已於**日本時間 10/23 23:53** 在官方 YouTube 首播，收錄於 9/30 發行的第六張原創專輯《POPS》。", "summary": "Mrs. GREEN APPLE premiered the music video for Cinderella on their official YouTube channel at 23:53 on October 23, 2026, after a teaser appeared without warning at midnight the night before. The song comes from POPS, the band's sixth original full-length album, released on September 30, 2026, and pairs a large orchestral arrangement with the band sound in a dramatic setting. The teaser shows a smiling girl dancing gracefully amid falling gold confetti. The two music videos already released from the album, A Posteriori and Kyohan, have each passed ten million views on YouTube.", "source": "BARKS · Spotify：https://open.spotify.com/artist/4QvgGvpgzgyUOo8Yp8LDm9", "url": "https://barks.jp/news/1100113/"}, {"en": "Starting Thursday, October 22nd, the \"Chef RyoChan\" collaboration between Ryoka Fujisawa (Mrs. GREEN APPLE) and Gusto will begin!", "zh": "**Mrs. GREEN APPLE** 鍵盤手藤澤涼架與日本連鎖餐廳 Gusto 合作「Chef RyoChan」，**日本全店 10/22 10:30 起至 12/2** 推出他設計的 6 道菜單，點指定餐點可獲馬克杯、餐具組、餐墊布等限量贈品。（去日本才用得到）", "summary": "Keyboardist Ryoka Fujisawa of Mrs. GREEN APPLE has designed a six-item menu for the Japanese family restaurant chain Gusto, running at all branches from 10:30 on October 22, 2026 until December 2. The dishes include a spicy jjigae hot pot set served with bulgogi kimbap, a basil tomato and bacon pizza, grilled chicken and vegetables, a fruit salad with plum dressing, an apple pie, and a green apple mousse arriving at a later date. Ordering marked items brings free limited goods, first mugs or cutlery sets in four designs each, then plates, a lunch cloth and rubber coaster charms.", "source": "Mrs. GREEN APPLE Official Site · Spotify：https://open.spotify.com/artist/4QvgGvpgzgyUOo8Yp8LDm9", "url": "https://mrsgreenapple.com/news/detail/23263?lang=en"}, {"en": "PayPayをMrs. GREEN APPLE仕様にできる期間限定きせかえが登場", "zh": "日本行動支付 **PayPay** 推出 **Mrs. GREEN APPLE** 期間限定「卡片換裝」，採用 phase 3 時期 logo，**日本 10/22 起至 2027/4/19** 可套用。", "summary": "Japan's PayPay payment app has added a limited-time Mrs. GREEN APPLE design to its card kisekae feature, which lets users change the barcode area on the app's home screen to a design of their choice. The skin uses the band's phase 3 era logo and is available from October 22, 2026 through April 19, 2027. The article, published on October 22, lists no conditions beyond the standard kisekae function. It lands in the same week as a run of other Mrs. GREEN APPLE tie-ins, including the Gusto restaurant menu collaboration that also started on October 22 and runs to December 2.", "source": "音楽ナタリー（via JOYSOUND ニュース）· Spotify：https://open.spotify.com/artist/4QvgGvpgzgyUOo8Yp8LDm9", "url": "https://news.joysound.com/article/694800"}]}]}, "market": {"asOf": "台股＝**2026/10/22（四）13:30 收盤**（⚠️ **10/23（五）因薔琵颱風休市，所以「前一交易日」仍是 10/22**；加上 10/24–10/26 連假，**下一次開盤是 10/27（二）**）；美股＝**2026/10/23（五）正規盤收盤**（台灣 10/24 清晨 04:00 結束）。　★ **今天台股區的數字與昨天簡報相同，這不是沒更新，而是中間沒有任何交易日。**", "highlight": "**一句話：10/23 這一夜美股從「AI 全面殺盤」收斂成「結構分化」—— 三大指數只小跌（S&P -0.52%、那斯達克 -0.21%），但道瓊獨自重挫 -1.23%；而真正乾淨的訊號是你觀察清單裡的資安四檔 CRWD +8.16%、PANW +7.2%、NET +6.9%、ZS +6.9% 同步噴出，是整張清單唯一「整個類別一起漲」的一組。**費半 ETF 當日 +0.94%、那斯達克 100 +0.14%，代表前一天被血洗的半導體**止血了但沒反攻**（近 20 個交易日仍 -12.91%）。壓力改從兩個新方向來：**①油價衝上半年新高**（Brent 結算 116.72 美元、WTI 突破 103 美元，中東升溫），直接打航空股；**②AI 融資成本**（CoreWeave 無擔保債殖利率破 11%、Oracle FY2027 可能需要約 400 億美元債＋股權，GS 目標價由 240 砍到 206）。同時亞馬遜 Andy Jassy 說「2026 年容量已售完、2027 大部分已被預訂」，黃仁勳也公開駁斥 2029 記憶體供過於求 —— **需求端沒變弱，變貴的是錢。**", "note": "★ **連假剩 3 天，只需要記住這四件事**：　**①你的清單這週唯一的「整類別同漲」是資安。** CRWD／PANW／NET／ZS 四檔全部 +6.9% 以上，觸發原因是一份指出企業資安預算強勁的報告，再加上 10/21 爆發的 **PHP2Shell** 漏洞（影響全球約七成網站、攻擊嘗試在數小時內從數千暴增到數百萬次，見科技區第 1 則）—— **這是「新聞事件直接推動你清單標的」的典型案例，值得記下來當研究樣本。**　**②半導體是止血、不是反轉。** 費半當日 +0.94%，但近 20 個交易日 -12.91%；10/22 那一輪殺的是設備與記憶體（LRCX -11.76%、KLAC -9.55%、AMAT -8.16%、SNDK -8.51%、MU -6.26%、WDC -6.43%），**10/23 並沒有把這些跌幅收回來。**　**③真正該追蹤的風險指標不是股價，是融資成本。** CoreWeave 債息破 11%、Oracle 五年期 CDS 擴大破 300bps、摩根士丹利估 CoreWeave 到 2027 年底要再借 240–370 億美元。**如果 AI 需求很強但借錢變貴，受傷的會是「要靠舉債蓋資料中心」的一方（ORCL、CRWV），不是「賣鏟子」的一方（NVDA、AVGO）。**　**④下週有聯準會會議，市場普遍預期不動。** 這意味著 10/27 台股開盤要同時消化「4 天的美股變化＋Fed 前的觀望」，**開盤第一個小時的價格大概率不理性，不要在那時候做決定。**　★ **台股 10/27 開盤要補的缺口**：10/22 加權收 46,041.43、單日跌 846.34 點（-1.81%）、成交 8,792.30 億元、盤中震盪 1,291 點收在全天最低；櫃買 -3.47% 更弱。**10/23 休市讓這個弱勢收盤「凍結」了 4 天**，10/27 開盤是照著 10/22 的情緒走、還是照著美股這 4 天的分化走，就是下週第一個觀察點。", "indices": [{"market": "TW", "name": "加權指數 TAIEX", "value": "46,041.43", "change": -1.81, "note": "**10/22（四）13:30 收盤**（前一交易日）· 跌 846.34 點、-1.81%，成交 8,792.30 億元。盤中上下震盪 1,291 點、收在全天最低。**10/23（五）因薔琵颱風休市，10/24–10/26 連假，下次開盤 10/27（二）。**"}, {"market": "TW", "name": "元大台灣50 0050", "value": "106.90", "change": -1.16, "note": "10/22（四）收盤。10/23 休市未交易。"}, {"market": "TW", "name": "元大高股息 0056", "value": "56.30", "change": 0, "note": "10/22（四）收盤，當日持平。10/23 休市未交易。"}, {"market": "TW", "name": "櫃買指數 OTC", "value": "381.70", "change": -3.47, "note": "10/22（四）收盤 · **-3.47%，明顯弱於加權**，中小型股殺幅更重。10/23 休市未交易。"}, {"market": "US", "name": "道瓊工業指數 Dow Jones", "value": "52,215.16", "change": -1.23, "note": "**10/23（五）收盤 · 跌 652.82 點、-1.23%，是三大指數中最弱的一個。**主因是油價衝上半年新高打擊航空股，以及 AXP（宣布裁減全球約 5% 人力）、T、TMUS、CMCSA 等權值成分股重挫。**但道瓊是本週唯一週線收紅的指數。**"}, {"marke </style>
</head>
<body>
<div class="header">
<div class="header-left">
<h1>☀️ 晨間簡報</h1>
<div class="date" id="h-date">載入中…</div>
<div class="ver" id="h-ver"></div>
</div>
<div class="head-right">
<div class="weather-badge">
<div style="font-size:24px" id="w-icon">🌤️</div>
<div>
<div class="temp" id="w-temp">—</div>
<div class="detail" id="w-note"></div>
</div>
</div>
<select class="date-select" id="date-select" title="回看歷史"></select>
<button class="notion-btn" id="add-cal-btn">➕ 加入 Notion 行事曆</button>
</div>
</div>
<div id="app"></div>
<!-- 加入 Notion 行事曆 彈窗 -->
<div class="cal-modal-overlay" id="cal-overlay">
<div class="cal-modal">
<h3>➕ 加入 Notion 行事曆</h3>
<div class="mhint" id="cal-hint"></div>
<label>事項名稱</label>
<input id="cal-title" type="text" placeholder="輸入事項標題…">
<div class="row">
<div><label>性質分類</label><select id="cal-cat"></select></div>
<div><label>優先程度</label><select id="cal-pri"></select></div>
</div>
<label>日期</label>
<input id="cal-date" type="date">
<div class="cal-modal-actions">
<button class="mbtn btn-cancel" id="cal-cancel">取消</button>
<button class="mbtn btn-submit" id="cal-submit">送出到 Notion</button>
</div>
</div>
</div>
<div class="cal-toast" id="cal-toast"></div>
<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
/* ---------- render ---------- */
function render(){
document.getElementById("h-date").textContent=(DATA.dateLabel||DATA.date)+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
var w=DATA.weather||{};
document.getElementById("w-icon").textContent=w.icon||"🌤️";
document.getElementById("w-temp").textContent=(w.high!=null?w.high+"°C":"")+(w.low!=null?" / "+w.low+"°C":"");
document.getElementById("w-note").textContent=w.note||"";
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
if(sc.note){var _n=document.createElement("div");_n.className="empty-tasks";_n.style.marginTop="12px";_n.style.textAlign="left";_n.style.lineHeight="1.8";_n.textContent=sc.note;list.appendChild(_n);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2><span class='hint'>"+esc((DATA.mail&&DATA.mail.window)||"")+"</span></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div><div class='sender'>"+esc(it.tag)+"</div>"+
"<div class='subject'>"+esc(it.title)+"</div>"+
"<div class='action'>"+(it.deadline&&it.deadline!=="—"?"📌 "+esc(it.deadline)+" · ":"")+esc(it.kind||"")+"</div></div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+esc(it.detail||"")+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(m.footnote)html+="<div style='font-size:11px;color:#8b949e;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;line-height:1.6'>※ "+esc(m.footnote)+"</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2><span class='hint'>"+esc((DATA.news&&DATA.news.window)||"")+"</span></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+esc(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");
body.querySelectorAll(".news-section").forEach(function(s){s.classList.toggle("visible",s.dataset.i===b.dataset.i);});
};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var cls=x.change==null?"":(x.change>=0?"up":"down");var arrow=x.change==null?"":(x.change>=0?" ▲":" ▼");return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+esc(x.value)+arrow+"</div><div class='k'>"+(x.change!=null?fmtChg(x.change)+(x.note?" · "+esc(x.note):""):esc(x.note||""))+"</div></div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(r.price)+"</td><td>"+esc(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2><span class='hint'>"+esc(mk.asOf||"")+"</span></div><div class='card-body'>"+
(mk.highlight?"<div class='hl-box'><div style='color:var(--green);font-weight:700;margin-bottom:4px'>🆕 觀察清單外・新熱門標的</div>"+esc(mk.highlight)+"</div>":"")+
(mk.note?"<div class='trade-date-note'>📅 "+esc(mk.note)+"</div>":"")+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+
"<p style='font-size:11.5px;color:var(--muted);margin:8px 0 18px'>每張卡是觀察清單的一個分類；點卡片切換同分類的下一支，右上角為前一交易日漲跌幅、卡上為 sparkline。</p>"+
"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"<p class='chart-note'>"+esc(mk.historyNote||"")+"</p></div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
(mk.disclaimer?"<p style='font-size:12px;color:var(--muted)'>"+esc(mk.disclaimer)+"</p>":"")+
"<p style='font-size:11.5px;color:var(--muted);margin-top:6px'>※ "+esc(SITE.watchlistNote||"")+"</p>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";
Object.keys(data).forEach(function(cat){
var arr=data[cat],idx=0;
var wrap=document.createElement("div");wrap.className="stack";
wrap.innerHTML=(arr.length>1?"<div class='layer l2'></div><div class='layer l1'></div>":"")+"<div class='stack-card'></div>";
var card=wrap.querySelector(".stack-card");
function paint(){
var s=arr[idx],code=s[1],chg=Q[code],price=s[4]||100,ccy=mkt==="TW"?"NT$":"$";
var col=(chg==null?"#8b949e":chgColor(chg));
var series=genSeries(code,chg||0,price,22);
card.innerHTML="<div class='sc-top'><span class='sc-cat'>"+esc(cat)+"</span><span class='sc-count'>"+(idx+1)+" / "+arr.length+"</span></div>"+
"<div class='sc-namerow'><span class='sc-name'>"+esc(s[0])+"<span class='sc-code'>"+esc(code)+"</span></span><span class='sc-chg' style='color:"+col+"'>"+fmtChg(chg)+"</span></div>"+
"<div class='sc-theme'>"+esc(s[2])+"</div>"+
"<div class='sc-spark'>"+sparkSVG(series,180,34,col)+"</div>"+
"<div class='sc-foot'><span class='sc-risk' style='color:"+riskColor(s[3])+"'>風險 "+esc(s[3])+"</span>"+(arr.length>1?"<span class='sc-hint'>點擊切換 ▸</span>":"")+"</div>"+
"<div class='sc-dots'>"+arr.map(function(_,k){return "<i class='"+(k===idx?"on":"")+"'></i>";}).join("")+"</div>";
}
paint();
if(arr.length>1)card.onclick=function(){idx=(idx+1)%arr.length;paint();};
grid.appendChild(wrap);
});
}
document.querySelectorAll("#mkt-tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#mkt-tabs button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");build(b.dataset.mkt);};});
build("TW");
// mover chart
var sel=document.getElementById("mover-select"),flat={};
[["TW","🇹🇼 台股"],["US","🇺🇸 美股"]].forEach(function(mk){
var og=document.createElement("optgroup");og.label=mk[1];var data=WL[mk[0]]||{};
Object.keys(data).forEach(function(cat){data[cat].forEach(function(s){
var code=s[1],key=mk[0]+"|"+code,chg=Q[code];
var o=document.createElement("option");o.value=key;o.textContent=s[0]+"　"+code+"（"+fmtChg(chg)+"）";og.appendChild(o);
flat[key]={name:s[0],code:code,chg:chg,price:s[4]||100,ccy:mk[0]==="TW"?"NT$":"$"};
});});
sel.appendChild(og);
});
var rng=22;
function drawMover(){
var f=flat[sel.value];if(!f)return;
var full=genSeries(f.code,f.chg||0,f.price,22),n=Math.min(rng,full.length),series=full.slice(-n);

"<span style='font-weight:700;margin-left:6px'>"+f.ccy+last.toFixed(dec)+"</span>"+

/* ---------- boot ---------- */
function bindStatic(){
document.getElementById("add-cal-btn").onclick=function(){openCalModal("",DATA?DATA.date:"");};
document.getElementById("cal-cancel").onclick=closeCalModal;
document.getElementById("cal-submit").onclick=submitCal;
document.getElementById("cal-overlay").onclick=function(e){if(e.target===this)closeCalModal();};
}
function buildDateSelect(){
var sel=document.getElementById("date-select"),dates=(ARCHIVE.dates||[]).slice().sort().reverse();
if(!dates.length){sel.style.display="none";return;}
var cur=new URLSearchParams(location.search).get("date")||DATA.date;
sel.innerHTML=dates.map(function(d){return "<option value='"+d+"'"+(d===cur?" selected":"")+">"+d+(d===dates[0]?"（最新）":"")+"</option>";}).join("");
sel.onchange=function(){var d=sel.value;location.search=(d===dates[0])?"":("?date="+d);};
}
/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
