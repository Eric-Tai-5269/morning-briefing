能**」，卡達首相居中調停，德黑蘭提出七項條件。", "summary": "President Donald Trump told CNN on November 8 that renewed US attacks on Iran are 'highly unlikely' while negotiations show progress, and that war with Iran is unlikely to resume. The remarks came as Washington and Tehran pursue indirect talks. On November 9 Qatari Prime Minister Sheikh Mohammed bin Abdulrahman Al Thani held separate meetings with Trump and Vice President JD Vance, with a source citing 'good progress' on Iran. Tehran says it will engage only within seven conditions, including lifting the naval blockade and unilateral sanctions, safe passage through the Strait of Hormuz, and release of frozen assets. Iranian officials denied reports of a Hormuz-for-eight-billion-dollar deal.", "source": "CNN（11/8）", "url": "https://www.cnn.com/2026/11/08/politics/trump-interview-on-iran"}, {"en": "US, Russia and Ukraine restart trilateral peace talks in Abu Dhabi", "zh": "美俄烏三方和談今天在阿布達比重啟，是**九個月來首次**；俄軍連日轟炸電網施壓基輔。", "summary": "The United States, Russia and Ukraine open their fourth round of trilateral talks in Abu Dhabi on November 10, the first since February's Geneva round after a March meeting was postponed by the Iran war. Jared Kushner and envoy Steve Witkoff lead the US side; Ukraine's delegation is headed by intelligence chief Rustem Umerov, while Russia sends deputy foreign ministers Sergei Ryabkov and Mikhail Galuzin plus Kremlin aide Vladimir Medinsky. Security guarantees and a post-war security architecture top the agenda. Russian strikes left more than 600,000 people in the Dnipropetrovsk region without power, and ACLED counts over 2,700 civilians killed in Russian attacks this year.", "source": "CNN（11/9）", "url": "https://edition.cnn.com/2026/11/09/europe/russia-ukraine-us-peace-talks-preview-intl"}, {"en": "Gunman who killed six in Krakow mass shooting dies in hospital", "zh": "波蘭克拉科夫主廣場槍擊案**兇手傷重死亡**，6 死約 15 傷，內政部長指嫌犯迷戀極右思想。", "summary": "The gunman who opened fire on Krakow's Main Square over the weekend has died in hospital, CNN reported on November 9. Six people were killed, four women and two men, among them a UK citizen, and about 15 were injured, including two police officers seriously hurt. The 25-year-old Polish suspect wore military-style fatigues and a bulletproof vest, drove between points in the square firing an automatic weapon, and kept shooting after police hit him. Interior Minister Marcin Kierwinski said he held 'very radical' ultranationalist views and was 'fascinated by far-right ideologies.' Prime Minister Donald Tusk said three family members were found dead at the suspect's home in Ostrowiec Swietokrzyski.", "source": "CNN（11/9）", "url": "https://www.cnn.com/2026/11/09/europe/krakow-shooting-poland-gunman-dead-intl-hnk"}, {"en": "Trump blames 'great dislike' for Israel and the Iran war for Republican midterm losses", "zh": "川普在《60 分鐘》受訪，把期中選舉失利歸因於**對以色列的強烈反感**、伊朗戰爭與油價上漲。", "summary": "In a CBS '60 Minutes' interview aired Sunday, Trump said a 'great dislike, incredibly, for Israel' was one reason Republicans lost the midterms, alongside the Iran war and rising gasoline prices, saying voters 'didn't like the war.' He agreed with Vice President JD Vance that the war hurt the party but said he does not regret launching it, arguing you cannot let Iran have a nuclear weapon. Trump said countries the US has protected should repay war costs, adding that without America, Israel would not exist. On Election Day he said he would end four billion dollars in annual aid to Israel; Netanyahu later said the aid would shift to a 'partnership.'", "source": "CNN（11/9）", "url": "https://www.cnn.com/2026/11/09/middleeast/trump-dislike-of-israel-contributed-to-republican-losses-intl"}, {"en": "Nvidia board opens independent investigation after CEO Jensen Huang admits affair", "zh": "輝達董事會啟動**獨立調查**，執行長黃仁勳承認與涉中國間諜嫌疑的前 Megaspeed 主管有婚外情。", "summary": "Nvidia's board said on Sunday, November 8, that independent directors working with outside legal counsel will conduct an independent investigation following reports that CEO Jensen Huang was targeted in a Chinese intelligence operation. Nvidia published a message from Huang to employees admitting an affair with Alice Huang, a former executive at Singapore-based Megaspeed, in which he apologised to his wife and children and said he had 'fallen short' of his responsibilities to the company. A memo circulating among US policymakers earlier in 2026 alleged she had been recruited by China's Ministry of State Security. The board said it has 'no reason to believe' national security or company secrets were compromised.", "source": "CNN（11/8）", "url": "https://www.cnn.com/2026/11/08/business/nvidia-investigation-ceo-jensen-huang"}]}, {"label": "科技", "items": [{"en": "Google unveils two specialized TPUs to escalate its AI chip rivalry with Nvidia", "zh": "Google 推出 **TPU 8tx 與 8i Max** 兩款專用 AI 晶片，瞄準政府機密運算與超長上下文推論。", "summary": "Google announced two specialized Tensor Processing Units on Monday, November 9, escalating its challenge to Nvidia. The TPU 8tx targets governments and heavily regulated industries, using hardware-level security to protect data while it is being processed. The TPU 8i Max combines two TPU 8i chips in a single package, doubling compute and memory bandwidth for memory-intensive work such as many AI agents collaborating on one software codebase. Amin Vahdat, Google's chief technologist for AI and infrastructure, said computing is moving from human to agent scale. Both are expected in 2027. Bloomberg reported Google has nearly 100 TPU customers, including Apple, Meta and Oracle; Alphabet shares rose more than 2% premarket.", "source": "Bloomberg（11/9）", "url": "https://bloomberg.com/news/articles/2026-11-09/google-escalates-nvidia-rivalry-with-new-versions-of-its-tpu-systems"}, {"en": "Nvidia stock slides more than 4% as the CEO probe bucks a broad market rally", "zh": "輝達股價 11/9 **逆勢重挫逾 4%**，投資人憂心黃仁勳調查與治理風險，同日那斯達克整體走高。", "summary": "Nvidia shares fell more than 4% on Monday, November 9, even as the Nasdaq and S&P 500 rallied, after the chipmaker's board opened an independent investigation into CEO Jensen Huang's relationship with Alice Huang, a former Megaspeed executive whom US officials suspect of working for Chinese intelligence. CNN reported the decline bucked the wider market advance, and the selloff coincided with Google unveiling two new TPU variants aimed at Nvidia's dominance. CNN also published analysis asking whether Nvidia can survive without Huang, arguing that the AI boom's dependence on a handful of founder-CEOs is itself a concentration risk for investors.", "source": "CNN（11/9）", "url": "https://www.cnn.com/2026/11/09/investing/nvidia-stock-huang-investigation"}, {"en": "Leaked EU draft would blacklist ten manipulative online designs and curb addictive features", "zh": "歐盟《數位公平法》草案外流，將**全面禁止十種操弄性設計**，違者最高罰全球營業額 6%。", "summary": "A leaked European Commission draft of the Digital Fairness Act, due to be presented on Wednesday, November 11, would outright ban ten manipulative online designs, including making cancellation harder than sign-up, burying prices or auto-renewal terms, repeated fake scarcity warnings and pre-selected extras. It would give all users the right to switch off autoplay, unrelated notifications, streak-style rewards and chatbot features that simulate relationships, ban profiling-based advertising to minors and paid loot boxes for children, and set the EU's first consumer rules for AI shopping agents. Fines could reach 6% of global turnover. The Commission estimates consumers would avoid 88.4 billion euros in losses between 2025 and 2035.", "source": "Euronews（11/9）", "url": "https://www.euronews.com/2026/11/09/eu-to-blacklist-ten-manipulative-online-design-traps-leaked-draft-shows"}]}, {"label": "運動", "items": [{"en": "Norris wins rain-hit Sao Paulo Grand Prix as Mercedes clinch constructors' title", "zh": "諾里斯從竿位奪下巴西站勝利，**梅賽德斯提前三站鎖定車隊冠軍**，韋斯塔潘從第 21 位衝上第二。", "summary": "Lando Norris won the Sao Paulo Grand Prix at Interlagos on Sunday, November 8, 2026, leading home a race disrupted by late rain in 1:35:23.504 after starting from pole. Max Verstappen recovered from 21st on the grid to finish second, 14.602s back, with Red Bull team-mate Isack Hadjar third. Kimi Antonelli led by around six seconds before delaying his pit stop a lap, then spun at Turn 1 and fell to fifth; George Russell's fourth place sealed Mercedes' ninth constructors' championship with three rounds to spare, their first since 2021. Charles Leclerc took a five-second penalty for a lap-70 clash with Liam Lawson.", "source": "Sky Sports（11/8）", "url": "https://www.skysports.com/f1/news/13609694/sao-paulo-gp-lando-norris-wins-wet-race-for-mclaren-as-mercedes-seal-2026-f1-constructors-championship-in-brazil"}, {"en": "Thunder trade two second-round picks to Kings for Nique Clifford amid injury crisis", "zh": "**雷霆以兩個次輪籤換來克里福德**，補強因威廉斯與華勒斯長期傷停而吃緊的側翼戰力。", "summary": "Oklahoma City announced on Sunday, November 8, 2026 that it had acquired second-year wing Nique Clifford from the Sacramento Kings for a 2028 Utah Jazz second-round pick and a 2030 Minnesota Timberwolves second-rounder, as ESPN's Anthony Slater reported. The 8-2 Thunder are thin on the wing after Jalen Williams fractured his left fibula and dislocated his left ankle against the Clippers in late October and Cason Wallace tore his left shoulder labrum; both could miss most of the season. Clifford, 24, was the No. 24 pick in 2025 and had fallen out of Doug Christie's rotation with the 1-8 Kings. He earns 3.2 million dollars this season.", "source": "ESPN（11/8）", "url": "https://espn.com/nba/story/_/id/50422647/thunder-get-nique-clifford-trade-kings-sources-say"}, {"en": "Mets seen as early favorites for Tarik Skubal as MLB hot stove opens", "zh": "**史庫巴爾成自由市場最大焦點**，大都會暫居領先，道奇、教士、費城人與藍鳥也加入戰局。", "summary": "MLB's 2026-27 free-agent market heated up on Monday, November 9, 2026, with Jon Heyman of the New York Post reporting the Mets are probably the favorite for Tarik Skubal, the offseason's top pitcher. The Padres, Giants, Phillies, Blue Jays and Dodgers are also involved; Skubal, 29, could beat Yoshinobu Yamamoto's 12-year, 325 million dollar record and the 43.33 million dollar average annual value shared by Max Scherzer and Justin Verlander. The Athletic reported the Dodgers are unlikely to match Yamamoto's length and the Cubs look unlikely to bid. Elsewhere, Atlanta said it will not trade Ronald Acuna Jr., while Texas may move Corey Seager or Jacob deGrom.", "source": "MLB.com（11/9）", "url": "https://www.mlb.com/news/mlb-rumors-and-2026-27-free-agent-news-november-9"}]}, {"label": "教育心理", "items": [{"en": "Democrats plan hearings and subpoenas over Trump's dismantling of the Education Department", "zh": "民主黨將以聽證與傳票反制**川普政府拆解教育部**，但受否決權限制，實際翻轉空間有限。", "summary": "With Democrats set to hold majorities in both chambers of Congress, Rep. Bobby Scott, the top Democrat on the House Education and Workforce Committee, said in an Associated Press report on November 9, 2026 that he will leave no rock unturned investigating the dismantling of the Education Department, federal student-loan oversight and anti-discrimination policy, using hearings and subpoenas; he has asked 10 agencies to preserve records. Sen. Chris Van Hollen said appropriations conditions could stop the bleeding, including language reversing the shift of special education to HHS. The department has cut staff by nearly half under Secretary Linda McMahon. Trump has threatened vetoes, and analysts see little chance of reversal.", "source": "AP／ABC News（11/9）", "url": "https://abcnews.com/US/wireStory/democrats-plan-new-power-rein-trumps-education-agenda-137984500"}, {"en": "Genes' link to children's IQ shifts with age, large British cohort study finds", "zh": "大型英國世代研究顯示，**基因與兒童智商的關聯隨年齡改變**：常見變異影響漸增，罕見有害變異影響減弱。", "summary": "A Nature Human Behaviour study of British birth cohorts, reported on November 9, 2026, found that genetic links to children's cognition shift with age. Among 6,495 unrelated children in the Avon Longitudinal Study of Parents and Children, polygenic scores for education and cognitive skills explained about 11% of IQ variance at age 4, rising to roughly 14% by age 16, with the gain concentrated in the upper half of the distribution. Rare gene-disrupting variants predicted lower IQ, but that effect faded: at age 4 it was 3.9 times stronger at the 5th percentile than the 95th, a gap no longer significant by 16. Authors include Daniel Malawsky and Hilary Martin of the Wellcome Sanger Institute.", "source": "PsyPost（11/9）", "url": "https://www.psypost.org/the-link-between-genes-and-kids-iq-shifts-as-they-grow-up-large-study-finds/"}, {"en": "ADHD symptoms may reflect a brain tilted toward excessive synchrony, MEG study suggests", "zh": "芬蘭腦磁圖研究指出，**ADHD 症狀可能反映大腦偏向過度同步**，gamma 波長程相關性愈強、症狀分數愈高。", "summary": "A Translational Psychiatry study reported on November 9, 2026 used magnetoencephalography on 70 adults, 34 with a prior ADHD diagnosis and 36 neurotypical, to test whether ADHD reflects where a brain sits relative to a critical point between disorder and over-synchronization. Led by Hamed Haque of the University of Helsinki with J. Matias Palva and Satu Palva, the team measured long-range temporal correlations during a faint-image detection task and a go/no-go response task. The ADHD group showed stronger slow alpha (8-13 Hz) and gamma (35-65 Hz) correlations with moderate effect sizes, and higher gamma values tracked higher symptom scores. The markers did not cleanly separate groups, and the sample was small.", "source": "PsyPost（11/9）", "url": "https://www.psypost.org/adhd-symptoms-may-reflect-a-brain-shifting-toward-overly-synchronized-activity-study-suggests/"}]}, {"label": "產業動態", "items": [{"en": "Anthropic targets mid-November Nasdaq debut as IPO valuation talk slips to 1.1-1.3 trillion dollars", "zh": "Claude 母公司 Anthropic 最快今天啟動 IPO 行銷，**估值期望從 2 兆美元降到 1.1–1.3 兆美元**，拚 11/16 當週掛牌。", "summary": "Anthropic is moving toward one of the largest technology listings ever, with formal marketing of its Nasdaq Global Select IPO expected to begin as early as November 10 and pricing in the week of November 16, ahead of Thanksgiving. Investor conversations last week centred on a valuation of roughly 1.1 trillion to 1.3 trillion dollars, down sharply from the 1.5 trillion to 2 trillion discussed earlier in the month. The amended S-1 shows third-quarter revenue of 16.96 billion dollars, up 47% from 11.56 billion in the second quarter, but sequential growth slowed from 144% and the quarter swung to a 567 million dollar operating loss.", "source": "Investing.com（11/9）", "url": "https://www.investing.com/news/stock-market-news/anthropic-ipo-targets-november-debut-as-valuation-expectations-fall-93CH-5012800"}, {"en": "Google adds confidential computing to its AI chip line with TPU 8tx and TPU 8i Max", "zh": "Google 一口氣推出兩款第八代 TPU，**8tx 主打硬體級機密運算、延遲最多降 50%**，8i Max 雙晶片封裝算力翻倍。", "summary": "Google has added two chips to its eighth-generation Tensor Processing Unit family, both aimed at enterprise AI training and inference and both positioned against Nvidia's GPUs. The TPU 8tx introduces hardware-level confidential computing that isolates customer data and model parameters, pairs fifth-generation AMD EPYC processors with Google's networking technology, and cuts latency by up to 50% versus the TPU 8t. The TPU 8i Max packages two TPU 8i chips together, roughly doubling compute and memory bandwidth. Google also open-sourced TPU Sync software and said about 100 customers now use TPUs. Pricing and a detailed launch schedule were not disclosed.", "source": "Bloomingbit／Decrypt（11/9）", "url": "https://en.bloomingbit.io/feed/news/124027"}, {"en": "OpenAI tests a ChatGPT dashboard showing brands their mentions and clicks", "zh": "OpenAI 測試 ChatGPT 商家儀表板，**讓品牌看見自己被提及次數與導流點擊數**，藏在尚未上線的 Business Hub。", "summary": "OpenAI is testing an analytics dashboard that would let businesses see how often they surface in ChatGPT's answers and how many clicks those appearances drive, logging impressions and clicks daily on a chart. It does not expose user prompts, user data, or rankings against competitors. The tool sits inside an unlaunched Business Hub and was spotted through a banner inviting owners to claim their business in ChatGPT; claiming also unlocks a business agent that answers customer questions using supplied contact details, with connecting a Shopify store one way to prove authority. The move follows OpenAI's advertising push, which it says reached a 1 billion dollar annualised run rate by September.", "source": "Digiday（11/9）", "url": "https://digiday.com/marketing/chatgpt-is-about-to-show-brands-their-mention-count"}]}, {"label": "追星", "items": [{"en": "Kenshi Yonezu's Taipei Dome shows head to general sale on Nov 19", "zh": "米津玄師 12/26、27 台北大巨蛋首唱，**一般販售暫定 11/19 中午 12:00 開賣**，實名制每場每帳號限 2 張。", "summary": "Taiwan's Ticket Plus platform has laid out the remaining steps for Kenshi Yonezu's December 26-27 shows at Taipei Dome, the first there by a Japanese solo artist. The real-name registration lottery closed October 31 with first-round results on November 2; from November 4 the system has run repeated resale lotteries on returned inventory, notifying winners daily from noon, with non-winners not contacted. A general sale is tentatively scheduled for Thursday, November 19 at 12:00, though it may not happen if stock sells out. Each account is capped at two tickets per show and each ID number may be registered for only one seat.", "source": "蕃新聞 yam（11/9）", "url": "https://n.yam.com/Article/20261109252532", "spotify": "https://open.spotify.com/artist/1snhtMLeb2DYoMOcVbb8iB"}, {"en": "YOASOBI renames its Asia tour, adds Australia; Taipei Dome and Hong Kong dates confirmed", "zh": "YOASOBI 巡演改名 11 城亞洲大洋洲巡迴，**台北大巨蛋 1/9–10、香港亞博館 1/21–22**，新增墨爾本與雪梨。", "summary": "YOASOBI announced on November 9 that it has reworked its biggest-ever tour, dropping shows in some originally planned countries, regions and venues after deliberating in light of recent circumstances, while adding the duo's first Australian dates in Melbourne (Rod Laver Arena, March 17, 2027) and Sydney (Afterpay Arena, March 19, 2027). The run has been renamed from ASIA 10-CITY DOME & STADIUM TOUR 2026-2027 Super Planet to YOASOBI 11-CITY ASIA-OCEANIA TOUR 2026-2027. The overseas leg opens at Taipei Dome on January 9-10, 2027, then Hong Kong's AsiaWorld-Arena on January 21-22, Singapore's National Stadium on February 20, Australia in March, and Korea on April 17.", "source": "TVfan（11/9）", "url": "https://tvfan.kyodo.co.jp/music/news-music/1530558", "spotify": "https://open.spotify.com/artist/64tJ2EAv1R6UaZqc4iOCyj"}, {"en": "Ado releases 'Shinka', opening theme for Prime Video anime Demon's Crest", "zh": "Ado 新曲〈シンカ〉11/6 上線，**擔任 Prime Video 動畫《Demon's Crest》片頭曲**，由ユリイ・カノン作詞作曲。", "summary": "Ado released her new song Shinka on November 6, the opening theme for Demon's Crest, an original anime by Sword Art Online author Reki Kawahara that premiered worldwide and exclusively on Prime Video the same evening at 21:00 JST. The track was written and composed by Vocaloid producer Yuriy Canon, a longtime collaborator, and arranged by Canon with Naoki Itai; the jacket illustration is by SKYn and the logo design by ZIIEK. Described as an up-tempo number about holding on to your own voice and expression in a world full of lies, it carries themes of determination to grow and hope for the future.", "source": "USEN Music News（11/6）", "url": "https://e.usen.com/news/news-release/ado116.html", "spotify": "https://open.spotify.com/artist/4vWfsyx7AkuLNuXwa075co"}, {"en": "Mrs. GREEN APPLE and CASETiFY launch the brand's first Japanese-band collaboration on Nov 20", "zh": "Mrs. GREEN APPLE 攜手 CASETiFY，**聯名配件 11/20 上午 11 點全球分批開賣**，日本門市今天晚間 6 點開放預約。", "summary": "CASETiFY will launch its first-ever collaboration with a Japanese band on November 20 at 11:00 JST, a Mrs. GREEN APPLE x CASETiFY collection rolling out worldwide in stages. The line covers phone cases for Apple, Samsung and Google devices plus AirPods cases, MagSafe card-holder stands, grip stands and laptop sleeves, priced from 6,380 yen for cases and 5,610 yen for other accessories. Designs use the band's green-apple symbol in sticker-style graphics, illustrated member characters, a grocery-cart collage of receipts, CDs and jam toast, and a neon-glow logo, with customisable text in six colours. Japanese STUDiO stores require reservations on November 20-21, bookable from November 10 at 18:00 via LINE.", "source": "PR TIMES（11/6）", "url": "https://prtimes.jp/main/html/rd/p/000000206.000044448.html", "spotify": "https://open.spotify.com/artist/3gIRvgZssIb3fjiRNPlqSn"}, {"en": "Fujii Kaze sets Dec 16 Blu-ray release for 'Pre: Prema Tour' Hiroshima show", "zh": "藤井風宣布 **「Pre: Prema Tour」廣島公演 Blu-ray 12/16 發售**，收錄 18 曲全場與 35 分鐘幕後紀錄片。", "summary": "Fujii Kaze will release a live Blu-ray of his Pre: Prema Tour on December 16. The disc captures the full 18-song set from the second night at Hiroshima Green Arena, the closing stop of a short July-August 2026 arena run that also visited Sapporo and Fukui, directed by Kento Yamada and subtitled in Japanese and English. A roughly 35-minute bonus documentary, Pre: Prema Behind the Scenes, traces the making of seven Japanese-language songs released between Love All Serve All and Prema, with commentary from Fujii. Packaging adds a 32-page photo booklet, a double-sided B4 poster and a three-sided slipcase; pre-orders are open.", "source": "Fujii Kaze Official（11/6）", "url": "https://fujiikaze.com/news-article/news261106/", "spotify": "https://open.spotify.com/artist/6bDWAcdtVR3WHz2xtiIPUi"}]}]}, "market": {"insights": ["**國安基金授權＋空方限制**，台股昨日暴漲 1,960 點收 41,661，史上第二大漲點", "**外資仍賣超 900 億**，三大法人合計賣超 945 億，這波反彈靠內資與政策撐起來", "**今天先看 42,349 這個盤中高點**，昨收離高點還差 687 點，追價買盤明顯不足", "**油價重挫、VIX 跌 21.9%**，美股四大指數同步收紅，羅素 2000 漲 3.15% 最強", "**輝達逆勢跌 4.58%** 是清單內最大個股 <body>

<script>
"use strict";
var SITE=null, DATA=null, ARCHIVE={dates:[]}, HOOK="";
var REMOTE="https://eric-tai-5269.github.io/morning-briefing/";
var TOMORROW=(function(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function priClass(p){return p==="高"?"pri-high":p==="中"?"pri-mid":"pri-low";}
function priIcon(p){return p==="高"?"🔴":p==="中"?"🟡":"🟢";}
function riskColor(r){return (r==="低"||r==="中低")?"#3fb950":(r==="中")?"#d29922":(r==="中高")?"#f0883e":"#f85149";}
function chgColor(c){return c>=0?"#3fb950":"#f85149";}
/* 漲跌幅防呆：台股單日上限 10%，其他超過 60% 視為誤填（多半是把股價填成漲幅） */
function qChg(code,mkt){var Q=(DATA.market&&DATA.market.quotes)||{},v=Q[code];if(v==null||isNaN(v))return null;v=+v;if(mkt==="TW"&&Math.abs(v)>10.5)return null;if(Math.abs(v)>60)return null;return v;}
function qPrice(code,fb){var P=(DATA.market&&DATA.market.prices)||{};return P[code]!=null?+P[code]:fb;}
function bullets(arr){return "<ul class='bul'>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul>";}
function splitStars(s){return String(s||"").split("★").map(function(x){return x.trim().replace(/[。]\s*$/,"");}).filter(Boolean);}
function fmtChg(c){if(c==null)return "—";return (c>=0?"+":"")+(Math.round(c*100)/100)+"%";}
/* ---------- Notion modal ---------- */
function openCalModal(title,date,cat,pri){
document.getElementById("cal-title").value=title||"";
document.getElementById("cal-date").value=date||new Date().toISOString().slice(0,10);
document.getElementById("cal-cat").value=cat||(SITE.notionForm.cats[0]);
document.getElementById("cal-pri").value=pri||"中";
document.getElementById("cal-overlay").classList.add("open");
setTimeout(function(){document.getElementById("cal-title").focus();},60);
}
function closeCalModal(){document.getElementById("cal-overlay").classList.remove("open");}
function calToast(msg,ok){var t=document.getElementById("cal-toast");t.textContent=msg;t.style.background=(ok===false)?"#f85149":"var(--green)";t.style.color=(ok===false)?"#fff":"#04121f";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3200);}
function sendToCal(title,date,cat,pri){
var url=HOOK+"?title="+encodeURIComponent(title)+"&date="+encodeURIComponent(date)+"&cat="+encodeURIComponent(cat||"功課")+"&pri="+encodeURIComponent(pri||"中");
fetch(url,{mode:"no-cors"}).then(function(){calToast("✅ 已送出："+title);}).catch(function(){calToast("✅ 已送出（請稍後到 Notion 確認）");});
}
function submitCal(){
var title=document.getElementById("cal-title").value.trim();
if(!title){calToast("請先輸入事項名稱",false);return;}
sendToCal(title,document.getElementById("cal-date").value,document.getElementById("cal-cat").value,document.getElementById("cal-pri").value);
closeCalModal();
}
/* ---------- sparkline ---------- */
function genSeries(code,chg,price,n){
var seed=0;for(var i=0;i<code.length;i++)seed=(seed*31+code.charCodeAt(i))%1000000;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
var arr=[100];for(var d=1;d<n-1;d++){arr.push(arr[d-1]*(1+(rnd()-0.45)*0.02));}
arr.push(arr[arr.length-1]*(1+(chg||0)/100));
var k=price/arr[arr.length-1];
return arr.map(function(x){return x*k;});
}
function sparkSVG(series,w,h,col){
var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
var pts=series.map(function(v,i){var x=(i/(series.length-1))*w;var y=h-((v-min)/rng)*(h-4)-2;return (Math.round(x*10)/10)+","+(Math.round(y*10)/10);}).join(" ");
return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' preserveAspectRatio='none'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
}
function mdb(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
/* 舊資料相容：把 dateLabel 的長段落拆成條列 */
function splitHighlights(dl){
var i=dl.indexOf("——");if(i<0)return [];
var rest=dl.slice(i+2),out=[];
rest.split("★").forEach(function(seg){seg=seg.trim();if(!seg)return;
  var parts=seg.split(/[①②③④⑤⑥⑦⑧⑨]/);
  if(parts.length>1){var lead=parts[0].replace(/[：:]\s*$/,"").trim();if(lead)out.push(lead);
    parts.slice(1).forEach(function(p){p=p.replace(/[；;。]\s*$/,"").trim();if(p)out.push(p);});}
  else out.push(seg.replace(/[。]\s*$/,""));});
return out;}
function renderHighlights(arr){
var box=document.getElementById("hl");
if(!arr||!arr.length){box.hidden=true;box.innerHTML="";return;}
box.innerHTML="<div class='hl-box'><h2>📌 今日重點</h2><ul>"+arr.map(function(t){return "<li>"+mdb(t)+"</li>";}).join("")+"</ul></div>";
box.hidden=false;}
function renderWeather(w){
var box=document.getElementById("w-box"),rows="";
if(w.cities&&w.cities.length){
  rows=w.cities.map(function(c){return "<div class='w-row'><span class='w-city'>"+esc(c.name)+"</span><span class='w-t'>"+esc(c.high)+"/"+esc(c.low)+"°C</span><span class='w-d'>"+esc(c.desc||"")+"</span></div>";}).join("");
}else{
  var n=String(w.note||"").replace(/\*\*/g,"").replace(/★/g,"").trim();n=n.split("。")[0];if(n.length>40)n=n.slice(0,40)+"…";
  rows="<div class='w-row'><span class='w-t'>"+(w.high!=null?esc(w.high)+"°":"")+(w.low!=null?"/"+esc(w.low)+"°C":"")+"</span></div><div class='w-d' style='white-space:normal;max-width:260px'>"+esc(n)+"</div>";
}
var al=w.alerts;
var tags=(al&&al.length)?al.map(function(a){return "<span class='w-tag "+(a.level==="red"?"red":"yellow")+"' title='"+esc(a.text||"")+"'>"+esc(a.type)+"："+esc(a.short||a.text||"")+"</span>";}).join("")
  :(w.cities?"<span class='w-tag ok'>無寒流／颱風／地震警報</span>":"");
box.innerHTML="<span class='w-icon'>"+esc(w.icon||"🌤️")+"</span><div>"+rows+(tags?"<div class='w-alerts'>"+tags+"</div>":"")+"</div>";
}
/* ---------- render ---------- */
function render(){
var dl=String(DATA.dateLabel||DATA.date);
document.getElementById("h-date").textContent=(DATA.dateShort||dl.split("——")[0].replace(/\*\*/g,"").trim())+" · "+SITE.site.location;
document.getElementById("h-ver").textContent="版本 v"+DATA.date+" · "+SITE.site.cacheBustNote;
renderWeather(DATA.weather||{});
renderHighlights(DATA.highlights||splitHighlights(dl));
// notion form options
var catSel=document.getElementById("cal-cat");catSel.innerHTML=SITE.notionForm.cats.map(function(c){return "<option>"+esc(c)+"</option>";}).join("");
var priSel=document.getElementById("cal-pri");priSel.innerHTML=SITE.notionForm.pris.map(function(p){return "<option value='"+esc(p.value)+"'"+(p.value==="中"?" selected":"")+">"+esc(p.label)+"</option>";}).join("");
document.getElementById("cal-hint").textContent=SITE.notionForm.hint||"";
var app=document.getElementById("app");
app.innerHTML=
"<div class='main'>"+
cardSchedule()+
cardMail()+
cardNews()+
cardMarket()+
"</div>";
initSchedule();
initMail();
initNews();
initMarket();
}
/* Card 1: schedule */
function cardSchedule(){
return "<div class='card'><div class='card-header'><h2>📅 今日行程</h2><span class='hint' id='task-count-label'>—</span></div>"+
"<div class='card-body'><div class='progress-ring-wrap'><div class='ring-container'>"+
"<svg viewBox='0 0 110 110' width='110' height='110'><circle class='ring-bg' cx='55' cy='55' r='48'/><circle class='ring-fg' id='ring-fg' cx='55' cy='55' r='48'/></svg>"+
"<div class='ring-text'><div class='pct' id='ring-pct'>0%</div><div class='sub' id='ring-sub'>完成</div></div></div></div>"+
"<div id='task-list'></div>"+
"<button class='tomorrow-btn' id='tmr-btn'>🌙 明天代辦事項</button></div></div>";
}
function initSchedule(){
var sc=DATA.schedule||{available:false,tasks:[]};
var TASKS=(sc.available&&Array.isArray(sc.tasks))?sc.tasks.slice():[];
var r=48,circ=2*Math.PI*r,fg=document.getElementById("ring-fg");fg.style.strokeDasharray=circ;
var list=document.getElementById("task-list"),pct=document.getElementById("ring-pct"),sub=document.getElementById("ring-sub"),label=document.getElementById("task-count-label");
function paint(){
var done=TASKS.filter(function(t){return t.done;}).length,total=TASKS.length,p=total?Math.round(done/total*100):0;
fg.style.strokeDashoffset=circ-(circ*p/100);pct.textContent=p+"%";
sub.textContent=total?done+"/"+total+" 完成":"無待辦";
label.textContent=total?total+" 項任務":"今日無待辦";
if(!total){list.innerHTML="<div class='empty-tasks'>🎉 "+esc(sc.message||"今日無待辦事項")+"</div>";return;}
list.innerHTML="";
TASKS.forEach(function(t,i){
var div=document.createElement("div");div.className="task-item";
div.innerHTML="<div class='task-cb "+(t.done?"checked":"")+"'></div><div class='task-info'>"+
"<div class='task-name"+(t.done?" done":"")+"'>"+esc(t.title)+"</div><div class='task-meta'>"+
(t.pri?"<span class='badge "+priClass(t.pri)+"'>"+priIcon(t.pri)+" "+esc(t.pri)+"優先</span>":"")+
(t.time?"<span class='badge badge-type'>"+esc(t.time)+"</span>":"")+
(t.cat?"<span class='badge badge-type'>"+esc(t.cat)+"</span>":"")+"</div></div>"+
"<button class='task-tmr'>🌙 未完成新增到明天</button>";
div.querySelector(".task-cb").onclick=function(){t.done=!t.done;paint();};
div.querySelector(".task-tmr").onclick=function(e){e.stopPropagation();sendToCal(t.title,TOMORROW,t.cat||"功課",t.pri||"中");this.classList.add("sent");this.textContent="✅ 已排明天";this.disabled=true;};
list.appendChild(div);
});
var adv=(sc.advice&&sc.advice.length)?sc.advice:splitStars(sc.note);
if(adv.length){var _a=document.createElement("div");_a.className="advice";_a.innerHTML="<h3>💡 AI 建議</h3>"+bullets(adv);list.appendChild(_a);}
}
paint();
document.getElementById("tmr-btn").onclick=function(){openCalModal("",TOMORROW);};
}
/* Card 2: mail */
function cardMail(){
return "<div class='card'><div class='card-header'><h2>📬 待處理信件</h2></div>"+
"<div class='card-body'><div class='email-scroll' id='mail-scroll'></div></div></div>";
}
function initMail(){
var m=DATA.mail||{items:[]},box=document.getElementById("mail-scroll"),html="";
html+="<div class='section-label'>🎓 成大 Moodle / 成大相關</div>";
(m.items||[]).forEach(function(it){
var lvl=it.level==="red"?"urg-red":it.level==="amber"?"urg-amber":"urg-green";
var cal=it.calendar;
var from=it.from||String(it.tag||"").split("·").filter(function(x){return !/優先|開考|剩|發布|48h/.test(x);}).join("·").replace(/^[🔴🟠🟡🟢✅\s]+/,"").trim();
var subj=it.subject||String(it.title||"").replace(/\*\*/g,"").split(/[。（(]/)[0].slice(0,60);
var todo=it.todo||String(it.kind||"").replace(/\*\*/g,"").split(/[：:]/).slice(-1)[0].split(/[；;]/)[0].slice(0,60);
var more=(it.subject?mdb(it.title||""):"")+(it.subject&&it.title?"<br>":"")+(it.todo&&it.kind?mdb(it.kind)+"<br>":"")+(it.detail?mdb(it.detail):"");
html+="<div class='email-item'><div class='email-header'><div style='display:flex;gap:8px;align-items:flex-start;flex:1'>"+
"<div class='urgency "+lvl+"'></div><div>"+(from?"<div class='sender'>"+esc(from)+"</div>":"")+
"<div class='subject'>"+mdb(subj)+"</div>"+
(todo?"<div class='action'>👉 "+mdb(todo)+(it.deadline&&it.deadline!=="—"?"（"+esc(it.deadline)+"）":"")+"</div>":"")+"</div></div>"+
"<span style='font-size:14px;color:var(--muted)'>▾</span></div>"+
"<div class='email-body'>"+more+
(cal?"<div><button class='email-add' data-t='"+esc(cal.title)+"' data-d='"+esc(cal.date)+"' data-c='"+esc(cal.cat)+"' data-p='"+esc(cal.pri)+"'>"+esc(cal.label||"➕ 加入行事曆")+"</button></div>":"")+
"</div></div>";
});
if(!(m.items||[]).length)html+="<div class='empty-tasks'>📭 過去 24 小時沒有需要處理的信</div>";
box.innerHTML=html;
box.querySelectorAll(".email-header").forEach(function(h){h.onclick=function(){var b=h.nextElementSibling,a=h.querySelector("span:last-child");b.classList.toggle("open");a.textContent=b.classList.contains("open")?"▴":"▾";};});
box.querySelectorAll(".email-add").forEach(function(b){b.onclick=function(e){e.stopPropagation();openCalModal(b.dataset.t,b.dataset.d,b.dataset.c,b.dataset.p);};});
}
/* Card 3: news */
function cardNews(){
return "<div class='card full-width'><div class='card-header'><h2>📰 最新消息</h2></div>"+
"<div class='card-body'><div class='news-tabs' id='news-tabs'></div><div id='news-body'></div></div></div>";
}
function initNews(){
var groups=(DATA.news&&DATA.news.groups)||[],tabs=document.getElementById("news-tabs"),body=document.getElementById("news-body");
var icons={"頭條":"🌐","科技":"💻","運動":"⚽","教育心理":"📚","產業":"🤖","追星":"🎵"};
tabs.innerHTML=groups.map(function(g,i){return "<button class='tab-btn"+(i===0?" active":"")+"' data-i='"+i+"'>"+(icons[g.label]||"📄")+" "+esc(g.label)+"</button>";}).join("");
body.innerHTML=groups.map(function(g,i){
var items=(g.items||[]).map(function(it){
return "<div class='news-item'><div class='news-en'>"+(it.url?"<a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.en)+"</a>":esc(it.en))+" <span class='arrow'>▾</span></div>"+
"<div class='news-zh'>"+mdb(it.zh)+"</div>"+
"<div class='news-summary'>"+esc(it.summary||"")+"</div>"+
"<div class='news-src'>來源: <a href='"+esc(it.url)+"' target='_blank' rel='noopener'>"+esc(it.source)+" ↗</a>"+
(it.spotify?"<a class='sp-link' href='"+esc(it.spotify)+"' target='_blank' rel='noopener'>🎧 Spotify</a>":"")+"</div></div>";
}).join("");
return "<div class='news-section"+(i===0?" visible":"")+"' data-i='"+i+"'>"+items+"</div>";
}).join("");
tabs.querySelectorAll(".tab-btn").forEach(function(b){b.onclick=function(){
tabs.querySelectorAll(".tab-btn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");

};});
body.querySelectorAll(".news-en").forEach(function(en){en.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("a"))return;var s=en.parentElement.querySelector(".news-summary"),a=en.querySelector(".arrow");s.classList.toggle("open");if(a)a.textContent=s.classList.contains("open")?"▴":"▾";};});
}
/* Card 4: market */
function cardMarket(){
var mk=DATA.market||{};
var tw=(mk.indices||[]).filter(function(x){return x.market==="TW";});
var us=(mk.indices||[]).filter(function(x){return x.market==="US";});
function statCard(x){var c=x.change,cls=c==null?"":(c>=0?"up":"down"),arrow=c==null?"":(c>=0?" ▲":" ▼");
var pts=x.changePts!=null?((x.changePts>=0?"+":"")+x.changePts+" "):"";
var cm=x.comment!=null?x.comment:(x.note?splitStars(String(x.note).replace(/✅[^。]*。?|⚠️[^。]*。?/g,""))[0]||"":"");
if(x.comment==null&&cm.length>40)cm=cm.replace(/\*\*/g,"").split("。")[0].slice(0,40);
var noVal=!x.value||x.value==="—";
return "<div class='stat'><div class='k'>"+esc(x.name)+"</div><div class='v "+cls+"'>"+(noVal&&c!=null?fmtChg(c):esc(x.value))+arrow+"</div>"+
(c!=null&&!noVal?"<div class='chg "+cls+"'>"+esc(pts)+"("+fmtChg(c)+")</div>":"")+(cm?"<div class='cm'>"+mdb(cm)+"</div>":"")+"</div>";}
var movers=(mk.movers||[]).map(function(r){return "<tr><td>"+esc(r.name)+"</td><td>"+esc(r.ticker)+"</td><td class='"+(r.change>=0?"up":"down")+"'>"+fmtChg(r.change)+"</td><td>"+esc(/未取得|沿用/.test(r.price||"")?"—":r.price)+"</td><td class='reason'>"+mdb(r.reason)+"</td></tr>";}).join("");
return "<div class='card full-width'><div class='card-header'><h2>📈 股市概況</h2></div><div class='card-body'>"+
(function(){var ins=(mk.insights&&mk.insights.length)?mk.insights:splitStars(mk.highlight).concat(splitStars(mk.note)).slice(0,5);
return ins.length?"<div class='insights'><h3>📊 市場解讀</h3>"+bullets(ins)+"</div>":"";})()+
"<div class='sec-head'>🇹🇼 台股指數 · ETF</div><div class='stat-row'>"+tw.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🇺🇸 美股指數 · ETF</div><div class='stat-row'>"+us.map(statCard).join("")+"</div>"+
"<div class='sec-head'>🗂️ 觀察清單 · 分類堆疊卡（點卡片切換同類個股）</div>"+
"<div class='wl-tabs' id='mkt-tabs'><button class='active' data-mkt='TW'>🇹🇼 台股</button><button data-mkt='US'>🇺🇸 美股</button></div>"+
"<div id='stack-grid' class='stack-grid'></div>"+

"<div class='sec-head'>📈 個股走勢 · 從全部個股挑選</div>"+
"<div style='background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px'>"+
"<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px'><select id='mover-select' class='stock-select'></select>"+
"<div class='wl-tabs' id='range-tabs' style='margin-bottom:0'><button data-rg='5'>1 週</button><button class='active' data-rg='22'>1 月</button></div></div>"+
"<div id='mover-head' style='font-size:13px;margin:4px 0 8px'></div><div id='mover-chart'></div>"+
"</div>"+
"<div class='sec-head'>⚡ 當日漲跌幅 ≥5% 個股</div><table style='margin-bottom:12px'><thead><tr><th>標的</th><th>代號</th><th>當日漲跌</th><th>價位</th><th>原因</th></tr></thead><tbody>"+movers+"</tbody></table>"+
"</div></div>";
}
function initMarket(){
var WL=SITE.watchlist, Q=(DATA.market&&DATA.market.quotes)||{};
function build(mkt){
var data=WL[mkt]||{},grid=document.getElementById("stack-grid");grid.innerHTML="";

/* 先用相對路徑抓（GitHub Pages / 本機伺服器）；失敗（例如直接雙擊 file:// 開啟）再改抓線上網址。 */
function loadJSON(p){
var E=window.__EMBED__;
if(E){
  if(p==="config/site.json"&&E.site)return Promise.resolve(E.site);
  if(p==="data/archive.json"&&E.archive)return Promise.resolve(E.archive);
  if(E.data&&(p==="data/latest.json"||p==="data/"+E.data.date+".json"))return Promise.resolve(E.data);
}
return fetch(p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.catch(function(){return fetch(REMOTE+p,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});});
}
function boot(){
loadJSON("config/site.json").then(function(s){SITE=s;HOOK=s.calendarHook;
var d=new URLSearchParams(location.search).get("date");
return Promise.all([loadJSON(d?("data/"+d+".json"):"data/latest.json"),loadJSON("data/archive.json").catch(function(){return {dates:[]};})]);
}).then(function(res){DATA=res[0];ARCHIVE=res[1];bindStatic();render();buildDateSelect();})
.catch(function(err){
document.getElementById("app").innerHTML="<div class='load-msg'>⚠️ 讀取資料失敗（"+esc(err.message)+"）。<br>本檔為「即時讀取版」：每天只要更新 <b>data/latest.json</b>，網頁內容就會自動跟著更新，不需要重新產生 index.html。<br>請透過 <b>GitHub Pages</b>（<a href='https://eric-tai-5269.github.io/morning-briefing/' target='_blank' rel='noopener'>線上網址</a>）或本機伺服器開啟；直接雙擊本檔時瀏覽器會擋掉本機讀取，此時本頁會自動改抓線上資料，若線上也失敗才會看到這則訊息。</div>";
});
